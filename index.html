{n:77,cat:"VI",q:"Given that the good satisfies all other applicable requirements of 19 CFR Part 182, what is the percentage of De minimis allowance for non-originating fibers and yarns in Textile and Apparel goods classified under chapters 61 through 63 claiming United States-Mexico-Canada Free Trade Agreement?",opts:{A:"Does not exceed 10% of the transaction value of the good",B:"Does not exceed 10% of the total cost of the good",C:"Not more than 10% of the total weight of the good",D:"Not more than 10% of the total weight of the component of the good that determines the tariff classification."},ans:["D"],cite:"19 CFR Part 182, Appendix A, Part II, Section 5(7)"},
{n:78,cat:"VI",q:"Cylindrical Can Assembly of 8507.90, HTSUS, is produced in Mexico\n• The sole non-originating material used in the production of the good is nickel-plated steel of 7212.50, HTSUS from Korea\n• The production in Mexico results in a substantial transformation\n• Importer is seeking preferential tariff treatment under the USMCA\nBased on the information provided, which statement is TRUE?",opts:{A:"The Cylindrical Can Assembly may not receive preferential tariff treatment under the USMCA because it contains a non-USMCA originating material.",B:"The Cylindrical Can Assembly is eligible for USMCA preferential tariff treatment because it is substantially transformed in Mexico and now a product of Mexico.",C:"The Cylindrical Can Assembly is not eligible for preferential tariff treatment because it is not produced in the United States.",D:"The Cylindrical Can Assembly meets the applicable USMCA rule of origin."},ans:["B","D"],cite:"DUAS RESPOSTAS ACEITAS (B ou D) — GN 11(B)(iii); GN 11(o)/85.19(A); 8507.90 HTSUS"},
{n:79,cat:"VI",q:"An allegation by an interested party that an importer of covered merchandise has evaded antidumping or countervailing (AD/CVD) duty order under the Enforce and Protect Act of 2015 (EAPA) must include all of the following information EXCEPT:",opts:{A:"Description of the covered merchandise",B:"Applicable AD/CVD orders",C:"Name and address of importer against whom the allegation is brought",D:"An explanation of the relationship between the importer and the interested party"},ans:["D"],cite:"19 CFR 165.11(b)"},
{n:80,cat:"VI",q:"Bebe Mattresses (Bebe), an Italian importer and manufacturer in Italy of toddler bed and baby crib cotton mattresses (mattresses), imported 140 toddler bed mattresses from WeSew, a manufacturer, in China with a value of $2,000.00 US. Bebe repackaged the toddler bed mattresses into individual plastic bags imprinted with Bebe's logo. Bebe shipped the 140 toddler bed mattresses and 80 baby crib mattresses manufactured by Bebe in Italy to Upscale Baby Furniture, a buyer in the United States. Bebe invoiced Upscale $4,200.00 for the 140 toddler bed mattresses and $1,700.00 for the 80 baby crib mattresses. Which of the formulas below yields the estimated anti-dumping / countervailing duty (AD/CVD) deposit due for the following merchandise? The \"all other companies\" AD/CVD rates apply. The rate is ad valorem. The possible cases, countries, and rates are:\n• A-475-845-000; Italy; 257.06%\n• A-570-092-000; China; 1731.75%\n• C-570-128-000; China; 97.78%\nIn the formulas below, the \"x\" stands for \"multiplied by.\"",opts:{A:"($1,700.00 x 2.5706) + ($4,200.00 x 2.5706)",B:"($1,700.00 x 257.06) + ($2,000.00 x 1731.75) + ($2,000.00 x 97.78)",C:"($1,700.00 x 2.5706) + ($4,200.00 x 17.3175) + ($4,200.00 x .9778)",D:"($1,700.00 x 257.06) + ($4,200.00 x 1731.75) + ($4,200.00 x 97.78)"},ans:["C"],cite:"19 CFR 159.41; 19 CFR 159.47"}
];

const APR2025=[
{n:1,cat:"I",q:"A customs broker has a client's confidential records as defined in CBP regulations pertaining to customs brokers. The records contain information that is not available from a source that is open to the public. The broker's client has specified in writing that the records should be kept confidential. Of those persons listed below, to whom may the broker disclose the confidential records?",opts:{A:"The client's surety on a particular entry",B:"The freight forwarder on a particular shipment",C:"The broker's other clients",D:"The client's exporter"},ans:["A"],cite:"19 CFR 111.24"},
{n:2,cat:"I",q:"A customs broker recently imported merchandise into the customs territory of the United States and transmitted the entry records for this merchandise to CBP. If copies of these entry records are retained by CBP, which of the following statements is TRUE?",opts:{A:"CBP maintains the copies and the customs broker does not need to retain their own copies of the submitted records.",B:"The customs broker is required to maintain copies of the submitted records.",C:"The customs broker is required to request the return of the submitted records from CBP.",D:"CBP will notify the customs broker when they can destroy their copies of the submitted records."},ans:["B"],cite:"19 CFR 163.2(a); 19 CFR 163.3"},
{n:3,cat:"I",q:"John and Fred Smith each had a 25% ownership share of a general partnership, JJF, with their father, Jack Smith, owning the other 50%. Three weeks ago, JJF had sent ABC Customhouse Brokers (ABC) a copy of the bill of lading, a commercial invoice, and a packing list for their incoming shipment. JJF, a longtime client of ABC, had executed a new customs power of attorney (POA) signed by Jack Smith one month ago. However, John Smith advised ABC that his father, Jack Smith, died last week, with JJF changing by operation of law into Smith & Smith, a new partnership that inherited JJF's legal rights and responsibilities. ABC states that they cannot proceed with the customs clearance on Smith & Smith's behalf without a newly executed POA. Which regulation explains why the existing POA is no longer valid?",opts:{A:"19 CFR 141.34",B:"19 CFR 141.39(b)",C:"19 CFR 111.23(b)",D:"19 CFR 111.30(b)"},ans:["B"],cite:"19 CFR 141.39(b)"},
{n:4,cat:"I",q:"For which company below will the customs broker be required to obtain documentation establishing the authority of the grantor to execute a power of attorney?",opts:{A:"Grayson, Grayson, and Drew, a corporation organized in the U.S. Virgin Islands",B:"Lightning Spirits, a corporation organized in Delaware, United States",C:"Coope Puerto Thiel, a corporation organized, located and registered only in Costa Rica",D:"Terra Firma Landscape, a corporation organized in and located in Puerto Rico"},ans:["C"],cite:"19 CFR 141.31(d); 19 CFR 141.37; 19 CFR 101.1"},
{n:5,cat:"I",q:"Which of the following would NOT constitute grounds sufficient to deny an application for a customs broker's license?",opts:{A:"Any conduct which would be deemed unfair or detrimental in commercial transactions by accepted standards.",B:"A failure to establish the good character and reputation of the applicant.",C:"Being 20 years old on the date of submission of the broker's license application.",D:"Being a citizen of the United States for only one year prior to the date of submission of the broker's license application."},ans:["D"],cite:"19 CFR 111.11(a); 19 CFR 111.16(b)"},
{n:6,cat:"I",q:"Which of the following is considered \"customs business?\"",opts:{A:"The preparation, and activities relating to the preparation, of documents in any format and the electronic transmission of documents intended to be filed with CBP in furtherance of any other customs business activity.",B:"The processing of applications for a broker's license or national permit for an individual, partnership, association, or corporation.",C:"Those activities performed by a business entity to ensure that documents for a related business entity are prepared using reasonable care.",D:"Any activity related to dispatching shipments in foreign commerce between the United States and its territories and foreign countries."},ans:["A"],cite:"19 CFR 111.1"},
{n:7,cat:"I",q:"A licensed broker must report or provide the following to CBP EXCEPT:",opts:{A:"Whether the broker has not engaged in any conduct that could constitute grounds for suspension or revocation of an individual broker under 19 CFR 111.53.",B:"A change of non-business mailing address if the broker is an individual broker not actively engaged in transacting business as a broker.",C:"A newly hired employee's name, date of birth, place of birth, current home address, and misdemeanor arrest records.",D:"The date a licensed brokerage member ceases to be the qualifying officer for purposes of 19 CFR 111.11(b) or (c)(2), and the name of the succeeding broker."},ans:["C"],cite:"19 CFR 111.28(b); 19 CFR 111.30"},
{n:8,cat:"I",q:"In accordance with the relevant regulation in Part 111 of 19 CFR, if a customs broker discovers a breach of electronic or physical records relating to the broker's customs business, the broker must electronically notify _____ within 72 hours of the discovery of the breach.",opts:{A:"Broker Management Branch, Office of Trade, CBP Headquarters",B:"Broker Management Officer at the processing Center",C:"The appropriate Executive Director, Office of Trade, CBP Headquarters",D:"CBP Office of Information, Technology Security Operations Center (CBP SOC)"},ans:["D"],cite:"19 CFR 111.21(b)"},
{n:9,cat:"I",q:"Forty-two days ago, a customs broker knowingly hired a person convicted of a felony. At no point has the customs broker sought approval for this hire from CBP. Additionally, CBP is not aware of this hire. As of today, what is the heaviest single maximum penalty that can be assessed by CBP against this broker for not seeking approval from the appropriate Executive Director, Office of Trade for the felon's continued employment?",opts:{A:"$5,000.00 penalty",B:"$10,000.00 penalty and a suspension of their license",C:"$25,000.00 penalty",D:"$30,000.00 penalty and revocation of their license"},ans:["C"],cite:"19 CFR 171, Appendix C, VII(C)"},
{n:10,cat:"I",q:"Sixty-one days ago, an authorized CBP official properly demanded that a broker, who was acting as importer for a released shipment and is also the bond principal, redeliver to CBP custody the merchandise from that shipment. The merchandise was not legally marked with its country of origin for the purpose of requiring the merchandise to be properly marked. In the meantime, the broker has taken no action, and the Center director did not give a good cause extension. CBP has now demanded liquidated damages in an amount equal to the entered value of the shipment. The broker wants relief from full payment. Which of the following is therefore legally TRUE?",opts:{A:"A petition for relief from payment of liquidated damages to CBP must be filed within 90 days of receiving the Notice to Mark / Notice to Redeliver (CBP Form 4647).",B:"A proper petition for relief from payment of liquidated damages is one that is written, addressed to the Commissioner of Customs and filed with the Fines, Penalties, and Forfeitures Officer within 60 days from the date of mailing to the bond principal the notice of claim for liquidated damages.",C:"A proper petition for relief from payment of liquidated damages is filed within 180 days of the date of liquidation of the entry summary.",D:"The broker is not allowed to petition for relief from payment of liquidated damages because there is no petition process for liquidated damages."},ans:["B"],cite:"19 CFR 134.54(b); 19 CFR 172.2; 19 CFR 172.1"},
{n:11,cat:"I",q:"Which of the following is a TRUE statement regarding decisions to remit or mitigate a penalty or cancel a claim for liquidated damages upon payment of a lesser amount?",opts:{A:"Decisions to remit or mitigate a penalty or cancel a claim for liquidated damages upon payment of a lesser amount are filed in the Automated Commercial Environment (ACE) and are protestable within 365 days from the date of the initial penalty or claim.",B:"Decisions to remit or mitigate a penalty or cancel a claim for liquidated damages upon payment of a lesser amount are only protestable if a paper protest is filed at the port of entry within 180 days from the date of the initial penalty or claim.",C:"Decisions to remit or mitigate a penalty or cancel a claim for liquidated damages upon payment of a lesser amount are only protestable if protested in person to the CBP, Chief of Penalties Branch within 180 days from the date of the initial penalty or claim.",D:"Decisions to remit or mitigate a penalty or cancel a claim for liquidated damages upon payment of a lesser amount are not protestable."},ans:["D"],cite:"19 CFR 172.22(a)"},
{n:12,cat:"I",q:"A customs broker receives payment for duties from a client after the due date. The payment did not include payment for the broker's services. What must the broker do?",opts:{A:"Return the payment to the client within 5 working days of receipt and file a formal complaint with CBP.",B:"Advise the client that the duty payment will not be transmitted to CBP until the payment for the broker's services is received.",C:"Transmit the duty payment to CBP within 5 working days of receipt by the broker.",D:"Deduct their service fee from the amount of the payment, transmit the remaining amount to CBP, and notify the center director of the situation."},ans:["C"],cite:"19 CFR 111.29(a)"},
{n:13,cat:"I",q:"Which of the following statements is legally TRUE regarding a customs broker conducting \"customs business?\"",opts:{A:"A customs broker may outsource the preparation of entries to a company located in India, but the entry must be transmitted by the broker.",B:"A customs broker must designate a knowledgeable point of contact to be available to CBP during (but not outside of) normal business hours to respond to customs business issues.",C:"A customs broker residing in the U.S. but on vacation in Europe may transmit entries as long as they have a secure Internet connection.",D:"A customs broker may hire a remote employee living in Puerto Rico to help determine classification of merchandise."},ans:["D"],cite:"19 CFR 101.1; 19 CFR 111.3(a); 19 CFR 111.3(b)"},
{n:14,cat:"I",q:"Which of the following is NOT legally required for a partnership broker to file entry and entry summary for commercial merchandise on behalf of an importer of record?",opts:{A:"Automated Broker Interface (ABI) functionality.",B:"A customs power of attorney executed directly with the importer of record.",C:"At least one member of the partnership is a broker.",D:"A customs broker license and a national permit."},ans:["A"],cite:"19 CFR 111.1; 19 CFR 111.2; 19 CFR 111.11; 19 CFR 142.3a; 19 CFR 143.1; 19 CFR Part 141, Subpart C"},
{n:15,cat:"I",q:"A freight forwarder is referring an import client to a customs broker with an expectation of receiving a referral fee. Which ONE of the following statements is legally TRUE with respect to their relationship?",opts:{A:"The customs broker may execute a customs power of attorney with the importer via the freight forwarder, via another third party, or with the importer directly to transact customs business for that importer.",B:"The importer must be notified in advance by the freight forwarder or broker of the name of the broker with whom the freight forwarder is doing business for the handling of the importer's Customs transactions.",C:"The agreement between the freight forwarder and the customs broker may stipulate that the importer may only communicate with the broker through the freight forwarder.",D:"The broker and freight forwarder may not enter into an agreement such that the freight forwarder, as an unlicensed person, benefits from the broker's services rendered to and fees earned from the importer."},ans:["B"],cite:"19 CFR 111.36"},
{n:16,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q16-20) — Mustang Boot Manufacturing (MBM), Milão, Itália, importa da América couro de JACARÉ AMERICANO de origem EUA já no formato de gáspea (upper) de bota de cowboy. A MBM usa couro BOVINO italiano para solas e saltos, combina com as gáspeas e processa tudo para virar botas de cowboy (a forma da gáspea muda levemente na montagem). MBM e o fornecedor americano cumpriram os requisitos de exportação do U.S. Fish & Wildlife Service (FWS): export license emitida e etiqueta CITES afixada na pele antes da exportação. Joseph Costa, representante de vendas da MBM, chega ao PORTO DE HOUSTON, TX (porto designado FWS) num voo da Star Airlines vindo da Itália, levando NA BAGAGEM 4 pares de botas-amostra, valor total US$ 3.000, para gerar pedidos junto a varejistas/atacadistas. Nas demonstrações ele vai CORTAR as botas (destruindo-as efetivamente) para mostrar as características, e reexportará as botas à Itália. As botas são unisex, acima do tornozelo e abaixo do joelho, com pull loops e construção WELT (tira de couro costurada entre palmilha e sola). Estilos: GatorP Buckaroo (bico fino, MBM-P-50268) e GatorS Buckaroo (bico quadrado, MBM-S-50275). MBM pediu à Expeditious Customs Brokers que faça a entry sob TEMPORARY IMPORTATION UNDER BOND (TIB) — são bens comerciais, inelegíveis para entrada oral/declaração de bagagem. Documentos: Interim Footwear Invoices (upper 100% couro; sola 100% couro/composition leather; welt construction marcado; slip-on type; não esportivo; não exclusivo masculino; assinadas 02 Jan 2025), permits de exportação da Itália, export license e CITES da exportação original dos EUA.",q:"The Interim Footwear Invoices state that the boots are leather. What section notes, chapter notes, and/or subheadings in the Harmonized Tariff Schedule of the U.S. (HTSUS) provide for the American alligator skin cowboy boot upper?",opts:{A:"Chapter 39, Note 2(p); 3920.43",B:"Chapter 41, Note 2(a); 4104.49",C:"Chapter 64, Note 3(b); 4113.30",D:"Chapter 42, Note 1; 4203.40"},ans:["C"],cite:"HTSUS Chapter 64, Note 3(b); HTSUS 4113.30"},
{n:17,cat:"II",scenario:"Mesmo cenário das Q16-20 (botas-amostra da MBM; Mr. Costa vai destruí-las em demonstrações e reexportar; entry TIB).",q:"In accordance with the facts above, what is the Chapter 98 CLASSIFICATION of the cowboy boots?",opts:{A:"9802.00.8068",B:"9806.00.35",C:"9811.00.60",D:"9813.00.20"},ans:["D"],cite:"HTSUS 9813.00.20"},
{n:18,cat:"II",scenario:"Mesmo cenário das Q16-20 (gáspeas de couro de jacaré americano com CITES/FWS; chegada no Porto de Houston, porto designado FWS).",q:"In accordance with the facts above, which of the following provisions of the CBP regulations are the most relevant for Expeditious to research whether U.S. Fish & Wildlife import permits are required for MBM's boots?",opts:{A:"19 CFR 10.16 through 10.26",B:"19 CFR 12.26 through 12.32",C:"19 CFR 111.19",D:"50 CFR, Part 15"},ans:["B"],cite:"19 CFR 12.26 - 12.32"},
{n:19,cat:"II",scenario:"Mesmo cenário das Q16-20. A prova mostra QUATRO CBP Form 7501 parcialmente preenchidos, diferindo apenas nos Blocos 2 (Entry Type), 6 (Port Code) e 9 (Mode of Transport): A) Entry Type 08 · Port 5309 · MOT 60 | B) Entry Type 08 · Port 5309 · MOT 40 | C) Entry Type 23 · Port 5309 · MOT 60 | D) Entry Type 23 · Port 2304 · MOT 40. Lembre: entry TIB; Porto de Houston; amostras trazidas NA BAGAGEM de um passageiro (Mr. Costa).",q:"Below are four partially completed CBP Form 7501 Entry Summary forms. Concentrating only on Blocks 2, 6, and 9, which one of the four forms correctly shows the entry type, port code, and mode of transport for the facts provided?",opts:{A:"Entry Type 08, Port Code 5309, Mode of Transport 60",B:"Entry Type 08, Port Code 5309, Mode of Transport 40",C:"Entry Type 23, Port Code 5309, Mode of Transport 60",D:"Entry Type 23, Port Code 2304, Mode of Transport 40"},ans:["C"],cite:"ACE Entry Summary Instructions, version 2.4a; 2024 HTSUS Annex C"},
{n:20,cat:"II",scenario:"Mesmo cenário das Q16-20 (botas de cowboy: upper de couro de jacaré, sola de couro, welt construction, acima do tornozelo/abaixo do joelho, unisex, não esportivas).",q:"What is CLASSIFICATION of the cowboy boots?",opts:{A:"4203.40.6000",B:"6403.51.3071",C:"6403.51.9030",D:"6403.91.9051"},ans:["B"],cite:"HTSUS 6403.51.3071; HTSUS Chapter 42, Note 2(d); HTSUS Chapter 64, Additional U.S. Note 1(a)"},
{n:21,cat:"IIIB",q:"Which of the following is NOT identified among the specified criteria that CBP will consider when reviewing an applicant's record with CBP for purposes of an application for accelerated payment of drawback?",opts:{A:"The number of trade compliance employees hired by the drawback claimant in the last 12 months.",B:"The presence or absence of unresolved CBP charges (duties, taxes, fees, or other debts owed CBP).",C:"The accuracy of the claimant's past drawback claims.",D:"Whether accelerated payment of the drawback or waiver of prior notice of intent to export was previously revoked or suspended."},ans:["A"],cite:"19 CFR 190.92(e)(1)(i)-(iii)"},
{n:22,cat:"IIIB",q:"X-Rocs, Inc. (X-Rocs) imports multifunction digital office machines (copiers) with copy, print, fax, and scan functions to the U.S. from Korea. X-Rocs has a valid limited power of attorney (POA) with Expeditious Customs Brokers, LLC (Expeditious), limited to entering imported merchandise for consumption. Four years after importation, if the copiers have not sold in the U.S., X-Rocs exports the copiers to India. X-Rocs has a valid limited POA with Trade Experts Customs Brokers (TradeEx) for its drawback program. X-Rocs' Vice President has signed a POA granting X-Rocs' Trade Compliance Manager, who is not a licensed customs broker, the power to sign contracts and business documents on behalf of X-Rocs. A broker at TradeEx executed a POA with an unlicensed employee to sign customs business documents on behalf of TradeEx. Of the list below, who does NOT have the authority to sign drawback entries submitted to CBP on behalf of X-Rocs?",opts:{A:"The Vice-President of X-Rocs",B:"An employee of Expeditious",C:"The Trade Compliance Manager with X-Rocs",D:"The unlicensed employee of TradeEx"},ans:["B"],cite:"19 CFR 141.0a(f); 19 CFR 190.2; 19 CFR 190.6(a)-(b)"},
{n:23,cat:"IIIB",q:"WeHeartGoats, Inc. (WeHeartGoats), a goat soap manufacturer and exporter, imports burlap, sewing thread, and string in bulk from which WeHeartGoats makes burlap drawstring bags that hold individual bars of soap. WeHeartGoats sews its own drawstring bags from the imported bulk burlap and string. The soap is made using goat milk and other ingredients. None of the ingredients to create the soap are imported. Because the burlap bags breathe, they are better packaging than paper or plastic for the soap bars. WeHeartGoats intends to claim drawback on the burlap and string that it manufactures into the drawstring bags upon the exportation of the soap-filled bags. Which the following statements is TRUE?",opts:{A:"The WeHeartGoats' drawstring bags, although wholly manufactured with imported materials, are ineligible for drawback because the bags are packaging for U.S. origin soap, and packaging that contains articles or merchandise not eligible for drawback is also not eligible for drawback.",B:"If WeHeartGoats receives acknowledgement of its letter of notification of intent to operate under a general manufacturing ruling from the drawback officer where the drawback entries are to be filed, the letter of notification will remain in effect for five years from the date of the first drawback claim filed in accordance with the letter of notification.",C:"If WeHeartGoats determines that a general manufacturing drawback ruling can be followed without variation, concurrent with or prior to filing a drawback claim, WeHeartGoats will file a letter of notification of intent to operate under a general manufacturing drawback ruling with the drawback officer where the drawback entries are to be filed.",D:"If, after receiving acknowledgement of its letter of notification of intent to operate under a general manufacturing drawback ruling from the drawback officer where the drawback entries are to be filed, WeHeartGoats decides to change its name to WeHeartGoats.US, Inc., the company must file a supplemental application. The supplemental application would be filed with CBP Headquarters, Office of Trade, Regulations and Rulings, Entry Process and Duty Refunds Branch (CBP Headquarters), for authorization to continue operating under its existing ruling."},ans:["C"],cite:"19 CFR 190.7; 19 CFR 190.7(e); 19 CFR 190.8(h); 19 CFR 190.8(g)(2)(i)(C); 19 CFR 190.13"},
{n:24,cat:"IIIB",q:"Evidence of exportation or destruction is required for a complete drawback claim. Which of the following supporting documentation will be a sufficient official postal record to prove exportation of merchandise on which drawback is to be claimed, if exported using the U.S. Postal Service (USPS) First-Class Package International Service?",opts:{A:"A completed commercial invoice describing the mail shipment from the U.S. exporter to the foreign importer showing the date the package was shipped from the U.S. post office.",B:"An email from the foreign importer to the U.S. exporter acknowledging receipt of the package and containing a picture of the package upon delivery to the foreign importer.",C:"An affidavit signed by the U.S. exporter's employee declaring that the employee took the package to the U.S. post office and shipped it with proper postage on the date of export.",D:"An original, complete USPS Customs Declaration and Dispatch Note describing the mail shipment, including a USPS barcode label affixed showing the shipment number, and a payment receipt attached."},ans:["D"],cite:"19 CFR 190.72; 19 CFR 190.74"},
{n:25,cat:"IIIB",q:"AZ-DZ Audio, Inc. (AZ-DZ) manufactures stage monitor loudspeakers (monitors) in Arizona from a mix of foreign and domestic components. Three years ago, AZ-DZ made a special export edition of its \"Goes to Eleven\" monitor for customers outside the U.S. That same year, AZ-DZ imported special gold cables from South Korea to be used in the Goes to Eleven monitors. AZ-DZ did not use all of the imported cables to make monitors and exported its excess stock back to the supplier last year. AZ-DZ now wants to claim unused merchandise drawback under 19 USC 1313(j) for duties paid on the unused cables. AZ-DZ never provided prior notice of intent to export or destroy merchandise to CBP as required by 19 CFR 190.35. In order to claim unused merchandise drawback despite its failure to comply with 19 CFR 190.35, AZ-DZ files an application with CBP's Detroit Drawback office pursuant to the CBP regulations. Which of the following information is AZ-DZ NOT required to provide in their application?",opts:{A:"The port(s) of exportation of the cables",B:"The relationship between the parties involved in the import and export transactions",C:"The export period covered by the application",D:"The country or countries to which the unused cables were exported"},ans:["D"],cite:"19 CFR 190.35; 19 CFR 190.36"},
{n:26,cat:"IV",q:"What is the CLASSIFICATION of a chocolate production line that includes a conveyor belt, a mixer, cooling tunnel, and cutters? The entire chocolate production line will be imported unassembled in one shipment.",opts:{A:"8208.30.0060",B:"8428.20.0010",C:"8438.20.0000",D:"8479.89.9599"},ans:["C"],cite:"GRI 1; GRI 2(a); GRI 6; HTSUS Section XVI, Note 4; HTSUS 8438.20.0000"},
{n:27,cat:"IV",q:"What is the CLASSIFICATION of an unadorned basket constructed of interwoven 6 millimeters wide plastic strips? The basket measures 10 inches square by 4 inches deep and includes an arched handle.",opts:{A:"3926.90.1000",B:"4602.90.0000",C:"3923.90.0080",D:"4602.19.1700"},ans:["B"],cite:"HTSUS 4602.90.0000"},
{n:28,cat:"IV",q:"A client with a barbeque franchise imports fresh beef ribs that are subject to regulations issued by the U.S. Trade Representative and U.S. Department of Agriculture. The client intends to import the beef ribs along with fresh pork ribs from a single country and in any calendar year will import 30,000 metric tons of beef ribs and 15,000 metric tons of pork ribs. Of the listed countries, from which country will the client's imported quantity exceed the amount permitted in any calendar year?",opts:{A:"Argentina",B:"Australia",C:"New Zealand",D:"Mexico"},ans:["A"],cite:"HTSUS Chapter 2, Additional U.S. Note 3"},
{n:29,cat:"IV",q:"What is the CLASSIFICATION of semi-refined solid paraffin wax with an oil content of .05% by weight? The product will be imported in solid brick shapes for use to coat paper.",opts:{A:"3407.00.4000",B:"4811.60.6000",C:"6904.10.0020",D:"2712.20.0000"},ans:["D"],cite:"GRI 1; GRI 6; HTSUS 2712.20.0000"},
{n:30,cat:"IV",q:"What is the CLASSIFICATION of live eel?",opts:{A:"0301.11.0020",B:"0301.92.0000",C:"0302.74.0000",D:"0303.26.0000"},ans:["B"],cite:"HTSUS 0301.92.0000"},
{n:31,cat:"IV",q:"What is required for men's woven 100% polyester (synthetic) trousers to be classified in subheading 6203.43.75, HTSUS, as water resistant trousers?",opts:{A:"Men's trousers cannot be classified as water resistant.",B:"The trousers must have critically sealed seams, be visibly coated with plastic, and when sprayed with water using a head pressure of 600 millimeters, not have more than 1.0 gram of water penetrate after two minutes when tested in accordance with AATCC Test Method 53.",C:"The trousers must have a water resistance such that, under a head pressure of 600 millimeters, not more than 1.0 gram of water penetrates after two minutes when tested in accordance with AATCC Test Method 35.",D:"The trousers must have a water resistance such that, under a head pressure of 600 millimeters, not more than 1.0 gram of water penetrates after two minutes when tested in accordance with AATCC Test Method 35 and the water resistance must be as a result of a rubber or plastics application to the outer shell, lining, or inner lining."},ans:["D"],cite:"HTSUS Chapter 62, Additional U.S. Note 2"},
{n:32,cat:"IV",q:"Which answer describes a material which is classifiable within Heading 3006, HTSUS?",opts:{A:"Plasters specially calcined or finely ground for use in dentistry",B:"Blood albumin not prepared for therapeutic or prophylactic uses",C:"Sterile absorbable surgical or dental hemostatics, sterile surgical or dental adhesion barriers, whether or not absorbable",D:"Ketones and quinones, whether or not with other oxygen function, and their halogenated, sulfonated, nitrated, or nitrosated derivatives"},ans:["C"],cite:"HTSUS Chapter 30, Note 4(c)"},
{n:33,cat:"IV",q:"What is the CLASSIFICATION of a teacup that is made of a porcelain containing 28 percent of tricalcium phosphate, valued at $18.00, and not available in specified sets?",opts:{A:"6911.10.2500",B:"6911.10.3810",C:"6911.10.5800",D:"6911.10.8010"},ans:["A"],cite:"HTSUS Chapter 69, Additional U.S. Notes 5(b), 6(a), 6(b); HTSUS 6911.10.2500"},
{n:34,cat:"IV",q:"What is the CLASSIFICATION of a hot-rolled, stainless-steel sheet imported in coils? The stainless-steel sheet measures 750 millimeters in width and 4 millimeters in thickness and is not coated, painted, clad, annealed, or pickled.",opts:{A:"7208.38.0090",B:"7220.12.1000",C:"7225.30.7000",D:"7219.13.0002"},ans:["D"],cite:"GRI 1; HTSUS Chapter 72, Notes 1(e), 1(f), 1(k); HTSUS 7219.13.0002"},
{n:35,cat:"IV",q:"What is the CLASSIFICATION of a new road tractor, with both compression-ignition internal combustion piston engine and electric motor as motors for propulsion that has a gross vehicle weight (G.V.W.) of 34,100 kilograms, and its self-loading semi-trailer for agricultural purposes?",opts:{A:"8701.21.0015 and 8716.31.0000",B:"8701.21.0045 and 8716.39.0040",C:"8701.22.0015 and 8716.20.0000",D:"8701.23.0015 and 8716.39.0010"},ans:["C"],cite:"GRI 1; GRI 6; HTSUS 8701.22.0015; HTSUS 8716.20.0000"},
{n:36,cat:"IV",q:"What is the CLASSIFICATION of floor tiles, which measure approximately 15 centimeters long by 15 centimeters wide and one centimeter thick, made of traditional cement stained to look like American Black Walnut parquet flooring?",opts:{A:"6808.00.0000",B:"6810.19.1400",C:"6811.82.0000",D:"6811.89.9000"},ans:["B"],cite:"HTSUS Chapter 68, Additional U.S. Note 2; HTSUS 6810.19.1400"},
{n:37,cat:"IV",q:"Which of the following is a TRUE statement regarding the principles governing the classification of goods in the Harmonized Tariff Schedule of the United States?",opts:{A:"For legal purposes, the HTSUS table of contents, alphabetical index, and title of sections, chapters and sub-chapters are of equal weight to the terms of headings, relative section or chapter notes, and the General Rules of Interpretation in classifying goods under the tariff schedule.",B:"For legal purposes, under the governing principles for the classification of goods in the tariff schedule, the HTSUS Explanatory Notes are required to be applied, unless the HTSUS headings or notes otherwise require.",C:"For legal purposes, the classification of goods in the subheadings of a heading shall be determined according to the terms of those subheadings and any related subheading notes with the understanding that subheadings at any level are comparable.",D:"For legal purposes, classification is determined according to the terms of the headings and any relative section or chapter notes, while the table of contents, alphabetical index, and titles of sections, chapters and sub-chapters are provided for ease of reference."},ans:["D"],cite:"GRI 1; GRI 6"},
{n:38,cat:"IV",q:"What is the CLASSIFICATION of the activated charcoal derived from coconut husks for use in a water filtration carbon filter?",opts:{A:"2306.50.0000",B:"3802.10.0020",C:"4402.20.0000",D:"8421.99.0140"},ans:["B"],cite:"HTSUS Chapter 44, Note 1(d); HTSUS 3802.10.0020"},
{n:39,cat:"IV",q:"What is the CLASSIFICATION of an apparatus for electroplating flatware made up of silver anodes, an electrolytic solution, and a direct-current (DC) power source? The apparatus is designed for silver anodes and brass (copper-zinc) flatware cathodes to be immersed in the electrolytic solution. The apparatus functions by applying a positively-charged electric current through the anodes and a negatively-charged current through the cathodes. These charges cause silver atoms to dissolve in the electrolytic solution and move toward the negatively-charged brass flatware, thereby coating the brass flatware with silver.",opts:{A:"7407.21.3000",B:"8543.30.9080",C:"8215.10.0000",D:"7106.92.5000"},ans:["B"],cite:"HTSUS 8543.30.9080"},
{n:40,cat:"IV",q:"What is the CLASSIFICATION of synthetic ice panels from Sweden consisting of interlocking tiles manufactured from high density polyethylene plastic? The tiles can be placed on any firm surface (indoor or outdoor) and once interlocked, form a seamless and uniform ice-skating surface. They are designed and marketed for at-home use by both youth and adults to practice skills for the sport of ice hockey while wearing ice skates.",opts:{A:"3918.90.1000",B:"3924.90.5650",C:"9506.70.6080",D:"9506.99.2580"},ans:["D"],cite:"GRI 1; GRI 6; HTSUS Chapter 39, Note 2(y); HTSUS 9506.99.2580"},
{n:41,cat:"V",q:"If CBP determines a bond is inadequate, how many days does the principal have from the date of notification to remedy the deficiency?",opts:{A:"15 days",B:"30 days",C:"60 days",D:"90 days"},ans:["A"],cite:"19 CFR 113.13(c)"},
{n:42,cat:"V",q:"Regarding bonds, which of the following responsibilities is a responsibility of the surety?",opts:{A:"Serving as the beneficiary of the bond",B:"Obtaining a bond as necessary",C:"Paying all revenue due even if it exceeds the bond amount",D:"Submitting bonds to CBP on behalf of the parties to the bond"},ans:["D"],cite:"ACE Business Rules and Process Document v. 12 Section 3.3"},
{n:43,cat:"V",q:"Choose the ONE answer that correctly fills the blank. Per 19 CFR 134.41, Marking of Country of Origin, should be these three things: Legible, Indelible and _____.",opts:{A:"Permanent",B:"Temporary",C:"Brief",D:"Provisional"},ans:["A"],cite:"19 CFR 134.41"},
{n:44,cat:"V",q:"Your client wants to transport a shipment of imported avocados from the Port of Los Angeles/Long Beach to the Port of San Francisco, without appraisal or payment of duties. Which ONE of the provisions listed below governs this requested in-bond transportation?",opts:{A:"19 CFR 18.46",B:"19 CFR 18.8",C:"19 CFR 12.45",D:"19 CFR 18.1"},ans:["D"],cite:"19 CFR 18.1"},
{n:45,cat:"V",q:"CBP liquidated an entry, ascertaining the duties, fees, and taxes at $750.00. However, the estimated duties, fees, and taxes the broker had deposited at entry amounted to $1,000.00. What is legally required to occur to address the discrepancy between the estimated duties and ascertained duties?",opts:{A:"The broker must file a protest to request a refund.",B:"CBP should disregard the difference because it less than $300.00, a de minimus amount.",C:"CBP should refund the broker $250.00 with interest.",D:"The broker must withdraw the entry and make another deposit to correct amount of duties, fees, and taxes."},ans:["C"],cite:"19 CFR 159.6(c)"},
{n:46,cat:"V",q:"Which ONE of the following scenarios qualify to pass free of duty and tax pursuant to 19 CFR 145.31 without preparing an entry as provided for in 19 CFR 145.12? The merchandise is not subject to quota.",opts:{A:"B-C Customs Brokers, on behalf of nominal consignee, Kushi, an online retailer organized and based in India, files a manifest as the entry document for a container of 1000 packages addressed to the 1000 U.S. purchasers of sets of jade figurines (figurines of semiprecious stones) which retail for the equivalent of $799.00 per set in India and sold for $879.00 per set to the U.S. purchasers in the U.S.",B:"B-C Customs Brokers files a CBP Form 7501 as the entry/entry summary for the second installment of a multi-installment shipment with a value of $2,400.00 imported by one person with all installments on a single invoice and arriving eight days after the first installment.",C:"A self-filer, Big Box Retailer, files a manifest as the entry document on 100 high demand items with a fair retail value under $800.00 each that it hopes to sell shortly after customs release to 100 unique customers.",D:"B-C Customs Brokers on behalf of BB Manufacturing files its weekly paperwork to withdraw merchandise from BB Manufacturing's Foreign Trade Zone (FTZ). Each shipment to each individual customer is valued under $800.00 at the time of entry. The aggregate value of the merchandise when it entered the FTZ exceeded $800.00."},ans:["A"],cite:"19 CFR 145.31"},
{n:47,cat:"V",q:"You come across a shipment of old canceled United States postage stamps. Which provision addresses importation of United States postage stamps?",opts:{A:"19 CFR 4.94",B:"19 CFR 12.140",C:"19 CFR 12.48",D:"19 CFR 12.41"},ans:["C"],cite:"19 CFR 12.48"},
{n:48,cat:"V",q:"A broker or importer demonstrates good cause in a timely request for an extension of liquidation on an entry of merchandise for consumption. For how long may a Center director extend the 1-year statutory period for liquidation from the date of entry?",opts:{A:"An additional period not to exceed 1 year",B:"An additional period not to exceed 18 months",C:"An additional period not to exceed 4 years",D:"For an unlimited additional period of time"},ans:["A"],cite:"19 CFR 159.12(a)"},
{n:49,cat:"V",q:"Which of the following best defines \"entry summary?\"",opts:{A:"Any other documentation or electronic submission of data necessary to enable CBP to assess duties, and collect statistics on imported merchandise, and determine whether other requirements of law and regulations are met.",B:"The voluntary delivery to the appropriate CBP officer or electronic submission to the Automated Commercial Environment (ACE) or any other CBP authorized electronic data interchange system of the documentation or data for preliminary review of entry documentation or data for other purposes.",C:"The imported merchandise which has not been properly released from Customs custody in a Customs territory.",D:"The delivery to CBP, including electronic submission to ACE or any other CBP-authorized electronic data interchange system, of the entry documentation or data required by section 484(a), Tariff Act of 1930, as amended (19 USC 1484(a)), to obtain the release of merchandise."},ans:["A"],cite:"19 CFR 141.0a(b)"},
{n:50,cat:"V",q:"Which of the following classifications and duty rates would correctly be listed on the entry summary for an importation on December 1, 2024 of the following merchandise? The merchandise is a scale model of a 1938 Chevy 3100 pickup truck in red. Commonly known as the \"Christmas truck,\" this model is intended for individuals 15 years of age and up. The model was die-cast in pieces in Germany of a zinc-aluminum alloy. The zinc was smelt in Germany and the aluminum was smelt in the Russian Federation. The pieces were assembled with welding into the full model trucks and painted in China. The bottom of the truck is stamped \"Assembled in China from components of Germany and Russia.\"",opts:{A:"9503.00.00/Free",B:"9903.88.16 + 9503.00.00/15%",C:"9503.00.00/70%",D:"9903.85.68 + 9503.00.00/200%"},ans:["A"],cite:"HTSUS GN 3(b); Ch. 99, Subch. III, U.S. Notes 19(a)(iii) e 20(u)(i); HTSUS 9503.00.00; 9903.88.16; 9903.85.68"},
{n:51,cat:"V",q:"Which ONE of the answer choices correctly states: (1) the country of exportation; and (2) the date of exportation for general statistical purposes as reported on the entry summary or withdrawal form for the following shipment? On April 10, 2024, A1 Jets sold airplane jet engines (engines) produced in England and with country of origin England to Buyer, an airplane manufacturer in Miami, Florida. On May 1, 2024, the containers containing the engines sold to buyer are loaded onto an ocean vessel. The vessel departs London, England on May 2, 2024. The vessel stops in Calais, France to pick up additional containers. The vessel departs Calais, France on May 8, 2024. The vessel arrives in Halifax, Canada on May 14, 2024, and offloads some containers, but not the containers of engines sold to Buyer. On May 16, 2024, the vessel leaves Halifax for Miami.",opts:{A:"London; May 1, 2024",B:"England; May 2, 2024",C:"France; May 8, 2024",D:"Canada; May 16, 2024"},ans:["B"],cite:"HTSUS, General Statistical Notes, Note 1(b)(i)"},
{n:52,cat:"V",q:"Which of the following is NOT a requirement for when a center Director would allow one entry summary to be filed for multiple entries?",opts:{A:"Merchandise is of the type defined in 19 CFR 132.1(e).",B:"Merchandise that is consigned to the same consignee.",C:"Each entry is identified separately by entry number on the entry summary.",D:"The time between the date of the first entry and the date of the last entry does not exceed one week."},ans:["A"],cite:"19 CFR 142.17"},
{n:53,cat:"V",q:"A licensed and permitted customs broker has elected statement processing for paying the duties, taxes, and fees on entry summaries on behalf of its clients and upon entries for which the broker acts as importer of record. On February 5, 2025, the broker transmits four entry summaries for four different clients to CBP. The cargo is released, and the entry date is also February 5, 2025. The broker put the duty payment on periodic daily statement. Using the 2025 calendar, what is the last date upon which the statement can be designated for processing?",opts:{A:"February 15, 2025",B:"February 20, 2025",C:"February 24, 2025",D:"March 21, 2025"},ans:["B"],cite:"19 CFR 24.25; 19 CFR 24.25(e); ACE Business Rules and Process Document Section 19.4"},
{n:54,cat:"V",q:"Which of the following goods are NOT specifically exempted from formal entry procedures under 19 CFR 141.4(b)?",opts:{A:"An aircraft part from a United States-registered aircraft that was removed during an emergency repair while being used abroad in international traffic. The part was returned to the United States within 45 days after removal and did not leave the custody of the carrier or foreign customs service while abroad.",B:"The corpse of a U.S. citizen, including a coffin and accompanying flowers.",C:"A yacht purchased in Mexico and brought into United States customs territory by a U.S. resident for the purpose of commercial cruises.",D:"A truck cab and trailer transporting Canadian lumber into the customs territory of the United States and returning to Canada after the shipment of lumber has been delivered."},ans:["C"],cite:"19 CFR 141.4(b)"},
{n:55,cat:"V",q:"Which of the following would NOT be a consideration of the port director for approval of an application for deactivation of a foreign trade zone site (FTZ)?",opts:{A:"All non-domestic status merchandise has been removed at the risk and expense of the operator.",B:"The application contains a layout or blueprint of the exact FTZ to be deactivated.",C:"The grantee has submitted an oral application for deactivation.",D:"Underutilization of the FTZ."},ans:["C","D"],cite:"DUAS RESPOSTAS ACEITAS (C ou D) — 19 CFR 146.7(b)"},
{n:56,cat:"V",q:"Upon arrival at a subzone or zone site of a conveyance containing foreign merchandise, which of the following is NOT a foreign trade zone operator's responsibility for direct delivery?",opts:{A:"Check the condition of any seal affixed to the conveyance, and if broken, missing, or improperly affixed, notify the port director and receive instructions before unloading the merchandise.",B:"Sign and date the in-bond or cartage documentation to accept responsibility for the merchandise under the Foreign Trade Zone Operator's Bond and to relieve the carrier of responsibility.",C:"Notify the consignee by annotation on the Customs Form 214, when the entire contents of a shipment have been admitted.",D:"Forward the in-bond or cartage documentation so as to reach the port director within two working days after the date of arrival of the conveyance at the subzone or zone site."},ans:["C"],cite:"19 CFR 146.40"},
{n:57,cat:"V",q:"How many business days does an importer have to respond to a CBP Notice of Detention for articles suspected of bearing counterfeit marks before CBP may disclose unredacted information to the owner of the marks?",opts:{A:"2",B:"4",C:"5",D:"7"},ans:["D"],cite:"19 CFR 133.21(b)(2)(ii)"},
{n:58,cat:"V",q:"Chemical Corporation imports adhesives into the United States. CBP notified Chemical Corporation that its most recent import of adhesives did not have the English name of the country of origin properly marked on the container. The adhesive was not exported or destroyed under Customs supervision prior to liquidation of the entry. Which ONE of the following actions may CBP take against Chemical Corporation?",opts:{A:"Assess criminal penalties of up to $5,000.00 and/or imprisonment for one year.",B:"Assess an additional 10% duty to the subject merchandise based on the final appraised value.",C:"Assess an additional 25% duty to the subject merchandise based on the final appraised value.",D:"Assess a monetary penalty equal to the final appraised value of the merchandise."},ans:["B"],cite:"19 CFR 134.2"},
{n:59,cat:"V",q:"The Umbrella Corporation produces robots as a result of an assembly operation in its facility in Vietnam using components from Thailand and China. It was determined that the country of origin of these robots will be the country of final assembly. The Umbrella Corporation intends to import these robots to the United States. Which of the following is an INCORRECT origin marking?",opts:{A:"Product of Vietnam, Thailand, and China",B:"Assembled in Vietnam from components of Thailand and China",C:"Assembled in Vietnam",D:"Made in Vietnam"},ans:["A"],cite:"19 CFR 134.43(e)"},
{n:60,cat:"V",q:"Which of the following actions can CBP take when merchandise and its container are marked such that the country of origin is not in English and contains unrecognizable symbols and characters? The merchandise is required to be marked in accordance with 19 USC 1304 and CBP regulations.",opts:{A:"CBP holds the merchandise in its custody for examination until estimated duties for the article are deposited.",B:"CBP notifies the shipper that the merchandise and its container are improperly marked and, upon the shipper's verbal consent, CBP properly marks the country of origin on the merchandise and its container.",C:"CBP sends the merchandise to a general order warehouse for six months after which the importer can make entry.",D:"CBP sends a CBP Form 29, Notice of Action, to assesses additional duty of 10% of the final appraised value."},ans:["D"],cite:"19 CFR 134.2"},
{n:61,cat:"V",q:"At which of the following ports of entry may an antique article otherwise prohibited entry by the Endangered Species Act of 1973 (16 USC 1521, et seq.) (Endangered Species Act) be entered? The merchandise meets all other U.S. Fish and Wildlife Service requirements.",opts:{A:"O'Hare International Airport, Chicago, Illinois",B:"Service Port, Port Angeles, Washington",C:"Rochester International Airport, Rochester, Minnesota",D:"Area Port, Tampa, Florida"},ans:["A"],cite:"19 CFR 10.53(e); 19 CFR 12.26(g)(2)"},
{n:62,cat:"V",q:"Which of the following is a requirement for lawful importation of milk and cream into the United States according to the Federal Import Milk Act?",opts:{A:"The cows that produced the milk and cream must be inspected by the Meat Inspection Division, Agricultural Research Service of the Department of Agriculture.",B:"The person shipping or transporting the milk and cream shall have a valid permit, or its electronic equivalent, from the Department of Health and Human Services.",C:"The person shipping or transporting the milk and cream shall present an affidavit that the milk and cream will be consumed outside of the United States.",D:"The person importing the milk and cream shall have a valid permit, or its electronic equivalent, indicating that the quarantine period has ended."},ans:["B"],cite:"19 CFR 12.7(a)"},
{n:63,cat:"V",q:"Unless exempted, when the final withdrawal of merchandise relating to a specific warehouse entry, general order, or seizure occurs, the warehouse proprietor must file the permit file folder or activity summary report with CBP within ___________ after the final withdrawal. There is no exemption present.",opts:{A:"10 working days",B:"30 calendar days",C:"60 working days",D:"90 calendar days"},ans:["B"],cite:"19 CFR 19.12(d)(4)(ii)"},
{n:64,cat:"V",q:"In which of the following situations may merchandise covered by a warehouse entry and accounted for using direct identification be stored in multiple locations within the warehouse?",opts:{A:"When the merchandise is above a pre-specified weight set by the warehouse proprietor and needs to be spread throughout the warehouse.",B:"When the proprietor's inventory control system specifically identifies all locations where merchandise for each entry is stored and quantity in each location.",C:"When the importer is responsible for the merchandise's deposit, storage, and inventory control in the warehouse.",D:"When the merchandise requires differing environmental conditions, such as refrigeration, humidity control, or minimum temperature."},ans:["B"],cite:"19 CFR 19.4(b)(8)(i)"},
{n:65,cat:"V",q:"What action must be taken with regards to merchandise for which a permit for withdrawal from a customs warehouse has been issued? Note: the permit is not a blanket permit.",opts:{A:"The merchandise must be removed from the warehouse prior to the preparation of the supplementary withdrawal.",B:"The merchandise must be physically removed from the warehouse, only when it is duty-paid, within 15 days after the withdrawal permit has been issued.",C:"All merchandise, besides duty-free merchandise which has been withdrawn, but not removed, does not remain in CBP custody, and must be physically removed after merchandise for which a permit for withdrawal has been issued.",D:"The merchandise must be segregated or physically marked to maintain its identity for merchandise for which a withdrawal permit has been issued."},ans:["D"],cite:"19 CFR 19.6(b)(2)"},
{n:66,cat:"VI",q:"An importer is withdrawing sugar-containing products defined in 15 CFR 2015.2(a), for which preferential treatment is claimed under the United States-Mexico-Canada Agreement (USMCA) from a warehouse for consumption. What must the importer possess in order to claim the in-quota tariff rate?",opts:{A:"A valid import license",B:"A valid export certificate",C:"A written authorization from CBP",D:"A permit of delivery"},ans:["B"],cite:"19 CFR 132.17(a)"},
{n:67,cat:"VI",q:"Which of the following accurately defines \"Quota priority?\"",opts:{A:"\"Quota priority\" is the standing which entitles quota-class merchandise to admission under an absolute quota, or to a reduced rate of duty under a tariff-rate quota, or to any other quota benefit.",B:"\"Quota priority\" is a system that imposes taxes on certain imported goods to control their entry into a country.",C:"\"Quota priority\" refers to the total quantity of goods allowed to be imported into a country within a specified time frame.",D:"\"Quota priority\" is the precedence granted to one entry or withdrawal for consumption of quota-class merchandise over other entries or withdrawals of merchandise subject to the same quota."},ans:["D"],cite:"19 CFR 132.1(f)"},
{n:68,cat:"VI",q:"Diane Baker is a licensed customs broker who executed a general power of attorney with Olympic Imports. Throughout 2024, Diane filed quota warehouse withdrawal entries (entry type 32) on behalf of Olympic Imports for various steel tubes subject to an absolute quota. Olympic Imports has provided Diane with paperwork from its manufacturer for a new shipment of steel tubes due to arrive on December 14, 2024. Per CBP, the absolute quota for steel pipes has been filled for 2024 and is closed. The next quota period opens on January 1, 2025. Which answer best describes how Diane must dispose of the steel tubes arriving on December 14, 2024?",opts:{A:"Admit the shipment into a foreign trade zone to store the steel pipes until the opening of the next absolute quota period.",B:"Submit a quota warehouse withdrawal (entry type 32) and enter the steel pipes at a higher duty rate.",C:"Submit a quota entry (entry type 02) and enter the steel pipes at a higher duty rate.",D:"Enter the shipment into a class 19 bonded warehouse until it can be exported."},ans:["A"],cite:"19 CFR 132.5(a); 19 CFR 132.5(c); 19 CFR 19.1(a)"},
{n:69,cat:"VI",q:"Under the United States-Mexico-Canada Agreement (USMCA), CBP determined that the importation of a series of non-commercial goods was carried out for the purpose of evading compliance. CBP has notified the importer that they must submit a copy of a certification of origin for the goods. When must the importer submit the certificate to CBP?",opts:{A:"Within 30 days from the date of entry for the first shipment in the series",B:"Within 30 days from the date of notice",C:"Within 60 days from the date of notice",D:"Within 60 days from the date of entry for the last shipment in the series"},ans:["B"],cite:"19 CFR 182.14(b)"},
{n:70,cat:"VI",q:"Your client is importing a shipment of blended syrups containing sugars derived from cane sugar with added yellow color but no added flavoring. The blended syrup (sirup) is capable of further mixing and is packaged consistent with the needs of commercial carbonated beverage manufacturers in 30-gallon drums and is not packaged consistent with marketing to the ultimate consumer. The syrup was manufactured in the British Virgin Islands and imported directly from the British Virgin Islands. The merchandise will be properly classified under subheading 2106.90.4400, HTSUS. The quota is open. There are 50 drums total. The net weight of the 50 drums of syrup is 4,770 kilograms. The raw (total) sugar weight is 4,436 kilograms. How much will the estimated duty be?",opts:{A:"$0.00 because the merchandise is being imported from an insular possession of the United States.",B:"$0.00 because the merchandise is a product of a country designated as a beneficiary country under the Caribbean Basin Economic Recovery Act (CBERA) and the special program indicator of \"E*\" appears in the Special column of the Column 1 duty rate.",C:"$162.38",D:"$174.61"},ans:["C"],cite:"HTSUS GN 7(a), 7(d)(ii); Ch. 17, Additional U.S. Notes 4 e 5; HTSUS 2106.90.4400"},
{n:71,cat:"VI",q:"You are responsible for a shipment of goods that are subject to different rates of duty and are packed together or mingled such that the quantity or value of each class of goods cannot be readily ascertained by CBP officers (without physical segregation of the shipment or the contents of any entire package thereof) by verifying the packing lists at the time of entry. Which of the following is TRUE regarding the rate of duty unless the consignee or his agent segregates the goods?",opts:{A:"The commingled goods shall be subject to the lowest rate of duty applicable to any part thereof.",B:"The commingled goods shall be subject to the average rate of duty applicable to all parts thereof.",C:"The commingled goods shall be subject to the rate of duty applicable to the goods that appear to be present in the greatest quantity in the shipment.",D:"The commingled goods shall be subject to the highest rate of duty applicable to any part thereof."},ans:["D"],cite:"HTSUS General Note 3(f)(i)"},
{n:72,cat:"VI",q:"What is the general rate of duty for barley seeds?",opts:{A:"0.10 cents/kilogram",B:"0.15 cents/kilogram",C:"0.25 cents/kilogram",D:"Free"},ans:["B"],cite:"HTSUS 1003.10.0000"},
{n:73,cat:"VI",q:"Which of the following is an element of computed value of imported merchandise?",opts:{A:"The selling price of the merchandise in the United States",B:"The amount of internal tax imposed by the country of export that is directly applicable to the materials",C:"The price of merchandise in the domestic market of the country of exportation",D:"The packing costs of the imported merchandise"},ans:["D"],cite:"19 CFR 152.106(a)(4)"},
{n:74,cat:"VI",q:"Company A, based in the United States, sells and rents high end sports cars. In 2015, Company A imported an Italian sports car from Italy and paid all applicable duties and taxes. In 2020, Company A leased the car to a client in China and exported it to him. The car did not meet the specifications agreed upon in the contract; however, the client continued to drive it for the remainder of the lease. The sports car was not subjected to any repairs or alterations while in China. In 2024, Company A then reimported the car into the United States. What statement is correct upon reimportation into the United States?",opts:{A:"The sports car may be imported duty-free under subheading 9801.00.10, HTSUS.",B:"The sports car may be imported duty-free under subheading 9802.00.50, HTSUS, because no repairs or alterations were made while in China.",C:"The sports car may be imported duty-free as it did not meet the specifications agreed to in the contract and was returned.",D:"The sports car may be imported duty-free because the car was leased out by the importer."},ans:["D"],cite:"HTSUS 9801.00.20; 9801.00.25; 9802.00.50; 19 CFR 10.108"},
{n:75,cat:"VI",q:"A U.S. furniture company imports dressers from a manufacturer in New Zealand. The U.S. company purchases and sends the designs and materials set forth below to the New Zealand manufacturer to aid in the production process. The cost of which of the following should not be added to the price actually paid or payable as an assist?",opts:{A:"A Canadian keyhole saw",B:"Italian paint with a satin finish",C:"Dresser knobs from France",D:"A dresser design schematic by a U.S. design firm"},ans:["D"],cite:"19 CFR 152.102(a)"},
{n:76,cat:"VI",q:"The duty free provision for products of the United States returned after 10 years is found in _____.",opts:{A:"9813.00.35",B:"9812.00.20",C:"9801.00.10",D:"9808.00.30"},ans:["C"],cite:"19 CFR 145.35; 19 CFR 10.31; 19 CFR 10.49; 19 CFR 10.102"},
{n:77,cat:"VI",q:"If the commercial invoice is in a foreign currency, the foreign currency shall be converted to U.S. dollars using the proclaimed rate, certified rate, or rates effective on the _____.",opts:{A:"Date the entry is filed",B:"Date the entry summary is filed",C:"Date of exportation",D:"Date of importation"},ans:["C"],cite:"19 CFR 159.32"},
{n:78,cat:"VI",q:"Based upon a request from the U.S. Department of Agriculture (USDA), a Federal agency, CBP is investigating Valley Garlic (an importer of garlic) for the evasion of antidumping duties under the Enforce and Protect Act of 2015 (EAPA). Another importer of garlic, The Garlic Stand, is following the case because they belong to the same trade association as Valley Garlic. According to CBP regulations, what below entity is included in the \"parties to the investigation\" for this case?",opts:{A:"Valley Garlic",B:"The U.S. Department of Agriculture",C:"The Garlic Stand",D:"The trade association to which Valley Garlic and the Garlic Stand belong"},ans:["A"],cite:"19 CFR 165.1"},
{n:79,cat:"VI",q:"Which part of CBP's Office of Trade is responsible for conducting the investigation of alleged evasion of antidumping duties?",opts:{A:"Mission Support",B:"Regulations and Rulings",C:"Trade Policy and Programs",D:"Trade Remedy Law Enforcement Directorate"},ans:["D"],cite:"19 CFR 165.1; 19 CFR 165.0"},
{n:80,cat:"VI",q:"When an entry is subject to antidumping and/or countervailing duties (AD/CVD), what certification is required to be submitted prior to liquidation by the importer? For the purposes of this question, CBP has been directed not to accept any such certification after liquidation.",opts:{A:"An importation certification",B:"An origin certification",C:"A reimbursement certification",D:"A registration certification"},ans:["C"],cite:"19 CFR 351.402(f)(2)(i); 19 CFR 351.402(f)(2)(iii)"}

function hintFor(q){
  const c=q.cite||"";
  if(/ANULADA/i.test(c))return t("hintAnnulled");
  const out=[];
  const PN=PART_NAMES[lang]||PART_NAMES.pt;
  const HC=HTS_CH[lang]||HTS_CH.pt;
  const parts=[...new Set([...c.matchAll(/19 CFR (?:Part )?(\d{1,3})/g)].map(m=>parseInt(m[1])))].filter(p=>p!==351);
  if(parts.length){
    const vols=p=>p<=140?"volume Parts 1–140":"volume Parts 141–199";
    out.push("📕 <b>19 CFR</b> — "+parts.map(p=>`Part ${p}${PN[p]?" ("+PN[p]+")":""} · ${vols(p)}`).join("; "));
  }
  if(/19 CFR 351/.test(c))out.push("📕 <b>19 CFR</b> — Part 351 ("+(PN[351]||"AD/CVD")+") · "+t("volEnd"));
  const chs=new Set();
  [...c.matchAll(/\b(\d{4})\.\d{2}/g)].forEach(m=>chs.add(parseInt(m[1].slice(0,2))));
  [...c.matchAll(/Chapter (\d{1,2})/g)].forEach(m=>chs.add(parseInt(m[1])));
  [...c.matchAll(/\bCh\. (\d{1,2})/g)].forEach(m=>chs.add(parseInt(m[1])));
  if(chs.size)out.push("📗 <b>HTSUS</b> — "+[...chs].sort((a,b)=>a-b).map(ch=>`${t("chWord")} ${ch}${HC[ch]?" ("+HC[ch]+")":""}`).join("; ")+". "+t("hintNotes"));
  if(/GRI/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGRI"));
  if(/Additional U\.S\. Rules/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintAddl"));
  if(/General Note|GN /.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGN"));
  if(/General Statistical Note/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGSN"));
  if(/Annex C/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintAnnex"));
  if(/ACE (Entry Summary Instructions|ES)/i.test(c))out.push("📘 <b>ACE Entry Summary Instructions</b> "+t("hintACEES"));
  if(/BRPD|Business Rules/i.test(c))out.push("📘 <b>ACE BRPD</b> "+t("hintBRPD"));
  if(/RTME|Right to Make Entry/i.test(c))out.push("📘 <b>RTME Directive 3530-002A</b> "+t("hintRTME"));
  return out.length?out.join("<br>"):t("hintFallback");
}
function hintL1(q){
  const c=q.cite||"";
  if(/ANULADA/i.test(c))return t("hintAnnulled");
  const out=[];
  const cfr=[...c.matchAll(/19 CFR (?:Part )?(\d{1,3})/g)].map(m=>+m[1]);
  if(cfr.length){
    const vols=[...new Set(cfr.map(p=>p>=200?t("volEnd"):(p<=140?"volume Parts 1–140":"volume Parts 141–199")))];
    out.push("📕 <b>19 CFR</b> — "+vols.join(" + "));
  }
  if(/HTSUS|GRI|General Note|GN |Chapter|Additional U\.S\. Rules|General Statistical|Annex C/.test(c)||/\b\d{4}\.\d{2}/.test(c))out.push("📗 <b>HTSUS</b>");
  if(/ACE (Entry Summary|ES)/i.test(c))out.push("📘 <b>ACE Entry Summary Instructions</b>");
  if(/BRPD|Business Rules/i.test(c))out.push("📘 <b>ACE BRPD</b>");
  if(/RTME|Right to Make Entry/i.test(c))out.push("📘 <b>RTME Directive 3530-002A</b>");
  return out.join("<br>")||t("hintFallback");
}
function hintLevels(q,lvl){
  if(/ANULADA/i.test(q.cite||""))return t("hintAnnulled");
  const parts=[`<div class="hlvl">${t("hintLvl")} 1/3 — ${t("hintLvlBook")}</div>`+hintL1(q)];
  if(lvl>=2)parts.push(`<div class="hlvl">${t("hintLvl")} 2/3 — ${t("hintLvlPart")}</div>`+hintFor(q));
  if(lvl>=3)parts.push(`<div class="hlvl">${t("hintLvl")} 3/3 — ${t("hintLvlExact")}</div>📌 <b>${esc(q.cite)}</b>`);
  return parts.join('<div class="hsep"></div>');
}

function renderTutor(q){

async function askTutor(preset){
  const q=practice.list[practice.idx];
  const inp=$("tutorin");
  const text=preset||(inp?inp.value.trim():"");
  if(!text||practice.loading)return;
  practice.chat.push({role:"user",text});
  practice.loading=true;renderPractice();
  const tutorLang={pt:"português brasileiro",en:"English",es:"español"}[lang];
  const sys=`You are an expert tutor for the U.S. Customs Broker License Exam (CBLE). ALWAYS answer in ${tutorLang}, clearly and didactically, in plain text (no markdown). The exam is open book: always point out WHERE to find the answer (19 CFR part/section, HTSUS chapter/note, applicable GRI, or ACE document). Be concise (max ~250 words).`;
  const context=`PROVA: ${examLabel(q.exam)}\nQUESTÃO ${q.n} (Categoria ${q.cat} - ${catName(q.cat)}):\n${q.scenario?("CENÁRIO: "+q.scenario+"\n"):""}${q.q}\nA) ${q.opts.A}\nB) ${q.opts.B}\nC) ${q.opts.C}\nD) ${q.opts.D}\nRESPOSTA(S) CORRETA(S) segundo o gabarito oficial: ${q.ans.join(", ")}\nCITAÇÃO OFICIAL: ${q.cite}\nO aluno respondeu: ${practice.pick} (${practice.answered?"acertou":"errou"}).`;
  const msgs=[{role:"user",content:context+"\n\nPergunta do aluno: "+practice.chat[0].text}];
  for(let i=1;i<practice.chat.length;i++){
    msgs.push({role:practice.chat[i].role==="user"?"user":"assistant",content:practice.chat[i].text});
  }
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:msgs})
    });
    const data=await r.json();
    const out=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")||"Não consegui gerar a explicação. Tente novamente.";
    practice.chat.push({role:"ai",text:out});
  }catch(e){
    practice.chat.push({role:"ai",text:"Erro ao consultar o tutor. Verifique a conexão e tente novamente."});
  }
  practice.loading=false;renderPractice();
  const box=$("tutorbox");if(box)box.scrollIntoView({behavior:"smooth",block:"end"});
}

      <button class="primary" ${exam.idx>=exam.qs.length-1?"disabled":""} onclick="exam.idx++;exam.hintLvl=0;exam.showTr=false;try{ttsStop()}catch(e){};renderExam();window.scrollTo(0,0)">${t("next")}</button>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){
  let qs=pool().slice();
  if(sel.size>1)qs=shuffle(qs);
  const ms=Math.round(qs.length*3.375)*60*1000;
  exam={active:true,qs,answers:{},idx:0,end:Date.now()+ms,timerId:setInterval(tickClock,1000),done:false,score:null,hintLvl:0,showTr:false};
  renderExam();
}
function pickExam(k,L){exam.answers[k]=L;renderExam();}
function tickClock(){
  const el=$("clock");if(!el)return;
  const ms=exam.end-Date.now();
  if(ms<=0){finishExam();return;}
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  el.textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if(ms<15*60000)el.classList.add("low");
}
function finishExam(){
  clearInterval(exam.timerId);
  let correct=0;const byCat={};Object.keys(CATS).forEach(c=>byCat[c]={c:0,t:0});
  exam.qs.forEach(q=>{
    byCat[q.cat].t++;
    const a=exam.answers[uid(q)];
    if(a&&q.ans.includes(a)){correct++;byCat[q.cat].c++;}
    if(a){stats[q.cat].total++;if(q.ans.includes(a))stats[q.cat].correct++;}
  });
  exam.done=true;exam.active=false;exam.score={correct,byCat,total:exam.qs.length};
  stSet("stats",stats);
  examHist.unshift({d:Date.now(),c:correct,t:exam.qs.length});
  examHist=examHist.slice(0,20);stSet("examhist",examHist);
  renderExam();window.scrollTo(0,0);
}
function renderExamResult(){
  const s=exam.score;const pct=Math.round(s.correct/s.total*100);const pass=pct>=75;
  app().innerHTML=`
  <div class="card" style="text-align:center">
    <span class="eyebrow">${t("resultEyebrow")}</span>
    <div class="result-big ${pass?'pass':'fail'}">${s.correct}/${s.total} · ${pct}%</div>
    <span class="stamp ${pass?'ok':'no'}">${pass?t('pass'):t('fail')}</span>
  </div>
  <div class="card">
    <h3>${t("byCat")}</h3>
    <table class="stats"><tr><th>${t("category")}</th><th>${t("hits")}</th><th>%</th></tr>
    ${Object.entries(s.byCat).filter(([k,v])=>v.t>0).map(([k,v])=>`<tr><td>${catName(k)}</td><td>${v.c}/${v.t}</td><td class="pct">${Math.round(v.c/v.t*100)}%</td></tr>`).join("")}
    </table>
    <p class="note">${t("resultNote")}</p>
    <div class="rowbtns">
      <button class="primary" onclick="reviewExam()">${t("reviewWrong")}</button>
      <button class="ghost" onclick="exam.done=false;renderExam()">${t("newExam")}</button>
    </div>
  </div>`;
}
function reviewExam(){
  const wrong=exam.qs.filter(q=>!(exam.answers[uid(q)]&&q.ans.includes(exam.answers[uid(q)])));
  practice.list=wrong.length?wrong:pool();
  practice.idx=0;resetQ();view="practice";renderNav();renderPractice();window.scrollTo(0,0);
}

const civTrQ=n=>{const tr=CIVICS_TR[n];if(!tr||lang==="en")return "";return lang==="pt"?tr.q[0]:tr.q[1];};
const civTrA=n=>{const tr=CIVICS_TR[n];if(!tr||!tr.a||lang==="en")return null;return lang==="pt"?tr.a[0]:tr.a[1];};
const DAY=86400000;
let civ={deck:stGet("civdeck")||{},session:[],pos:0,flipped:false,mode:null,browseCat:null,chat:null,loading:false,graded:0};
function civState(n){if(!civ.deck[n])civ.deck[n]={reps:0,ease:2.5,ivl:0,due:0,seen:false,lapses:0};return civ.deck[n];}
function civDueCards(filter){
  const now=Date.now();
  return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>{const s=civState(c.n);return s.seen&&s.due<=now;});
}
function civNewCards(filter){return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>!civState(c.n).seen);}
function civMasteredCount(filter){return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>civState(c.n).ivl>=4).length;}
function civReadiness(){
  let sum=0;
  CIVICS.forEach(c=>{const s=civState(c.n);sum+=s.ivl>=4?1:(s.reps>=1?0.5:0);});
  return Math.round(sum/CIVICS.length*100);
}
function civStartSession(mode){
  const filter = mode==="star" ? (c=>c.s===1) : null;
  const due=civDueCards(filter), fresh=civNewCards(filter);
  let list=due.slice(0,30);
  const newLimit=mode==="star"?20:12;
  list=list.concat(fresh.slice(0,Math.max(0,newLimit-Math.floor(due.length/3))));
  if(!list.length)list=CIVICS.filter(c=>(!filter||filter(c))).slice().sort((a,b)=>civState(a.n).due-civState(b.n).due).slice(0,15);
  civ.session=shuffle(list.slice());civ.pos=0;civ.flipped=false;civ.mode=mode;civ.chat=null;civ.graded=0;
  renderCivics();
}
function civGrade(g){ // 0=errei 1=difícil 2=bom 3=fácil
  const card=civ.session[civ.pos];const s=civState(card.n);
  s.seen=true;
  if(g===0){s.reps=0;s.ivl=0;s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);s.due=Date.now();
    const re=Math.min(civ.session.length,civ.pos+4);
    civ.session.splice(re,0,card); // reaparece nesta sessão
  }else if(g===1){s.ivl=Math.max(1,Math.round(s.ivl*1.2))||1;s.ease=Math.max(1.3,s.ease-0.15);s.reps++;s.due=Date.now()+s.ivl*DAY;}
  else if(g===2){s.reps++;s.ivl=s.reps===1?1:(s.reps===2?3:Math.round(s.ivl*s.ease));s.due=Date.now()+s.ivl*DAY;}
  else{s.reps++;s.ivl=Math.max(4,Math.round((s.ivl||1)*s.ease*1.3));s.ease=Math.min(3.0,s.ease+0.1);s.due=Date.now()+s.ivl*DAY;}
  civ.graded++;civ.pos++;civ.flipped=false;civ.chat=null;
  stSet("civdeck",civ.deck);
  renderCivics();window.scrollTo(0,0);
}

async function civExplain(){
  const c=civ.session[civ.pos];
  civ.loading=true;renderCivics();
  const tutorLang={pt:"português brasileiro",en:"English",es:"español"}[lang];
  const sys=`You are a friendly tutor helping an immigrant prepare for the U.S. naturalization civics test (oral, in English). ALWAYS answer in ${tutorLang}, in plain text (no markdown), max ~150 words. Explain the MEANING of the question and answer in very simple terms, give one easy memory tip or association, and remind how to say the answer in English.`;
  const user=`Question ${c.n}: ${c.q}\nOfficial answers: ${c.a.join(" | ")}${c.d?"\nNOTE: this answer changes with elections/appointments — remind the student to check uscis.gov/citizenship/testupdates.":""}`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:[{role:"user",content:user}]})});
    const data=await r.json();
    civ.chat=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")||"—";
  }catch(e){civ.chat=t("civTutorErr");}
  civ.loading=false;renderCivics();
}

function ttsInit(){
  if(!("speechSynthesis" in window))return;
  const load=()=>{tts.voices=speechSynthesis.getVoices();};
  load();speechSynthesis.onvoiceschanged=load;
}
function ttsVoice(lc){
  if(!tts.voices.length&&ttsSupported())tts.voices=speechSynthesis.getVoices();
  const pref={en:["en-US","en_US","en-GB","en"],pt:["pt-BR","pt_BR","pt-PT","pt"],es:["es-US","es-MX","es-419","es-ES","es"]}[lc]||["en"];
  for(const p of pref){const v=tts.voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p.replace("_","-").toLowerCase()));if(v)return v;}
  return null;
}
function ttsSupported(){return "speechSynthesis" in window;}
function hasVoice(lc){return !!ttsVoice(lc);}
function ttsStop(){if(ttsSupported()){speechSynthesis.cancel();}tts.playing=-1;if(view==="reading")renderReading();}
function ttsSpeak(text,lc,onend){
  if(!ttsSupported())return;
  const u=new SpeechSynthesisUtterance(text);
  const v=ttsVoice(lc);if(v)u.voice=v;
  u.lang=(v&&v.lang)||({en:"en-US",pt:"pt-BR",es:"es-US"}[lc]);
  u.rate=tts.slow?0.7:0.95;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
}
function ttsOne(i,lc){ttsStop();const s=curReading()[i];tts.playing=i;renderReading();ttsSpeak(s[lc],lc,()=>{tts.playing=-1;renderReading();});}
function ttsAll(i){ // fala EN + tradução do idioma do app (EN puro se o app estiver em inglês)
  ttsStop();const s=curReading()[i];tts.playing=i;renderReading();
  const done=()=>{tts.playing=-1;renderReading();};
  if(lang==="pt")ttsSpeak(s.en,"en",()=>ttsSpeak(s.pt,"pt",done));
  else if(lang==="es")ttsSpeak(s.en,"en",()=>ttsSpeak(s.es,"es",done));
  else ttsSpeak(s.en,"en",done);
}
function ttsToggleRead(parts,lc){
  if(!ttsSupported())return;
  if(speechSynthesis.speaking){ttsStop();return;}
  parts.filter(Boolean).forEach(p=>ttsSpeak(p,lc));
}
