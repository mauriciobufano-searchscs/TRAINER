{n:56,cat:"V",q:"Who may import honeybees from any country without exception for experimental or scientific purposes?",opts:{A:"Any university or college with a experimental or scientific need.",B:"U.S. Department of Agriculture",C:"The American Beekeeping Federation with a license from the U.S. Foreign Agriculture Service",D:"Any importer with a certificate of quota eligibility or foreign government export permit as honeybees are subject to quota."},ans:["B"],cite:"19 CFR 12.32"},
{n:57,cat:"V",q:"A carnet presented by a freight forwarder without an interest in the merchandise referenced in the carnet shall not be accepted by CBP unless the freight forwarder is a _____.",opts:{A:"Nominal consignee",B:"Ultimate consignee",C:"Licensed customs broker",D:"Common carrier"},ans:["C"],cite:"Right to Make Entry Directive 3530-002A"},
{n:58,cat:"V",q:"Which one of the following matters is NOT subject to protest under 19 USC 1514?",opts:{A:"The classification and rate and amount of duties chargeable",B:"The appraised value of merchandise",C:"The refusal to reliquidate an entry made before December 18, 2006, under 19 USC 1520(c)",D:"The liquidation or reliquidation of an entry, or any modification of an entry"},ans:["C"],cite:"19 CFR 174.11"},
{n:59,cat:"V",q:"Which of the following is NOT a required field when a broker creates a blanket U.S. – Mexico - Canada Agreement (USMCA) certificate of origin (CBP Form 434) in the Automated Commercial Environment (ACE) Portal on behalf of an importer without an ACE portal account?",opts:{A:"Valid Date From and Valid Date To",B:"Manufacturers Identification Code (MID)",C:"Harmonized Tariff Schedule (HTS) Number",D:"Filer code and importer of record number"},ans:["B"],cite:"Business Rules and Process Document v 11 (Trade) Section 4.3"},
{n:60,cat:"V",q:"Broker ABC receives documents to clear an ocean shipment of $250,000 in ceramic plates. The invoice indicates that the merchandise was manufactured in South Korea. Broker ABC did not receive additional information regarding the country of origin before filing the entry summary and paying the duties, merchandise processing fee, and harbor maintenance fee. Upon receiving the proof of country of origin, Broker ABC filed a timely post importation claim under the US-Korea Free Trade Agreement (KORUS). Upon liquidation, what will CBP refund?",opts:{A:"The refund will be 100% of the duties, merchandise processing fee (MPF), harbor maintenance fee (HMF), plus interest calculated from the date of payment to the date of liquidation.",B:"The refund will be 100% of the duties and MPF only plus interest calculated from the date of payment to the date of liquidation.",C:"The refund will be 100% of the duties, MPF, and HMF plus interest calculated from the date of entry to the date of payment.",D:"The refund will be 99% of the duties and MPF only but no interest as a refund resulting from post-importation claim for duty preference under the KORUS is not eligible for interest."},ans:["B"],cite:"19 CFR 24.3a; 19 CFR 24.23(c)(13); 19 CFR 24.24"},
{n:61,cat:"V",q:"The following types of evidence of right to make entry for importations by common carrier when merchandise is not released directly to the carrier are acceptable types of evidence EXCEPT:",opts:{A:"A bill of lading or air waybill properly endorsed when required.",B:"An extract from a bill of lading or air waybill that has not been certified to be genuine by the carrier bringing the merchandise to the port of entry.",C:"A certified duplicate bill of lading or air waybill with the carrier's certificate in the required form.",D:"A shipping receipt or other document presented in lieu of a bill of lading when entry is made by the actual consignee in person."},ans:["B"],cite:"19 CFR 141.11"},
{n:62,cat:"V",scenario:"Calendário 2024 fornecido na prova — feriados federais destacados: 01/01 (New Year), 15/01 (MLK), 19/02 (Presidents Day), 27/05 (Memorial Day), 19/06 (Juneteenth), 04/07 (Independence Day), 02/09 (Labor Day), 14/10 (Columbus Day), 11/11 (Veterans Day), 28/11 (Thanksgiving), 25/12 (Christmas).",q:"Use the provided calendar and the following entry record information to determine the answer with the correct dates in order for 1) entry filing due date, 2) final possible post-summary correction (PSC) submission date without an extension, and 3) final protest submission date. If any single date in the series is incorrect, the entire answer is incorrect.\n• The shipment is of commercial goods whose entered value exceeds $2,500.00, and it arrived at the port of entry on February 15, 2024.\n• The date of entry is the same date that the broker filed entry and is February 16, 2024.\n• Broker filed entry summary and paid the amount due on March 4, 2024.\n• Broker filed a PSC on April 15, 2024, requesting a refund and accelerated liquidation. CBP disagreed in part with the PSC, and the entry liquidated on April 26, 2024.",opts:{A:"March 1, 2024; December 12, 2024; October 23, 2024",B:"February 15, 2024; April 15, 2024; August 15, 2024",C:"March 7, 2024; December 10, 2024; July 25, 2024",D:"March 1, 2024; December 10, 2024; October 23, 2024"},ans:["A"],cite:"19 CFR 141.5; ACE BRPD, Chapter 6; 19 CFR 174.12(e)"},
{n:63,cat:"V",q:"How should you report the known U.S. State of Destination Code on CBP Form 7501 at the time of entry summary filing when the contents of the shipment are destined to more than one state, territory, or possession?",opts:{A:"Report the state of destination by spelling out the entire name of the destination location with the least aggregate value.",B:"Report the state of destination using the standard postal two-letter state or territory abbreviation of the destination location with the greatest aggregate value.",C:"Report the state of destination as \"MULTI\" to reflect that there are multiple destinations.",D:"Report all of the states, territories, and possessions that are listed on the shipping documents using the standard postal two-letter state or territory abbreviation."},ans:["B"],cite:"ACE ES Instructions v. 2-4"},
{n:64,cat:"V",q:"A cartman has custody of in-bond merchandise coming from Mexico or Canada, for which entry has NOT been made. Within how many calendar days is the carrier required to notify CBP of merchandise for which entry has not been made?",opts:{A:"Five (5)",B:"Ten (10)",C:"Twenty (20)",D:"Thirty (30)"},ans:["C"],cite:"19 CFR 123.10(b)"},
{n:65,cat:"V",q:"Which one of the following types of merchandise must be seized upon importation and delivered to the nearest United States Secret Service representative?",opts:{A:"Metal die stamps containing the likeness of a toonie, a $2 dollar coin of Canadian currency.",B:"A movie film containing matter advocating or urging treason or insurrection against the United States.",C:"Matches manufactured with white phosphorus.",D:"Switchblade knives that do not qualify for an exception under 15 USC 1244."},ans:["A"],cite:"19 CFR 12.48(a)"},
{n:66,cat:"VI",q:"Commerce initiates a/an _____ investigation when a proper and complete petition is filed on behalf of an affected United States industry, alleging that foreign merchandise is being sold in the United States at \"less than fair value\" and that such sales are materially injuring, or threatening to materially injure, a United States industry.",opts:{A:"Scope",B:"Antidumping",C:"Countervailing",D:"Sunset"},ans:["B"],cite:"19 CFR Part 351"},
{n:67,cat:"VI",q:"No later than once every five years, a __________ occurs when the Secretary of the Department of Commerce determines whether antidumping or countervailable subsidies would be likely to continue or resume if an order were revoked or a suspended investigation were terminated.",opts:{A:"Changed circumstance review",B:"Sunset Review",C:"Preliminary determination",D:"Termination of investigation"},ans:["B"],cite:"19 CFR 351.218(a)"},
{n:68,cat:"VI",q:"CBP initiates an investigation of a claim that an importer of merchandise within the scope of antidumping or countervailing duty (AD/CVD) orders is evading those orders. Through its investigation, CBP decides there is reasonable suspicion that the importer has entered covered merchandise into the customs territory of the U.S. through evasion. Which of the following actions would CBP NOT take after deciding there is reasonable suspicion of evasion?",opts:{A:"Notify the Department of Commerce of its decision that there is reasonable suspicion and ask the Department of Commerce to identify the applicable AD/CVD assessment rates for the covered merchandise.",B:"Suspend the liquidation of each unliquidated entry of the covered merchandise that entered on or after the date the investigation was initiated.",C:"Extend the period of liquidation for each unliquidated entry of covered merchandise that entered before the date the investigation was initiated.",D:"Notify parties to the investigation of its decision that there is reasonable suspicion within five business days of taking any interim measures and provide parties to the investigation with a public version of the administrative record as of that date."},ans:["A"],cite:"19 CFR 165.24"},
{n:69,cat:"VI",q:"The U.S. importer entered into an agreement with an unrelated exporter/manufacturer for the purchase of 10,000 branded hats. The purchase contract contained the following terms: the price for the 10,000 hats is $50,000.00; the merchandise may be resold only in New York; and the buyer indicates that it will spend $5,000.00 on his own account to promote the sale of the merchandise. No selling commission, assist, royalty, or license fee is involved. Is transaction value the proper method of appraisement and, if so, what is the transaction value?",opts:{A:"No, transaction value is inapplicable because there is a restriction on the disposition or use of the merchandise (i.e., the merchandise may be resold only in New York).",B:"Yes, $50,000.00",C:"Yes, but it is impossible to calculate the transaction value based on the information provided",D:"Yes, $55,000.00"},ans:["B"],cite:"19 CFR 152.103(a)(2)"},
{n:70,cat:"VI",q:"A U.S. hardware company imports hammers from a manufacturer in Argentina. The U.S. company purchases and sends the designs and materials set forth below to the Argentinian manufacturer free of charge to aid in the production process. The cost of which of the following should not be added to the price actually paid or payable as an assist?",opts:{A:"Brazilian wood used for the handle",B:"A German origin hammer head mold",C:"A hammer design schematic by a U.S. engineering firm",D:"A Taiwanese lathe machine"},ans:["C"],cite:"19 CFR 152.102(a)(1)(iv)"},
{n:71,cat:"VI",q:"What is the Most Favored Nation rate of duty applicable to dried paprika?",opts:{A:"3 cents/kilogram",B:"5 cents/kilogram",C:"11 cents/kilogram",D:"66 cents/kilogram"},ans:["A"],cite:"HTS 0904.21.2000"},
{n:72,cat:"VI",q:"Which of the following is NOT an acceptable basis of appraisement for imported merchandise?",opts:{A:"The price of merchandise in the domestic market of the country of exportation.",B:"The transaction value which is the price actually paid without regard to its method of derivation.",C:"The computed value if the deductive value cannot be determined.",D:"The deductive value if the transaction of similar merchandise cannot be determined."},ans:["A"],cite:"19 CFR 152.108(c)"},
{n:73,cat:"VI",q:"Gemma Jones purchases 10,000 glass vases from Sklyana Vasa Company (SVC). The wholesale price charged by SVC is $3.00 per vase with the following volume discounts:\n0 – 1,000 vases: Full price\n1,001 – 5,000 vases: 5% discount\n5,001 – 15,000 vases: 10% discount\n15,001 – 25,000 vases: 15% discount\nJones receives the shipment and finds that 100 of the vases are broken. She contacts SVC who agrees not to charge her for the broken vases. What is the transaction value for the vases?",opts:{A:"$26,730.00",B:"$27,000.00",C:"$28,215.00",D:"$29,700.00"},ans:["B"],cite:"19 CFR 152.103(a)(1)"},
{n:74,cat:"VI",q:"For which ONE of the following transactions would the commission amount paid by the buyer NOT be added to the price paid or payable when determining transaction value?",opts:{A:"A foreign manufacturer attended a trade fair with 100 vendors (sellers). The trade fair operator offered to provide the manufacturer with a translator who would also guide English speaking buyers who may be interested in the manufacturer's products to the manufacturer's booth. The manufacturer signed an agreement with the trade fair operator stating that each invoice from the manufacturer on transactions for which the translator found a buyer and provided translation services would include a 5% commission to be paid to the translator for those services.",B:"Canadian Machine Manufacturer (CMM) had an agreement with We Sell Inc. (We Sell), a U.S. corporation, whereby We Sell would locate purchasers in the United States to buy CMM productions. We Sell would contract for CMM's products with CMM and receive a 15% discount from the manufacturer's suggested price. We Sell would invoice the purchaser for the manufacturer's suggested price, keeping the 15% as We Sell's commission; however, CMM had to approve the sale to the purchaser first.",C:"Seller X in China offered U.S. buyers the opportunity to have purchased goods inspected prior to lading for shipment to the U.S. by a third party. Buyers could choose any one of three inspection companies offered by Seller X. The buyer could negotiate the price with the inspection company and pay the inspection company directly. The inspection company was required to rebate one-third of its fee to Seller X.",D:"Needless Markup, a Delaware company, wants to begin importing fleece sweatshirts from the Dominican Republic (DR). Needless Markup hires Caribbean Trading, and established purchasing company, to travel to the DR and make several purchases on behalf of Needless Markup. The invoice from Caribbean Trading includes the sweatshirts and a commission for Caribbean Trade of 7% of the purchase price of the goods."},ans:["D"],cite:"19 CFR 151.102 - 152.103"},
{n:75,cat:"VI",q:"An examining officer finds merchandise during a cargo inspection that is not invoiced. There is no evidence that smuggling was intended, and the failure to invoice the merchandise is conclusively a mistake. Which of the following is true regarding the duties on the merchandise found?",opts:{A:"Estimated duties are paid according to what is actually listed on the invoice.",B:"Duties are suspended until a new entry is made.",C:"Duties are assessed on the merchandise actually found.",D:"Duties are assessed based on whichever is the higher rate (merchandise listed on invoice versus merchandise actually found)."},ans:["C"],cite:"19 CFR 152.3"},
{n:76,cat:"VI",q:"A shipment of portable gas stoves manufactured in Sweden are imported into the United States. The appraised value of each stove upon importation is $600.00. They are classified under 7321.11.1030 with a duty rate of 5.7 percent. The importer discovers that 15 of the stoves have a faulty gas valve. The stoves are exported to Canada for warranty repair. Upon reimportation from Canada, there is no charge to the importer, but the value of the repair is $120.00 each. The reimportation is under 9802.00.40 in the Harmonized Tariff Schedule of the United States. Which statement accurately reflects the dutiable value and duty rate upon reimportation?",opts:{A:"The dutiable value is $1,800.00, and the duty rate is \"Free\" with a claim of \"S\" as the goods were repaired in Canada and the United States-Mexico-Canada Agreement applies to repairs of goods originating outside of the United States, Mexico, or Canada.",B:"The dutiable value is $1,800.00, and the duty rate is 5.7%, the rate of duty on the article itself, as goods originating outside of the United States, Canada, or Mexico are not eligible for duty free treatment under the United States-Mexico-Canada Agreement.",C:"The dutiable value is $0.00 because the importer was not charged for the repair, and the rate of duty is not relevant since any rate of duty multiplied by a dutiable value of $0.00 will be $0.00 owed.",D:"The dutiable value is $0.00 because the importer was not charged for the warranty repair, and the duty rate is 5.7 percent because it is the duty rate that applies to the article itself."},ans:["A"],cite:"Chapter 98, Subchapter II, U.S. Note 3"},
{n:77,cat:"VI",q:"Transaction value means:",opts:{A:"The price actually paid or payable for the merchandise.",B:"The price actually paid or payable for the merchandise plus buying commissions, royalties, assists, packing costs, and proceeds.",C:"The price actually paid or payable for the merchandise plus selling commissions, royalties, packing costs, and U.S. inland freight.",D:"The price actually paid or payable for the merchandise plus selling commissions, royalties, assists, packing costs, and proceeds."},ans:["D"],cite:"19 CFR 152.103(a), 19 CFR 152.103(b)"},
{n:78,cat:"VI",q:"Which statement is FALSE with respect to the applicable rates of duty?",opts:{A:"Subject to exceptions specified in the Customs Regulations, rates of duty applicable to merchandise shall be the rates in effect at the \"time of entry,\" which is defined in 19 CFR 141.68.",B:"Merchandise entered for warehouse is dutiable at the rates in effect at the time withdrawal for consumption is made in accordance with 19 CFR 141.68(g).",C:"Dutiable merchandise eligible for informal mail entry is dutiable at the rates in effect at the time the preparation of the entry documentation by a CBP employee is completed.",D:"For quota-class merchandise where the quota period opens in one calendar year and closes in another calendar year, the applicable rate of duty shall be determined at the time of liquidation."},ans:["D"],cite:"19 CFR 141.68, 19 CFR 132.11a"},
{n:79,cat:"VI",q:"What are the two methods of calculating regional value content under the United States-Mexico-Canada Agreement?",opts:{A:"Transaction Value and De Minimis",B:"Transaction Value and Net Cost",C:"De Minimis and Net Cost",D:"Computed Value and Net Cost"},ans:["B"],cite:"19 CFR 182, Appendix A, Section 7"},
{n:80,cat:"VI",q:"A shipment of leather handbags manufactured in India and subject to absolute quota arrives in the U.S. You find that the quota for this merchandise from India is closed. Which of the following describes the suitable action for the importer?",opts:{A:"Make a consumption entry and pay column 2 rates.",B:"Export the merchandise to Pakistan and re-import into the U.S. as a product of Pakistan.",C:"Request a visa waiver from the Pakistan embassy.",D:"Make a warehouse entry."},ans:["D"],cite:"19 CFR 132.5(c)"}
];

const OCT2025=[
{n:1,cat:"I",q:"Which ONE of the following constitutes an impermissible \"misuse of license or permit\" pursuant to CBP regulations pertaining to licensed customs brokers?",opts:{A:"A broker allows an unlicensed person, who is not an employee, to solicit, promote or perform any customs business or transaction using the broker's license.",B:"A broker influences or attempts to influence the conduct of any representative of the Department of Homeland Security in any pending matter by the use of duress or false accusation.",C:"A broker procures or attempts to procure information from Government records to which they have not been granted access by proper authority.",D:"A broker knowingly uses false or misleading representations to procure employment pertaining to a customs matter."},ans:["A"],cite:"19 CFR 111.37; 19 CFR 111.34; 19 CFR 111.33; 19 CFR 111.38"},
{n:2,cat:"I",q:"AA Customs Brokers, Inc. has a corporate customs broker license and a national permit. Tom, the individually licensed broker who was the corporation's national permit qualifier, has recently resigned from AA Customs Brokers, Inc. What is the maximum number of days from Tom's effective resignation date that AA Customs Brokers, Inc. has to find a new licensed customs broker to qualify its national permit to avoid their permit's revocation by operation of law?",opts:{A:"120 days",B:"60 days",C:"30 days",D:"180 days"},ans:["D"],cite:"19 CFR 111.45(a)"},
{n:3,cat:"I",q:"By what date must an initial petition for relief in a seizure and a penalty case be filed?",opts:{A:"Within 60 days of the mailing of the notice of seizure or notice of penalty.",B:"Within 30 days from the date of mailing of the notice of seizure or notice of penalty.",C:"For seizure cases, within 60 days of the date of mailing of the notice of seizure, and for penalty cases, within 30 days from the date of mailing of the notice of penalty.",D:"For seizure cases, within 30 days from the date of mailing of the notice of seizure, and for penalty cases, within 60 days of the mailing of the notice of penalty incurred."},ans:["D"],cite:"19 CFR 171.2(b)"},
{n:4,cat:"I",q:"What are the requirements for CBP to consider an offer in compromise under the Tariff Act of 1930 (as amended) arising from a violation of Customs law?",opts:{A:"Tender of a 20% deposit of the total sum offered and an offer in writing.",B:"Tender of the specific sum offered and an offer in writing.",C:"Tender of the domestic value of the claim and an offer in writing.",D:"Tender of at least $1,000.00 and an offer in writing."},ans:["B"],cite:"19 CFR 161.5"},
{n:5,cat:"I",q:"Which ONE of the following is NOT required to be maintained by a broker as evidence of their registration for, attendance at, or completion of the qualifying continuing broker education?",opts:{A:"The location where the broker completed the qualifying continuing broker education.",B:"The name of the entity or person who provided the qualifying continuing broker education.",C:"The date(s) the broker attended the qualifying continuing broker education.",D:"The date(s) the broker received proof of completing the qualifying continuing broker education."},ans:["D"],cite:"19 CFR 111.102(d)(1)(i)-(vi)"},
{n:6,cat:"I",q:"Which people and/or entities must certify completion of the continuing broker education requirement with their status report required under 19 CFR 111.30(d)?\ni. Individually licensed brokers;\nii. Partnerships with customs broker licenses;\niii. Associations with customs broker licenses;\niv. Corporations with customs broker licenses",opts:{A:"i",B:"i and ii",C:"ii, iii, and iv",D:"i, ii, iii, and iv"},ans:["A"],cite:"19 CFR 111.101; 19 CFR 111.30(d)"},
{n:7,cat:"I",q:"ZX Customs Brokers, Inc. (ZX) is a customs broker that is a corporation. George Forest, an individually licensed customs broker, is ZX's Vice President of Compliance and is the qualifier for ZX's license and national permit. On May 1, 2025, the Executive Director, Office of Trade, CBP accepts Mr. Forest's voluntary suspension of his individual license for one year effective May 5, 2025 due to health issues. ZX's Import Manager, Jayne Smythe, is an individually licensed broker, but she is not a duly appointed officer of ZX. Which of the following statements is FALSE?",opts:{A:"ZX may notify CBP that it is appointing Import Manager Smythe as its national permit qualifier and continue conducting customs business until the annual permit expires on December 31, 2025.",B:"ZX may make a written voluntary offer of suspension of its broker's license and permit for one year to accommodate Mr. Forest's voluntary suspension of his license and discontinue conducting customs business during the suspension period.",C:"ZX may appoint Import Manager Smythe as Vice President of Import Compliance, notify CBP that Ms. Smythe will be the new license and permit qualifier effective May 5, 2025, and continue conducting customs business.",D:"Prior to September 2, 2025, ZX may hire Dr. Hu, an individually licensed broker, as its Vice President of Import Compliance. It can then designate Dr. Hu to act as the corporation's new license qualifier and Import Manager Smythe to serve as its new national permit qualifier. After informing CBP of the appointments and complying with all other relevant requirements, it may continue conducting customs business.",},ans:["A"],cite:"19 CFR 111.52; 19 CFR 111.11(c); 19 CFR 111.19; 19 CFR 111.45"},
{n:8,cat:"I",q:"Suzy Smith is a licensed customs broker, and her license is overseen by the Processing Center located in Miami, Florida. Ms. Smith seeks to obtain a national permit in her individual capacity to transact customs business throughout the customs territory of the United States. Ms. Smith's application included: (1) broker license number and date of issuance; (2) address, telephone number, and email of the office of record; (3) name, telephone number, and email of the point of contact; (4) a list of all employees with the specific employee information prescribed in 19 CFR 111.28; (5) the location where records will be retained; (6) the name, telephone and email of the knowledgeable employee responsible for broker-wide records maintenance and financial recordkeeping; (7) and a receipt showing the fees specified in 19 CFR 111.96(b) and (c) have been paid. What additional materials must Ms. Smith provide to complete her application for a national permit?",opts:{A:"A request to move oversight of her license to CBP Headquarters.",B:"A waiver for the national permit examination.",C:"A supervision plan describing how she will exercise responsible supervision and control over the customs business conducted under the national permit.",D:"A list of her past employers, regardless of whether the employment was related to the transaction of customs business."},ans:["C"],cite:"19 CFR 111.19(b)(8)"},
{n:9,cat:"I",q:"When a protest is filed on behalf of a principal by an agent, who is not an attorney at law or a customhouse broker or his authorized employee, what document must also be filed to demonstrate the agent is authorized to file protest?",opts:{A:"Articles of incorporation",B:"Certificate of authority",C:"Letter of intent",D:"Power of attorney"},ans:["D"],cite:"19 CFR 174.3(a)"},
{n:10,cat:"I",q:"The U.S. Department of Defense (DoD), an agency or office of the United States Government, hires a licensed customs broker for the importation of armor equipment to be used in a new concept unmanned tank style vehicle. The DoD instructs the broker that a power of attorney is NOT required due to the nature and sensitivity of the importation, and the fact that the equipment is for the account of the DoD. Which of the below statements is TRUE?",opts:{A:"When merchandise is imported by the DoD it is automatically duty-free.",B:"The power of attorney is not required where the DoD is to act as Importer of Record (IOR) due to inherent sensitivities.",C:"When merchandise is imported by a U.S. government agency it is exempt from examination by CBP.",D:"Merchandise imported by, or for the account of the DoD, is subject to ordinary Customs entry requirements and a Power of attorney is required if a customs broker is used."},ans:["D"],cite:"19 CFR 141.46; 19 CFR 10.100"},
{n:11,cat:"I",q:"Which of the following parties is required to maintain records and render them for examination and inspection by CBP?",opts:{A:"A consumer who purchases an imported automobile from a domestic dealer.",B:"A traveler who has made an oral declaration of non-commercial goods under the traveler's personal exemption.",C:"A person who knowingly causes the importation of merchandise carried under bond into the United States.",D:"A consumer who unknowingly purchases imported goods from a local store."},ans:["C"],cite:"19 CFR 163.2(a)(1)(i)-(ii); 19 CFR 163.2(e)"},
{n:12,cat:"I",q:"When merchandise is withdrawn from a bonded warehouse, records relating to the withdrawal must be retained by a customs broker for how many years from the date of the last withdrawal?",opts:{A:"2",B:"4",C:"5",D:"6"},ans:["C"],cite:"19 CFR 111.23(b)"},
{n:13,cat:"I",q:"In transacting customs business, licensed customs brokers must exercise responsible supervision and control. CBP's determination of what is necessary to perform and maintain responsible supervision and control will vary depending upon the circumstances in each instance. Regardless of the circumstances, which ONE of the following factors is a mandatory requirement for licensed customs brokers to exercise responsible supervision and control when conducting customs business?",opts:{A:"Conducting audits and reviews of customs transactions handled by the employee",B:"Providing adequate training to brokerage employees",C:"Ensuring employees have access to the latest CBP regulations",D:"Employing a sufficient number of licensed brokers relative to the job complexity"},ans:["A","B","C","D"],cite:"QUESTÃO ANULADA — crédito concedido a todos os examinandos (qualquer resposta conta como acerto)"},
{n:14,cat:"I",q:"Andrew Balder, an employee of PM Morris Customs Brokerage (MCB), has decided to import dual color lapel men's dress jackets to take advantage of their exploding popularity. One of MCB's clients regularly imports comparable dress jackets and has a record number of sales. Which of the following statements is CORRECT?",opts:{A:"Andrew Balder may not import items similar to that of MCB's clients because it would be a conflict of interest.",B:"An employee of a broker may not also be an importer.",C:"Andrew Balder must notify the appropriate Center Director and seek permission to import such articles.",D:"Andrew Balder must notify the MCB's client that they are also going to import dual color lapel men's dress jackets."},ans:["D"],cite:"19 CFR 111.31(c)"},
{n:15,cat:"I",q:"_____ means an activity performed by a business entity to ensure that documents for a related business entity or entities are prepared and filed with CBP using \"reasonable care\", but such activity does not extend to the actual preparation or filing of the documents or their electronic equivalents.",opts:{A:"Corporate compliance activity",B:"Conducting customs business",C:"Exercising responsible supervision and control",D:"Informed compliance activity"},ans:["A"],cite:"19 CFR 111.1"},
{n:16,cat:"I",q:"An individually licensed broker subject to continuing broker education requirements completed a qualifying course on April 15, 2027. The broker is maintaining appropriate records pertaining to their continuing education in accordance with applicable CBP regulations. The broker certified completion of their continuing education hours with the filing of their triennial status report on February 1, 2030. For how long is the broker required to maintain a record of their April 15, 2027, continuing education course - which of the following dates identifies the right timeframe?",opts:{A:"April 15, 2030",B:"February 1, 2033",C:"April 15, 2033",D:"February 1, 2035"},ans:["B"],cite:"19 CFR 111.102(d)(1); 19 CFR 163.4(a)"},
{n:17,cat:"I",q:"Which answer choice correctly completes the following statement: Upon CBP's request, the individual broker must make available to CBP the information and documentation pertaining to the qualifying continuing broker education completed during a triennial period on or before _____.",opts:{A:"30 calendar days from the date of CBP's request",B:"30 business days from the date of CBP's request",C:"30 calendar days from the date of receipt of CBP's request",D:"30 business days from the date of receipt of CBP's request"},ans:["C"],cite:"19 CFR 111.102(d)(2)"},
{n:18,cat:"I",q:"At the conclusion of the 2024-to-2027 triennial reporting period, Joe Slacker, a licensed customs broker and part-time college student, completed eight hours of accredited continuing broker education and two semesters of supply chain management college coursework. As a customs broker he was required to complete 20 hours of qualifying continuing broker education. Mr. Slacker submitted a triennial status report, but he failed to report or certify compliance with the continuing broker education requirement. What must Mr. Slacker do to rectify his non-compliance and maintain his license?",opts:{A:"Submit a corrected status report certifying the eight continuing broker education hours completed during the triennial period within 30 calendar days of the issuance of CBP's notice of failure to report and certify compliance.",B:"Request a waiver under 19 CFR 111 from completing the remaining 12 qualifying continuing education credit hours as Mr. Slacker completed more than 12 hours of supply chain management coursework at the collect he attended.",C:"Complete the required number of qualifying continuing broker education credits and submit a corrected status report within 30 calendar days of the issuance of CBP's notice of failure to report and certify compliance.",D:"Retake and pass the Customs Broker License Exam within 120 calendar days of CBP's notice of failure to report and certify compliance."},ans:["C"],cite:"19 CFR 111.104"},
{n:19,cat:"I",q:"What is the penalty for any person who intentionally transacts customs business, other than as provided in 19 CFR 111.2(a)(2), without holding a valid broker's license?",opts:{A:"The person receives a written reprimand from the port director with the approval of Headquarters, which may be considered in connection with any future disciplinary proceedings.",B:"The person is subject to criminal sanctions.",C:"The person is automatically barred from importing merchandise into the United States.",D:"The person is liable for a monetary penalty for each such transaction."},ans:["D"],cite:"19 CFR 111.2(a)(2); 19 CFR 111.4"},
{n:20,cat:"I",q:"Mr. Jones, a buying agent with power of attorney for importer American Widgets, employs licensed customs broker Ms. Smith for the transaction of customs business and Speedy Freight Forwarder for the transportation of merchandise on behalf of American Widgets. Mr. Jones does not have a customs broker license. American Widgets' imported merchandise was not purchased on a delivered duty-paid basis. Ms. Smith executed a power of attorney directly with American Widgets. Of the following choices, what additional action must Ms. Smith take for billing purposes?",opts:{A:"Ms. Smith must transmit either a copy of her bill for services rendered or a copy of the entry to American Widgets, unless American Widgets waives transmittal.",B:"Ms. Smith must pay a finder's fee to Mr. Jones for the referral of American Widgets' customs business.",C:"Ms. Smith must execute a power of attorney directly with Speedy Freight Forwarder.",D:"Ms. Smith must transmit directly to Speedy Freight Forwarder a copy of the brokerage charges."},ans:["A"],cite:"19 CFR 111.36(a)"},
{n:21,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q21-25) — Baltimore Quick Printers (BQ, Baltimore/MD) comprou uma Luxemburg Digital Press da fabricante Stampa Fabbrica (Gênova, Itália), parte NÃO relacionada, por US$ 80.000,00, termos C.I.F. (Stampa pré-paga frete e seguro internacionais). A prensa estava em backorder. Em 06/01/2025 a Stampa embarcou uma prensa para um comprador em Pequim (China), que RECUSOU o embarque alegando atraso. Em 07/01/2025 a Stampa ofereceu por e-mail à BQ um \"rebate de US$ 15.000,00 sobre o preço de compra\" para aceitar essa prensa recusada. BQ confirmou; embarque AÉREO Pequim→Baltimore, Shark Airlines, AWB 989-2349 9976, saiu da China em 17/01/2025. Em rota, o voo foi desviado de Baltimore para Boston (mau tempo). O broker Fast Brokers ajustou a documentação (descarga em Boston) e arranjou transporte rodoviário bonded Boston→Baltimore pela Exact Trucking (bonded sob 19 CFR 113.63), criando o CBP Form 7512. O Officer Evans (Porto de Baltimore) marcou a mercadoria como \"arrived\"; data de entry: 17/01/2025. BQ pagou a fatura em 21/01/2025. ▸ AWB: valor declarado p/ transporte $114.600; valor declarado p/ ADUANA $80.000; 6 volumes, 11.500 kg brutos; peso taxável 11.000 kg × $3,00 = frete $33.000; seguro $2,00/$100 sobre $80.000 (=$1.600); prepaid $34.600; origem corrigida de IT para CN. ▸ Fatura comercial (SF05012023S, 07/01/2025, C.I.F.): linha 001 prensa $80.000 (HS 8443.3, C/O IT); linha 002 frete+seguro $34.600; linha 003 \"rebate negociado 07/01/2025\" −$15.000; total $114.600. ▸ Fatura do broker: broker fee $390; documento adicional $30; doc fees Shark Airlines $35; encargos CBP $5.233,37 (Duty $0; Ad'l duty Sec. 301 $4.875,00; MPF $277,12; HMF $81,25); total $5.688,37; nota: C/O China HTS 9903.88.15/7,5% + 8443.32.5000/Free.",q:"What is the dutiable value of the press?",opts:{A:"$65,000.00",B:"$80,000.00",C:"$99,600.00",D:"$114,600.00"},ans:["A"],cite:"19 CFR 152.103(a)(1); 19 CFR 152.103(i)"},
{n:22,cat:"II",scenario:"Mesmo cenário das Q21-25 (prensa BQ Printers / Stampa Fabbrica; voo desviado para Boston; CBP Form 7512 com a Exact Trucking).",q:"The facts indicate that a Fast Brokers employee created a transportation entry on a CBP Form 7512. CBP regulations also grant other parties the authority to file transportation entries. Which of the parties listed below does not have the regulatory authority to file the transportation entry under the facts provided?",opts:{A:"Shark Airlines",B:"Exact Trucking",C:"CBP Officer Evans of the Port of Baltimore",D:"Baltimore Quick Printers"},ans:["C"],cite:"19 CFR 18.1(c)"},
{n:23,cat:"II",scenario:"Mesmo cenário das Q21-25 (rebate de $15.000 oferecido em 07/01/2025, antes da exportação; BQ pagou a fatura em 21/01/2025).",q:"Refer to the Commercial Invoice. How will the price change that Stampa, the seller, offered to BQ Printers, the buyer, affect transaction value?",opts:{A:"The price change will not be added to or subtracted from the price paid or payable as it will be paid to the buyer after the buyer pays the seller's invoice.",B:"The price change will be deducted from the price paid or payable because the price change was a discount from the seller to the buyer negotiated as part of the sale.",C:"The price change will not be added or subtracted from the price paid or payable because it was negotiated after the date of importation.",D:"The price change will be added to the price paid or payable as it is an indirect payment paid to the buyer by the seller after the buyer pays the seller's invoice."},ans:["B"],cite:"19 CFR 152.103(a)(1); 19 CFR 152.103(a)(4)"},
{n:24,cat:"II",scenario:"Mesmo cenário das Q21-25. FATOS ADICIONAIS (só para esta questão): Fast Brokers obteve documentação adicional do cliente indicando que o país de origem da prensa é a ITÁLIA (não China). Um auditor da Fast Brokers constatou erros nos duties, taxes e fees cobrados na fatura ao BQ Printers. Lembre: embarque AÉREO (sem HMF); 8443.32.5000/Free; Sec. 301 só se aplica a produtos da China.",q:"What will be the total amount of the corrected broker invoice?",opts:{A:"$455.00",B:"$732.12",C:"$813.37",D:"$4,956.25"},ans:["B"],cite:"9903.88.15 HTSUS; 19 CFR 24.23; 19 CFR 24.24"},
{n:25,cat:"II",scenario:"Mesmo cenário das Q21-25. FATOS ADICIONAIS (só para esta questão; assuma corretos os duties/taxes/fees da fatura do broker): O CBP Form 7512 tinha erro tipográfico — 5 caixas em vez das 6 do AWB. A Exact Trucking entregou 5 caixas. BQ tem prova de que a caixa faltante representava 50% do valor da prensa. O entry summary NÃO está liquidado.",q:"Which of the listed regulations describes the process by which BQ Printers may provide CBP with evidence of the shortage and request a duty allowance?",opts:{A:"19 CFR 18.6(f)",B:"19 CFR 18.8(d)(1)(i)",C:"19 CFR 158.3",D:"19 CFR 159.7(c)"},ans:["C"],cite:"19 CFR 18.6(f); 19 CFR 18.8(d)(1)(i); 19 CFR 158.3; 19 CFR 159.7"},
{n:26,cat:"III",q:"Smith Imports, an importer located in Baltimore, MD, purchased 100,000 pounds of South Korean steel. The shipment is due to arrive in Los Angeles, CA on May 25, 2025. The steamship line estimates a conveyance arrival date of May 28, 2025. Smith Imports instructed its customs broker to make entry at the port of Baltimore. The customs broker advises that the product is subject to an absolute quota, and as of May 15, the steel quota is considered filled. The next quota period opens on July 1, 2025. Which of the following is NOT an appropriate action for the customs broker to take on behalf of Smith Imports?",opts:{A:"Admit the shipment into a Foreign Trade Zone to hold the merchandise until the opening of the next quota period.",B:"Submit a warehouse entry to hold the merchandise until the opening of the next quota period.",C:"Export the merchandise out of the United States to Canada.",D:"File a transportation entry to move the merchandise in-bond from Los Angeles through various ports to Baltimore, arriving at the start of the next quota period."},ans:["D"],cite:"19 CFR 132.5(a) e (c)"},
{n:27,cat:"III",q:"The annual Tariff Rate Quota (TRQ) limit for beef from Argentina is 20,000,000 KG. The quota period is an annual quota that begins on January 1st. A filer entered beef from Argentina as a type 02 quota entry. Quota was allocated and the entry received a presentation date of July 1, 2025. On September 1, 2025, the filer realized that the quantity of the beef was not accurately recorded, and more beef was imported than originally claimed on the entry. The quota filled on August 1, 2025. The entry has not liquidated. Of the options below, what is the best action the filer could take?",opts:{A:"Request cancellation of the original entry.",B:"File a Post Summary Correction (PSC) to correct the entry.",C:"Contact HQ Quota to determine whether any quota quantity can be reserved.",D:"File a PSC when the next quota period opens."},ans:["C"],cite:"ACE BRPD Section 7.14; 19 CFR 141.67"},
{n:28,cat:"III",q:"ATC Imports hires Fry Customs Brokers to file an entry for imported carpets subject to a tariff-rate quota. CBP Officer James inadvertently releases the merchandise before the proper presentation of the entry summary, and the quota is nearing fulfillment. The port director has decided to issue liquidated damages. Which of the facts below would justify the port director's decision?",opts:{A:"The importer submitted estimated duties calculated at the over-quota rate.",B:"The merchandise is returned to CBP custody within 30 days from the date of demand for redelivery.",C:"The release was due to causes wholly beyond the control of the importer.",D:"The entry summary with estimated duties attached is not presented timely."},ans:["D"],cite:"19 CFR 132.14(a)(4)(i)(C)"},
{n:29,cat:"III",q:"PB Creations, Inc. (PB) is the importer of record and consignee for an entry of peanut butter from Argentina that is subject to an absolute quota. On Sunday, May 31, 2025, at 8:00 am, Eastern AH Brokers, the authorized broker for PB, filed an error-free entry and entry summary in CBP's Automated Commercial Environment (ACE) and scheduled payment of estimated duties via statement. The shipment is due to arrive at the Customs port of Baltimore, Maryland, on June 1, 2025. The shipment actually arrives at the port of Baltimore on Monday, June 2, 2025, at 12:03 pm Eastern, based on the manifest information filed in ACE. AH Brokers pays the statement on Thursday, June 12, 2025, at 5:00 pm Eastern. Based on this fact pattern, which of the date and time combinations below is the correct presentation date establishing quota priority for the entry of peanut butter from Argentina?",opts:{A:"June 1, 2025 at 8:30 am Eastern",B:"June 2, 2025 at 12:03 pm Eastern",C:"June 12, 2025 at 5:00 pm Eastern",D:"June 13, 2025 at 8:30 am Eastern"},ans:["B"],cite:"19 CFR 132.11a"},
{n:30,cat:"III",q:"On May 15, 2025, CBP Headquarters issued public notice that 116,000 dozen brooms of broom corn classifiable under subheadings 9603.10.40 to 9603.10.60 have been entered or withdrawn for consumption and that the quota is nearing fulfillment. Such brooms are covered by a tariff-rate quota. Your customs brokerage client has 6,000 dozen broom corn brooms, valued at $0.95 each, arriving July 9, 2025, from India. The brooms are country of origin India. Your client does not want to enter any brooms into a bonded warehouse. There is no harbor maintenance fee. You calculate the merchandise processing fee (MPF) to be $236.94. Based on this fact pattern, which of the following best describes the applicable entry process when a tariff-rate quota is nearing fulfillment?",opts:{A:"Filing an Entry Type 01 consumption entry for all 6,000 dozen brooms under 9603.10.4000 and put $5,708.94 on statement.",B:"Filing an Entry Type 01 consumption entry for all 6,000 dozen brooms under 9603.10.9000 and put $7,076.94 on statement.",C:"Filing an Entry Type 02 consumption entry for all 6,000 dozen brooms under 9603.10.5000 and put $23,276.94 on statement.",D:"Filing an Entry Type 02 consumption entry with line 001 for 5,478 dozen brooms under 9603.10.4000/8% and with line 002 for 522 dozen brooms under 9603.10.5000/32¢ each and put $7,237.35 on statement."},ans:["C"],cite:"19 CFR 132.13(a)(1)(i)"},
{n:31,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of diammonium hydrogenorthophosphate?",opts:{A:"Heading 2805",B:"Heading 3104",C:"Heading 3102",D:"Heading 3105"},ans:["D"],cite:"Chapter 31, Note 5 HTSUS; 3105.30.0000 HTSUS"},
{n:32,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a pair of men's trousers made up of 100 percent polyester knit pile fabric, the outer surface of which has been laminated with a polyester material that completely obscures the underlying fabric?",opts:{A:"6103.43.1520",B:"6103.49.8024",C:"6113.00.1012",D:"6203.43.7590"},ans:["A"],cite:"GRI 1; Chapter 54, Note 1 HTSUS; Chapter 59, Note 1 HTSUS; Chapter 60, Note 1(c) HTSUS"},
{n:33,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a rectangular-shaped box/container made of 100% tinplate steel? The box measures 6 inches long by 4.25 inches wide by 2 inches high, and the top of the box is hinged. The box is used for children to hold and organize crayons and playthings.",opts:{A:"7326.90.1000",B:"7326.90.3500",C:"7326.90.8688",D:"8007.00.5000"},ans:["A"],cite:"7326.90.1000 HTSUS"},
{n:34,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a machine that produces glass fibers? This machine is a highly specialized piece of equipment that operates at elevated temperatures to produce glass fibers using molten glass. Due to the size of the complete machine, it cannot be shipped on a single conveyance. The importer of record elected to enter the machine disassembled and in multiple shipments within six days at the Port of Newark. The first shipment was released pursuant to a special permit for immediate delivery upon arrival. After the components are imported, they will be delivered directly to the customer and will be assembled then.",opts:{A:"8475.29.0000",B:"8479.89.9599",C:"8464.90.0110",D:"8475.90.9000"},ans:["A"],cite:"8475.29.0000 HTSUS; GRI 2(a); 19 CFR 141.58; 19 CFR 142.21(h)"},
{n:35,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a non-dairy snack bar, determined to be a food preparation that is a sugar confectionary, made of peanuts and corn flakes and containing cocoa in the chocolate coated bottom? The snack bar contains 8% by weight of cocoa calculated on a totally defatted basis and 53% added sugar. The snack bars are individually wrapped for retail sale.",opts:{A:"1704.90.3520",B:"1806.32.9000",C:"1904.10.0040",D:"2106.90.9997"},ans:["B"],cite:"Note 1(a) to Chapter 17, HTSUS; Note 2 to Chapter 18, HTSUS; Note 3 to Chapter 19, HTSUS"},
{n:36,cat:"IV",q:"Diamond Vision imports eyeglass (spectacle) frames and lenses as disassembled parts into the United States. The frame part is a single molded unit of plastic consisting of rims, a bridge, and a nose piece. The temples and end pieces are also molded plastic and are imported in pairs consisting of one left and one right temple. Steel hinges and screws are imported in boxes. The lenses are plastic and are imported in pairs. Which ONE of the following rules would not apply when determining the eight-digit classification of the spectacle frames and lenses under the HTSUS?",opts:{A:"General Rule of Interpretation 1",B:"General Rule of Interpretation 2(a)",C:"Additional U.S. Rules of Interpretation 1(c)",D:"General Statistical Note 1"},ans:["D"],cite:"GRI 1 e 2(a); Additional U.S. Rules of Interpretation 1(c); General Statistical Note 1"},
{n:37,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION for the described vehicle? Quality Express is a shuttle company that delivers small parcels. In January 2023, they imported several used, 100% electric vans with an Environmental Protection Agency (EPA) rated range of 200 miles. The electric vans conform to all applicable safety standards required of passenger vehicles. They each feature two swing out front doors with windows, two sliding rear doors with windows, and a swing out rear door with a window. The vans are carpeted throughout and carry up to seven people, with a cargo space comprising 28% of the total interior volume. After importation, the rear bench seats may be removed to allow for additional cargo space.",opts:{A:"8703.80.0045",B:"8703.90.0100",C:"8704.60.0000",D:"8702.40.6100"},ans:["A"],cite:"8703.80.0045 HTSUS"},
{n:38,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION and associated duty rate to be listed on the entry summary for an entry on August 1, 2025, of the following merchandise? The merchandise is a replica scale model of a 1955 Chevy 3100 pickup truck in red. Commonly known as the \"Christmas Truck,\" this model is intended for individuals 15 years of age and up. The model was die-cast in parts in Germany of a zinc-aluminum alloy. The parts were buffed, painted, and assembled with welding into the complete model trucks in China.",opts:{A:"9503.00.0090/Free",B:"9503.00.0090/15%",C:"9817.95.01/Free",D:"9817.95.01/25%"},ans:["A"],cite:"General Note 3(b); 9503.00.0090 HTSUS; 9903.88.16 HTSUS; 9817.95.01 HTSUS; Chapter 99, Subchapter III, U.S. Note 20(u)(i)"},
{n:39,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a multi-function electric countertop appliance advertised for sale as a \"toaster oven?\" The apparatus can be used to bake, broil, toast, warm, and air-fry. It has a 12-liter interior capacity, large enough to toast four slices of bread or bake a nine-inch pizza, and includes an oven rack and an air fryer basket.",opts:{A:"8516.60.4060",B:"8516.60.4070",C:"8516.60.6000",D:"8516.72.0000"},ans:["B"],cite:"8516.60.4070 HTSUS; Chapter 85, Additional U.S. Note 2"},
{n:40,cat:"IV",q:"Which of the following clauses is FALSE? When classifying goods for importation into the United States under the Harmonized Tariff Schedule of the United States and absent special language or context which otherwise requires, _____.",opts:{A:"a tariff classification controlled by use (other than actual use) is to be determined in accordance with the use in the United States at, or immediately prior to, the date of importation, of goods of that class or kind to which the imported goods belong, and the controlling use is the principal use.",B:"a tariff classification controlled by the actual use to which the imported goods are put in the United States is satisfied only if such use is intended at the time of importation, the goods are so used and proof thereof is furnished within 3 years after the date the goods are entered.",C:"a provision for parts of an article covers products solely or principally used as part of such articles but a provision for \"parts\" or \"parts and accessories\" shall prevail over a specific provision for such part or accessory.",D:"the principles of section XI regarding mixtures of two or more textile materials shall apply to the classification of goods in any provision in which a textile material is named."},ans:["C"],cite:"Additional U.S. Rules of Interpretation 1"},
{n:41,cat:"V",q:"Importer Sunny Solar Panels filed an entry for a shipment that arrived in the Los Angeles/Long Beach seaport on March 1, 2020. Sunny Solar Panels filed an entry summary on March 3, 2020, and tendered all duties, taxes, and fees owed. The merchandise was released from U.S. Customs and Border Protection (CBP) custody on March 3, 2020. CBP liquidated the entry on January 22, 2021. Upon reviewing the liquidation, Sunny Solar Panels realized that due to a clerical error they overpaid harbor maintenance fees. What is the deadline for Sunny Solar Panels to file a protest?",opts:{A:"Within 90 days of January 22, 2021",B:"Within 180 days of January 22, 2021",C:"Within 365 days of March 1, 2020",D:"Within 180 days of March 3, 2020"},ans:["B"],cite:"19 CFR 174.12(e)(1)"},
{n:42,cat:"V",q:"An importer wants to import switchblade knives. When the importer contacts a broker for assistance with making entry, what should the broker relay as to the permissibility of importing switchblades?",opts:{A:"Importation of a switchblade knife with a 2-inch blade is permitted when transported in the possession of an amputee with only one arm.",B:"All importations of switchblade knives are contrary to law and are subject to forfeiture.",C:"Switchblade knife components do not qualify as a switchblade knife.",D:"Importation of switchblade knives with 2.5-inch blades is permitted when imported by a National Park Ranger."},ans:["A"],cite:"19 CFR 12.95 - 12.98"},
{n:43,cat:"V",q:"Which of the following is TRUE with respect to imported merchandise after the U.S. International Trade Commission (ITC) finds a violation of section 337 of the Tariff Act of 1930 (19 USC 1337) and issues an exclusion order, as implemented by CBP under 19 CFR 12.39?",opts:{A:"The exclusion order is not effective until 60 days after issuance, at which point merchandise subject to the exclusion order no longer may be entered.",B:"Merchandise subject to the exclusion order may not be entered under any circumstance after the exclusion order has issued.",C:"Merchandise subject to the exclusion order may be entered under a basic importation and entry bond in an amount set by CBP.",D:"Merchandise subject to the exclusion order may be entered under bond until the determination of a violation becomes final."},ans:["D"],cite:"19 CFR 12.39; 19 CFR 113.62; 19 CFR 113.74"},
{n:44,cat:"V",q:"What must a port director do if an entry summary for a shipment of commercial goods greater than $2,500 in value secured by a single entry bond is NOT filed timely?",opts:{A:"Issue a warning and allow additional time for filing.",B:"Seize the merchandise until the entry summary is filed.",C:"Demand liquidated damages for the bond amount.",D:"Limit the importer's ability to file future entries."},ans:["C"],cite:"19 CFR 142.15"},
{n:45,cat:"V",q:"A surety may terminate its agreement to accept future obligations under a bond, with or without the consent of the principal, with reasonable notice of the termination made in compliance with the methods provided in 19 CFR, Part 113. Absent proof to CBP that a shorter time frame is reasonable under the facts and circumstances, how many days constitute reasonable notice for bond termination from the terminating surety to the principal and CBP?",opts:{A:"7 business days",B:"10 business days",C:"15 days",D:"30 days"},ans:["D"],cite:"19 CFR 113.27(b)"},
{n:46,cat:"V",q:"Which of the following statements is TRUE regarding changes to a bond?",opts:{A:"A minor alteration which does not go to the substance of the bond may be made prior to signing without any additional documentation.",B:"A new bond must be executed when an erasure or alteration is made after the bond is signed but prior to the approval of the bond by CBP.",C:"The consent of all parties must be written on the bond if a modification or interlineation is made after the bond is signed but prior to the approval of the bond by CBP.",D:"A new bond is required, which will supersede the existing bond, when a change is made after approval of the bond by CBP."},ans:["D"],cite:"19 CFR 113.23"},
{n:47,cat:"V",q:"Domestic status may be granted to any of the following types of merchandise in a Foreign Trade Zone, EXCEPT:",opts:{A:"Merchandise that is a growth, product, or manufacture of the United States on which all applicable internal-revenue taxes have been paid.",B:"Merchandise that was previously imported from Belgium and on which duty and tax have been paid.",C:"Merchandise from Greece that was previously entered free of duty and tax.",D:"Merchandise that is previously imported from France, on which applicable duties, taxes, or fees have not been paid."},ans:["D"],cite:"19 CFR 146.43"},
{n:48,cat:"V",q:"Which ONE of the statements below regarding the admissibility of merchandise into a Foreign Trade Zone (FTZ) is TRUE?",opts:{A:"Prohibited merchandise may only be admitted into a foreign trade zone temporarily. Conditionally admissible merchandise may be admitted into a FTZ if permitted by the regulations of the Federal agency concerned.",B:"Prohibited merchandise may not be admitted into a FTZ. Conditionally admissible merchandise may be admitted into a FTZ if permitted by the regulations of the Federal agency concerned.",C:"Prohibited merchandise may be admitted into a FTZ only upon filing a certification that such merchandise will not be entered into the commerce of the United States. Conditionally admissible merchandise may be admitted into a FTZ temporarily, pending a final determination of its status.",D:"Merchandise may never be admitted into a FTZ temporarily pending a determination of admissibility and if determined to be prohibited, must be disposed of. Conditionally admissible merchandise may be admitted into a FTZ if permitted by the regulations of the Federal agency concerned."},ans:["B"],cite:"19 CFR 146.31"},
{n:49,cat:"V",q:"Hagen Industries Limited (\"Hagen\") imported two containers of 1000-piece jigsaw puzzles from Poland, and is identified as the consignee on the bill of lading for the shipment. The puzzles were transported to the Port of Los Angeles-Long Beach by vessel. Twenty (20) calendar days after arrival and unlading at the port, no entry had been filed for the puzzles. The port director properly took custody of both containers and deposited them in a general order warehouse at Hagen's expense. How long from the date of importation can the puzzles remain in the warehouse before they become subject to sale?",opts:{A:"3 months",B:"6 months",C:"12 months",D:"18 months"},ans:["B"],cite:"19 CFR 127.4"},
{n:50,cat:"V",q:"Which regulation lists some of the laws that CBP enforces on behalf of various other federal agencies?",opts:{A:"19 CFR 161.2(a)",B:"19 CFR 118.4",C:"19 CFR 141.11(a)(3)",D:"19 CFR 141.15(c)"},ans:["A"],cite:"19 CFR 161.2(a); 19 CFR 118.4; 19 CFR 141.11(a)(3); 19 CFR 141.15(c)"},
{n:51,cat:"V",q:"Which motor vehicles may be imported by any person and do not have to be shown in compliance with emissions requirements before they are entitled to admissibility?",opts:{A:"Gasoline-fueled light-duty trucks and light-duty motor vehicles manufactured before January 1, 1968.",B:"Diesel-fueled light-duty motor vehicles manufactured between January 1, 1975 and December 31, 1984.",C:"Motor vehicles not otherwise exempt from EPA emissions requirements and less than 20 years old.",D:"Highway motorcycles manufactured between January 1, 1978 and December 31, 1984."},ans:["A"],cite:"19 CFR 12.73(e)"},
{n:52,cat:"V",q:"ABC Importer is importing tracing paper from Germany which is classifiable under subheading 4806.30 of the HTSUS. The paper is being imported as rolls measuring 20 cm in width and 100 yards in length. Which of the following pieces of additional information is NOT required to be included for entry on the invoice or other document accompanying the invoice?",opts:{A:"Weight of paper in grams per square meter",B:"Length of the paper in cm",C:"Diameter of the roll in cm",D:"Width of the paper in cm"},ans:["B"],cite:"19 CFR 141.89(a)"},
{n:53,cat:"V",q:"An entry for warehouse was filed in 2025. Liquidation of the entry was never suspended or extended. When is the warehouse entry deemed liquidated by operation of law at the rate of duty, value, quantity, and amount of duties asserted by the importer of record?",opts:{A:"One year from the date of entry of the merchandise",B:"One year from the date of final withdrawal of all merchandise covered by the warehouse entry",C:"One year from the date of the first withdrawal of merchandise covered by the warehouse entry",D:"Five years from the date of importation of the warehouse merchandise"},ans:["B"],cite:"19 CFR 159.11(a); 19 CFR 144.5"},
{n:54,cat:"V",q:"XYZ Corporation has a shipment arriving to the Los Angeles/Long Beach seaport by vessel. The vessel left the port of export on January 17, 2025. The vessel arrived within the limits of the seaport with the intent to unlade on January 23, 2025. The vessel's contents were inspected by a U.S. Department of Agriculture officer on January 24, 2025. Finally, the merchandise was unladen on January 27, 2025. On which of the following days was the merchandise imported into the United States?",opts:{A:"January 17, 2025",B:"January 23, 2025",C:"January 24, 2025",D:"January 27, 2025"},ans:["B"],cite:"19 CFR 101.1"},
{n:55,cat:"V",q:"Which of the following documents is NOT evidence of the right to make entry for merchandise imported by common carrier which is not released directly to the carrier?",opts:{A:"A commercial or pro forma invoice.",B:"A shipping receipt or other document presented in lieu of a bill of lading or air waybill bearing a carrier's certificate.",C:"A bill of lading or air waybill, presented by the holder thereof, properly endorsed when endorsement is required under the law.",D:"An extract from a bill of lading or air waybill certified to be genuine by the carrier bringing the merchandise to the port of entry."},ans:["A"],cite:"19 CFR 141.11(a)"},
{n:56,cat:"V",q:"Jane Doe wants to import liquid chemicals in stainless steel tanks that are capable of being used repeatedly. The tanks are emptied of the liquid chemicals at importation and exported empty in order to be refilled. Ms. Doe does not want to make entry or pay duty for these tanks, which will be exported and reimported continuously. Ms. Doe is considering having these tanks designated as Instruments of International Traffic (IITs). Which of the following statements concerning IITs is TRUE?",opts:{A:"A steel tank may be designated as an IIT that is exempt from ordinary duties, but will remain subject to antidumping and countervailing duties.",B:"A steel tank that is designated as an IIT must be exported from the United States within 365 days of admission.",C:"A steel tank may only be designated as an IIT if Ms. Doe obtains a basic custodial bond.",D:"A steel tank may be designated as an IIT that is exempt from entry, but will remain subject to vessel reporting requirements."},ans:["B","D"],cite:"DUAS RESPOSTAS ACEITAS (B ou D) — 19 CFR 10.41a; 19 CFR 4.2(a); 19 CFR 4.0(a)"},
{n:57,cat:"V",q:"Izzie Stein is the importer of record (IOR) on a shipment of goods she purchased directly from a foreign manufacturer. The shipment has estimated duties, taxes, and fees due of $5,800.00. Ms. Stein sold the merchandise to a consignee. Ms. Stein pays her customs broker the $5,800.00 owed to U.S. Customs and Border Protection (CBP) but later gets a notice that the duties were never paid. Who will CBP bill for the unpaid duties and why?",opts:{A:"The customs broker will be billed because they received the duty payment from Ms. Stein.",B:"The foreign manufacturer will be billed because they are the pay-to party on the commercial invoice.",C:"The consignee will be billed because they received the shipment of goods.",D:"Ms. Stein will be billed because she is the importer of record."},ans:["D"],cite:"19 CFR 141.1(b)(1)"},
{n:58,cat:"V",q:"High End Store (High End), a U.S. retailer, submitted an administrative ruling request for classification of a woman's hooded blouse prior to the importation of such blouses. New York Ruling Letter (NY) N123456 was issued to High End, which classified the hooded blouse under subheading 6106.20.2010 of the HTSUS. As part of the decision in NY N123456, the following instruction was included: \"[a] copy of the ruling or the control number indicated above should be provided with the entry documents filed at the time this merchandise is imported.\" The manufacturer who produces hooded blouses for High End also produces identical hooded blouses for Discount Retailer, another U.S. retailer. Both High End and Discount Retailer imported the blouses after the issuance of NY N123456. Which of the following statements is TRUE?",opts:{A:"Discount Retailer may classify its identical hooded blouses under subheading 6106.20.2010, HTSUS, in reliance upon NY N123456.",B:"In reviewing the entry documentation filed by Discount Retailer, the Center Director may request additional information regarding the imported blouses. If the Center Director determines that Discount Retailer has not obtained a ruling affirming that its hooded blouses are also classifiable under 6106.20.2010, HTSUS, the Center Director is required to suspend liquidation of the entry until Discount Retailer obtains a ruling.",C:"Prior to relying upon NY N123456, issued for High End, Discount Retailer should write to the Port Director at the port of entry and seek clarification as to whether NY N123456 has been modified or revoked.",D:"Once published, NY N123456 is not subject to modification or revocation unlike other administrative ruling letters that do not classify merchandise."},ans:["A"],cite:"19 CFR 177.9(a)-(c); 19 CFR 159.12(a)(2); 19 CFR 177.12(a)"},
{n:59,cat:"V",q:"For a first violation, Customs and Border Protection may impose a civil fine on any person who directs, assists financially or otherwise, or aids and abets the importation of merchandise seized for bearing counterfeit marks in the amount of:",opts:{A:"Not more than the domestic value of the imported merchandise at the time of seizure.",B:"Not more than the value of the merchandise had it been genuine, according to the manufacturer's suggested retail price in the United States at the time of seizure.",C:"Not more than twice the domestic value of the imported merchandise at the time of seizure.",D:"Not more than twice the value the merchandise had it been genuine, according to the manufacturer's suggested retail price in the United States at the time of seizure."},ans:["B"],cite:"19 CFR 133.27(a)"},
{n:60,cat:"V",q:"U.S. Navy Petty Officer John Doe is returning to Washington, D.C. after serving an extended duty tour in Hokkaido, Japan. Mr. Doe wants to import the vintage café racer motorcycle he acquired in Japan for his personal use in the United States without payment of duty. When Mr. Doe contacts a duly licensed customs broker to arrange for the importation and entry of this motorcycle, which of the following questions is RELEVANT to ascertaining whether the motorcycle may be accorded duty-free treatment under 19 CFR Part 148, Subpart H?",opts:{A:"Has the motorcycle been advanced in value or improved in condition by any process of manufacture or other means after purchase abroad?",B:"Since Mr. Doe purchased the motorcycle, has it served as a personal effect or been used for commercial purposes after offer for sale?",C:"Is the motorcycle a product of Japan?",D:"Has Mr. Doe filed a U.S. Customs and Border Protection (CBP) Form 6059-B for the motorcycle, which will arrive in D.C. a month after his return flight?"},ans:["B"],cite:"19 CFR 148.74(a)(1); 19 CFR 10.1(a)(1); 19 CFR 148.13(b); 9805.00.50 HTSUS"},
{n:61,cat:"V",q:"An A.T.A. (Admission Temporaire – Temporary Admission) carnet refers to the document reproduced as the Annex to the Customs Convention on the A.T.A. Carnet for the Temporary Admission of Goods. An A.T.A. carnet issued in conformity with the provisions of this Convention and the relevant U.S. Customs and Border Protection Regulations must show the period for which it is valid. What is the maximum length of that period of validity from the date of issue?",opts:{A:"1 year",B:"2 years",C:"3 years",D:"4 years"},ans:["A"],cite:"19 CFR 114.1(d); 19 CFR 114.3(a); 19 CFR 114.23(a)"},
{n:62,cat:"V",q:"When is country of origin based on an inventory management method?",opts:{A:"When the goods are non-fungible, consist of indirect materials, and have been disassembled.",B:"When the goods are non-fungible, have been commingled, and direct physical identification of the origin of the goods is not practical.",C:"When the goods are fungible, have been commingled, and direct physical identification of the origin of the goods is not practical.",D:"Anytime the goods are fungible, regardless of other attributes."},ans:["C"],cite:"19 CFR 102.12(b)"},
{n:63,cat:"V",q:"Which of the following examples of substituted merchandise is eligible for unused merchandise drawback pursuant to 19 USC 1313(j)(2)?",opts:{A:"Amaretto black tea, not fermented, classified under subheading 0902.10.9015, HTSUS; substituted for imported Earl Grey tea, not fermented, classified under subheading 0902.10.9015, HTSUS.",B:"Raw, shelled peanuts, classified under subheading 1202.41.8040, HTSUS; substituted for imported raw, shelled peanuts, classified under subheading 1202.41.8040, HTSUS.",C:"Chocolate and other food preparations containing cocoa classified under subheading 1806.20.2028, HTSUS; substituted for imported chocolate and other food preparations containing cocoa, classified under subheading 1806.20.2038, HTSUS.",D:"Wine of fresh grapes, including fortified wine, classified under subheading 2204.21.8030, HTSUS; substituted for imported wine of fresh grapes, including fortified wine, classified under 2204.21.8060, HTSUS."},ans:["A"],cite:"19 CFR 190.2; 19 CFR 190.32(d)"},
{n:64,cat:"V",scenario:"Q64 — A prova mostra QUATRO entry summaries (CBP Form 7501) idênticos em tudo — mercadoria de Ontario, Canadá; Country of Origin \"CA\"; Exporting Country \"CA\"; Mode of Transport 30; mesmo filer, surety, bond type 08, port 3401, datas 09/03/2025 — EXCETO no campo 2 (Entry Type): A) Entry Type 06 · B) Entry Type 07 · C) Entry Type 11 · D) Entry Type 31. Contexto: desde 15/05/1997 o código ISO \"CA\" foi substituído pelo código de província canadense (\"XO\" = Ontario), mas \"CA\" continua aceitável sob seis condições.",q:"Merchandise is arriving from Ontario, Canada and is known to be country of origin Ontario, Canada. On May 15, 1997, the ISO country code for goods of Canadian origin was replaced by the Canadian Province Code. However, under six conditions, \"CA\" remains an acceptable ISO code. Based on the entry summary information provided, which does NOT correctly display \"CA\" as the country of origin in lieu of \"XO,\" the code for the province of Ontario?",opts:{A:"O entry summary com Entry Type 06 (FTZ consumption)",B:"O entry summary com Entry Type 07 (quota/AD-CVD consumption)",C:"O entry summary com Entry Type 11 (informal)",D:"O entry summary com Entry Type 31 (warehouse)"},ans:["B"],cite:"ACE Entry Summary Instructions v. 2.4, p. 16-17"},
{n:65,cat:"V",q:"Speedy Imports received three shipments of adhesives exported from Mexico via truck. Each shipment entered the United States on three different dates; the first on June 10th, the second on June 12th, and the third on June 14th, of this year. The adhesives in all of the shipments are classified under subheading 3506.10.5000, HTSUS, and includes adhesives of U.S. and Mexican origin. All shipments are consigned to Sticky Fingers LLC. Speedy Imports consolidated all three entries into one entry summary on June 15th with each entry identified by its entry number. Speedy Imports later was notified that the entry summary was rejected. Based on the above information, which of the following best explains why the entry summary was rejected?",opts:{A:"The time between the date of the first entry and the last entry exceeded the time allowed.",B:"The entry summary document was filed too late based on the dates of entry.",C:"The country of origin of the merchandise was not the same for all merchandise.",D:"The merchandise was not consigned to one consignee."},ans:["C"],cite:"19 CFR 142.17(a)"},
{n:66,cat:"VI",q:"USA Corporation imports a specialized machine that is disassembled and split into several shipments for delivery purposes. A specific tool is used to produce this machine, and the cost of that tool is added to the machine's value as an assist. USA Corporation decides to pay duties on the tool's entire value with the first shipment, rather than to split the tool's value between all of the machine's entries. What is the Customs term for this allocation of assists?",opts:{A:"Inclusion",B:"Deduction",C:"Proration",D:"Apportionment"},ans:["D"],cite:"19 CFR 152.103(e)(1)"},
{n:67,cat:"VI",q:"An Irish golf accessory manufacturer, acting as the importer of record, imports golf balls to give away as a promotion at a tournament it is sponsoring. Because there is no sale at the time of import, what value must be listed on the invoice?",opts:{A:"The value calculated based on the manufacturer's average shipment value for the last 12 months.",B:"The highest value the manufacture has received for the sale of similar goods.",C:"There is no value because there is no sale.",D:"The value as if the manufacturer sold the golf balls to an importer in the ordinary course of trade."},ans:["D"],cite:"19 CFR 141.86(a)(6); 19 CFR 152.101(b)"},
{n:68,cat:"VI",q:"Calculate the duty for the following merchandise. Fresh shiitake mushrooms (not dried) have been imported into the United States. The invoiced amount for the mushrooms is $7.56 per kilogram. There are 2,000 kilograms in the shipment.",opts:{A:"$1,730.56",B:"$3,024.00",C:"$3,200.00",D:"$4,784.00"},ans:["C"],cite:"0709.54.0000 HTSUS"},
{n:69,cat:"VI",q:"Which of the following is a limitation on the use of transaction value for imported merchandise?",opts:{A:"The buyer's price of imported merchandise is contingent on the price at which the buyer sells other merchandise to the seller of the merchandise.",B:"The buyer's resale and use of imported merchandise is limited geographically by law.",C:"The buyer and seller are related; however, that relationship does not influence the price of the imported merchandise.",D:"The buyer is restricted from selling imported merchandise before a fixed date."},ans:["A"],cite:"19 CFR 152.103(j); 19 CFR 152.103(k)"},
{n:70,cat:"VI",q:"A shipment of 1,000 water bottles manufactured in Germany is entered at $20.00 per unit at the Port of Philadelphia. The water bottles were shipped from Hamburg to Philadelphia with a shipping cost of $300.00. On the invoice, a credit of $10,000.00 for a previous overpayment by the buyer has been applied to the selling price. The total due on the invoice is $10,300.00. What is the transaction value of the merchandise based on the provided information?",opts:{A:"$10,000.00",B:"$20,300.00",C:"$10,300.00",D:"$20,000.00"},ans:["D"],cite:"19 CFR 152.103(a)(2)"},
{n:71,cat:"VI",q:"If the transaction value of similar merchandise cannot be determined, which of the following choices is an acceptable basis of appraisement for imported merchandise?",opts:{A:"The price of merchandise for export to a country other than the United States",B:"The price of merchandise in the domestic market of the country of exportation",C:"The minimum value",D:"The deductive value"},ans:["D"],cite:"19 CFR 151.101(b)(4)"},
{n:72,cat:"VI",q:"Which of the following costs should NOT be added to the price actually paid or payable to determine the transaction value for an entry of handmade leather bags?",opts:{A:"The leather provided free of charge by the U.S. buyer to Italian designers who will make the bag",B:"The royalty fees the U.S. buyer is required to pay as a condition of the sale",C:"The shipping costs paid by the U.S. buyer to import the bags",D:"The amount of debt the U.S. buyers relieve for the Italian designers in exchange for the shipment of the bags"},ans:["C"],cite:"19 CFR 152.103(b)(1); 19 CFR 152.102(f)"},
{n:73,cat:"VI",q:"ASW Furnishings (ASW), a Los Angeles furniture company, has agreed to purchase 5000 chairs from Big House, a furniture manufacturer in Poland. ASW supplies Big House with the following inputs to use in the production of the chairs, free of charge:\n• Design specifications created by a Chicago-based furniture designer, purchased for a flat fee of $3200.00.\n• 2500 yards of cotton upholstery fabric, which Big House procured for $2.00 per yard in Poland, then shipped to ASW's screen printer in South Africa. ASW paid their South African screen printer to add a design to the fabric for $1.00 per yard, before returning the fabric to Big House's factory in Poland.\nBig House imports the chairs to the United States in five shipments of 1000 chairs each. ASW agrees to pay Big House $375,000.00 for the entire order of 5000 chairs, not including the value of the assists. If Big House chooses for the total assist value to be apportioned over the entire anticipated production of 5000 chairs, what is the dutiable value of one shipment of 1000 chairs?",opts:{A:"$75,500.00",B:"$76,000.00",C:"$76,140.00",D:"$77,140.00"},ans:["A","B","C","D"],cite:"QUESTÃO ANULADA — crédito concedido a todos os examinandos (qualquer resposta conta como acerto)"},
{n:74,cat:"VI",q:"A car manufacturer is importing parts from its overseas subsidiary for testing in its new electric vehicle model that is in pre-production. The parts are being tested to determine whether changes need to be made before the vehicle goes to market. Under which of the following scenarios would these parts be eligible to receive duty-free treatment under subheading 9817.85.01?",opts:{A:"After the manufacturer uses the parts, the parts will be sold at a discounted rate to a local school for use in its shop classes.",B:"The company is using the parts in quality control tests for the vehicle.",C:"The manufacturer is importing 10 times more parts than other manufacturers have used in the development of similar electric vehicles.",D:"To avoid waste, the best-functioning imported parts will be incorporated into vehicles that will be sold to the public."},ans:["B"],cite:"9817.85.01, HTSUS"},
{n:75,cat:"VI",q:"When determining if goods qualify for the United States-Colombia Free Trade Agreement, which of the following is NOT a permissible addition to the value of originating materials?",opts:{A:"The cost of freight and insurance to import U.S. origin raw material to produce Colombian goods.",B:"The duties and taxes paid on the importation of U.S. origin raw material to produce Colombian goods.",C:"The cost of wasted originating material that results from producing the originating finished good.",D:"The depreciated value of originating U.S. equipment used to produce Colombian goods."},ans:["D"],cite:"19 CFR 10.3016(c)"},
{n:76,cat:"VI",q:"Orange juice in bulk containers is imported into the United States from Morocco. The orange juice is produced as follows: Oranges classified under heading 0805 are imported from Spain into Morocco. Purified water from France is imported into Morocco. Calcium citrate, a preservative, is manufactured in Morocco. The juice from the oranges (25% by volume and 70% by value), water (74.75% by volume and 29.5% by value), and calcium citrate (0.25% by volume and 0.5% by value) are combined in Morocco and repackaged in bulk containers prior to being exported to the United States. Upon importation, the orange juice will be classified under subheading 2009.12.2500. Which of the following correctly states the originating country, special program indicator, and rate of duty for the described orange juice?",opts:{A:"Morocco; MA; Free",B:"Morocco; None; 4.5₵ per liter",C:"Spain; None; 4.5₵ per liter",D:"France; E; Free"},ans:["C"],cite:"2009.12.4500 HTSUS; 19 CFR 10.770(c); 19 CFR 10.195(a)(2)(i)(D)-(F); 19 CFR 134.1(b); GN 27(h)/20.5"},
