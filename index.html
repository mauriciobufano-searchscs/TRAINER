  if(/General Statistical/.test(c))return "GSN";
  if(/Additional U\.S\. Rules/.test(c))return "AUSR";
  if(/General Note|GN /.test(c))return "GN";
  m=c.match(/\b(\d{4})\.\d{2}/);if(m)return "H"+parseInt(m[1].slice(0,2));
  m=c.match(/Chapter (\d{1,2})/);if(m)return "H"+m[1];
  if(/ACE (Entry Summary|ES)/i.test(c))return "ACEES";
  if(/BRPD|Business Rules/i.test(c))return "BRPD";
  if(/RTME|Right to Make Entry/i.test(c))return "RTME";
  return null;
}
function srcLabel(k){
  if(SRC_FIXED[k])return SRC_FIXED[k];
  if(k[0]==="P"){const n=+k.slice(1);const PN=PART_NAMES[lang]||PART_NAMES.pt;return "19 CFR Part "+n+(PN[n]?" — "+PN[n]:"");}
  if(k[0]==="H"){const n=+k.slice(1);const HC=HTS_CH[lang]||HTS_CH.pt;return "HTSUS — "+t("chWord")+" "+n+(HC[n]?" ("+HC[n]+")":"");}
  return k;
}
function startDrill(){
  const qs=shuffle(pool().filter(q=>srcKey(q))).slice(0,20);
  navd={active:true,list:qs,idx:0,score:0,times:[],start:0,picked:null,timerId:null};
  drillNextQ();
}
function drillAllKeys(){return [...new Set(pool().map(srcKey).filter(Boolean))];}
function drillNextQ(){
  navd.picked=null;navd.start=Date.now();
  const q=navd.list[navd.idx];
  const correct=srcKey(q);
  const others=shuffle(drillAllKeys().filter(k=>k!==correct)).slice(0,3);
  navd.opts=shuffle([correct].concat(others));
  navd.correct=correct;
  if(navd.timerId)clearInterval(navd.timerId);
  navd.timerId=setInterval(()=>{const el=$("navclock");if(el)el.textContent=Math.floor((Date.now()-navd.start)/1000)+"s";},400);
  renderDrill();window.scrollTo(0,0);
}
function drillPick(k){
  if(navd.picked!==null)return;
  clearInterval(navd.timerId);
  const secs=(Date.now()-navd.start)/1000;
  navd.times.push(secs);
  navd.picked=k;
  if(k===navd.correct)navd.score++;
  renderDrill();
}
function drillAdvance(){
  navd.idx++;
  if(navd.idx>=navd.list.length){clearInterval(navd.timerId);renderDrill();window.scrollTo(0,0);return;}
  drillNextQ();
}
function drillExit(){navd.active=false;if(navd.timerId)clearInterval(navd.timerId);renderPractice();}
function renderDrill(){
  if(navd.idx>=navd.list.length){
    const avg=navd.times.length?(navd.times.reduce((a,b)=>a+b,0)/navd.times.length):0;
    const pct=Math.round(navd.score/navd.list.length*100);
    app().innerHTML=`
    <div class="card" style="text-align:center">
      <span class="eyebrow">🧭 ${t("drillDone")}</span>
      <div class="result-big ${pct>=75?'pass':'fail'}">${navd.score}/${navd.list.length}</div>
      <p class="lead">${t("drillAcc")}: <b>${pct}%</b> · ${t("drillAvg")}: <b>${avg.toFixed(1)}s</b></p>
      <p class="note">${t("drillMsg")}</p>
      <div class="rowbtns" style="justify-content:center">
        <button class="primary" onclick="startDrill()">${t("drillAgain")}</button>
        <button class="ghost" onclick="drillExit()">${t("back")}</button>
      </div>
    </div>`;
    return;
  }
  const q=navd.list[navd.idx];
  const done=navd.picked!==null;
  app().innerHTML=`
  <div class="topbar">
    <button class="ghost" onclick="drillExit()">${t("back")}</button>
    <span class="progress">🧭 ${t("qWord")} ${navd.idx+1} ${t("ofWord")} ${navd.list.length}</span>
    <span class="timer" id="navclock">0s</span>
  </div>
  <div class="card">
    <span class="badge">${examLabel(q.exam)} · Q${q.n} · ${catName(q.cat)}</span>
    <div class="qtext">${esc(q.q)}</div>
    <div class="civanslabel" style="margin-top:12px">🧭 ${t("drillWhere")}</div>
    <div class="opts">
      ${navd.opts.map(k=>{
        let cls="opt";
        if(done){
          if(k===navd.correct)cls+=" correct";
          else if(k===navd.picked)cls+=" wrong";
          else cls+=" dim";
        }
        return `<button class="${cls}" ${done?"disabled":""} onclick="drillPick('${k}')"><span>${esc(srcLabel(k))}</span></button>`;
      }).join("")}
    </div>
    ${done?`
      <span class="stamp ${navd.picked===navd.correct?'ok':'no'}">${navd.picked===navd.correct?t("drillRight"):t("drillWrong")} · ${navd.times[navd.times.length-1].toFixed(1)}s</span>
      <div class="hintbox">${hintFor(q)}</div>
      <div class="ansreveal">✅ <b>${t("drillAnswer")}:</b><br>${q.ans.map(L=>`<b>${L})</b> ${esc(q.opts[L])}`).join("<br>")}</div>
      <div><span class="cite">${t("source")}: ${esc(q.cite)}</span></div>
      <div class="rowbtns"><button class="primary" onclick="drillAdvance()">${t("next")}</button></div>
    `:""}
  </div>`;
}
// ---------- PORTÃO DE ACESSO (cortina simples — troque o código na linha abaixo) ----------
// Para trocar o código: converta o novo código em Base64 (ex.: site base64encode.org) e cole aqui.
const GATE_CODE_B64="Q0JMRTIwMjY="; // código atual: CBLE2026
let gateOk=stGet("gate")===true;
function gateTry(){
  const v=($("gatein")||{}).value||"";
  if(btoa(unescape(encodeURIComponent(v.trim())))===GATE_CODE_B64){gateOk=true;stSet("gate",true);renderLangs();render();}
  else{const e=$("gateerr");if(e)e.style.display="block";const i=$("gatein");if(i){i.value="";i.focus();}}
}
function renderGate(){
  $("langs").innerHTML="";
  $("nav").innerHTML="";
  app().innerHTML=`
  <div class="card" style="max-width:420px;margin:60px auto;text-align:center">
    <span class="eyebrow">🔒 ${t("gateTitle")}</span>
    <p class="lead" style="margin:12px 0">${t("gateLead")}</p>
    <input id="gatein" type="password" autocomplete="off" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;text-align:center;letter-spacing:2px" onkeydown="if(event.key==='Enter')gateTry()">
    <p id="gateerr" class="note" style="display:none;color:var(--stamp)">${t("gateErr")}</p>
    <div class="rowbtns" style="justify-content:center;margin-top:12px"><button class="primary" onclick="gateTry()">${t("gateBtn")}</button></div>
  </div>`;
  const i=$("gatein");if(i)i.focus();
}
// ---------- render principal ----------
function render(){
  if(!gateOk){renderGate();return;}
  renderNav();
  if(view==="home")renderHome();
  else if(view==="practice")renderPractice();
  else if(view==="exam")renderExam();
  else if(view==="civics")renderCivics();
  else if(view==="reading")renderReading();
  else if(view==="htsus")renderHtsus();
  else renderStats();
}
renderLangs();
render();
</script>
