61:{q:["Qual das opções é VERDADEIRA sobre pagamento a menor ou a maior de duties, taxes e fees apurado na reliquidation de um entry? (Nota: o gabarito oficial aceitou DUAS respostas — B e D.)","¿Cuál de las opciones es VERDADERA sobre el pago de menos o de más de duties, taxes y fees determinado en la reliquidation de un entry? (Nota: la clave oficial aceptó DOS respuestas — B y D.)"],
A:["O CBP pode emitir cobrança de $14,63 por pagamento a menor em até 180 dias da liquidation original.","El CBP puede emitir un cobro de $14.63 por pago de menos dentro de 180 días desde la liquidation original."],
B:["O CBP deve emitir reembolso de $7,56 por pagamento a maior, mediante pedido do importer of record em conjunto com reliquidation de protest.","El CBP debe emitir un reembolso de $7.56 por pago de más, a solicitud del importer of record en conjunto con una reliquidation de protest."],
C:["O CBP pode cobrar ou reembolsar qualquer quantia, mediante pedido escrito em até 60 dias da liquidation original.","El CBP puede cobrar o reembolsar cualquier suma, mediante solicitud escrita dentro de 60 días desde la liquidation original."],

62:{q:["Jane Doe está apresentando um entry summary. Uma das linhas é um vestido feminino, peça de tecido plano (woven) em três cores diferentes. Além das informações gerais exigidas na fatura comercial, que outra informação específica do vestido deve constar na fatura por regulamento?","Jane Doe está presentando un entry summary. Una línea es un vestido de mujer, prenda de tejido plano (woven) en tres colores. Además de la información general exigida en la factura comercial, ¿qué otra información específica del vestido debe constar en la factura por reglamento?"],

B:["Se o vestido tem bolsos costurados","Si el vestido tiene bolsillos cosidos"],

63:{q:["A Johnson Consolidated Freight (JCF) é a nominal consignee de um embarque de garrafas de vidro vazias, consignado à IPA (USA), Inc., cervejaria. A JCF tem POA adequada com a IPA. A JCF contrata a Knowledgeable Customs Brokers para apresentar entry e entry summary como importer of record. A Knowledgeable obtém POA da IPA e registra a si mesma como importer of record, obrigando seu próprio bond. Qual dos passos abaixo NÃO é um dos passos que a Knowledgeable tomará para se liberar da responsabilidade por increased e additional duties?","Johnson Consolidated Freight (JCF) es la nominal consignee de un embarque de botellas de vidrio vacías, consignado a IPA (USA), Inc., cervecera. JCF tiene POA adecuada con IPA. JCF contrata a Knowledgeable Customs Brokers para presentar entry y entry summary como importer of record. Knowledgeable obtiene POA de IPA y se registra a sí misma como importer of record, obligando su propio bond. ¿Cuál de los pasos siguientes NO es uno de los pasos que Knowledgeable tomará para liberarse de la responsabilidad por increased y additional duties?"],
A:["Apresentar, em até 90 dias do time of entry, declaração do actual owner reconhecendo que pagará todos os additional e increased duties, junto com bond do actual owner com as condições do 19 CFR 113.62.","Presentar, dentro de 90 días del time of entry, una declaración del actual owner reconociendo que pagará todos los additional e increased duties, junto con un bond del actual owner con las condiciones del 19 CFR 113.62."],
B:["Fornecer, em até 90 dias do time of entry, cópias das POAs entre Knowledgeable/JCF e Knowledgeable/IPA provando o right to make entry sob o 19 CFR 141.11.","Entregar, dentro de 90 días del time of entry, copias de las POAs entre Knowledgeable/JCF y Knowledgeable/IPA probando el right to make entry bajo el 19 CFR 141.11."],
C:["Declarar ao CBP, no momento do entry e entry summary, que não é a actual owner das mercadorias.","Declarar al CBP, al presentar el entry y entry summary, que no es la actual owner de las mercancías."],
D:["Fornecer ao CBP, no momento do entry e entry summary, o nome e endereço da actual owner das mercadorias.","Entregar al CBP, al presentar el entry y entry summary, el nombre y la dirección de la actual owner de las mercancías."]},
64:{q:["Um customs broker apresentou tempestivamente a documentação de entry (CBP Form 3461) para mercadoria importada, sem o entry summary (7501), em 15/set/2025, e pediu que o time of entry fosse nessa data. A mercadoria, por navio, tinha chegada estimada em 16/set/2025. Ela chegou aos limites do porto em 17/set/2025 e foi descarregada em 18/set/2025. Qual é o time of entry?","Un customs broker presentó a tiempo la documentación de entry (CBP Form 3461) para mercancía importada, sin el entry summary (7501), el 15/sep/2025, y pidió que el time of entry fuera esa fecha. La mercancía, por buque, tenía llegada estimada el 16/sep/2025. Llegó a los límites del puerto el 17/sep/2025 y fue descargada el 18/sep/2025. ¿Cuál es el time of entry?"],

65:{q:["Se um Center Director estender a liquidation de um entry, o aviso oficial de extensão e as razões serão publicados em www.cbp.gov. Qual é o prazo mínimo que o aviso de extensão deve permanecer no site?","Si un Center Director extiende la liquidation de un entry, el aviso oficial de extensión y sus razones se publicarán en www.cbp.gov. ¿Cuál es el plazo mínimo que el aviso debe permanecer en el sitio?"],

C:["Estender o prazo de liquidation de cada entry não liquidado de covered merchandise que entrou após a data de início da investigação.","Extender el plazo de liquidation de cada entry sin liquidar de covered merchandise que entró después de la fecha de inicio de la investigación."],

67:{q:["Qual das opções é VERDADEIRA quanto a mercadoria importada depois que a ITC constata violação da section 337 do Tariff Act de 1930 (19 USC 1337) e emite exclusion order, conforme implementado pelo CBP no 19 CFR 12.39?","¿Cuál de las opciones es VERDADERA respecto a mercancía importada después de que la ITC constata una violación de la section 337 del Tariff Act de 1930 (19 USC 1337) y emite una exclusion order, según lo implementa el CBP en el 19 CFR 12.39?"],
A:["A exclusion order só é eficaz 60 dias após a emissão, quando a mercadoria sujeita a ela não pode mais fazer entry.","La exclusion order solo es eficaz 60 días después de su emisión, cuando la mercancía sujeta a ella ya no puede hacer entry."],

71:{q:["Dos cenários de importação a seguir, qual TEM Transaction Value?","De los siguientes escenarios de importación, ¿cuál TIENE Transaction Value?"],
A:["Enquanto negocia termos com um importador pretendido, o fabricante estrangeiro importa 10.000 time switches de refrigerador para um depósito, tentando escapar de aumentos tarifários iminentes.","Mientras negocia términos con un importador previsto, el fabricante extranjero importa 10,000 time switches de refrigerador a un depósito, tratando de adelantarse a aumentos arancelarios inminentes."],

73:{q:["Um embarque de trens de brinquedo do Vietnã entra a $10/unidade, DDP Newark, NJ. Os trens vão de caminhão da fábrica em Dong Nai ao porto de Ho Chi Minh e de lá por frete aéreo a Newark. O CBP recebeu rated bill of lading de Ho Chi Minh a Newark. Se aplicável, o MPF é maior que o mínimo e menor que o máximo. Qual é o transaction value com base em: 1500 trens a $10; frete interno Dong Nai–Ho Chi Minh $200; frete Ho Chi Minh–Newark $350? (Nota: o gabarito oficial concedeu crédito a TODOS os examinandos nesta questão.)","Un embarque de trenes de juguete de Vietnam entra a $10/unidad, DDP Newark, NJ. Los trenes van en camión de la fábrica en Dong Nai al puerto de Ho Chi Minh y de allí por flete aéreo a Newark. El CBP recibió un rated bill of lading de Ho Chi Minh a Newark. Si aplica, el MPF es mayor que el mínimo y menor que el máximo. ¿Cuál es el transaction value con base en: 1500 trenes a $10; flete interno Dong Nai–Ho Chi Minh $200; flete Ho Chi Minh–Newark $350? (Nota: la clave oficial dio crédito a TODOS los examinados en esta pregunta.)"],

74:{q:["A A&G, moveleira de Minneapolis, compra 5000 tábuas de passar sob medida da Kraftsmen (Eslovênia). A A&G fornece gratuitamente: especificações de design de designer de Dallas ($3.200 taxa fixa); e 2500 jardas de tecido de algodão adquirido pela Kraftsmen na Eslovênia a $2,00/jarda, enviado à estamparia da A&G em Moçambique, onde a A&G pagou $1,00/jarda pela estampa, antes de o tecido voltar à Eslovênia. A A&G importa em cinco embarques de 1000 tábuas e paga $375.000 pelo pedido, sem os assists. Se a A&G ratear o valor total dos assists por toda a produção prevista de 5000 tábuas, qual é o valor tributável de um embarque de 1000 tábuas?","A&G, mueblera de Minneapolis, compra 5000 tablas de planchar a medida a Kraftsmen (Eslovenia). A&G suministra gratis: especificaciones de diseño de un diseñador de Dallas ($3,200 tarifa fija); y 2500 yardas de tela de algodón adquirida por Kraftsmen en Eslovenia a $2.00/yarda, enviada a la estampadora de A&G en Mozambique, donde A&G pagó $1.00/yarda por el estampado, antes de que la tela volviera a Eslovenia. A&G importa en cinco embarques de 1000 tablas y paga $375,000 por el pedido, sin los assists. Si A&G prorratea el valor total de los assists sobre toda la producción prevista de 5000 tablas, ¿cuál es el valor gravable de un embarque de 1000 tablas?"],
A:["$75.500,00","$75,500.00"],B:["$76.000,00","$76,000.00"],C:["$76.140,00","$76,140.00"],D:["$77.140,00","$77,140.00"]},
75:{q:["Uma subsidiária estrangeira vende minério à matriz americana. O preço cobrado é o preço do minério na New York Mercantile Exchange na data em que o minério chega aos EUA. Selecione a afirmação VERDADEIRA sobre esse preço.","Una subsidiaria extranjera vende mineral a su matriz estadounidense. El precio cobrado es el precio del mineral en la New York Mercantile Exchange en la fecha en que el mineral llega a EE.UU. Seleccione la afirmación VERDADERA sobre ese precio."],
A:["O preço é aceitável sob transaction value por se basear numa fórmula que nenhuma das partes controla.","El precio es aceptable bajo transaction value por basarse en una fórmula que ninguna de las partes controla."],

78:{q:["A Luxury Resins, produtora japonesa de plásticos, vendeu resina à Phone Cases Plus, fabricante americana não relacionada, por $20.000. Depois, a Phone Cases Plus decide pagar royalty de $2.000 a um dono de marca pelo direito de fabricar e vender capas de celular da marca feitas com a resina. Qual é o transaction value da transação entre Luxury Resins e Phone Cases Plus?","Luxury Resins, productora japonesa de plásticos, vendió resina a Phone Cases Plus, fabricante estadounidense no relacionada, por $20,000. Después, Phone Cases Plus decide pagar un royalty de $2,000 a un dueño de marca por el derecho de fabricar y vender fundas de celular de la marca hechas con la resina. ¿Cuál es el transaction value de la transacción entre Luxury Resins y Phone Cases Plus?"],

80:{q:["Durante exame de carga, um oficial do CBP descobriu que nenhuma mercadoria física confere com a fatura do entry. O oficial determina que não houve intenção de fraude. O entry original deve ser substituído por um novo. Como serão tratados os estimated duties pagos no entry original?","Durante un examen de carga, un oficial del CBP descubrió que ninguna mercancía física coincide con la factura del entry. El oficial determina que no hubo intención de fraude. El entry original debe reemplazarse por uno nuevo. ¿Cómo se tratarán los estimated duties pagados en el entry original?"],
A:["Serão transferidos ao novo entry via ACH.","Se transferirán al nuevo entry vía ACH."],
B:["Serão reembolsados na liquidation, como no caso de uma nonimportation.","Se reembolsarán en la liquidation, como en el caso de una nonimportation."],
C:["Serão aplicados como crédito no próximo periodic monthly statement do importador.","Se aplicarán como crédito en el próximo periodic monthly statement del importador."],
D:["Serão retidos pelo CBP e aplicados ao processo de forfeiture vindouro.","Serán retenidos por el CBP y aplicados al proceso de forfeiture venidero."]}

out2025:{
1:{q:["Qual das opções a seguir constitui um \"uso indevido de licença ou permit\" NÃO permitido, segundo os regulamentos do CBP aplicáveis a customs brokers licenciados?","¿Cuál de las siguientes opciones constituye un \"uso indebido de licencia o permit\" NO permitido según los reglamentos del CBP aplicables a customs brokers licenciados?"],
A:["Um broker permite que uma pessoa sem licença, que não é seu funcionário, solicite, promova ou realize qualquer customs business usando a licença do broker.","Un broker permite que una persona sin licencia, que no es su empleado, solicite, promueva o realice cualquier customs business usando la licencia del broker."],
B:["Um broker influencia ou tenta influenciar a conduta de um representante do DHS em assunto pendente, por meio de coação ou falsa acusação.","Un broker influye o intenta influir en la conducta de un representante del DHS en un asunto pendiente, mediante coacción o falsa acusación."],
C:["Um broker obtém ou tenta obter informações de registros do Governo aos quais não recebeu acesso da autoridade competente.","Un broker obtiene o intenta obtener información de registros del Gobierno a los que no recibió acceso de la autoridad competente."],
D:["Um broker usa conscientemente declarações falsas ou enganosas para conseguir contratação em assunto aduaneiro.","Un broker usa a sabiendas declaraciones falsas o engañosas para conseguir empleo en un asunto aduanero."]},
2:{q:["A AA Customs Brokers, Inc. tem licença corporativa e national permit. Tom, o broker individual que era o qualificador do national permit, renunciou. Qual o prazo máximo, a partir da renúncia, para indicar novo broker qualificador e evitar a revogação automática (by operation of law) do permit?","AA Customs Brokers, Inc. tiene licencia corporativa y national permit. Tom, el broker individual que era el calificador del national permit, renunció. ¿Cuál es el plazo máximo, desde la renuncia, para designar un nuevo broker calificador y evitar la revocación automática (by operation of law) del permit?"],

3:{q:["Até quando deve ser apresentada a petição inicial de alívio (petition for relief) em um caso de apreensão (seizure) e em um caso de penalidade (penalty)?","¿Hasta cuándo debe presentarse la petición inicial de alivio (petition for relief) en un caso de incautación (seizure) y en un caso de penalidad (penalty)?"],
A:["Em até 60 dias do envio da notificação de apreensão ou da notificação de penalidade.","Dentro de 60 días del envío de la notificación de incautación o de penalidad."],

4:{q:["Quais são os requisitos para o CBP considerar uma offer in compromise (proposta de acordo) sob o Tariff Act de 1930, decorrente de violação da legislação aduaneira?","¿Cuáles son los requisitos para que el CBP considere una offer in compromise (propuesta de acuerdo) bajo el Tariff Act de 1930, derivada de una violación de la ley aduanera?"],

5:{q:["Qual item a seguir NÃO precisa ser mantido pelo broker como comprovação de inscrição, participação ou conclusão da educação continuada qualificada (continuing broker education)?","¿Cuál de los siguientes NO necesita ser conservado por el broker como evidencia de inscripción, asistencia o finalización de la educación continua calificada (continuing broker education)?"],
A:["O local onde o broker concluiu a educação continuada.","El lugar donde el broker completó la educación continua."],

6:{q:["Quais pessoas e/ou entidades devem certificar o cumprimento da educação continuada junto com o status report exigido pelo 19 CFR 111.30(d)? i. Brokers individuais licenciados; ii. Partnerships licenciadas; iii. Associations licenciadas; iv. Corporations licenciadas.","¿Qué personas y/o entidades deben certificar el cumplimiento de la educación continua junto con el status report exigido por 19 CFR 111.30(d)? i. Brokers individuales licenciados; ii. Partnerships licenciadas; iii. Associations licenciadas; iv. Corporations licenciadas."],

7:{q:["A ZX Customs Brokers, Inc. (ZX) é uma corporation-broker. George Forest, broker individual licenciado, é VP de Compliance e qualificador da licença e do national permit da ZX. Em 01/05/2025, o CBP aceita a suspensão voluntária da licença individual de Forest por 1 ano, a partir de 05/05/2025 (saúde). Jayne Smythe, Import Manager da ZX, é broker licenciada, mas NÃO é officer formalmente nomeada da ZX. Qual afirmação é FALSA?","ZX Customs Brokers, Inc. (ZX) es una corporation-broker. George Forest, broker individual licenciado, es VP de Compliance y calificador de la licencia y del national permit de ZX. El 01/05/2025, el CBP acepta la suspensión voluntaria de la licencia individual de Forest por 1 año, desde el 05/05/2025 (salud). Jayne Smythe, Import Manager de ZX, es broker licenciada, pero NO es officer formalmente designada de ZX. ¿Qué afirmación es FALSA?"],
A:["A ZX pode notificar o CBP nomeando a Import Manager Smythe como qualificadora do national permit e continuar o customs business até o permit anual expirar em 31/12/2025.","ZX puede notificar al CBP designando a la Import Manager Smythe como calificadora del national permit y continuar el customs business hasta que el permit anual expire el 31/12/2025."],
B:["A ZX pode oferecer por escrito a suspensão voluntária de sua licença e permit por 1 ano, acompanhando a suspensão de Forest, e interromper o customs business no período.","ZX puede ofrecer por escrito la suspensión voluntaria de su licencia y permit por 1 año, acompañando la suspensión de Forest, y suspender el customs business durante ese período."],
C:["A ZX pode nomear Smythe como VP de Import Compliance, notificar o CBP de que ela será a nova qualificadora da licença e do permit a partir de 05/05/2025, e continuar o customs business.","ZX puede nombrar a Smythe como VP de Import Compliance, notificar al CBP que ella será la nueva calificadora de la licencia y del permit desde el 05/05/2025, y continuar el customs business."],
D:["Antes de 02/09/2025, a ZX pode contratar o Dr. Hu (broker licenciado) como VP de Import Compliance, designá-lo qualificador da licença e Smythe qualificadora do national permit e, após informar o CBP e cumprir os demais requisitos, continuar o customs business.","Antes del 02/09/2025, ZX puede contratar al Dr. Hu (broker licenciado) como VP de Import Compliance, designarlo calificador de la licencia y a Smythe calificadora del national permit y, tras informar al CBP y cumplir los demás requisitos, continuar el customs business."]},
8:{q:["Suzy Smith é broker licenciada (Processing Center de Miami) e quer um national permit individual. A aplicação já incluiu: (1) nº/data da licença; (2) endereço, telefone e e-mail do office of record; (3) ponto de contato; (4) lista de funcionários conforme 19 CFR 111.28; (5) local de guarda dos registros; (6) funcionário responsável pelos registros e finanças; (7) comprovante das taxas do 111.96(b)-(c). Que material adicional falta para completar a aplicação?","Suzy Smith es broker licenciada (Processing Center de Miami) y quiere un national permit individual. La solicitud ya incluyó: (1) nº/fecha de licencia; (2) dirección, teléfono y correo del office of record; (3) punto de contacto; (4) lista de empleados según 19 CFR 111.28; (5) lugar de conservación de registros; (6) empleado responsable de registros y finanzas; (7) comprobante de las tarifas del 111.96(b)-(c). ¿Qué material adicional falta para completar la solicitud?"],

B:["Uma dispensa (waiver) do exame do national permit.","Una exención (waiver) del examen del national permit."],
C:["Um plano de supervisão descrevendo como exercerá responsible supervision and control sobre o customs business conduzido sob o national permit.","Un plan de supervisión que describa cómo ejercerá responsible supervision and control sobre el customs business realizado bajo el national permit."],

9:{q:["Quando um protest é apresentado em nome de um principal por um agente que NÃO é advogado nem customs broker (ou funcionário autorizado), que documento deve ser apresentado junto para demonstrar que o agente está autorizado a protestar?","Cuando un protest es presentado en nombre de un principal por un agente que NO es abogado ni customs broker (o empleado autorizado), ¿qué documento debe presentarse para demostrar que el agente está autorizado a protestar?"],

10:{q:["O Departamento de Defesa (DoD) contrata um broker licenciado para importar equipamento de blindagem para um novo veículo militar não tripulado. O DoD instrui que a procuração (POA) NÃO seria necessária pela natureza sensível da importação e por ser por conta do DoD. Qual afirmação é VERDADEIRA?","El Departamento de Defensa (DoD) contrata a un broker licenciado para importar equipo de blindaje para un nuevo vehículo militar no tripulado. El DoD instruye que el poder (POA) NO sería necesario por la naturaleza sensible de la importación y por ser por cuenta del DoD. ¿Qué afirmación es VERDADERA?"],
A:["Mercadoria importada pelo DoD é automaticamente isenta de impostos (duty-free).","La mercancía importada por el DoD es automáticamente libre de impuestos (duty-free)."],
B:["A POA não é exigida quando o DoD é o Importer of Record, por sensibilidades inerentes.","El POA no se exige cuando el DoD es el Importer of Record, por sensibilidades inherentes."],

11:{q:["Qual das partes a seguir é obrigada a manter registros e disponibilizá-los para exame e inspeção pelo CBP?", "¿Cuál de las siguientes partes está obligada a mantener registros y ponerlos a disposición para examen e inspección del CBP?"],

12:{q:["Quando mercadoria é retirada de um bonded warehouse, por quantos anos o customs broker deve manter os registros relativos à retirada, contados da data da última retirada?", "Cuando se retira mercancía de un bonded warehouse, ¿por cuántos años debe el customs broker conservar los registros relativos al retiro, contados desde la fecha del último retiro?"],

13:{q:["Ao realizar customs business, os customs brokers licenciados devem exercer responsible supervision and control (supervisão e controle responsáveis). A avaliação do CBP sobre o que é necessário para exercer e manter essa supervisão varia conforme as circunstâncias de cada caso. Independentemente das circunstâncias, qual ÚNICO dos fatores a seguir é requisito obrigatório para o broker licenciado exercer responsible supervision and control no customs business?", "Al realizar customs business, los customs brokers licenciados deben ejercer responsible supervision and control (supervisión y control responsables). La evaluación del CBP sobre lo necesario para ejercer y mantener esa supervisión varía según las circunstancias de cada caso. Independientemente de las circunstancias, ¿cuál ÚNICO de los siguientes factores es requisito obligatorio para que el broker licenciado ejerza responsible supervision and control en el customs business?"],
A:["Realizar auditorias e revisões das transações aduaneiras conduzidas pelo funcionário", "Realizar auditorías y revisiones de las transacciones aduaneras manejadas por el empleado"],
B:["Oferecer treinamento adequado aos funcionários da corretora", "Brindar capacitación adecuada a los empleados de la agencia"],
C:["Garantir que os funcionários tenham acesso aos regulamentos mais recentes do CBP", "Asegurar que los empleados tengan acceso a los reglamentos más recientes del CBP"],
D:["Empregar número suficiente de brokers licenciados em relação à complexidade do trabalho", "Emplear un número suficiente de brokers licenciados en relación con la complejidad del trabajo"]},
14:{q:["Andrew Balder, funcionário da PM Morris Customs Brokerage (MCB), decidiu importar paletós masculinos de lapela bicolor para aproveitar a popularidade explosiva do produto. Um dos clientes da MCB importa regularmente paletós comparáveis e tem número recorde de vendas. Qual das afirmações a seguir está CORRETA?", "Andrew Balder, empleado de PM Morris Customs Brokerage (MCB), decidió importar sacos de vestir masculinos de solapa bicolor para aprovechar su explosiva popularidad. Uno de los clientes de MCB importa regularmente sacos comparables y tiene un número récord de ventas. ¿Cuál de las siguientes afirmaciones es CORRECTA?"],
A:["Andrew Balder não pode importar itens semelhantes aos dos clientes da MCB, pois isso seria conflito de interesse.", "Andrew Balder no puede importar artículos similares a los de los clientes de MCB, pues sería un conflicto de interés."],
B:["Um funcionário de broker não pode ser também importador.", "Un empleado de un broker no puede ser también importador."],
C:["Andrew Balder deve notificar o Center Director competente e pedir permissão para importar tais artigos.", "Andrew Balder debe notificar al Center Director correspondiente y solicitar permiso para importar dichos artículos."],
D:["Andrew Balder deve avisar o cliente da MCB de que ele também vai importar paletós masculinos de lapela bicolor.", "Andrew Balder debe avisar al cliente de MCB que él también va a importar sacos masculinos de solapa bicolor."]},
15:{q:["_____ significa a atividade realizada por uma entidade empresarial para assegurar que os documentos de outra(s) entidade(s) empresarial(is) relacionada(s) sejam preparados e apresentados ao CBP com \"reasonable care\" (cuidado razoável), sem que essa atividade alcance a efetiva preparação ou apresentação dos documentos ou de seus equivalentes eletrônicos.", "_____ significa la actividad realizada por una entidad empresarial para asegurar que los documentos de otra(s) entidad(es) empresarial(es) relacionada(s) se preparen y presenten ante el CBP con \"reasonable care\" (cuidado razonable), sin que dicha actividad alcance la preparación o presentación efectiva de los documentos o sus equivalentes electrónicos."],
A:["Corporate compliance activity (atividade de compliance corporativo)", "Corporate compliance activity (actividad de cumplimiento corporativo)"],
B:["Conducting customs business (realizar customs business)", "Conducting customs business (realizar customs business)"],
C:["Exercising responsible supervision and control (exercer supervisão e controle responsáveis)", "Exercising responsible supervision and control (ejercer supervisión y control responsables)"],
D:["Informed compliance activity (atividade de informed compliance)", "Informed compliance activity (actividad de informed compliance)"]},
16:{q:["Uma broker individual licenciada, sujeita aos requisitos de continuing broker education, concluiu um curso qualificado em 15 de abril de 2027. Ela mantém os registros adequados de sua educação continuada conforme os regulamentos do CBP. Ela certificou a conclusão das horas ao apresentar seu triennial status report em 1º de fevereiro de 2030. Por quanto tempo o broker deve manter o registro do curso de 15 de abril de 2027 — qual das datas a seguir identifica o prazo correto?", "Una broker individual licenciada, sujeta a los requisitos de continuing broker education, completó un curso calificado el 15 de abril de 2027. Mantiene los registros adecuados de su educación continua conforme a los reglamentos del CBP. Certificó la finalización de las horas al presentar su triennial status report el 1º de febrero de 2030. ¿Por cuánto tiempo debe el broker conservar el registro del curso del 15 de abril de 2027 — cuál de las siguientes fechas identifica el plazo correcto?"],
A:["15 de abril de 2030", "15 de abril de 2030"],
B:["1º de fevereiro de 2033", "1º de febrero de 2033"],
C:["15 de abril de 2033", "15 de abril de 2033"],
D:["1º de fevereiro de 2035", "1º de febrero de 2035"]},
17:{q:["Qual alternativa completa corretamente a afirmação a seguir: mediante solicitação do CBP, o broker individual deve disponibilizar ao CBP as informações e a documentação relativas à continuing broker education qualificada concluída durante um período trienal até _____.", "¿Qué opción completa correctamente la siguiente afirmación: a solicitud del CBP, el broker individual debe poner a disposición del CBP la información y la documentación relativas a la continuing broker education calificada completada durante un período trienal a más tardar _____?"],
A:["30 dias corridos a contar da data da solicitação do CBP", "30 días calendario desde la fecha de la solicitud del CBP"],
B:["30 dias úteis a contar da data da solicitação do CBP", "30 días hábiles desde la fecha de la solicitud del CBP"],
C:["30 dias corridos a contar da data de recebimento da solicitação do CBP", "30 días calendario desde la fecha de recepción de la solicitud del CBP"],
D:["30 dias úteis a contar da data de recebimento da solicitação do CBP", "30 días hábiles desde la fecha de recepción de la solicitud del CBP"]},
18:{q:["Ao final do período trienal de reporte 2024-2027, Joe Slacker, customs broker licenciado e estudante universitário de meio período, concluiu oito horas de continuing broker education credenciada e dois semestres de disciplinas universitárias de supply chain management. Como customs broker, ele era obrigado a completar 20 horas de continuing broker education qualificada. O Sr. Slacker apresentou o triennial status report, mas deixou de reportar ou certificar o cumprimento do requisito de educação continuada. O que o Sr. Slacker deve fazer para sanar o descumprimento e manter sua licença?", "Al final del período trienal de reporte 2024-2027, Joe Slacker, customs broker licenciado y estudiante universitario de medio tiempo, completó ocho horas de continuing broker education acreditada y dos semestres de cursos universitarios de supply chain management. Como customs broker debía completar 20 horas de continuing broker education calificada. El Sr. Slacker presentó el triennial status report, pero no reportó ni certificó el cumplimiento del requisito de educación continua. ¿Qué debe hacer el Sr. Slacker para subsanar el incumplimiento y mantener su licencia?"],
A:["Apresentar status report corrigido certificando as oito horas de continuing broker education concluídas no período trienal, em até 30 dias corridos da emissão do aviso do CBP sobre a falha em reportar e certificar o cumprimento.", "Presentar un status report corregido certificando las ocho horas de continuing broker education completadas en el período trienal, dentro de 30 días calendario desde la emisión del aviso del CBP sobre la falta de reporte y certificación."],
B:["Solicitar dispensa (waiver) sob o 19 CFR 111 das 12 horas de crédito restantes, já que concluiu mais de 12 horas de disciplinas de supply chain management na faculdade.", "Solicitar una dispensa (waiver) bajo el 19 CFR 111 de las 12 horas de crédito restantes, ya que completó más de 12 horas de cursos de supply chain management en la universidad."],
C:["Concluir o número exigido de créditos de continuing broker education qualificada e apresentar status report corrigido em até 30 dias corridos da emissão do aviso do CBP sobre a falha em reportar e certificar o cumprimento.", "Completar el número exigido de créditos de continuing broker education calificada y presentar un status report corregido dentro de 30 días calendario desde la emisión del aviso del CBP sobre la falta de reporte y certificación."],
D:["Refazer e ser aprovado no Customs Broker License Exam em até 120 dias corridos do aviso do CBP sobre a falha em reportar e certificar o cumprimento.", "Volver a rendir y aprobar el Customs Broker License Exam dentro de 120 días calendario desde el aviso del CBP sobre la falta de reporte y certificación."]},
19:{q:["Qual é a penalidade para quem intencionalmente realiza customs business, fora das hipóteses do 19 CFR 111.2(a)(2), sem possuir licença válida de broker?", "¿Cuál es la penalidad para quien intencionalmente realiza customs business, fuera de lo previsto en el 19 CFR 111.2(a)(2), sin tener una licencia válida de broker?"],

20:{q:["O Sr. Jones, buying agent (agente de compras) com procuração da importadora American Widgets, contrata a customs broker licenciada Sra. Smith para a realização de customs business e a Speedy Freight Forwarder para o transporte da mercadoria em nome da American Widgets. O Sr. Jones não tem licença de customs broker. A mercadoria importada pela American Widgets não foi comprada na condição delivered duty-paid. A Sra. Smith firmou procuração diretamente com a American Widgets. Dentre as opções a seguir, que providência adicional a Sra. Smith deve tomar para fins de faturamento?", "El Sr. Jones, buying agent (agente de compras) con poder de la importadora American Widgets, contrata a la customs broker licenciada Sra. Smith para realizar customs business y a Speedy Freight Forwarder para el transporte de la mercancía en nombre de American Widgets. El Sr. Jones no tiene licencia de customs broker. La mercancía importada por American Widgets no fue comprada en condición delivered duty-paid. La Sra. Smith firmó un poder directamente con American Widgets. De las siguientes opciones, ¿qué acción adicional debe tomar la Sra. Smith para efectos de facturación?"],
A:["A Sra. Smith deve transmitir à American Widgets uma cópia de sua fatura pelos serviços prestados ou uma cópia da entry, salvo se a American Widgets dispensar essa transmissão.", "La Sra. Smith debe transmitir a American Widgets una copia de su factura por los servicios prestados o una copia de la entry, salvo que American Widgets renuncie a dicha transmisión."],
B:["A Sra. Smith deve pagar um finder's fee (comissão de indicação) ao Sr. Jones pela indicação do customs business da American Widgets.", "La Sra. Smith debe pagar un finder's fee (comisión por referencia) al Sr. Jones por haber referido el customs business de American Widgets."],
C:["A Sra. Smith deve firmar procuração diretamente com a Speedy Freight Forwarder.", "La Sra. Smith debe firmar un poder directamente con Speedy Freight Forwarder."],
D:["A Sra. Smith deve transmitir diretamente à Speedy Freight Forwarder uma cópia dos encargos da corretora.", "La Sra. Smith debe transmitir directamente a Speedy Freight Forwarder una copia de los cargos de la agencia."]},

23:{q:["Consulte a Commercial Invoice. Como a alteração de preço que a Stampa, vendedora, ofereceu à BQ Printers, compradora, afeta o transaction value?", "Consulte la Commercial Invoice. ¿Cómo afecta al transaction value el cambio de precio que Stampa, la vendedora, ofreció a BQ Printers, la compradora?"],

26:{q:["A Smith Imports, importadora sediada em Baltimore/MD, comprou 100.000 libras de aço sul-coreano. O embarque deve chegar a Los Angeles/CA em 25 de maio de 2025. A companhia marítima estima a chegada do meio de transporte em 28 de maio de 2025. A Smith Imports instruiu seu customs broker a fazer a entry no porto de Baltimore. O broker informa que o produto está sujeito a absolute quota e que, desde 15 de maio, a cota do aço é considerada preenchida. O próximo período de cota abre em 1º de julho de 2025. Qual das ações a seguir NÃO é apropriada para o broker tomar em nome da Smith Imports?", "Smith Imports, importadora con sede en Baltimore/MD, compró 100.000 libras de acero surcoreano. El embarque debe llegar a Los Ángeles/CA el 25 de mayo de 2025. La naviera estima la llegada del medio de transporte el 28 de mayo de 2025. Smith Imports instruyó a su customs broker hacer la entry en el puerto de Baltimore. El broker informa que el producto está sujeto a absolute quota y que, desde el 15 de mayo, la cuota del acero se considera llena. El próximo período de cuota abre el 1º de julio de 2025. ¿Cuál de las siguientes acciones NO es apropiada para que el broker la tome en nombre de Smith Imports?"],
A:["Admitir o embarque em uma Foreign Trade Zone para reter a mercadoria até a abertura do próximo período de cota.", "Admitir el embarque en una Foreign Trade Zone para retener la mercancía hasta la apertura del próximo período de cuota."],
B:["Apresentar warehouse entry para reter a mercadoria até a abertura do próximo período de cota.", "Presentar una warehouse entry para retener la mercancía hasta la apertura del próximo período de cuota."],
C:["Exportar a mercadoria dos Estados Unidos para o Canadá.", "Exportar la mercancía de los Estados Unidos a Canadá."],
D:["Apresentar transportation entry para movimentar a mercadoria in-bond de Los Angeles, passando por diversos portos, até Baltimore, chegando no início do próximo período de cota.", "Presentar una transportation entry para mover la mercancía in-bond desde Los Ángeles, pasando por varios puertos, hasta Baltimore, llegando al inicio del próximo período de cuota."]},
27:{q:["O limite anual da Tariff Rate Quota (TRQ) para carne bovina da Argentina é de 20.000.000 KG. O período de cota é anual e começa em 1º de janeiro. Um filer registrou carne bovina argentina como entry tipo 02 (quota). A cota foi alocada e a entry recebeu presentation date de 1º de julho de 2025. Em 1º de setembro de 2025, o filer percebeu que a quantidade de carne não fora registrada corretamente e que se importou mais do que o declarado originalmente na entry. A cota foi preenchida em 1º de agosto de 2025. A entry ainda não liquidou. Dentre as opções abaixo, qual é a melhor ação do filer?", "El límite anual de la Tariff Rate Quota (TRQ) para carne de res de Argentina es de 20.000.000 KG. El período de cuota es anual y comienza el 1º de enero. Un filer registró carne argentina como entry tipo 02 (quota). La cuota fue asignada y la entry recibió presentation date del 1º de julio de 2025. El 1º de septiembre de 2025, el filer notó que la cantidad de carne no se había registrado correctamente y que se importó más de lo declarado originalmente. La cuota se llenó el 1º de agosto de 2025. La entry aún no ha liquidado. De las opciones siguientes, ¿cuál es la mejor acción del filer?"],
A:["Solicitar o cancelamento da entry original.", "Solicitar la cancelación de la entry original."],
B:["Apresentar uma Post Summary Correction (PSC) para corrigir a entry.", "Presentar una Post Summary Correction (PSC) para corregir la entry."],
C:["Contatar a HQ Quota para verificar se alguma quantidade de cota pode ser reservada.", "Contactar a HQ Quota para determinar si puede reservarse alguna cantidad de cuota."],
D:["Apresentar PSC quando o próximo período de cota abrir.", "Presentar una PSC cuando abra el próximo período de cuota."]},
28:{q:["A ATC Imports contrata a Fry Customs Brokers para apresentar entry de tapetes importados sujeitos a tariff-rate quota. O CBP Officer James libera a mercadoria por engano antes da devida apresentação do entry summary, e a cota está perto de ser preenchida. O port director decidiu impor liquidated damages. Qual dos fatos abaixo justificaria a decisão do port director?", "ATC Imports contrata a Fry Customs Brokers para presentar la entry de alfombras importadas sujetas a tariff-rate quota. El CBP Officer James libera la mercancía por error antes de la debida presentación del entry summary, y la cuota está por llenarse. El port director decidió imponer liquidated damages. ¿Cuál de los hechos siguientes justificaría la decisión del port director?"],

B:["A mercadoria é devolvida à custódia do CBP em até 30 dias da data da demanda de redelivery.", "La mercancía se devuelve a la custodia del CBP dentro de 30 días desde la fecha de la demanda de redelivery."],
C:["A liberação decorreu de causas inteiramente fora do controle do importador.", "La liberación se debió a causas totalmente fuera del control del importador."],

29:{q:["A PB Creations, Inc. (PB) é importer of record e consignee de uma entry de pasta de amendoim da Argentina, sujeita a absolute quota. No domingo, 31 de maio de 2025, às 8h00 (horário do Leste), a Eastern AH Brokers, corretora autorizada da PB, apresentou entry e entry summary sem erros no ACE do CBP e programou o pagamento dos estimated duties via statement. O embarque deveria chegar ao porto aduaneiro de Baltimore, Maryland, em 1º de junho de 2025. O embarque efetivamente chega a Baltimore na segunda-feira, 2 de junho de 2025, às 12h03 (Leste), conforme o manifesto apresentado no ACE. A AH Brokers paga o statement na quinta-feira, 12 de junho de 2025, às 17h00 (Leste). Com base nesses fatos, qual das combinações de data e hora abaixo é a presentation date correta que estabelece a prioridade de cota para essa entry?", "PB Creations, Inc. (PB) es importer of record y consignee de una entry de mantequilla de maní de Argentina, sujeta a absolute quota. El domingo 31 de mayo de 2025, a las 8:00 a. m. (hora del Este), Eastern AH Brokers, agencia autorizada de PB, presentó entry y entry summary sin errores en el ACE del CBP y programó el pago de los estimated duties vía statement. El embarque debía llegar al puerto aduanero de Baltimore, Maryland, el 1º de junio de 2025. El embarque efectivamente llega a Baltimore el lunes 2 de junio de 2025 a las 12:03 p. m. (Este), según el manifiesto presentado en ACE. AH Brokers paga el statement el jueves 12 de junio de 2025 a las 5:00 p. m. (Este). Con base en estos hechos, ¿cuál de las combinaciones de fecha y hora es la presentation date correcta que establece la prioridad de cuota para esta entry?"],
A:["1º de junho de 2025, às 8h30 (Leste)", "1º de junio de 2025, a las 8:30 a. m. (Este)"],
B:["2 de junho de 2025, às 12h03 (Leste)", "2 de junio de 2025, a las 12:03 p. m. (Este)"],
C:["12 de junho de 2025, às 17h00 (Leste)", "12 de junio de 2025, a las 5:00 p. m. (Este)"],
D:["13 de junho de 2025, às 8h30 (Leste)", "13 de junio de 2025, a las 8:30 a. m. (Este)"]},
30:{q:["Em 15 de maio de 2025, a Headquarters do CBP publicou aviso de que 116.000 dúzias de vassouras de broom corn (sorgo-vassoura), classificáveis nas subheadings 9603.10.40 a 9603.10.60, já foram entered ou withdrawn for consumption e de que a cota está perto de ser preenchida. Essas vassouras são cobertas por tariff-rate quota. Seu cliente tem 6.000 dúzias de vassouras de broom corn, avaliadas em $0.95 cada, chegando em 9 de julho de 2025, vindas da Índia. O país de origem é a Índia. O cliente não quer colocar nenhuma vassoura em bonded warehouse. Não há harbor maintenance fee. Você calcula o merchandise processing fee (MPF) em $236.94. Com base nesses fatos, qual das opções descreve melhor o processo de entry aplicável quando uma tariff-rate quota está perto de ser preenchida?", "El 15 de mayo de 2025, Headquarters del CBP publicó un aviso de que 116.000 docenas de escobas de broom corn (sorgo escobero), clasificables en las subheadings 9603.10.40 a 9603.10.60, ya fueron entered o withdrawn for consumption y de que la cuota está por llenarse. Estas escobas están cubiertas por una tariff-rate quota. Su cliente tiene 6.000 docenas de escobas de broom corn, valoradas en $0.95 cada una, que llegan el 9 de julio de 2025 desde la India. El país de origen es la India. El cliente no quiere colocar ninguna escoba en bonded warehouse. No hay harbor maintenance fee. Usted calcula el merchandise processing fee (MPF) en $236.94. Con base en estos hechos, ¿cuál opción describe mejor el proceso de entry aplicable cuando una tariff-rate quota está por llenarse?"],
A:["Apresentar entry tipo 01 (consumo) para todas as 6.000 dúzias sob a 9603.10.4000 e colocar $5,708.94 no statement.", "Presentar una entry tipo 01 (consumo) para las 6.000 docenas bajo la 9603.10.4000 y poner $5,708.94 en el statement."],
B:["Apresentar entry tipo 01 (consumo) para todas as 6.000 dúzias sob a 9603.10.9000 e colocar $7,076.94 no statement.", "Presentar una entry tipo 01 (consumo) para las 6.000 docenas bajo la 9603.10.9000 y poner $7,076.94 en el statement."],
C:["Apresentar entry tipo 02 (consumo) para todas as 6.000 dúzias sob a 9603.10.5000 e colocar $23,276.94 no statement.", "Presentar una entry tipo 02 (consumo) para las 6.000 docenas bajo la 9603.10.5000 y poner $23,276.94 en el statement."],
D:["Apresentar entry tipo 02 (consumo) com a linha 001 para 5.478 dúzias sob a 9603.10.4000/8% e a linha 002 para 522 dúzias sob a 9603.10.5000/32¢ cada, colocando $7,237.35 no statement.", "Presentar una entry tipo 02 (consumo) con la línea 001 para 5.478 docenas bajo la 9603.10.4000/8% y la línea 002 para 522 docenas bajo la 9603.10.5000/32¢ cada una, poniendo $7,237.35 en el statement."]},

34:{q:["Dentre as quatro opções abaixo, qual é a melhor CLASSIFICAÇÃO de uma máquina que produz fibras de vidro? Trata-se de equipamento altamente especializado, que opera em temperaturas elevadas para produzir fibras de vidro a partir de vidro fundido. Pelo tamanho da máquina completa, ela não pode ser embarcada em um único meio de transporte. O importer of record optou por registrar a máquina desmontada e em vários embarques, dentro de seis dias, no Porto de Newark. O primeiro embarque foi liberado mediante special permit for immediate delivery na chegada. Depois de importados, os componentes serão entregues diretamente ao cliente e só então montados.", "De las cuatro opciones siguientes, ¿cuál es la mejor CLASIFICACIÓN de una máquina que produce fibras de vidrio? Es un equipo altamente especializado que opera a temperaturas elevadas para producir fibras de vidrio a partir de vidrio fundido. Por el tamaño de la máquina completa, no puede embarcarse en un solo medio de transporte. El importer of record optó por registrar la máquina desarmada y en varios embarques, dentro de seis días, en el Puerto de Newark. El primer embarque fue liberado mediante special permit for immediate delivery a la llegada. Tras la importación, los componentes se entregarán directamente al cliente y solo entonces se ensamblarán."],

36:{q:["A Diamond Vision importa armações de óculos (spectacle frames) e lentes como peças desmontadas para os Estados Unidos. A armação é uma peça única moldada em plástico, composta de aros, ponte e apoio de nariz. As hastes (temples) e as extremidades também são de plástico moldado e vêm em pares, uma esquerda e uma direita. Dobradiças e parafusos de aço vêm em caixas. As lentes são de plástico e vêm em pares. Qual ÚNICA das regras a seguir NÃO se aplicaria na determinação da classificação de oito dígitos das armações e lentes no HTSUS?", "Diamond Vision importa armazones de anteojos (spectacle frames) y lentes como piezas desarmadas a los Estados Unidos. El armazón es una pieza única moldeada en plástico, compuesta de aros, puente y apoyo nasal. Las patillas (temples) y los extremos también son de plástico moldeado y vienen en pares, uno izquierdo y uno derecho. Las bisagras y tornillos de acero vienen en cajas. Los lentes son de plástico y vienen en pares. ¿Cuál ÚNICA de las siguientes reglas NO se aplicaría al determinar la clasificación de ocho dígitos de los armazones y lentes en el HTSUS?"],
A:["General Rule of Interpretation 1 (Regra Geral de Interpretação 1)", "General Rule of Interpretation 1 (Regla General de Interpretación 1)"],
B:["General Rule of Interpretation 2(a) (Regra Geral de Interpretação 2(a))", "General Rule of Interpretation 2(a) (Regla General de Interpretación 2(a))"],
C:["Additional U.S. Rules of Interpretation 1(c)", "Additional U.S. Rules of Interpretation 1(c)"],

37:{q:["Dentre as quatro opções abaixo, qual é a melhor CLASSIFICAÇÃO do veículo descrito? A Quality Express é uma empresa de transporte que entrega pequenas encomendas. Em janeiro de 2023, importou várias vans usadas, 100% elétricas, com autonomia de 200 milhas segundo a classificação da Environmental Protection Agency (EPA). As vans atendem a todos os padrões de segurança exigidos de veículos de passageiros. Cada uma tem duas portas dianteiras de abrir com janelas, duas portas traseiras corrediças com janelas e uma porta traseira de abrir com janela. São totalmente carpetadas e levam até sete pessoas, com espaço de carga correspondente a 28% do volume interno total. Após a importação, os bancos traseiros podem ser removidos para ampliar o espaço de carga.", "De las cuatro opciones siguientes, ¿cuál es la mejor CLASIFICACIÓN del vehículo descrito? Quality Express es una empresa de transporte que entrega paquetes pequeños. En enero de 2023 importó varias vans usadas, 100% eléctricas, con autonomía de 200 millas según la clasificación de la Environmental Protection Agency (EPA). Las vans cumplen todas las normas de seguridad exigidas a los vehículos de pasajeros. Cada una tiene dos puertas delanteras abatibles con ventanas, dos puertas traseras corredizas con ventanas y una puerta trasera abatible con ventana. Están completamente alfombradas y llevan hasta siete personas, con un espacio de carga equivalente al 28% del volumen interior total. Tras la importación, los asientos traseros pueden retirarse para ampliar el espacio de carga."],

38:{q:["Dentre as quatro opções abaixo, qual é a melhor CLASSIFICAÇÃO e a alíquota correspondente a serem informadas no entry summary de uma entry em 1º de agosto de 2025 da seguinte mercadoria? Trata-se de uma réplica em miniatura (scale model) de uma picape Chevy 3100 de 1955, na cor vermelha. Conhecida como \"Christmas Truck\", a miniatura destina-se a pessoas de 15 anos ou mais. O modelo foi fundido sob pressão (die-cast) em partes, na Alemanha, em liga de zinco-alumínio. As partes foram polidas, pintadas e montadas por soldagem, formando as picapes completas, na China.", "De las cuatro opciones siguientes, ¿cuál es la mejor CLASIFICACIÓN y la tasa de duty correspondiente para informar en el entry summary de una entry del 1º de agosto de 2025 de la siguiente mercancía? Se trata de una réplica a escala (scale model) de una camioneta Chevy 3100 de 1955, en color rojo. Conocida como \"Christmas Truck\", está destinada a personas de 15 años en adelante. El modelo fue fundido a presión (die-cast) por partes, en Alemania, en aleación de zinc-aluminio. Las partes fueron pulidas, pintadas y ensambladas por soldadura, formando las camionetas completas, en China."],

39:{q:["Dentre as quatro opções abaixo, qual é a melhor CLASSIFICAÇÃO de um eletrodoméstico elétrico de bancada multifuncional, anunciado como \"toaster oven\" (forno-torradeira)? O aparelho pode assar, gratinar (broil), torrar, aquecer e fritar a ar (air-fry). Tem capacidade interna de 12 litros, suficiente para torrar quatro fatias de pão ou assar uma pizza de nove polegadas, e inclui grelha de forno e cesto de air fryer.", "De las cuatro opciones siguientes, ¿cuál es la mejor CLASIFICACIÓN de un electrodoméstico eléctrico de mesada multifunción, anunciado como \"toaster oven\" (horno tostador)? El aparato puede hornear, gratinar (broil), tostar, calentar y freír al aire (air-fry). Tiene una capacidad interior de 12 litros, suficiente para tostar cuatro rebanadas de pan u hornear una pizza de nueve pulgadas, e incluye una parrilla de horno y una canasta de air fryer."],

40:{q:["Qual das cláusulas a seguir é FALSA? Ao classificar mercadorias para importação nos Estados Unidos sob o Harmonized Tariff Schedule of the United States, e salvo linguagem ou contexto especial que exija o contrário, _____.", "¿Cuál de las siguientes cláusulas es FALSA? Al clasificar mercancías para importación a los Estados Unidos bajo el Harmonized Tariff Schedule of the United States, y salvo lenguaje o contexto especial que exija lo contrario, _____."],
A:["uma classificação tarifária controlada pelo use (que não seja o actual use) é determinada conforme o uso, nos Estados Unidos, na data da importação ou imediatamente antes dela, das mercadorias da classe ou espécie a que pertencem as importadas, sendo o uso determinante o principal use (uso principal).", "una clasificación arancelaria controlada por el use (distinto del actual use) se determina conforme al uso, en los Estados Unidos, en la fecha de importación o inmediatamente antes de ella, de las mercancías de la clase o especie a la que pertenecen las importadas, siendo el uso determinante el principal use (uso principal)."],
B:["uma classificação tarifária controlada pelo actual use (uso efetivo) dado às mercadorias nos Estados Unidos só é satisfeita se esse uso for pretendido no momento da importação, as mercadorias forem assim usadas e a prova disso for apresentada em até 3 anos da data em que foram entered.", "una clasificación arancelaria controlada por el actual use (uso efectivo) dado a las mercancías en los Estados Unidos solo se satisface si ese uso se pretende al momento de la importación, las mercancías se usan así y la prueba se presenta dentro de los 3 años desde la fecha en que fueron entered."],
C:["uma provisão para partes de um artigo abrange produtos usados única ou principalmente como parte desses artigos, mas a provisão para \"parts\" ou \"parts and accessories\" prevalece sobre uma provisão específica para tal parte ou acessório.", "una disposición para partes de un artículo abarca productos usados única o principalmente como parte de esos artículos, pero la disposición para \"parts\" o \"parts and accessories\" prevalece sobre una disposición específica para tal parte o accesorio."],
D:["os princípios da Seção XI relativos a misturas de dois ou mais materiais têxteis aplicam-se à classificação de mercadorias em qualquer provisão em que um material têxtil seja nomeado.", "los principios de la Sección XI relativos a mezclas de dos o más materiales textiles se aplican a la clasificación de mercancías en cualquier disposición en la que se nombre un material textil."]},
41:{q:["A importadora Sunny Solar Panels registrou entry de um embarque que chegou ao porto de Los Angeles/Long Beach em 1º de março de 2020. Apresentou o entry summary em 3 de março de 2020 e recolheu todos os duties, taxes e fees devidos. A mercadoria foi liberada da custódia do CBP em 3 de março de 2020. O CBP liquidou a entry em 22 de janeiro de 2021. Ao revisar a liquidação, a Sunny Solar Panels percebeu que, por erro material, pagou harbor maintenance fees a maior. Qual é o prazo para a Sunny Solar Panels apresentar um protest?", "La importadora Sunny Solar Panels registró la entry de un embarque que llegó al puerto de Los Ángeles/Long Beach el 1º de marzo de 2020. Presentó el entry summary el 3 de marzo de 2020 y pagó todos los duties, taxes y fees adeudados. La mercancía fue liberada de la custodia del CBP el 3 de marzo de 2020. El CBP liquidó la entry el 22 de enero de 2021. Al revisar la liquidación, Sunny Solar Panels advirtió que, por error material, pagó harbor maintenance fees de más. ¿Cuál es el plazo para que Sunny Solar Panels presente un protest?"],
A:["Em até 90 dias de 22 de janeiro de 2021", "Dentro de 90 días desde el 22 de enero de 2021"],
B:["Em até 180 dias de 22 de janeiro de 2021", "Dentro de 180 días desde el 22 de enero de 2021"],
C:["Em até 365 dias de 1º de março de 2020", "Dentro de 365 días desde el 1º de marzo de 2020"],
D:["Em até 180 dias de 3 de março de 2020", "Dentro de 180 días desde el 3 de marzo de 2020"]},
42:{q:["Um importador quer importar canivetes automáticos (switchblade knives). Ao procurar um broker para auxiliar na entry, o que o broker deve informar sobre a permissibilidade da importação de switchblades?", "Un importador quiere importar navajas automáticas (switchblade knives). Al contactar a un broker para hacer la entry, ¿qué debe informarle el broker sobre la permisibilidad de importar switchblades?"],
A:["A importação de um switchblade com lâmina de 2 polegadas é permitida quando transportado na posse de um amputado com apenas um braço.", "La importación de un switchblade con hoja de 2 pulgadas está permitida cuando lo lleva consigo un amputado con un solo brazo."],
B:["Todas as importações de switchblade knives são contrárias à lei e estão sujeitas a perdimento (forfeiture).", "Todas las importaciones de switchblade knives son contrarias a la ley y están sujetas a decomiso (forfeiture)."],
C:["Componentes de switchblade knife não se qualificam como switchblade knife.", "Los componentes de un switchblade knife no califican como switchblade knife."],
D:["A importação de switchblades com lâmina de 2,5 polegadas é permitida quando feita por um National Park Ranger.", "La importación de switchblades con hoja de 2,5 pulgadas está permitida cuando la realiza un National Park Ranger."]},
43:{q:["O que é VERDADEIRO quanto à mercadoria importada depois que a U.S. International Trade Commission (ITC) constata violação da section 337 do Tariff Act de 1930 (19 USC 1337) e emite uma exclusion order, implementada pelo CBP conforme o 19 CFR 12.39?", "¿Qué es VERDADERO respecto de la mercancía importada después de que la U.S. International Trade Commission (ITC) constata una violación de la section 337 del Tariff Act de 1930 (19 USC 1337) y emite una exclusion order, implementada por el CBP conforme al 19 CFR 12.39?"],
A:["A exclusion order só produz efeitos 60 dias após sua emissão; a partir daí, a mercadoria abrangida não pode mais ser entered.", "La exclusion order solo produce efectos 60 días después de su emisión; a partir de entonces, la mercancía abarcada ya no puede ser entered."],
B:["A mercadoria abrangida não pode ser entered em nenhuma circunstância depois de emitida a exclusion order.", "La mercancía abarcada no puede ser entered bajo ninguna circunstancia después de emitida la exclusion order."],
C:["A mercadoria abrangida pode ser entered sob basic importation and entry bond, em valor fixado pelo CBP.", "La mercancía abarcada puede ser entered bajo un basic importation and entry bond, por un monto fijado por el CBP."],
D:["A mercadoria abrangida pode ser entered sob bond até que a decisão sobre a violação se torne definitiva.", "La mercancía abarcada puede ser entered bajo bond hasta que la determinación de la violación sea definitiva."]},
44:{q:["O que o port director deve fazer se o entry summary de um embarque de mercadoria comercial de valor superior a $2,500, garantido por single entry bond, NÃO for apresentado tempestivamente?", "¿Qué debe hacer el port director si el entry summary de un embarque de mercancía comercial de valor superior a $2,500, garantizado por un single entry bond, NO se presenta oportunamente?"],
A:["Emitir advertência e conceder prazo adicional para a apresentação.", "Emitir una advertencia y conceder plazo adicional para la presentación."],
B:["Apreender a mercadoria até que o entry summary seja apresentado.", "Incautar la mercancía hasta que se presente el entry summary."],
C:["Exigir liquidated damages no valor do bond.", "Exigir liquidated damages por el monto del bond."],
D:["Limitar a capacidade do importador de registrar entries futuras.", "Limitar la capacidad del importador de registrar entries futuras."]},
45:{q:["Uma surety pode encerrar seu compromisso de assumir obrigações futuras sob um bond, com ou sem o consentimento do principal, mediante aviso razoável de encerramento pelos meios previstos no 19 CFR, Part 113. Na ausência de prova ao CBP de que prazo menor é razoável diante dos fatos e circunstâncias, quantos dias constituem aviso razoável de terminação do bond, da surety que encerra para o principal e para o CBP?", "Una surety puede terminar su compromiso de asumir obligaciones futuras bajo un bond, con o sin el consentimiento del principal, mediante aviso razonable de terminación por los medios previstos en el 19 CFR, Part 113. A falta de prueba ante el CBP de que un plazo menor es razonable según los hechos y circunstancias, ¿cuántos días constituyen aviso razonable de terminación del bond, de la surety que termina hacia el principal y el CBP?"],

D:["30 dias", "30 días"]},
46:{q:["Qual das afirmações a seguir é VERDADEIRA quanto a alterações em um bond?", "¿Cuál de las siguientes afirmaciones es VERDADERA respecto de los cambios en un bond?"],
A:["Uma alteração menor, que não afete a substância do bond, pode ser feita antes da assinatura, sem documentação adicional.", "Una alteración menor, que no afecte la sustancia del bond, puede hacerse antes de la firma, sin documentación adicional."],
B:["Um novo bond deve ser firmado quando houver rasura ou alteração após a assinatura, mas antes da aprovação do bond pelo CBP.", "Debe firmarse un nuevo bond cuando haya borradura o alteración después de la firma, pero antes de la aprobación del bond por el CBP."],
C:["O consentimento de todas as partes deve constar por escrito no bond se houver modificação ou entrelinha após a assinatura, mas antes da aprovação pelo CBP.", "El consentimiento de todas las partes debe constar por escrito en el bond si hay modificación o interlineado después de la firma, pero antes de la aprobación por el CBP."],
D:["É exigido um novo bond, que substituirá o existente, quando a alteração for feita após a aprovação do bond pelo CBP.", "Se exige un nuevo bond, que sustituirá al existente, cuando el cambio se hace después de la aprobación del bond por el CBP."]},
47:{q:["Pode ser concedido domestic status a qualquer das mercadorias a seguir em uma Foreign Trade Zone, EXCETO:", "Puede concederse domestic status a cualquiera de las siguientes mercancías en una Foreign Trade Zone, EXCEPTO:"],
A:["Mercadoria que seja cultivo, produto ou manufatura dos Estados Unidos, sobre a qual todos os internal-revenue taxes aplicáveis já foram pagos.", "Mercancía que sea cultivo, producto o manufactura de los Estados Unidos, sobre la cual ya se pagaron todos los internal-revenue taxes aplicables."],
B:["Mercadoria anteriormente importada da Bélgica e sobre a qual duty e tax já foram pagos.", "Mercancía previamente importada de Bélgica y sobre la cual ya se pagaron duty y tax."],

48:{q:["Qual ÚNICA das afirmações a seguir sobre a admissibilidade de mercadoria em uma Foreign Trade Zone (FTZ) é VERDADEIRA?", "¿Cuál ÚNICA de las siguientes afirmaciones sobre la admisibilidad de mercancía en una Foreign Trade Zone (FTZ) es VERDADERA?"],
A:["Mercadoria proibida (prohibited) só pode ser admitida em FTZ temporariamente. Mercadoria condicionalmente admissível pode ser admitida em FTZ se permitido pelos regulamentos da agência federal competente.", "La mercancía prohibida (prohibited) solo puede admitirse en una FTZ temporalmente. La mercancía condicionalmente admisible puede admitirse en una FTZ si lo permiten los reglamentos de la agencia federal competente."],
B:["Mercadoria proibida não pode ser admitida em FTZ. Mercadoria condicionalmente admissível pode ser admitida em FTZ se permitido pelos regulamentos da agência federal competente.", "La mercancía prohibida no puede admitirse en una FTZ. La mercancía condicionalmente admisible puede admitirse en una FTZ si lo permiten los reglamentos de la agencia federal competente."],
C:["Mercadoria proibida só pode ser admitida em FTZ mediante certificação de que não entrará no comércio dos Estados Unidos. Mercadoria condicionalmente admissível pode ser admitida temporariamente, na pendência de determinação final de seu status.", "La mercancía prohibida solo puede admitirse en una FTZ presentando una certificación de que no entrará al comercio de los Estados Unidos. La mercancía condicionalmente admisible puede admitirse temporalmente, a la espera de una determinación final de su estatus."],
D:["Mercadoria nunca pode ser admitida em FTZ temporariamente enquanto se aguarda determinação de admissibilidade; se for considerada proibida, deve ser descartada. Mercadoria condicionalmente admissível pode ser admitida em FTZ se permitido pelos regulamentos da agência federal competente.", "La mercancía nunca puede admitirse en una FTZ temporalmente a la espera de una determinación de admisibilidad; si se determina que está prohibida, debe desecharse. La mercancía condicionalmente admisible puede admitirse en una FTZ si lo permiten los reglamentos de la agencia federal competente."]},
49:{q:["A Hagen Industries Limited (\"Hagen\") importou dois contêineres de quebra-cabeças de 1.000 peças vindos da Polônia e consta como consignee no bill of lading do embarque. Os quebra-cabeças foram transportados por via marítima até o Porto de Los Angeles-Long Beach. Vinte (20) dias corridos após a chegada e a descarga no porto, nenhuma entry havia sido registrada para os quebra-cabeças. O port director assumiu regularmente a custódia dos dois contêineres e os depositou em general order warehouse às custas da Hagen. Por quanto tempo, contado da data da importação, os quebra-cabeças podem permanecer no armazém antes de ficarem sujeitos a venda?", "Hagen Industries Limited (\"Hagen\") importó dos contenedores de rompecabezas de 1.000 piezas desde Polonia y figura como consignee en el bill of lading del embarque. Los rompecabezas fueron transportados por vía marítima al Puerto de Los Ángeles-Long Beach. Veinte (20) días calendario después de la llegada y descarga en el puerto, no se había registrado ninguna entry para los rompecabezas. El port director tomó debidamente custodia de ambos contenedores y los depositó en un general order warehouse a costa de Hagen. ¿Por cuánto tiempo, contado desde la fecha de importación, pueden permanecer los rompecabezas en el almacén antes de quedar sujetos a venta?"],

B:["6 meses", "6 meses"],
C:["12 meses", "12 meses"],
D:["18 meses", "18 meses"]},
50:{q:["Qual regulamento lista algumas das leis que o CBP faz cumprir em nome de diversas outras agências federais?", "¿Qué reglamento enumera algunas de las leyes que el CBP hace cumplir en nombre de otras agencias federales?"],

51:{q:["Quais veículos automotores podem ser importados por qualquer pessoa e NÃO precisam comprovar conformidade com os requisitos de emissões para serem admissíveis?", "¿Qué vehículos automotores puede importar cualquier persona y NO necesitan demostrar cumplimiento de los requisitos de emisiones para ser admisibles?"],
A:["Caminhões leves (light-duty trucks) e veículos leves movidos a gasolina fabricados antes de 1º de janeiro de 1968.", "Camiones ligeros (light-duty trucks) y vehículos ligeros a gasolina fabricados antes del 1º de enero de 1968."],
B:["Veículos leves a diesel fabricados entre 1º de janeiro de 1975 e 31 de dezembro de 1984.", "Vehículos ligeros a diésel fabricados entre el 1º de enero de 1975 y el 31 de diciembre de 1984."],
C:["Veículos automotores não isentos por outra via dos requisitos de emissões da EPA e com menos de 20 anos.", "Vehículos automotores no exentos por otra vía de los requisitos de emisiones de la EPA y con menos de 20 años."],
D:["Motocicletas rodoviárias fabricadas entre 1º de janeiro de 1978 e 31 de dezembro de 1984.", "Motocicletas de carretera fabricadas entre el 1º de enero de 1978 y el 31 de diciembre de 1984."]},
52:{q:["A ABC Importer está importando papel vegetal (tracing paper) da Alemanha, classificável na subheading 4806.30 do HTSUS. O papel vem em rolos de 20 cm de largura e 100 jardas de comprimento. Qual das informações adicionais a seguir NÃO precisa constar, para fins de entry, na fatura ou em documento que a acompanhe?", "ABC Importer está importando papel de calcar (tracing paper) de Alemania, clasificable en la subheading 4806.30 del HTSUS. El papel viene en rollos de 20 cm de ancho y 100 yardas de largo. ¿Cuál de las siguientes informaciones adicionales NO se exige, a efectos de la entry, en la factura o en un documento que la acompañe?"],

D:["Largura do papel em cm", "Ancho del papel en cm"]},
53:{q:["Uma entry for warehouse foi registrada em 2025. A liquidação nunca foi suspensa nem prorrogada. Quando a warehouse entry é considerada liquidada by operation of law (por força de lei), pela alíquota, valor, quantidade e montante de duties declarados pelo importer of record?", "Se registró una entry for warehouse en 2025. La liquidación nunca fue suspendida ni prorrogada. ¿Cuándo se considera la warehouse entry liquidada by operation of law (por ministerio de la ley), según la tasa, valor, cantidad y monto de duties declarados por el importer of record?"],
