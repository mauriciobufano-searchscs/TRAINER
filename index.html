<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ExamNav">
<meta name="robots" content="noindex, nofollow">
<title>Exam Navigator — Official Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2A47;      /* CBP dark blue */
  --navy2:#16406B;
  --paper:#F2F4F6;
  --card:#FFFFFF;
  --ink:#1C2733;
  --muted:#5B6B7B;
  --line:#D7DEE5;
  --stamp:#B3382C;     /* customs stamp red */
  --ok:#1E7A46;
  --gold:#B98A2E;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
header{background:var(--navy);color:#fff;padding:18px 20px;border-bottom:4px solid var(--gold)}
.hwrap{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
.brand p{font-size:12px;opacity:.75;font-family:'Spline Sans Mono',monospace}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.8px;text-transform:uppercase}
nav button.active{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
main{max-width:960px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin:4px 0 10px}
h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
p.lead{color:var(--muted);font-size:14.5px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;background:var(--card);transition:.15s}
.tile:hover{border-color:var(--navy);transform:translateY(-1px)}
.tile .big{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--navy);text-transform:uppercase}
.tile small{color:var(--muted);display:block;margin-top:4px;line-height:1.4}
.badge{display:inline-block;border:1.5px solid var(--navy);color:var(--navy);font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-bottom:10px}
.qtext{font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.langs{display:flex;gap:4px;margin-right:8px}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:'Spline Sans Mono',monospace;font-size:11.5px}
.langs button.active{background:var(--gold);border-color:var(--gold);color:#1C2733;font-weight:600}
.flashtr{font-size:14px;color:var(--muted);font-style:italic;margin:-4px 0 6px;line-height:1.4}
.trblock{background:#F7F9FB;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:10px}
.trlist li{color:#4a5866;font-size:13.5px}
.spk{background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:15px;padding:3px 8px;vertical-align:middle;margin-left:6px}
.spk:hover{background:#EEF3F9;border-color:var(--navy2)}
.ansreveal{background:#F1F8F3;border-left:4px solid var(--ok);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:14px;line-height:1.5}
.guideline{font-size:13.5px;line-height:1.55;margin:7px 0;color:#3a4652}
.tile.soon{opacity:.75;border-style:dashed;cursor:default;position:relative}
.tile.soon:hover{transform:none;box-shadow:none}
.soonbadge{position:absolute;top:10px;right:10px;background:var(--gold);color:#1C2733;font-family:'Spline Sans Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.8px;padding:3px 8px;border-radius:999px}
.readrow{display:flex;gap:14px;align-items:center;padding:14px 16px}
.readrow.nowplaying{border-color:var(--gold);box-shadow:0 0 0 2px rgba(185,138,46,.25)}
.playbig{min-width:52px;height:52px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:19px;cursor:pointer;flex-shrink:0}
.playbig:hover{background:var(--navy2)}
.readtexts{flex:1;min-width:0}
.readen{font-size:16.5px;font-weight:600;cursor:pointer;line-height:1.4;padding:2px 0}
.readtr{font-size:13.5px;color:var(--muted);cursor:pointer;line-height:1.45;padding:1px 0}
.readen:hover,.readtr:hover{color:var(--navy2)}
.flashcard{cursor:pointer;min-height:180px}
.flashq{font-size:19px;font-weight:600;line-height:1.45;margin:14px 0}
.taphint{color:var(--muted);font-size:13.5px;text-align:center;margin-top:18px}
.flashdivider{border-top:2px dashed var(--line);margin:14px 0}
.civanslabel{font-family:'Spline Sans Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.civans{margin:0 0 4px 18px;padding:0}
.civans li{margin:4px 0;line-height:1.5;font-size:14.5px}
.dynwarn{background:#FDF3E7;border:1px solid #E8C89A;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#7A5A1E;margin-top:10px}
.gradebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.gradebtns button{border:none;border-radius:10px;padding:12px 6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.5px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.gradebtns small{font-size:10.5px;opacity:.85;font-family:'Spline Sans Mono',monospace}
.g0{background:#B3382C}.g1{background:#C07A1F}.g2{background:#1E7A46}.g3{background:#16406B}
.readywrap{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}
.readybar{flex:1;height:12px;background:#E4E9EE;border-radius:999px;overflow:hidden}
.readyfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:999px;transition:width .4s}
.civmini .qtext{margin:8px 0 6px}
.hlvl{font-family:'Spline Sans Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy2);margin-bottom:4px}
.hsep{border-top:1px dashed #C9D8EA;margin:10px 0}
.hintbox{background:#F4F7FB;border:1px solid #C9D8EA;border-left:4px solid var(--navy2);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin:10px 0;color:#2c3e50}
.scnlabel{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.6px;color:#8a6d2f;margin-bottom:8px}
.opttr{display:block;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px}
.scenario{background:#FBFAF6;border:1px dashed var(--gold);border-radius:8px;padding:14px;font-size:13.5px;line-height:1.55;margin:12px 0;white-space:pre-wrap;color:#4b4436}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font-size:14.5px;line-height:1.5;width:100%}
.opt:hover{border-color:var(--navy)}
.opt .letter{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--navy);min-width:20px}
.opt.correct{border-color:var(--ok);background:#EFF8F2}
.opt.wrong{border-color:var(--stamp);background:#FBF0EE}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.stamp{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border:3px double currentColor;border-radius:6px;transform:rotate(-4deg);margin:14px 0 4px}
.stamp.ok{color:var(--ok)}
.stamp.no{color:var(--stamp)}
.cite{font-family:'Spline Sans Mono',monospace;font-size:12.5px;background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px;display:inline-block;margin-top:8px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.primary{background:var(--navy);color:#fff;border:none;padding:11px 20px;border-radius:7px;cursor:pointer;font-weight:700;font-size:14px}
button.primary:hover{background:var(--navy2)}
button.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);padding:10px 18px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
button.danger{background:var(--stamp);color:#fff;border:none;padding:11px 20px;border-radius:7px;cursor:pointer;font-weight:700;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
select{padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;font-family:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.progress{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--muted)}
.timer{font-family:'Spline Sans Mono',monospace;font-size:20px;font-weight:600;color:var(--navy);background:#fff;border:2px solid var(--navy);padding:6px 14px;border-radius:8px}
.timer.low{color:var(--stamp);border-color:var(--stamp)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.sheet button{padding:8px 0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-family:'Spline Sans Mono',monospace;font-size:12px}
.sheet button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.sheet button.cur{outline:2px solid var(--gold)}
.tutor{background:#F6F8FB;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:14px}
.tutor h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--navy);font-size:16px;letter-spacing:1px;margin-bottom:8px}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user{background:var(--navy);color:#fff;margin-left:30px}
.msg.ai{background:#fff;border:1px solid var(--line);margin-right:10px}
.tutorrow{display:flex;gap:8px;margin-top:8px}
.tutorrow input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit}
table.stats{width:100%;border-collapse:collapse;margin-top:10px}
table.stats th,table.stats td{border:1px solid var(--line);padding:9px 12px;font-size:13.5px;text-align:left}
table.stats th{background:var(--navy);color:#fff;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.pct{font-family:'Spline Sans Mono',monospace;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.result-big{font-family:'Barlow Condensed',sans-serif;font-size:52px;color:var(--navy)}
.pass{color:var(--ok)}.fail{color:var(--stamp)}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.tile{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <h1>EXAM NAVIGATOR</h1>
      <p>Official Exam Prep · CBLE · US Civics · PT/EN/ES</p>
    </div>
    <div class="langs" id="langs"></div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<script>
const QUESTIONS = [
{n:1,cat:"I",q:"A broker fails to file the triennial status report by March 1 of the reporting year which results in the suspension of their license by operation of law. In addition to filing the triennial status report, what must the broker do to reinstate their license?",opts:{A:"Pay a fine of $500 within 90 calendar days from the date the original report was due.",B:"File a protest with CBP within 180 days showing just cause as to why their license should be reinstated.",C:"File an appeal with CBP within three months of the date of the notice of suspension.",D:"Pay the required fee within 60 calendar days of the date of the notice of suspension."},ans:["D"],cite:"19 CFR 111.30(d)(4)"},
{n:2,cat:"I",q:"Which ONE of the following activities may qualify for one credit of continuing broker education?",opts:{A:"Viewing a one-hour recording of a CBP webinar offered to prepare registered CBLE examinees for exam-day procedures.",B:"Attending a one-hour discussion session on the potential use of artificial intelligence in tariff classification, offered during an in-person trade workshop near the Port of Baltimore and attended by several CBP employees. The organizers intend to seek approval for continuing broker education credit only after the session concludes.",C:"Giving a one-hour lecture on duty refund opportunities for educational institutions at a convention for educators and university procurement officers. The lecture and the convention have been approved for continuing broker education credit by a CBP-selected accreditor, prior to being held.",D:"One hour spent preparing subject matter for a self-guided, five-month long online course on valuation that commenced at the start of the year. The course culminates in a retention test and has been approved for continuing broker education credit by a CBP-selected accreditor."},ans:["C"],cite:"19 CFR 111.103(a)-(b); 19 CFR 101.1"},
{n:3,cat:"I",q:"Smith Logistics LLC (\"Smith Logistics\") is a freight forwarder and licensed customs broker. Smith Logistics has executed a valid power of attorney to authorize its unlicensed employee, Erin Johnson, to sign documents pertaining to customs business on its behalf. Which ONE of the following statements is TRUE for this scenario?",opts:{A:"Smith Logistics must provide proof of the existence of the power of attorney to CBP upon CBP's request.",B:"Smith Logistics must file a statement with the processing Center identifying Erin Johnson as a party authorized to sign documents pertaining to customs business on its behalf.",C:"Smith Logistics must file a copy of the power of attorney with CBP before Erin Johnson may begin signing documents pertaining to customs business on its behalf.",D:"Smith Logistics must provide CBP with proof that Erin Johnson is at least 21 years old and is a citizen of the United States before she may begin signing documents pertaining to customs business on its behalf."},ans:["A"],cite:"19 CFR 111.2(a)(2)(ii)(A)(1)-(2)"},
{n:4,cat:"I",q:"Torres & Sons, a partnership, executed a power of attorney (POA) with Kent Customs Brokers (KCB) on May 1, 2024. Torres and Sons ended its business relationship with KCB on April 20, 2026, and wishes to also end KCB's POA. Any of the following measures would terminate the POA between Torres and Sons and KCB EXCEPT:",opts:{A:"Providing a written notice of the POA's revocation to CBP electronically and receiving confirmation of the notice's receipt.",B:"Waiting until the POA expires on May 1, 2026.",C:"Executing a new POA with a different customs broker.",D:"Forming a new firm by adding an additional member to the partnership."},ans:["C"],cite:"19 CFR 141.39; 19 CFR 141.34; 19 CFR 141.35"},
{n:5,cat:"I",q:"Which ONE of the four choices below correctly identifies how long a customs broker must retain the specified type of record?",opts:{A:"An entry summary document, or CBP Form 7501, must be retained for three years after the date of entry.",B:"Records concerning the filing of a drawback claim must be retained for three years after liquidation of the claim or for a longer period if required by law.",C:"Records relating to the withdrawal of merchandise from a bonded warehouse must be retained for five years after the date of entry into the bonded warehouse.",D:"A document or letter by which an importer revokes a previously granted power of attorney to a customs broker must be retained for five years after the execution date of the subject power of attorney."},ans:["B"],cite:"19 CFR 163.4(a)-(b); 19 CFR 111.23(a)-(b); 19 CFR 190.15"},
{n:6,cat:"I",q:"Which ONE of the following four scenarios best demonstrates proper compliance with a record examination request? Assume that duly accredited representatives of the U.S. Department of Homeland Security (DHS) made each of the requests below.",opts:{A:"A customs broker receives a request to inspect records relating to a client that the broker stopped working with over five years ago. The broker has maintained the requested records but informs DHS that they will not make the records available for inspection because the period of retention has ended.",B:"A customs broker receives a request to inspect records relating to a particular entry of merchandise from an entry made two years ago. The broker mails the original paper version of the requested records to DHS, postmarked 60 calendar days after the request was made.",C:"A customs broker receives reasonable notice of a site visit including a request to inspect records pertaining to a client. During the site visit, the broker informs DHS that the records are kept off-site and will not be available for inspection during the visit, stating they will send the records electronically within 30 calendar days of the visit.",D:"A customs broker receives a request to inspect a customs broker's records relating to an unused merchandise drawback claim. The request specifies that the broker has up to 120 calendar days to provide the requested records. On the 45th calendar day from the request, the broker sends the original electronic version of the requested records to DHS."},ans:["D"],cite:"19 CFR 111.23(a)-(b); 19 CFR 111.25(a)-(b); 19 CFR 163"},
{n:7,cat:"I",q:"No later than _____ calendar days after initiating an investigation under 19 CFR 165.15, CBP will take interim measures if there is _____ that the importer entered covered merchandise into the customs territory of the United States through evasion.",opts:{A:"15; substantial evidence",B:"15; reasonable suspicion",C:"90; substantial evidence",D:"90; reasonable suspicion"},ans:["D"],cite:"19 CFR 165.24(a)"},
{n:8,cat:"I",q:"What is the maximum civil fine CBP may impose after the seizure of merchandise imported for sale when the merchandise is seized pursuant to 19 USC 1526(e) for bearing a counterfeit mark, has a domestic value of $1,000, and would have a manufacturer's suggested retail price (MSRP) of $25,000 in the United States at the time of seizure if it had been genuine?",opts:{A:"$1,000 if this seizure is the importer's first seizure under 19 USC 1526(e)",B:"$1,000 if this seizure is the importer's second seizure under 19 USC 1526(e)",C:"$25,000 if this seizure is the importer's first seizure under 19 USC 1526(e)",D:"$25,000 if this seizure is the importer's second seizure under 19 USC 1526(e)"},ans:["C"],cite:"19 CFR 133.27; 19 CFR 133.21"},
{n:9,cat:"I",q:"An individually licensed customs broker voluntarily suspends her license on September 1, 2024, and reinstates her license on November 15, 2028. How many continuing education credits must she complete during the 2027-2030 triennial reporting period?",opts:{A:"13",B:"14",C:"27",D:"36"},ans:["B"],cite:"19 CFR 111.1; 19 CFR 111.102(a)-(b)"},
{n:10,cat:"I",q:"A customs broker discovers that a client has omitted information from an affidavit. The broker believes the client omitted the information by mistake and advises the client promptly of the omission and the proper corrective actions required. What else must the broker do?",opts:{A:"Provide the client with the monetary penalty associated with making the omission.",B:"Tell the client the broker can no longer conduct customs transactions on the client's behalf.",C:"Retain a record of their communication with the client.",D:"Suspend their customs broker's license until the client resolves their omission on the affidavit."},ans:["C"],cite:"19 CFR 111.39(c)"},
{n:11,cat:"I",q:"Of the four choices below, which business relationship may Tracy, a licensed customs broker and sole proprietor of her brokerage, maintain without violating CBP regulations?",opts:{A:"Tracy transacts customs business on behalf of her client, X-Logistics, a bona fide importer. At the time when she entered into the broker-client relationship, Tracy knew that X-Logistics was a notoriously disreputable importer.",B:"Tracy has an agreement with Faith, another sole proprietor who had her customs broker license suspended with prejudice. For the duration of Faith's license suspension, Faith refers her clients to Tracy, and Tracy gives Faith a small percentage of the fees collected from the clients Faith referred to her.",C:"Tracy befriends an attorney, Margaret, who works for the Office of Regulations and Rulings at DHS and authors classification rulings for the type of widgets that Tracy's clients import. Tracy treats Margaret to a nice dinner in exchange for the opportunity to talk about the classification rulings pending Margaret's review.",D:"Tracy hires Paul to help with recordkeeping at her brokerage. Six months after Paul's start date, Tracy discovers that Paul is a convicted felon. Tracy takes no further action and continues to employ Paul."},ans:["A"],cite:"19 CFR 111.42; 19 CFR 111.53; 19 CFR 111.34"},
{n:12,cat:"I",q:"Which of the following statements regarding national permits is FALSE?",opts:{A:"A national permit is required for the purpose of transacting customs business throughout the customs territory of the United States.",B:"Individuals who obtain a passing grade on the Customs Broker License Examination may submit applications for a customs broker license and a national permit at the same time.",C:"Applicants who receive notification from the appropriate Executive Director, Office of Trade, CBP Headquarters that their national permit application has been denied may appeal the decision to the Court of International Trade directly, provided that the appeal action is commenced within 60 calendar days after the original denial date by the Executive Director.",D:"The individual broker who qualifies their business entity for a national permit is required to exercise responsible supervision and control over the activities conducted under that national permit."},ans:["C"],cite:"19 CFR 111.19"},
{n:13,cat:"I",q:"When must customs brokers notify CBP of a change in address for their office of record?",opts:{A:"Within 10 calendar days of the change",B:"Within 10 business days of the change",C:"Within 30 calendar days of the change",D:"Within 30 business days of the change"},ans:["A"],cite:"19 CFR 111.30(a)"},
{n:14,cat:"I",q:"As a licensed customs broker and sole proprietor, Janet Martin must submit a list of the names of her current employees to the processing Center. She has two employees: Spencer McGill (reported within 30 days of hiring in 2021; nothing changed since) and Logan Sharpe (new employee, not yet reported). Which ONE of the following lists should Ms. Martin timely provide to the processing Center to best comply with CBP regulations?",opts:{A:"ONLY the new employee Logan Sharpe, with: Name; SSN 098-76-5432; Date of Birth October 29, 1979; Place of Birth Bentonville, AR; Date of Hire April 8, 2026; Current Home Address 123 Evening Blvd., St. Louis, MO.",B:"Logan Sharpe only, with: Name; SSN; Date of Birth listed only as \"1979\"; Place of Birth; Date of Hire; Current MAILING Address (PO Box 789, St. Louis, MO).",C:"BOTH employees, each with: Name; SSN; Date of Birth (no place of birth); Date of Hire; Current Home Address.",D:"BOTH employees, each with: Name; SSN; Date AND Place of Birth; Date of Hire; Current MAILING Address (including a PO Box for one employee)."},ans:["A"],cite:"19 CFR 111.28(b)"},
{n:15,cat:"I",q:"Which of the following documents must be filed with CBP in circumstances where a licensed customs broker's employee is authorized to transact customs business on behalf of the broker?",opts:{A:"Statement identifying an employee as authorized to transact customs business on a licensed broker's behalf",B:"Power of attorney authorizing an employee to sign documents pertaining to customs business on a licensed broker's behalf",C:"Evidence of employment by the brokerage, attached to each document signed by the employee",D:"Power of attorney executed with the client, attached to each document signed by the employee"},ans:["A"],cite:"19 CFR 111.2(a)(2)(ii)(A)(1)-(2)"},
{n:16,cat:"I",q:"In the event of a cyberbreach of electronic records relating to customs business, when must the customs broker report the breach to CBP following the discovery of the breach?",opts:{A:"Within 72 hours",B:"Within 10 calendar days",C:"Within 10 business days",D:"Within 30 calendar days"},ans:["A"],cite:"19 CFR 111.21(b)"},
{n:17,cat:"I",q:"Jane Smith is a licensed customs broker and a qualifying officer of ABC Broker, Inc. corporation. If ABC Broker, Inc. terminates Jane Smith's employment, which of the following best describes how Jane Smith must report her termination to CBP?",opts:{A:"Jane Smith has no obligation to report the termination of her employment. Her former employer, ABC Broker Inc., is responsible for reporting the termination to CBP.",B:"Jane Smith has up to 30 calendar days to provide written notice to the Executive Assistant Commissioner and the Court of International Trade.",C:"Jane Smith has up to 30 business days to provide written notice to the processing Center.",D:"Jane Smith must immediately provide written notice to the appropriate Executive Director, Office of Trade, and must send a copy of the written notice to the processing Center."},ans:["D"],cite:"19 CFR 111.28(d)"},
{n:18,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q18-20) — Um embarque de produtos de beleza fabricados em Quebec, Canadá, sai do armazém do fabricante em 12/02/2026, por caminhão (não conteinerizado), e entra nos EUA pelo Porto de Buffalo, NY, no mesmo dia. Entrada para consumo.\n\nCBP Form 7501 (trecho):\n1. Filer/Entry No: ABC-1234567-1 | 2. Entry Type: 01 | 3. Summary Date: 02/12/2026 | 4. Surety: 998 | 5. Bond Type: 8 | 6. Port Code: 0900 | 7. Entry Date: 02/12/2026\n9. Mode of Transport: 30 | 10. Country of Origin: XQ | 11. Import Date: 02/12/2026\nLinha 001: 3304.99.5000 BEAUTY OR MAKEUP PREPS, OTHER — 9870 kg gross / 6 PLTS / 9540 KG — Valor 114.432 — FREE — 0.00\nLinha 002: 3307.30.5000 BATH PREPARATIONS, OTHER — 5064 / 6 PLTS / 4764 KG — Valor 33.348 — FREE — 0.00\n(Documentos podem conter erros — identifique-os.)",q:"Which ONE of the following blocks of the CBP Form 7501 (Entry Summary) provided contains incorrect information?",opts:{A:"Block 6",B:"Block 8",C:"Block 9",D:"Block 10"},ans:["A"],cite:"ACE Entry Summary Instructions; Schedule D of Annex C, HTSUS"},
{n:19,cat:"II",scenario:"Mesmo cenário das Q18-20 (7501 de produtos de beleza, entry date 12/02/2026).\nCalendário 2026: feriados federais destacados — 01/01 (qui), 19/01 (seg) e 16/02 (seg, Presidents Day).",q:"If the provided entry summary is to serve as both the entry documentation and entry summary, by what date must the filer indicate to CBP that the estimated duty owed will be paid by statement processing?",opts:{A:"February 12, 2026",B:"February 22, 2026",C:"February 27, 2026",D:"March 20, 2026"},ans:["A"],cite:"19 CFR 141.101; 19 CFR 24.25(c)(1)-(3)"},
{n:20,cat:"II",scenario:"Mesmo cenário das Q18-20. As opções descrevem como os Blocos 27-34 deveriam ser preenchidos para as linhas 1 e 2, caso o USMCA NÃO se aplicasse.",q:"In the above entry summary, if USMCA did not apply for either line number, which ONE of the choices below best represents how Blocks 27-34 should be entered for line numbers 1 and 2?",opts:{A:"Linha 001: FREE / 0.00. Linha 002: 4.9% / 1.634,05. (Sem Merchandise Processing Fee em nenhuma linha.)",B:"Linha 001: FREE + MPF 0.3464% / 396,39. Linha 002: FREE + MPF 0.3464% / 115,52. (Ambas as linhas FREE de duty, apenas MPF.)",C:"Linha 001: FREE / 0.00 (sem MPF). Linha 002: 4.9% / 1.634,05 + MPF 0.3464% / 115,52. (MPF apenas na linha 2.)",D:"Linha 001: FREE + MPF 0.3464% / 396,39. Linha 002: 4.9% / 1.634,05 + MPF 0.3464% / 115,52. (Duty na linha 2 e MPF em ambas as linhas.)"},ans:["D"],cite:"ACE Entry Summary Instructions pgs. 13-14, 29; 19 CFR 24.23"},
{n:21,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q21-23) — Você prepara entry/entry summary no ABI para a Chill Bedspreads LTD. Fatura comercial da Handmade Indonesia (Jakarta): 1.000 colchas de veludo (tecido plano/woven) 100% poliéster, pintadas à mão com dragões no centro, acabadas nos 4 lados com edging de 2\" de veludo poliéster em cor contrastante costurado com pesponto duplo. US$ 25,70/unid., total US$ 25.700. Porto de embarque: Jakarta. Destino final: Chicago-Midway Airport. Carrier: American Airlines. País de origem: Indonésia. 20.000 kg. Anotação manuscrita na fatura: \"Velvet hand painted bedspread with edging ___HTSUS___/duty rate%\".",q:"You received a \"documents required\" notification after the entry summary was filed. In reviewing the invoice, you handwrite additional information, including adding to the description that the bedspread contains edging. Which ONE of the regulations listed below contains the requirement that prompted you to change the description as shown on the invoice provided?",opts:{A:"19 CFR 141.86(a)(3)",B:"19 CFR 141.86(h)(3)",C:"19 CFR 141.89(a)",D:"19 CFR 142.6(a)(4)"},ans:["C"],cite:"19 CFR 141.89(a)"},
{n:22,cat:"II",scenario:"Mesmo cenário das Q21-23 (fatura da Handmade Indonesia; destino final Chicago-Midway Airport).",q:"The entry documents will be filed at the port for the final destination provided on the invoice. What is the Customs Port code for this intended port?",opts:{A:"3901",B:"3910",C:"5501",D:"5582"},ans:["B"],cite:"Schedule D of Annex C, HTSUS"},
{n:23,cat:"II",scenario:"Mesmo cenário das Q21-23 (colchas de veludo 100% poliéster com edging).",q:"When determining the classification of the bedspread, you discover that there are two potential subheadings in two different chapters of the HTSUS. In addition to the information on the commercial invoice, the answer to which ONE of the following questions is necessary to obtain from your client to correctly classify the bedspread?",opts:{A:"Does the bedspread have outer layers with a filling between?",B:"Is polyester a man-made fiber?",C:"Is the dragon painted by hand or machine?",D:"How many millimeters is the edging?"},ans:["A"],cite:"Note 1(s) Section XI; Note 1 Ch. 63; Ch. 54 Note 1; 6304.19.15; 9404.40.10; 9404.40.90 HTSUS"},
{n:24,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q24-26) — Zurefire EV, divisão da Zurefire Motor Company, quer ser consignee em importações futuras e pede à Okay Customs Brokers (Okay CB) um importer of record number usando o EIN da matriz (86-1599999) como os 9 primeiros dígitos + sufixo de 2 dígitos. O CBP Form 5106 foi enviado por e-mail pela presidente da Zurefire Motor Company, Eloise Smelly, com a Seção 4 incompleta. Após verificar os dados com Ms. Smelly, a entry writer Candy Dunn (Okay CB) fará o input via ABI. O license qualifier da Okay CB, Justin Time, verificou que a Okay CB tem autoridade sob a POA com a Zurefire Motor Company.\nForm 5106: 1A Nome: Zurefire EV | 1B EIN: 86-1599999** | 1C DIV/AKA/DBA: em branco | 3F Related Business: [X] Current — Zurefire Motor Company — 86-159999900.",q:"Which ONE of the following two-digit suffixes to the IRS Employer Identification Number (EIN) can Zurefire EV request to use for its importer identification number to replace the \"**\" in Block 1B?",opts:{A:"ZE",B:"Z1",C:"EV",D:"I0"},ans:["C"],cite:"19 CFR 24.5(d)"},
{n:25,cat:"II",scenario:"Mesmo cenário das Q24-26 (Form 5106 da Zurefire EV, divisão da Zurefire Motor Company).",q:"If data is required in Blocks 1C and 1D, which of the following choices will correctly identify the data needed to complete those Blocks?",opts:{A:"Data is not required in Blocks 1C and 1D because there is no red asterisk next to the block number.",B:"Mark DIV in 1C and type Zurefire Motor Company in 1D.",C:"Mark DIV in 1C and type Zurefire EV in 1D.",D:"Mark DBA in 1C and type Zurefire Motor Company DBA Zurefire EV in 1D."},ans:["B"],cite:"CBP Form 5106 Instructions; ACE BRPD Section 23.10"},
{n:26,cat:"II",scenario:"Mesmo cenário das Q24-26 (5106 enviado pela presidente Eloise Smelly; input no ABI pela entry writer Candy Dunn; license qualifier Justin Time).",q:"Whose name should be transmitted as the certifier in ABI?",opts:{A:"Zurefire EV",B:"Eloise Smelly",C:"Candy Dunn",D:"Justin Time"},ans:["D"],cite:"ACE BRPD Section 23.4"},
{n:27,cat:"III",q:"Bake 4U, Inc. (B4U) imports bulk pastry dough subject to a tariff-rate quota (annual aggregate limit 3,500,000 kg; 2026 quota period Apr 1, 2026 - Mar 30, 2027). B4U sources the dough from the Netherlands and admits it into an FTZ in Texas in privileged foreign status. In its subzone, B4U bakes portioned pastries packaged for bulk sale, filing consumption entries to withdraw them. Today an emergency (refrigerator failure) forces B4U to bake all affected dough immediately; excess pastries will be sold at retail on-site to FTZ workers. The annual dough quota has not yet filled. Which of the following answer choices is a TRUE statement?",opts:{A:"The dough B4U imports is eligible to obtain quota status upon submission of CBP Form 214 in proper form, to achieve admission in privileged foreign status.",B:"Due to the emergency, B4U may elect nonprivileged foreign status for the affected dough, which is baked into pastries for retail sale within the FTZ.",C:"The pastries B4U withdraws from an FTZ for bulk sale are only eligible for the higher non-quota duty rate in effect on the date privileged foreign status was granted.",D:"The pastries B4U withdraws from an FTZ for bulk sale are eligible to obtain a lower in-quota duty rate upon presentation of an entry summary in proper form, and will be dutiable in accordance with their condition at withdrawal from the FTZ."},ans:["C"],cite:"19 CFR 132.11(a)-(b); 146.14; 146.41(e); 146.65(a)(1)"},
{n:28,cat:"III",q:"A&M Industries entered peanut butter from India as a type 01 consumption entry on May 1, 2024. Peanut butter from India is subject to a tariff rate quota with an in-quota rate of 0%. The 2024 quota period (Jan 1 - Dec 31, 2024) has closed but did not fill. On January 31, 2025, A&M wishes to amend the entry summary to change the entry to a type 02 quota entry. Can A&M Industries claim quota for the 2024 quota period?",opts:{A:"No, but A&M Industries can file a post summary correction amending the entry summary to change the entry to a type 02 quota entry and claim quota for the 2025 quota period.",B:"No, the 2024 quota period has closed.",C:"Yes, A&M Industries should request that CBP cancel the entry so that a replacement quota entry type may be submitted.",D:"Yes, A&M Industries should contact HQ Quota to arrange for quota reservation in the 2024 quota period."},ans:["B"],cite:"ACE BRPD Section 7.14"},
{n:29,cat:"III",q:"You are a licensed customs broker and have submitted Entry Summary data through ABI. After preliminary data validations, the system sends you an \"AX\" type message with a REJECT status. Which of the following could NOT have resulted in this rejection?",opts:{A:"The merchandise licenses, visas, or certificates are incorrect.",B:"The quota is full, expired, or closed.",C:"The entry type is for quota and there is at least one line listing quota goods and the quota is available.",D:"The quota is not yet opened."},ans:["C"],cite:"ACE BRPD Section 7.16"},
{n:30,cat:"III",q:"Which of the following is NOT a method for establishing tariff-rate and absolute quotas?",opts:{A:"Executive orders",B:"Presidential proclamations",C:"U.S. Trade Representative orders",D:"Legislative enactments"},ans:["C"],cite:"19 CFR 132.2(a)"},
{n:31,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION for dried pineapples that are reduced in size, suitable for immediate consumption, and imported in small packages rather than in bulk?",opts:{A:"0801.19.01",B:"0804.30.60",C:"0812.90.40",D:"0813.40.90"},ans:["B"],cite:"Heading 0804, HTSUS"},
{n:32,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of alloy steel coils? The cold-rolled steel is successively superimposed in coils and measures 1220 mm in width and 3.75 mm in thickness. The steel chemistry consists of 0.15% Carbon, 0.7% Titanium, and 25% Nickel. The coils have not been further worked than cold-rolled.",opts:{A:"7209.15.0000",B:"7219.32.0035",C:"7225.50.8010",D:"7226.99.0130"},ans:["C"],cite:"7225.50.8010 HTSUS; GRI 1; Ch. 72 Notes 1(f), 1(k), Add. U.S. Note 2, Stat. Note 1"},
{n:33,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a solenoid valve used to control the airflow within the suspension system of a motor vehicle?",opts:{A:"8479.89.9599",B:"8481.80.9005",C:"8481.20.0060",D:"8708.99.8180"},ans:["B"],cite:"8481.80.9005 HTSUS; GRIs 1 and 6"},
{n:34,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of a men's bow tie constructed of 100% cotton woven black fabric with gray polka dots?",opts:{A:"6117.80.2000",B:"6117.80.8710",C:"6215.10.0025",D:"6215.90.0015"},ans:["D"],cite:"6215.90.0015 HTSUS; Note 1 Ch. 61; Note 1 Ch. 62; Note 7(b) Section XI"},
{n:35,cat:"IV",q:"Which of the following is NOT a requirement with respect to additional articles or classes of articles designated Instruments of International Traffic?",opts:{A:"Generally, a container designated an Instrument of International Traffic must exit the United States within 365 days of the date on which it was admitted for it to be deemed to remain in international traffic.",B:"Normal accessories and equipment must be imported with a \"container\" that qualifies as an Instrument of International Traffic to, themselves, be included in \"instruments of international traffic.\"",C:"Entry or the payment of duty prior to release, subject to the provisions of the relevant CBP regulation.",D:"Filing of a bond on CBP Form 301, or its electronic equivalent in ACE eBond, containing the bond conditions set forth in 19 CFR 113.66, prior to release."},ans:["C"],cite:"19 CFR 10.41a"},
{n:36,cat:"IV",q:"Of the four choices below, what is the CLASSIFICATION of a miniature billiards table designed for children from 8 to 12 years of age? It is composed of rosewood with cherry wood veneers and resin. The playing surface is a green synthetic mat.",opts:{A:"9403.30.8005",B:"9403.60.8081",C:"9503.00.0071",D:"9504.20.6000"},ans:["D"],cite:"9504.20.6000 HTSUS; Note 1(l) to Chapter 94"},
{n:37,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of linoleum tiles? The tiles are composed of solidified linseed oil, pine resin, ground cork dust, sawdust, calcium carbonate, and have a felted synthetic fiber backing. The linoleum layer is 2 mm thick, the backing 4 mm thick, and the tiles are square, 24 cm per side.",opts:{A:"4504.10.3000",B:"5704.10.0090",C:"5904.10.0000",D:"6806.00.0000"},ans:["C"],cite:"5904.10.0000 HTSUS; GRI 1"},
{n:38,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of sound insulating panels? The panels are 2 cm thick, imported in 1 x 0.5 m sections, composed of wood shavings agglomerated with a cement binder, sanded but otherwise unfinished. They look like randomly oriented wood slivers pressed into a flat, rigid board. Intended use: acoustic sound absorption in construction (e.g., music studios).",opts:{A:"4411.14.1000",B:"4418.92.0000",C:"6806.90.0010",D:"6808.00.0000"},ans:["D"],cite:"6808.00.0000 HTSUS; GRI 1; Ch. 44 Note 1(ij)"},
{n:39,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION for a plastic brush with metal bristles used to groom a dog or cat that at time of importation is valued at $3.64?",opts:{A:"9603.29.8010",B:"9603.29.8090",C:"9603.90.8050",D:"9615.11.3000"},ans:["C"],cite:"9603.90.8050 HTSUS; GRI 1"},
{n:40,cat:"IV",q:"Of the four choices below, which is the best CLASSIFICATION of pure silver (99.99%) coins that are minted in South Africa, have legal tender status, and are valued at $25,000.00 USD?",opts:{A:"7106.91.1010",B:"7115.90.4000",C:"7118.10.0000",D:"7118.90.0055"},ans:["D"],cite:"7118.90.0055 HTSUS; GRI 1; GRI 3(a)"},
{n:41,cat:"V",q:"Which of the following statements is TRUE about the procedure after detention of shipments under the Toxic Substances Control Act (TSCA) of a covered commodity?",opts:{A:"The importer of the detained shipment must bring the shipment into compliance with TSCA or export the shipment from the customs territory of the United States within 90 days after notice of detention or 30 days of demand for redelivery, whichever comes first.",B:"The importer must submit written documentation to the Administrator with a copy to the port director within 90 days from the date of notice of detention, to show why the shipment should not be refused entry.",C:"The importer must bring the shipment into compliance with TSCA or export the shipment within 120 days after notice of detention or 60 days of demand for redelivery, whichever comes first.",D:"The importer must submit written documentation to the Administrator with a copy to the port director within 120 days from the date of notice of detention, to show why the shipment should not be refused entry."},ans:["A"],cite:"19 CFR 12.124(a)"},
{n:42,cat:"V",q:"Which Federal agencies will notify CBP that a covered import does not comply with an applicable energy labeling standard?",opts:{A:"Department of Energy (DOE) and Federal Trade Commission (FTC)",B:"U.S. Information Agency (USIA) and the U.S. Energy Information Administration (EIA)",C:"Environmental Protection Agency (EPA) and the Air Quality National Commission",D:"Department of Transportation (DOT) and the National Highway Traffic Safety Administration (NHTSA)"},ans:["A"],cite:"19 CFR 12.50(a)-(b)"},
{n:43,cat:"V",q:"When evaluating an application for Lever-rule protection against gray market articles in accordance with 19 CFR 133.2(e), which of the following is NOT a physical and material difference that CBP may consider between articles authorized for importation or sale in the United States and those not so authorized?",opts:{A:"Differences resulting from legal or regulatory requirements, certification, etc.",B:"Differences in the formulation, product construction, structure, or composite product components, of both the authorized and gray market product.",C:"The retail price of the product authorized for sale in the United States and the retail price of the unauthorized gray market product.",D:"Performance and/or operational characteristics of both the authorized and gray product."},ans:["C"],cite:"19 CFR 133.2(e)"},
{n:44,cat:"V",q:"Which of the following imported articles are subject to seizure pursuant to the Digital Millennium Copyright Act (17 USC 1201)? Assume all trademarks and copyrights referenced are recorded with CBP.",opts:{A:"Authentic DVDs for copyrighted movies that the importer manifested as blank CDs.",B:"A memory card primarily designed to circumvent the copyright protection measures on a videogame console and enable the user to copy copyrighted videogames for redistribution.",C:"A computer with a logo confusingly similar to a recorded trademark.",D:"An arcade machine with videogames substantially similar to recorded copyrights, where the copyright owner has stated that the use is unauthorized."},ans:["B"],cite:"19 CFR 133.47; 133.22; 133.42"},
{n:45,cat:"V",q:"A drawback claimant must furnish a properly executed drawback bond if approved for _____ privilege.",opts:{A:"Waiver of prior notice of intent to export",B:"Accelerated payment",C:"Exporters summary procedure",D:"One time waiver of prior notice for past exports"},ans:["B"],cite:"19 CFR 190.92(d)"},
{n:46,cat:"V",q:"What type of rejected merchandise is eligible for substitution drawback under 19 CFR 190.45?",opts:{A:"Merchandise that did not conform to sample or specifications.",B:"Merchandise that was shipped without the consent of the consignee.",C:"Merchandise that was determined to be defective as of the time of importation.",D:"Merchandise that was ultimately sold at retail and returned for any reason."},ans:["D"],cite:"19 CFR 190.45"},
{n:47,cat:"V",q:"If an Activity Code 1 - Basic Importation and Entry continuous bond will be transmitted to CBP pursuant to the ACE electronic bond system (eBond) test, using a CBP-approved Electronic Data Interchange (EDI), who must transmit it?",opts:{A:"Port Director",B:"Importer",C:"Filer",D:"Surety or Surety Agent"},ans:["D"],cite:"ACE BRPD Chapter 3, Section 3.7"},
{n:48,cat:"V",q:"HK Importers, Inc. (HKI) has a continuous basic importation and entry bond ($200,000) with Total Country Surety. HKI is a client of Best CHB, which has its own continuous bond ($200,000) with Thrift Surety. Best filed entry on Jan 13, 2026, on behalf of HKI (HKI as importer of record) for wooden chairs valued at $40,000; released same day. Best scheduled ACH payment for 9 business days after entry and prepared the entry summary. Due to a computer error at Best, the entry summary was not transmitted, nor was payment made. CBP issued a liquidated damages demand of $100 for failure to file the entry summary. Which of the following statements is FALSE?",opts:{A:"Best is liable to CBP for the payment of the liquidated damage demand amount because Best's computer error caused the failure to file the entry summary data.",B:"HKI is liable for the payment of the liquidated damage demand amount because it is the importer of record.",C:"If the liquidated damage amount is not paid within 60 days of the demand and the principal has not filed a petition for relief, CBP will make a demand for payment on Total Country Surety.",D:"Thrift Surety has legal responsibility as a surety for the importation of the wooden chairs and may be notified by CBP if the duties owed are not tendered by HKI."},ans:["A"],cite:"19 CFR 113.62(a)(1)(i); 142.12(b); 141.101(a); 142.15"},
{n:49,cat:"V",q:"Which entry type code indicates a re-warehouse entry?",opts:{A:"Entry type code 21",B:"Entry type code 22",C:"Entry type code 31",D:"Entry type code 32"},ans:["B"],cite:"ACE BRPD Section 12.1"},
{n:50,cat:"V",q:"Merchandise arrived at a port of entry and has been unladen from a vessel. No entry or entry summary has been filed. The merchandise can remain on the dock before it is deemed not timely entered for _____ days and the carrier has to give notice of unentered merchandise to a bonded warehouse certified by the port director as qualified to receive general order merchandise no later than _____ calendar days after landing.",opts:{A:"20; 20",B:"15; 20",C:"30; 60",D:"10; 30"},ans:["B"],cite:"19 CFR 141.5; 4.37(a); 4.37(c)"},
{n:51,cat:"V",q:"Absent the grant of an extension by the port director for reasonable cause, when must the operator of a Foreign Trade Zone or Subzone prepare their annual reconciliation report?",opts:{A:"Within 30 days after the end of the zone/subzone year",B:"Within 45 days after the end of the zone/subzone year",C:"Within 90 days after the end of the zone/subzone year",D:"Within 120 days after the end of the zone/subzone year"},ans:["C"],cite:"19 CFR 146.25(a)"},
{n:52,cat:"V",q:"To which of the following actions may merchandise admitted to a Foreign Trade Zone in zone-restricted status be subjected?",opts:{A:"Transfer to customs territory for domestic consumption upon obtaining approval from a Center Director",B:"Modify zone status to domestic status",C:"Manipulation or manufacture into a distinct article of commerce",D:"Exportation from the United States"},ans:["D"],cite:"19 CFR 146.44(a)"},
{n:53,cat:"V",q:"Which of the following best defines a domestic material?",opts:{A:"A material whose country of origin is the same as the country in which the good is produced.",B:"A material used in the production, testing, or inspection of another good.",C:"A material that is interchangeable for commercial purposes and whose properties are essentially identical.",D:"A material that is grown or occurs organically rather than being processed or manufactured."},ans:["A"],cite:"19 CFR 102.1(d)"},
{n:54,cat:"V",q:"Which of the following abbreviations or alternate spellings is unacceptable according to regulations found in 19 CFR 134?",opts:{A:"Luxemb for Luxembourg",B:"Gt. Britain for Great Britain",C:"Ita for Italy",D:"Brasil for Brazil"},ans:["C"],cite:"19 CFR 134.45"},
{n:55,cat:"V",q:"Unless exported or destroyed under Customs supervision prior to liquidation of the entry, articles without country of origin marking, as required, shall be subject to additional duties in the amount of:",opts:{A:"20 percent of the final appraised value",B:"50 percent of the final appraised value",C:"10 percent of the final appraised value",D:"200 percent of the final appraised value"},ans:["C"],cite:"19 CFR 134.2"},
{n:56,cat:"V",q:"Under ACE Entry Summary Instructions, which of the following is TRUE regarding the reporting of gross shipping weight of goods?",opts:{A:"Gross shipping weight is optional for goods transported by air.",B:"Gross shipping weight must include the container's weight if shipped in lift vans.",C:"Gross shipping weight is optional for each line item in the entry summary.",D:"Gross shipping weight must be reported in kilograms for all modes of transportation."},ans:["D"],cite:"ACE Entry Summary Instructions v2.4a, page 18"},
{n:57,cat:"V",q:"Of the following choices, when may the Surety Code \"999\" appropriately be entered on an entry summary?",opts:{A:"When the bond is waived by regulation",B:"When a cash deposit is used in place of a bond",C:"When a single transaction bond amount is unknown",D:"When a continuous bond is not applicable"},ans:["A"],cite:"ACE Entry Summary Instructions v2.4a, page 3"},
{n:58,cat:"V",q:"Under which of the following circumstances would the ACE Cargo Release system generate a \"documents required\" message upon entry submission?",opts:{A:"The merchandise is ready for release from Customs custody.",B:"The filer should correct or override the census warning and retransmit.",C:"CBP is issuing CBP Form 29, Notice of Action, to change the classification and/or value of the merchandise.",D:"CBP and/or a partner government agency is requesting supporting documentation for further review."},ans:["D"],cite:"ACE BRPD Section 1.2"},
{n:59,cat:"V",q:"Under which circumstance may an individual who qualifies as an importer of record under 19 USC 1484 authorize an unpaid agent to enter merchandise on their behalf?",opts:{A:"The individual, a known importer in the United States, is receiving in one shipment on one day merchandise that is a bona fide gift from a person in a foreign country with an aggregate fair retail value in the country of shipment of less than $100.00.",B:"The individual, a known importer not acting on behalf of a corporation, partnership, or association, makes a written request to the agent claiming to be indigent with proof that the individual cannot afford to pay the agent.",C:"The individual, a regular importer, appoints the agent to handle an importation of a single article of merchandise and the agent is a relative of the individual.",D:"The individual, a person in the United States who is not a regular importer, is receiving a non-commercial shipment, and authorizes the unpaid agent in writing using power of attorney language."},ans:["D"],cite:"Right to Make Entry Directive (CD 3530-002A)"},
{n:60,cat:"V",q:"In ACE, which of the following data elements CANNOT be changed through a Post Summary Correction (PSC) for any entry type?",opts:{A:"Entry Type",B:"Importer of Record",C:"Harmonized Tariff Schedule classification",D:"Commercial Invoice Value"},ans:["B"],cite:"ACE BRPD v12.0, Sections 6.5-6.6"},
{n:61,cat:"V",q:"Which of the following is TRUE with respect to an underpayment or overpayment of duties, taxes, and fees determined upon reliquidation of an entry? (Nota: o gabarito oficial aceitou DUAS respostas — B e D.)",opts:{A:"CBP may issue a bill for $14.63 in underpayment of duties, taxes, and fees, within 180 days of the original liquidation.",B:"CBP must issue a refund for $7.56 in overpayment of duties, taxes, and fees, upon receiving a request from the importer of record in conjunction with a protest reliquidation.",C:"CBP may issue a bill for underpayment or refund for overpayment of duties, taxes, and fees, irrespective of the sum entailed, upon receipt of a written request within 60 days of the original liquidation.",D:"CBP will refund a $15.42 overpayment on a reliquidated entry, reliquidated upon approval of a protest filed by the importer of record in which the importer indicated in the protest that it requested refunds of all amounts."},ans:["B","D"],cite:"19 CFR 173.3; 19 CFR 159.6"},
{n:62,cat:"V",q:"Jane Doe is filing an entry summary. One line item is for a woman's dress, which is a woven garment of three different colors. In addition to the general information required on the accompanying commercial invoice, what other information that is specific to the dress must be provided on the invoice by regulation?",opts:{A:"Whether the dress contains any embroidery, lace, braid, edging, trimming, piping or applique work",B:"Whether the dress has pockets sewn in",C:"The exact dimensions (length and width) of the dress",D:"Whether there are two or more colors in the warp and/or filling in the dress fabric"},ans:["D"],cite:"19 CFR 141.89(a)"},
{n:63,cat:"V",q:"Johnson Consolidated Freight (JCF) is the nominal consignee for a shipment of empty glass bottles, consigned to IPA (USA), Inc., a beer brewer. JCF has an appropriate POA with IPA. JCF contracts with Knowledgeable Customs Brokers (Knowledgeable) to file the entry and entry summary as the importer of record. Knowledgeable obtains POA from IPA and files with itself as importer of record, obligating its basic importation and entry bond. Which one of the steps below is NOT one of the steps Knowledgeable will take to be relieved of liability for increased and additional duties owed under the facts above?",opts:{A:"File a declaration within 90 days from the time of entry made by the actual owner acknowledging that the owner will pay all additional and increased duties, along with a bond of the actual owner containing conditions set forth in 19 CFR 113.62.",B:"Furnish within 90 days from the time of entry copies of the POA documents between Knowledgeable and JCF and Knowledgeable and IPA proving that Knowledgeable had the right to make entry under 19 CFR 141.11.",C:"Declare to CBP at the time of filing the entry and entry summary that it is not the actual owner of the goods.",D:"Furnish to CBP at the time of filing the entry and entry summary the name and address of the actual owner of the goods."},ans:["B"],cite:"RTME Directive (CD 3530-002A) Sec. 5.1.3; 19 CFR 141.19; 141.20"},
{n:64,cat:"V",q:"A customs broker timely and properly filed entry documentation (CBP Form 3461) for imported merchandise, without also filing an entry summary (CBP Form 7501), on September 15, 2025, and requested the time of entry to be on that same date. The merchandise, transported via vessel, had an estimated date of arrival of September 16, 2025. The merchandise arrived within the port limits on September 17, 2025, and was offloaded on September 18, 2025. What is the time of entry?",opts:{A:"September 15, 2025",B:"September 16, 2025",C:"September 17, 2025",D:"September 18, 2025"},ans:["C"],cite:"19 CFR 141.68(a)(2); 141.68(e)"},
{n:65,cat:"V",q:"If a Center Director extends the liquidation of an entry, the official notice of extension and reasons for the extension will be posted on www.cbp.gov. What is the minimum timeframe that the notice of extension must be maintained on www.cbp.gov?",opts:{A:"1 month",B:"6 months",C:"12 months",D:"15 months"},ans:["D"],cite:"19 CFR 159.12(a)-(b)"},
{n:66,cat:"VI",q:"As part of an investigation, CBP has decided that there is reasonable suspicion that an importer entered covered merchandise into the U.S. through evasion of anti-dumping duties under the Enforce and Protect Act of 2015 (EAPA). The entries are unliquidated. What interim measure must CBP take with respect to the entries?",opts:{A:"Schedule oral discussions to occur with the importer within 200 calendar days to continue the investigation.",B:"Provide a public version of the administrative record of this investigation online within 15 business days after notifying the U.S. Department of Commerce.",C:"Extend the period for liquidating each unliquidated entry of such covered merchandise that entered after the date the investigation was initiated.",D:"Suspend the liquidation of each unliquidated entry of such covered merchandise that entered on or after the date of the initiation of the investigation under 19 CFR 165.15."},ans:["D"],cite:"19 CFR 165.24(b)(1)(i)-(iii); 165.24(c)"},
{n:67,cat:"VI",q:"Which of the following is TRUE with respect to imported merchandise after the ITC finds a violation of section 337 of the Tariff Act of 1930 (19 USC 1337) and issues an exclusion order, as implemented by CBP under 19 CFR 12.39?",opts:{A:"The exclusion order is not effective until 60 days after issuance, at which point merchandise subject to the exclusion order no longer may be entered.",B:"Merchandise subject to the exclusion order may not be entered under any circumstance after the exclusion order has been issued.",C:"Merchandise subject to the exclusion order may be entered under a basic importation and entry bond in an amount set by CBP.",D:"Merchandise subject to the exclusion order may be entered under bond until the determination of a violation becomes final."},ans:["D"],cite:"19 CFR 12.39; 19 CFR 113"},
{n:68,cat:"VI",q:"Coffee Inc., a Canadian company, buys raw coffee beans from Colombia classified under HTS subheading 0901.11, then processes the beans into instant coffee classified under 2101.11.21. The instant coffee is imported into the U.S. for sale. In order for the instant coffee to qualify for preferential tariff treatment under USMCA, which of the following statements must be TRUE?",opts:{A:"The nonoriginating coffee must constitute no more than 60 percent by weight of the good.",B:"The nonoriginating coffee must constitute no more than 75 percent by weight of the good.",C:"The nonoriginating coffee must constitute no less than 60 percent by weight of the good.",D:"The nonoriginating coffee must have a Labor Value Content (LVC) of thirty percent, with at least 15 percentage points of high-wage material."},ans:["A"],cite:"General Note 11(o), Chapter 21, HTSUS"},
{n:69,cat:"VI",q:"Which of the following Special Program Indicators (SPI) is NOT valid?",opts:{A:"BU",B:"S",C:"S+",D:"P"},ans:["A"],cite:"HTSUS General Note 3(c)(i)"},
{n:70,cat:"VI",q:"Which of the following is considered an assist and should be included in the entered value?",opts:{A:"The cost of engineering plans produced in Omaha, Nebraska for switch assemblies that are supplied free of charge by a U.S. importer to a foreign producer of switches in Taipei, Taiwan.",B:"The cost of printed circuit assemblies that will be integrated into timing switches that are purchased by a foreign producer of switch assemblies produced in Taipei, Taiwan.",C:"The cost of a factory air conditioning system that was supplied free of charge by a U.S. importer to a foreign producer of switches in Taipei, Taiwan.",D:"The cost of printed circuit assembly components for switch integration that are supplied free of charge by a U.S. importer to a foreign producer of switches in Taipei, Taiwan."},ans:["D"],cite:"19 CFR 152.102(a)"},
{n:71,cat:"VI",q:"Of the following importation scenarios, which has a Transaction Value?",opts:{A:"While negotiating business and transaction terms with an intended importer, the foreign manufacturer imports 10,000 refrigerator time switches to a storage facility in an effort to beat pending tariff increases.",B:"An event operator hosting a large public aerospace convention imports multiple goods from multiple manufacturers for consignment sale. The articles are not samples and will be sold to convention attendees.",C:"A foreign manufacturer sells merchandise to a related U.S. importer. The foreign seller does not sell identical or similar merchandise to any unrelated parties. The transaction between the foreign seller and the U.S. importer is determined by Customs to be unaffected by the relationship.",D:"A foreign manufacturer of industrial drones is importing promotional steel airplane models to be given to each purchaser of a drone as a thank you gift."},ans:["C"],cite:"19 CFR 152.103(j)(2)(i)"},
{n:72,cat:"VI",q:"A shipment of plastic optical fibers manufactured in China is valued at $95,678.00 and imported under HTS 9001.10.0050. What is the total applicable duty amount for this shipment? (Note: duties based upon Executive Orders which are not part of the examination references are not included.)",opts:{A:"$6,410.43",B:"$30,329.93",C:"$23,919.50",D:"$15,978.23"},ans:["B"],cite:"9001.10.0050 HTSUS; 9903.88.02 HTSUS"},
{n:73,cat:"VI",q:"A shipment of toy trains manufactured in Vietnam is entered at $10 per unit, Delivered Duty Paid (DDP) Newark, NJ. The toy trains are delivered by truck from the factory in Dong Nai to the port in Ho Chi Minh, then shipped via air freight to Newark. CBP was provided with a rated bill of lading from Ho Chi Minh to Newark. If applicable, the merchandise processing fee is greater than the minimum and less than the maximum. What is the transaction value based on: 1500 toy trains at $10 each; Inland Freight Dong Nai-Ho Chi Minh $200; Ocean Freight Ho Chi Minh-Newark $350? (Nota: o gabarito oficial concedeu crédito a TODOS os examinandos nesta questão.)",opts:{A:"$15,000.00",B:"$14,650.00",C:"$14,599.00",D:"$14,450.00"},ans:["A","B","C","D"],cite:"Crédito concedido a todos os examinandos"},
{n:74,cat:"VI",q:"A&G, a Minneapolis furniture company, purchases 5000 bespoke ironing boards from Kraftsmen (Slovenia). A&G supplies free of charge: design specifications from a Dallas-based designer ($3,200 flat fee); and 2500 yards of cotton fabric procured by Kraftsmen in Slovenia at $2.00/yard, shipped to A&G's screen printer in Mozambique where A&G paid $1.00/yard to add a design, before returning the fabric to Slovenia. A&G imports in five shipments of 1000 boards each and pays $375,000 for the full order, not including assists. If A&G apportions the total assist value over the entire anticipated production of 5000 boards, what is the dutiable value of one shipment of 1000 ironing boards?",opts:{A:"$75,500.00",B:"$76,000.00",C:"$76,140.00",D:"$77,140.00"},ans:["A"],cite:"19 CFR 151.102-103"},
{n:75,cat:"VI",q:"A foreign subsidiary sells ore to its U.S. parent company. The price of the ore charged by the subsidiary to its parent is the price of ore on the New York Mercantile Exchange on the date the ore arrives in the United States. Select the statement that is TRUE regarding this price.",opts:{A:"The price is acceptable under transaction value as it is based upon a formula which neither party can control.",B:"The price is not acceptable because it is not known at the time of shipment.",C:"The price is not acceptable because the parties are related.",D:"The price is acceptable under deductive value because it is based on the price of ore sold in the United States."},ans:["A"],cite:"19 CFR 152.103(a)(1)"},
{n:76,cat:"VI",q:"A U.S. buyer purchased merchandise from an unrelated manufacturer in India. The terms of the sale were ex-factory packed. The U.S. buyer paid the foreign manufacturer $18,344 which included a $1,500 packing fee. The U.S. buyer also paid $4,500 to a freight forwarder to cover expenses for inland freight of $500 and air freight of $4,000. In addition, the U.S. buyer paid a commission of $1,500 to a buying agent who facilitated the purchase. What is the entered value for the imported merchandise?",opts:{A:"$18,344.00",B:"$12,344.00",C:"$6,500.00",D:"$25,844.00"},ans:["A"],cite:"19 CFR 152.103(a)(5)(i)"},
{n:77,cat:"VI",q:"Footwear incorporating a protective metal toe-cap imported on or after July 1, 1981 will be determined in accordance with _____.",opts:{A:"Section 402, Tariff Act of 1930 (19 USC 1401a), as amended by section 201, Trade Agreements Act of 1979.",B:"Section 402, Tariff Act of 1930 (19 USC 1401a)",C:"Statement of Administrative Action relating to customs valuation, submitted to and approved by Congress along with the Trade Agreements Act of 1979 (Pub. L. 96-39)",D:"T.D. 81-7, 46 FR 2600, January 12, 1981, as amended by T.D. 89-1, 53 DR 51270, Dec. 21, 1988"},ans:["A"],cite:"6401.10.00 HTSUS; 19 CFR 152.101(a)"},
{n:78,cat:"VI",q:"Luxury Resins, a Japanese producer of plastic materials, sold resin to Phone Cases Plus, an unrelated U.S. manufacturer, for $20,000. Later, Phone Cases Plus decides to pay a $2,000 royalty to a brand owner for the right to manufacture and sell branded phone cases made from the resin. What is the transaction value of the transaction between Luxury Resins and Phone Cases Plus?",opts:{A:"$18,000.00",B:"$20,000.00",C:"$22,000.00",D:"$2,000.00"},ans:["B"],cite:"19 CFR 152.103(f)"},
{n:79,cat:"VI",q:"If the commercial invoice is in a foreign currency, the foreign currency shall be converted to U.S. dollars using the proclaimed rate or certified rate or rates effective on the _____.",opts:{A:"Date of import",B:"Date of entry",C:"Date of export",D:"Date of lading"},ans:["C"],cite:"19 CFR 159.32"},
{n:80,cat:"VI",q:"During a cargo examination of entered goods, a CBP officer discovered that none of the physical merchandise agrees with the invoice submitted with the entry. The CBP officer determines that there was no evidence of any intent to defraud. The original entry must be replaced by a new entry. How will the estimated duties paid on the original entry be treated?",opts:{A:"The estimated duties paid on the original entry will be transferred to the new entry via ACH transfer.",B:"The estimated duties paid on the original entry will be refunded on liquidation as in the case of a nonimportation.",C:"The estimated duties paid on the original entry will be applied to the importer's next periodic monthly statement as a credit against the amount due on the statement.",D:"The estimated duties paid on the original entry will be retained by CBP and applied against the forthcoming forfeiture proceedings."},ans:["B"],cite:"19 CFR 152.3"}
];

const OCT2024=[
{n:1,cat:"I",q:"Which ONE of the following permits constitute sufficient permit authority for a customs broker to conduct customs business within the customs territory of the U.S.?",opts:{A:"National permit",B:"Association or corporation permit",C:"Partnership permit",D:"No permit"},ans:["A"],cite:"19 CFR 111.2(b)"},
{n:2,cat:"I",q:"Who must exercise responsible supervision and control over the transaction of customs business of an association or corporation that is a broker?",opts:{A:"All employees of a licensed association or corporation who also hold a customs broker license.",B:"Only licensed employees who are also the license qualifier and/or permit qualifier for the association or corporation.",C:"Every officer of a licensed association or corporation, even if the officer is not a licensed broker.",D:"Every licensed officer of a licensed association or corporation."},ans:["D"],cite:"19 CFR 111.28(a); 19 CFR 111.1"},
{n:3,cat:"I",q:"While preparing entry documents for its client Angel Industries, Shady CHB sees that the insurance value is significantly lower than the commercial invoice value. Angel explains there are two commercial invoices: the real (lower) invoice from the shipper used for insurance, and a second invoice created by Angel at a higher amount used for calculating Customs value, on which it pays duties, taxes, and fees — a system used to reduce reportable profit for income tax purposes. Shady's attorney advises terminating the relationship because the \"double invoice scheme\" is fraudulent. Of the choices below, what is Shady's best next step?",opts:{A:"Shady documents the double invoice scheme and immediately terminates its relationship with Angel and reports to CBP the client's name, date of termination, and the reason for the termination.",B:"Shady will file the entry using the lower, correct value and will advise Angel that they will only file entry in the future using the actual invoice from the shipper.",C:"Shady will file the entry at the value requested by Angel and will keep Angel as a client because the potential fraud does not involve CBP.",D:"Shady will file the entry as requested by Angel because it is not fraud to pay more in duties, taxes, and fees than actually owed."},ans:["A"],cite:"19 CFR 111.32; 19 CFR 111.53"},
{n:4,cat:"I",q:"An individual's customs broker license is suspended by operation of law for failure to file a triennial status report and pay the fee, and the individual has received the notice of suspension as prescribed by regulation. When will the license be revoked by operation of law if the individual fails to file the report and pay the fee?",opts:{A:"On the 30th business day after the date of the suspension notice",B:"On March 31 of the reporting year.",C:"On the 61st calendar day after the date of the suspension notice.",D:"On the date that the Federal Register Notice of revocation is published."},ans:["C"],cite:"19 CFR 111.30(d)"},
{n:5,cat:"I",q:"____ must be set forth in or attached to an application for a new national permit to describe how responsible supervision and control will be exercised over the customs business conducted under the national permit.",opts:{A:"A supervision plan",B:"A regulation proposal",C:"A status report",D:"A control strategy"},ans:["A"],cite:"19 CFR 111.19(b)(8)"},
{n:6,cat:"I",q:"What is the maximum number of calendar days that the designated recordkeeping contact has to make the records available to CBP, if the request does NOT specify additional time to respond?",opts:{A:"10",B:"15",C:"30",D:"60"},ans:["C"],cite:"19 CFR 111.23"},
{n:7,cat:"I",q:"A duly licensed customs broker was named in and properly served a U.S. CBP summons signed by a Center Director. The summons requires the broker to provide CBP with documentation for 10 entries the broker filed on behalf of Company Z within the last three years. The broker terminated Company Z as a client 10 months before the summons' issuance and the POA was revoked. Company Z has not provided the broker with specific written instructions regarding responding to a summons. How must the broker respond to the Customs' summons?",opts:{A:"Provide CBP with the entry files requested because the broker is legally obligated to make such records available to CBP.",B:"Return the summons to CBP because it must be signed by an auditor or special agent to be legally effective.",C:"Forward the summons to Company Z and notify the Center Director that it has been forwarded to the party obligated to respond to the summons.",D:"No response to the summons is required because the record retention period for Company Z's entry filed expired upon the termination of the broker-client relationship."},ans:["A"],cite:"19 CFR 163.7(a)"},
{n:8,cat:"I",q:"Ms. Crimson and Mr. Blue are both individually licensed customs brokers. They form an LLC and obtain an organizational customs broker license as an association. The LLC hires Ms. Yellow, also a licensed customs broker. Crimson is the majority owner. Blue is the license qualifier. Yellow is the permit qualifier. All three are officers of the LLC. The LLC surrenders its organizational license and permit to the processing Center and terminates the brokerage business. Upon termination, who is responsible for notifying CBP in writing of the name, address, email address, and telephone number of the party having legal custody of the LLC's brokerage records?",opts:{A:"Only Blue, as the license qualifier, is required to notify CBP.",B:"Only Crimson, as the majority owner, is required to notify CBP.",C:"Only Yellow, as the permit qualifier, is required to notify CBP.",D:"Crimson, Blue, and Yellow as individually licensed brokers and officers of the LLC are all required to notify CBP."},ans:["D"],cite:"19 CFR 111.30(e)(3)"},
{n:9,cat:"I",q:"Other than the owner or purchaser, of the following, who has the authority to sign or certify electronic transmissions of the entry or entry summary?",opts:{A:"Any employee of the properly designated customs broker.",B:"Any employee of the properly designated customs broker who also has a login to the broker's electronic submission software to send data to CBP.",C:"All employees of the properly designated customs broker who also have been granted power of attorney (POA) by the customs broker.",D:"A nominal consignee in its own name without the services of a properly designated customs broker."},ans:["C"],cite:"RTME Directive 3530-002A, Sec. 5.3; 19 CFR 111.1; 111.2; 141.0a"},
{n:10,cat:"I",q:"The grantor of a customs power of attorney (POA) to a licensed customs brokerage business is a limited partnership and imports textile goods. The grantor also has a POA with a freight forwarder with a special grant allowing the freight forwarder to appoint subagents, including customs brokers. Which of the following statements is legally FALSE?",opts:{A:"The names of all general partners and limited partners in the limited partnership must be listed on the POA agreement between the customs broker and the limited partnership.",B:"The POA between the limited partnership and the customs broker must have attached the partnership agreement for the limited partnership.",C:"If the POA between the limited partnership and the customs broker was executed on March 1, 2024, a new power of attorney must be executed on or before March 1, 2026.",D:"Even though the grantor gave the power to the freight forwarder to appoint a subagent, the grantor is still required to have a POA with the customs broker directly."},ans:["A"],cite:"19 CFR 141.39(a)(2); 111.36(c)(3); 131.34"},
{n:11,cat:"I",q:"Which of the following limitations in a limited power of attorney between a broker and an importer would NOT be permitted under Customs regulations?",opts:{A:"Both the importer and the broker are corporations and the POA agreement, executed on October 27, 2024, specifies that it is valid until October 27, 2026.",B:"Both the importer and the broker are corporations and the POA specifies that the broker may only file entry on the importer's shipments arriving at the Newark/New York Customs port of entry.",C:"Both the importer and the broker are partnerships and the POA agreement, executed on October 27, 2024, specifies that it is valid until October 31, 2026.",D:"Both the importer and the broker are individuals and the POA agreement specifies that the only customs business that the broker may perform on behalf of the importer is to make, sign, and file protests."},ans:["C"],cite:"19 CFR 141.34; 19 CFR 141.31(a)"},
{n:12,cat:"I",q:"Sam Sly's customs broker license was revoked by operation of law for failure to file a triennial status report and pay the fee. Sam ignored the warning letter from CBP thinking his employer had filed for him. Besides his job, Sam does freelance jobs classifying merchandise and filling out entry documents (not filing them) for clients from a freelance website. CBP discovers Sam is advertising publicly as a licensed customs broker and has conducted customs business for five importers of commercial goods after his license was revoked. CBP sends a penalty notice for conducting customs business without a license for $10,000.00. This is Sam's first penalty, he can pay, but requests mitigation claiming he did not know his license was revoked. Based upon the guidelines in Appendix C to 19 CFR Part 171, will CBP mitigate and, if so, to what amount?",opts:{A:"Yes, CBP will mitigate to $250.00.",B:"Yes, CBP will mitigate to $1,000.00.",C:"No, CBP will not mitigate the penalty.",D:"No, CBP will not mitigate and will raise the penalty to $30,000.00 because there were five violations."},ans:["C"],cite:"19 CFR Part 171, Appendix C II. E(5), II F, II G"},
{n:13,cat:"I",q:"If a penalty is assessed or a seizure is made and less than 180 days remain before the statute of limitations may be asserted as a defense, the Fines, Penalties, and Forfeitures Officer may specify in the seizure or penalty notice a reasonable period of time, but not less than __________, for the filing of a petition for relief.",opts:{A:"7 working days",B:"7 days including weekends",C:"10 business days",D:"30 working days"},ans:["A"],cite:"19 CFR 171.2(e)"},
{n:14,cat:"I",q:"Which ONE of the following is subject to mandatory seizure under 19 USC 1595a(c)?",opts:{A:"Merchandise that is stolen, smuggled, or clandestinely imported or introduced.",B:"Merchandise in which copyright, trademark, or trade name protection violations are involved.",C:"Merchandise marked intentionally in violation of 19 USC 1304.",D:"Merchandise that requires a license to import and is not accompanied by such license."},ans:["A"],cite:"19 CFR 162.23(a)"},
{n:15,cat:"I",q:"What is the maximum amount that a broker can be penalized for a violation or violations of 19 USC 1641 in one penalty notice?",opts:{A:"$25,000.00",B:"$30,000.00",C:"$50,000.00",D:"$100,000.00"},ans:["B"],cite:"19 CFR Part 171 Appendix C XII"},
{n:16,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q16-20) — Echo Paper Products Ltd. (Echo), de Edmonton, Alberta, Canadá, contratou a NB Brokerage, Inc. (NBB), de Portal, Dakota do Norte, para registrar suas entries no CBP. Presidente da Echo: David Smith. VP de Compliance: Joan McKay. A Echo é registrada em Alberta e NÃO é registrada em nenhum estado dos EUA.\nA NBB forneceu uma POA (19 CFR 141.32) assinada por Joan McKay em 01/03/2024, válida até 31/12/2099 ou até revogação por escrito.\nA Echo fabrica papel não revestido (HTSUS 4802.56.6000) com polpa canadense. Papel similar de origem AUSTRALIANA está sujeito a antidumping (caso A-602-807); não há caso AD para papel canadense. A Echo alugou espaço em armazém em Dakota do Norte onde contratados reembalam o papel; pode precisar reexportar papel ao Canadá.",q:"Which of the following statements is FALSE with respect to the Power of Attorney (POA)?",opts:{A:"The language in the POA confirming that Echo's agent is: 1) a resident; and 2) authorized to accept service of process against Echo means that the POA can be accepted by CBP pursuant to 19 CFR 141.36.",B:"The POA must also have attached documentation establishing the authority of Joan McKay to execute the POA on behalf of Echo pursuant to 19 CFR 141.37.",C:"The written notification set forth in 19 CFR 111.29(b)(1) must be on, or attached to, the POA pursuant to 111.29(b)(2)(i).",D:"The POA must contain a corporate seal of the grantor as specified in 19 CFR 113.37(g)(1)(v)."},ans:["D"],cite:"19 CFR 111.29; 141.36; 141.38"},
