op"><b>generally within 30 days of conditional release</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">141.113</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Respond to CBP Form 28 (Request for Information)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 days</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">CBP practice</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Respond to CBP Form 29 (Notice of Action — "proposed")</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>20 days from the notice date (an action "taken" is already done: the path is a protest)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">CBP practice</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">💰 Payment and liquidation</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Periodic Monthly Statement (PMS)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>by the 15th business day of the following month</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">24.25</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Deemed liquidation (automatic if CBP does not act)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 year from entry</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">159.11</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Liquidation extensions</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>up to +3 years (max 4 total)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">159.12</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Voluntary reliquidation by CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>90 days from notice of liquidation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">173.3</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Post Summary Correction (PSC)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>within 300 days of entry and 15 days before liquidation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">ACE</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">⚖️ Challenges and penalties</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Protest</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>180 days from liquidation/decision</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">174.12</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Accelerated disposition of a protest</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>demandable after 90 days; 30 days of silence = denied</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">174.22</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Petition against a penalty</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>60 days from the notice</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">171.2</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Petition against liquidated damages</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>60 days from the notice</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">172.3</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">USMCA — post-importation preference claim</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 year from importation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">182.32</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Prior disclosure</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>before knowledge of a formal investigation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">162.74</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">👤 Broker — Part 111</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Keep customs business records</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 years</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.23</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Revoked POA + letter of revocation</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 years after revocation OR after the client ceases to be active — whichever is LATER (an active POA is kept until revoked)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">141.46</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Client pays the broker (check/funds) AFTER the debt to CBP is due</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>transmit to CBP within 5 WORKING days of receipt</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.29(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Broker receives client funds from CBP (refunds)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>account for and pay to the client within 60 calendar days</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.29(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Change of address (office of record, mailing or E-MAIL)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>10 calendar days (via authorized EDI)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Employee list: hiring, termination or ANY change to employee information</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 days from the event</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.28(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">The (individual) broker terminated from the firm they qualify</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>IMMEDIATE written notice to the Executive Director, Office of Trade + copy to the processing Center</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.28(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">The FIRM reports organization changes (incl. the date the qualifying member/officer ceases)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>10 calendar days, in writing, to the processing Center</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Firm without ANY licensed qualifier (replace the qualifying member/officer)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>120 continuous days — after that, license and permit revoked by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Firm without a licensed NATIONAL PERMIT QUALIFIER</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>180 continuous days — the national permit is revoked by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">CBP notice before a revocation by operation of law</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 calendar days BEFORE — IF the broker gave CBP advance notice of the underlying events</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Failure to pay the annual permit user fee</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>permit revoked by operation of law (after notice)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(b) · 111.96(c)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Report a cyberbreach to CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>72 hours</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.21(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Triennial status report — filing window</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>DURING February of the reporting year (2027, 2030…); as of MARCH 1 = suspension by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reinstate a license suspended by operation of law</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>report + fee within 60 days of notice</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Continuing education</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>36 h per triennial period</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.103</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Apply for the license after passing the exam</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>3 years</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.11</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Maximum monetary penalty on a broker</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>$30,000 per violation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.91</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">🧾 Bonds — Part 113</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">File a continuous bond / rider in advance</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>up to 60 days BEFORE the requested effective date</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.26</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Termination of the bond by the PRINCIPAL</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>effective on the requested date if it is ≥10 BUSINESS days after CBP receives the request; otherwise on the 10th business day after</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Termination by the SURETY (with or without the principal's consent)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>reasonable notice = 30 days (to the Revenue Division + the principal); already incurred obligations are not disavowed</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Effect of termination</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>no new transactions may be charged to the terminated bond — a new bond (CBP Form 301) is required</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(c)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB bond amount</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>general rule: DOUBLE the duties (200%); professional equipment 9813.00.50 = 110% of estimated duties including fees</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.31(f) · Dir. 3510-004</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cartman/lighterman with insufficient bond (CBP written notice)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>remedy within 15 days of notification</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">112.25</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">📜 Special regimes</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — Temporary Importation under Bond</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 year, extendable to 3 total</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.37</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Merchandise in a bonded warehouse</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 years from importation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">144.5</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Drawback claim</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 years from importation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">190.51</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reconciliation (closing the flag)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>21 months</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">ACE/159</td></tr></table>

<div class="card">
  <h3>🗂️ Entry types — the CBP Form 7501 code</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Code</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">What it is</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>01</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumption — the default: free or dutiable merchandise entering commerce</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>02</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumption — subject to quota/visa</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>03</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumption — subject to antidumping/countervailing (AD/CVD)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>06</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumption — withdrawal from a Foreign Trade Zone (FTZ)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>11</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Informal — low-value shipments (general rule up to $2,500)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>21</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Warehouse — entry into a bonded warehouse (up to 5 years)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>22</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Re-warehouse — transfer to another bonded warehouse/port</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>23</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — temporary importation under bond (1 year, up to 3)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>31</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Withdrawal — from the warehouse for consumption</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>51 / 52</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Government — Defense (51) and other federal agencies (52)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>61 / 62 / 63</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">In-bond: IT / T&amp;E / IE — see the 7512 chart below</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>86</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Section 321 — de minimis up to $800 with PGA data (via ACE)</td></tr></table>
</div>
<div class="card">
  <h3>🚛 In-bond — the three moves of CBP Form 7512</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Type</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Movement</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IT — Immediate Transportation (61)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cargo arrives at one port and travels under bond to ANOTHER U.S. port, where the entry will be filed. No duty on the way.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>T&amp;E — Transportation &amp; Exportation (62)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cargo crosses the U.S. under bond just passing through: enters at one port and LEAVES the country through another. It never enters U.S. commerce.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IE — Immediate Exportation (63)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cargo is exported through the SAME port where it arrived, with no consumption entry.</td></tr></table>
  <p class="note" style="margin-top:10px">Memorize by asking "where does the cargo end up?": IT ends at another U.S. port (for entry); T&amp;E ends abroad leaving through another port; IE ends abroad leaving through the same port. Warehouse withdrawals for transportation/exportation also use the 7512. Operational in-bond deadline: as a rule, 30 days to reach destination (19 CFR 18).</p>
</div>
<div class="card">
  <h3>📜 Part 113 — bonds</h3>
  <p class="guideline"><b>Structure:</b> three-party contract — principal (importer/carrier) + surety (Treasury-approved, Circular 570) + CBP. Form: <b>CBP Form 301</b>.</p>
  <p class="guideline"><b>Types:</b> single transaction bond (STB) for one operation; continuous bond covers 12 months with automatic renewal.</p>
  <p class="guideline"><b>Amounts:</b> continuous importation bond (Activity 1) = <b>10% of duties/taxes/fees paid in the last 12 months, minimum $50,000</b>. STB generally = value of the merchandise + duties (other-agency merchandise: value ×3).</p>
  <p class="guideline"><b>113.62 conditions (Basic Importation Bond):</b> pay duties on time, file the entry summary within 10 business days, produce documents, <b>redelivery</b> when demanded, keep records, submit to examination.</p>
  <p class="guideline"><b>Broken condition → liquidated damages:</b> pre-set claim against principal AND surety — default: value of the merchandise; TIB not exported: <b>double the duties</b>. Relief via petition (Part 172).</p>
</div>
<div class="card" style="border-left:4px solid var(--stamp)">
  <h3>⚠️ Pairs the exam loves to confuse</h3>
  <p class="guideline">• <b>Liquidation ≠ liquidated damages</b>: liquidation closes the entry's account; liquidated damages is the bond's contractual claim.</p>
  <p class="guideline">• <b>Suspension by operation of law ≠ disciplinary</b>: the first is automatic (triennial report not filed) and reversible with report + fee; the second requires proceedings.</p>
  <p class="guideline">• <b>License ≠ permit</b>: the license qualifies the person/firm; the national permit enables the activity.</p>
  <p class="guideline">• <b>The surety is jointly liable</b> — but only up to the bond amount.</p>
  <p class="note" style="margin-top:10px">Amounts and deadlines change over time — this guide is the memorization skeleton; in the exam, the final word is the current text of 19 CFR.</p>
</div>`,

<div class="card">
  <span class="eyebrow">Las partes más evaluadas del examen · libro abierto</span>
  <h2>⚖️ Guía Broker & Bonds — 19 CFR 111 y 113</h2>
  <p class="lead">La Part 111 es el estatuto del customs broker; la Part 113 es el contrato de garantía que sostiene el sistema. Juntas dominan el examen. Memoriza el esqueleto — y en el examen, confirma en el CFR.</p>
</div>
<div class="card" style="border-left:4px solid var(--gold)">
  <h3>🧾 "Customs business" — la definición que abre el examen (111.1)</h3>
  <p class="guideline"><b>SÍ es customs business</b> (hecho para terceros → exige licencia): <b>entry y admisibilidad</b> de mercancía (incluidos los entries de TIB); <b>clasificación y valoración</b>; <b>pago de duties/taxes/fees</b>; <b>refunds y drawback</b>; y la preparación/firma de documentos de esas actividades destinados al CBP.</p>
  <p class="guideline"><b>NO es customs business</b> (no exige licencia): la mera <b>transmisión electrónica de datos</b> sin ejercer juicio sobre el contenido; el importador actuando <b>por cuenta propia</b>; la <b>corporate compliance activity</b> — orientar filiales del mismo grupo; marketing, flete y logística pura.</p>
  <p class="guideline"><b>Customs territory (101.1):</b> los 50 estados + District of Columbia + <b>Puerto Rico</b>. FUERA: Islas Vírgenes de EE.UU., Guam y demás territorios — trampa recurrente.</p>
  <p class="guideline"><b>National permit — punto de contacto:</b> la firma debe designar un contacto experto (knowledgeable point of contact) disponible para el CBP <b>durante Y fuera del horario normal</b>.</p>
  <p class="guideline"><b>Sin licencia (111.4):</b> multa de <b>$10,000 por transacción/violación</b>, con tope de <b>$30,000 en total</b> por todas las violaciones.</p>
  <p class="note">El examen adora el lado negativo de la definición: las opciones incorrectas suelen disfrazar de "customs business" algo que no lo es — o al revés.</p>
</div>
<div class="card">
  <h3>👤 Part 111 — la licencia y la profesión</h3>
  <p class="guideline"><b>Licencia individual (111.11):</b> ciudadano de EE.UU., <b>21 años cumplidos antes de solicitar</b>, no ser empleado federal, buen carácter moral y <b>75% en el examen</b>. La solicitud (CBP <b>Form 3124</b> + tarifa) debe presentarse dentro de <b>3 años</b> de aprobar.</p>
  <p class="guideline"><b>Firmas:</b> una partnership/corporation se licencia teniendo al menos <b>un licenciado calificador</b> (qualifying member/officer), que debe ejercer responsible supervision and control (111.28).</p>
  <p class="guideline"><b>National permit:</b> único y nacional — habilita el customs business en todo el territorio aduanero.</p>
  <p class="guideline"><b>Deberes de conducta:</b> transmitir fondos con prontitud (cheques del CBP al cliente; duties al CBP), cuentas separadas, no retener documentos del cliente, avisar por escrito deudas con el CBP, integridad — si el cliente no corrige un error conocido, el broker se retira; prohibido compartir honorarios con quien tuvo la licencia suspendida/revocada.</p>
  <p class="guideline"><b>Disciplina:</b> denegación, suspensión y revocación con notice y hearing; multa monetaria de hasta <b>$30,000</b> por violación.</p>
</div>
<div class="card" style="border-left:4px solid var(--gold)">
  <h3>⏱️ Tabla maestra de plazos — 19 CFR</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Obligación</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Plazo</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Fuente</th></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">📦 Entrada y despacho</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Presentar el entry (liberación) tras la llegada</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>15 días calendario</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">142.2</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Mercancía no declarada pasa a General Order</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>después de 15 días</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">127.1</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Venta/disposición de mercancía en G.O.</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>6 meses</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">127.14</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Entry summary + depósito de duties tras el release</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>10 días hábiles</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">142.12</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Demanda de redelivery</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>en general hasta 30 días del release condicional</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">141.113</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Responder al CBP Form 28 (Request for Information)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 días</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">práctica CBP</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Contestar el CBP Form 29 (Notice of Action — "proposed")</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>20 días desde la fecha del aviso (la acción "taken" ya está tomada: el camino es el protest)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">práctica CBP</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">💰 Pago y liquidation</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Periodic Monthly Statement (PMS)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>hasta el 15º día hábil del mes siguiente</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">24.25</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Deemed liquidation (automática si el CBP no actúa)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 año desde el entry</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">159.11</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Extensiones de liquidation</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>hasta +3 años (máx. 4 en total)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">159.12</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reliquidation voluntaria por el CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>90 días del aviso de liquidation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">173.3</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Post Summary Correction (PSC)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>hasta 300 días del entry y 15 días antes de la liquidation</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">ACE</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">⚖️ Impugnaciones y penalidades</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Protest</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>180 días desde la liquidation/decisión</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">174.12</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Accelerated disposition del protest</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>exigible tras 90 días; 30 días de silencio = denegado</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">174.22</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Petition contra una penalty (multa)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>60 días desde el aviso</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">171.2</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Petition contra liquidated damages</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>60 días desde el aviso</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">172.3</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">USMCA — solicitud de preferencia posimportación</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 año desde la importación</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">182.32</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Prior disclosure</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>antes de conocer una investigación formal</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">162.74</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">👤 Broker — Part 111</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Guardar registros de customs business</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 años</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.23</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">POA revocada + carta de revocación</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 años tras la revocación O tras dejar el cliente de ser activo — lo que sea MÁS TARDE (la POA activa se guarda hasta su revocación)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">141.46</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">El cliente paga al broker (cheque/fondos) DESPUÉS del vencimiento de la deuda con el CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>transmitir al CBP en 5 días HÁBILES desde el recibo</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.29(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">El broker recibe del CBP fondos del cliente (reembolsos/refunds)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>rendir cuentas y pagar al cliente en 60 días calendario</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.29(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cambio de dirección (office of record, postal o E-MAIL)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>10 días calendario (vía EDI autorizado)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Lista de empleados: contratación, desvinculación o CUALQUIER cambio de datos</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 días desde el evento</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.28(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">El broker (individuo) desvinculado de la firma que él califica</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>aviso INMEDIATO por escrito al Executive Director, Office of Trade + copia al processing Center</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.28(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align ing:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reportar un cyberbreach al CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>72 horas</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.21(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Triennial status report — ventana de entrega</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>DURANTE febrero del año de reporte (2027, 2030…); desde el 1º de MARZO = suspensión by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reactivar licencia suspendida by operation of law</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>informe + tarifa en 60 días del aviso</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Educación continua</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>36 h por trienio</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.103</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Solicitar la licencia tras aprobar el examen</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>3 años</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.11</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Multa monetaria máxima a un broker</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>$30,000 por violación</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.91</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">🧾 Bonds — Part 113</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Presentar continuous bond / rider por adelantado</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>hasta 60 días ANTES de la fecha de vigencia pedida</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.26</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Terminación del bond por el PRINCIPAL</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>rige en la fecha pedida si cae ≥10 días HÁBILES después de que el CBP reciba la solicitud; si no, el 10º día hábil siguiente</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Terminación por la SURETY (con o sin consentimiento del principal)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>aviso razonable = 30 días (a la Revenue Division + al principal); no desconoce obligaciones ya incurridas</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Efecto de la terminación</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>ninguna transacción nueva se carga al bond terminado — se exige bond nuevo (CBP Form 301)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(c)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Monto del bond de TIB</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>regla general: el DOBLE de los duties (200%); equipo profesional 9813.00.50 = 110% de los duties estimados incluyendo fees</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.31(f) · Dir. 3510-004</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cartman/lighterman con bond insuficiente (aviso escrito del CBP)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>remediar en 15 días desde la notificación</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">112.25</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">📜 Regímenes especiales</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — Temporary Importation under Bond</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 año, prorrogable hasta 3 en total</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.37</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Mercancía en bonded warehouse</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 años desde la importación</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">144.5</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Drawback claim</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 años desde la importación</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">190.51</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reconciliation (cerrar el flag)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>21 meses</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">ACE/159</td></tr></table>

<div class="card">
  <h3>🗂️ Tipos de entry — el código del CBP Form 7501</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Código</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Qué es</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>01</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — el estándar: mercancía libre o gravada entrando al comercio</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>02</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — sujeta a quota/visa</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>03</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — sujeta a antidumping/countervailing (AD/CVD)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>06</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — salida de una Foreign Trade Zone (FTZ)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>11</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Informal — envíos de bajo valor (regla general hasta $2,500)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>21</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Warehouse — entrada a un bonded warehouse (hasta 5 años)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>22</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Re-warehouse — transferencia a otro bonded warehouse/puerto</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>23</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — importación temporal bajo bond (1 año, hasta 3)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>31</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Withdrawal — retiro del warehouse para consumo</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>51 / 52</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Gobierno — Defensa (51) y demás agencias federales (52)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>61 / 62 / 63</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">In-bond: IT / T&amp;E / IE — ver el cuadro del 7512 abajo</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>86</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Section 321 — de minimis hasta $800 con datos de PGA (vía ACE)</td></tr></table>

  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Tipo</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Movimiento</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IT — Immediate Transportation (61)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">La carga llega a un puerto y viaja bajo bond hasta OTRO puerto de EE.UU., donde se hará el entry. Sin duty en el trayecto.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>T&amp;E — Transportation &amp; Exportation (62)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">La carga cruza EE.UU. bajo bond solo de paso: entra por un puerto y SALE del país por otro. Nunca entra al comercio estadounidense.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IE — Immediate Exportation (63)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">La carga se exporta por el MISMO puerto donde llegó, sin entry de consumo.</td></tr></table>
  <p class="note" style="margin-top:10px">Memoriza con la pregunta "¿dónde termina la carga?": IT termina en otro puerto de EE.UU. (para entry); T&amp;E termina fuera del país saliendo por otro puerto; IE termina fuera del país saliendo por el mismo puerto. Los retiros de warehouse para transporte/exportación también usan el 7512. Plazo operativo del in-bond: por regla, 30 días para llegar al destino (19 CFR 18).</p>

<div class="card">
  <h3>📜 Part 113 — bonds</h3>
  <p class="guideline"><b>Estructura:</b> contrato tripartito — principal (importador/transportista) + surety (aprobada por el Treasury, Circular 570) + CBP. Formulario: <b>CBP Form 301</b>.</p>
  <p class="guideline"><b>Tipos:</b> single transaction bond (STB) para una operación; continuous bond cubre 12 meses con renovación automática.</p>
  <p class="guideline"><b>Montos:</b> continuous de importación (Activity 1) = <b>10% de los duties/taxes/fees de los últimos 12 meses, mínimo $50,000</b>. STB en general = valor de la mercancía + duties (mercancía de otras agencias: valor ×3).</p>

  <h3>⚠️ Pares que el examen adora confundir</h3>

<div class="card">

  <h2>📖 Guia HTSUS — como achar a classificação sem se perder</h2>

  <h3>🗺️ O mapa do livro</h3>
  <p class="guideline">O HTSUS é um funil: <b>22 Seções → 99 Capítulos → posição (4 dígitos) → subposição (6 dígitos) → linha americana (8 e 10 dígitos)</b>.</p>
  <p class="guideline">Regra de bolso da ordem: matéria-prima vem no começo, produto acabado vem no fim (animais vivos no Cap. 1, máquinas no 84, obras de arte no 97).</p>
  <p class="guideline">Peças de apoio: <b>General Notes</b> (FTAs, USMCA e programas especiais), <b>Notas de Seção e de Capítulo</b> (definições e EXCLUSÕES), <b>Capítulo 98</b> (regimes especiais dos EUA: 9801 retorno de mercadoria americana, 9802 reparo/montagem) e <b>Capítulo 99</b> (medidas temporárias: Seção 301, salvaguardas).</p>

<div class="card" style="border-left:4px solid var(--gold)">
  <h3>🧭 O método em 5 passos</h3>

<div class="card">
  <span class="eyebrow">Method over memorization · open-book exam</span>
  <h2>📖 HTSUS Guide — how to find the classification without getting lost</h2>
  <p class="lead">The HTSUS has thousands of pages, but the right lookup takes minutes. The secret is following the same path every time — the same one in every classification question.</p>
</div>
<div class="card">
  <h3>🗺️ The map of the book</h3>
  <p class="guideline">The HTSUS is a funnel: <b>22 Sections → 99 Chapters → heading (4 digits) → subheading (6 digits) → U.S. line (8 and 10 digits)</b>.</p>
  <p class="guideline">Rule of thumb for the order: raw materials come first, finished goods come last (live animals in Ch. 1, machinery in 84, works of art in 97).</p>
  <p class="guideline">Supporting pieces: <b>General Notes</b> (FTAs, USMCA and special programs), <b>Section and Chapter Notes</b> (definitions and EXCLUSIONS), <b>Chapter 98</b> (U.S. special regimes: 9801 American goods returned, 9802 repair/assembly) and <b>Chapter 99</b> (temporary measures: Section 301, safeguards).</p>
</div>
<div class="card" style="border-left:4px solid var(--gold)">
  <h3>🧭 The 5-step method</h3>
  <p class="guideline">1️⃣ <b>Alphabetical index</b>: look up the merchandise by name and note the candidate chapters.</p>
  <p class="guideline">2️⃣ <b>Read the Section and Chapter Notes BEFORE classifying</b>: they define terms and KICK OUT merchandise ("this chapter does not cover…"). This is where the exam trap lives.</p>
  <p class="guideline">3️⃣ <b>GRI 1</b>: the heading text + the notes decide. If it resolves here, you are done — do not invent extra rules.</p>
  <p class="guideline">4️⃣ <b>Go down one level at a time</b>: pick the heading (4 digits) and only then compare sibling subheadings at the same level (GRI 6), down to 10 digits.</p>
  <p class="guideline">5️⃣ <b>Close at the duty column</b>: General (NTR), Special (FTAs — confirm the program in the General Notes) and Column 2. Check whether Chapter 99 adds duty (e.g., Section 301 for China).</p>
</div>
<div class="card">
  <h3>⚖️ Each GRI in one line</h3>
  <p class="guideline"><b>GRI 1</b> — Heading text and notes rule. Resolves most cases.</p>
  <p class="guideline"><b>GRI 2(a)</b> — Incomplete or unassembled with the essential character = classify as complete.</p>
  <p class="guideline"><b>GRI 2(b)</b> — Mixtures of materials: a reference to a material includes its mixtures → decided by GRI 3.</p>
  <p class="guideline"><b>GRI 3(a)</b> — The most specific description beats the generic one.</p>
  <p class="guideline"><b>GRI 3(b)</b> — Mixtures, composites and retail SETS: classify by the component giving the essential character.</p>
  <p class="guideline"><b>GRI 3(c)</b> — Still tied: the heading last in numerical order wins.</p>
  <p class="guideline"><b>GRI 4</b> — No heading fits? Use the most akin (very rare in practice).</p>
  <p class="guideline"><b>GRI 5</b> — Cases and packing go with the product (unless suitable for repetitive use on their own).</p>
  <p class="guideline"><b>GRI 6</b> — Everything above applies again at subheading level, comparing only siblings at the same level.</p>
  <p class="guideline"><b>Additional U.S. Rules</b> — U.S. rules for "parts", "parts and accessories" and principal use.</p>
</div>
<div class="card" style="border-left:4px solid var(--stamp)">
  <h3>⚠️ Classic exam traps</h3>
  <p class="guideline">• The chapter note <b>excludes</b> the merchandise → the "obvious" chapter is wrong. Read the notes first.</p>
  <p class="guideline">• Set put up for retail sale → GRI 3(b), essential character — do not classify item by item.</p>
  <p class="guideline">• Unassembled product in the container → GRI 2(a), classify as the complete product.</p>
  <p class="guideline">• A heading naming the merchandise (eo nomine) beats "other" — specific beats general.</p>
  <p class="guideline">• A Special rate requires confirming the program in the General Notes — do not trust the symbol in parentheses alone.</p>
  <p class="guideline">• Quick code reading: 2 digits = chapter · 4 = heading · 6 = worldwide (HS) · 8 and 10 = U.S. only.</p>
</div>`,

  <p class="guideline">2️⃣ <b>Lee las Notas de Sección y de Capítulo ANTES de clasificar</b>: definen términos y EXPULSAN mercancías ("this chapter does not cover…"). Aquí vive la trampa del examen.</p>
  <p class="guideline">3️⃣ <b>GRI 1</b>: el texto de la partida + las notas deciden. Si se resuelve aquí, terminaste — no inventes reglas extra.</p>

  <p class="guideline">5️⃣ <b>Cierra en la columna de duty</b>: General (NTR), Special (TLCs — confirma el programa en las General Notes) y Column 2. Revisa si el Cap. 99 agrega arancel (p. ej., Sección 301 para China).</p>
</div>
<div class="card">
  <h3>⚖️ Las GRIs en una línea cada una</h3>
  <p class="guideline"><b>GRI 1</b> — El texto de la partida y las notas mandan. Resuelve la mayoría de los casos.</p>
  <p class="guideline"><b>GRI 2(a)</b> — Incompleto o desarmado con el carácter esencial = se clasifica como completo.</p>
  <p class="guideline"><b>GRI 2(b)</b> — Mezclas de materiales: la referencia a un material incluye sus mezclas → decide la GRI 3.</p>
  <p class="guideline"><b>GRI 3(a)</b> — La descripción más específica vence a la genérica.</p>

  <p class="guideline"><b>GRI 4</b> — ¿Ninguna partida encaja? Usa la más parecida (rarísimo en la práctica).</p>

</div>
<div class="card" style="border-left:4px solid var(--stamp)">
  <h3>⚠️ Trampas clásicas del examen</h3>

function renderHtsus(){app().innerHTML=HTSUS_GUIDE[lang]||HTSUS_GUIDE.pt;}

// ---------- TREINO DE NAVEGAÇÃO (fonte contra o relógio) ----------
let navd={active:false,list:[],idx:0,score:0,times:[],start:0,picked:null,timerId:null};
const SRC_FIXED={GRI:"HTSUS — General Rules of Interpretation (GRIs)",GN:"HTSUS — General Notes",GSN:"HTSUS — General Statistical Notes",AUSR:"HTSUS — Additional U.S. Rules of Interpretation",ACEES:"ACE Entry Summary Instructions",BRPD:"ACE BRPD (Business Rules and Process Document)",RTME:"RTME Directive 3530-002A"};
function srcKey(q){
  const c=q.cite||"";
  if(/ANULADA/i.test(c))return null;
  let m=c.match(/19 CFR (?:Part )?(\d{1,3})/);
  if(m)return "P"+m[1];
  if(/GRI/.test(c))return "GRI";
  if(/General Statistical/.test(c))return "GSN";
  if(/Additional U\.S\. Rules/.test(c))return "AUSR";
  if(/General Note|GN /.test(c))return "GN";
  m=c.match(/\b(\d{4})\.\d{2}/);if(m)return "H"+parseInt(m[1].slice(0,2));
  m=c.match(/Chapter (\d{1,2})/);if(m)return "H"+m[1];
  if(/ACE (Entry Summary|ES)/i.test(c))return "ACEES";
  if(/BRPD|Business Rules/i.test(c))return "BRPD";
  if(/RTME|Right to Make Entry/i.test(c))return "RTME";
  return null;
}
function srcLabel(k){
  if(SRC_FIXED[k])return SRC_FIXED[k];
  if(k[0]==="P"){const n=+k.slice(1);const PN=PART_NAMES[lang]||PART_NAMES.pt;return "19 CFR Part "+n+(PN[n]?" — "+PN[n]:"");}
  if(k[0]==="H"){const n=+k.slice(1);const HC=HTS_CH[lang]||HTS_CH.pt;return "HTSUS — "+t("chWord")+" "+n+(HC[n]?" ("+HC[n]+")":"");}
  return k;
}
function startDrill(){
  const qs=shuffle(pool().filter(q=>srcKey(q))).slice(0,20);
  navd={active:true,list:qs,idx:0,score:0,times:[],start:0,picked:null,timerId:null};
  drillNextQ();
}
function drillAllKeys(){return [...new Set(pool().map(srcKey).filter(Boolean))];}
function drillNextQ(){
  navd.picked=null;navd.start=Date.now();
  const q=navd.list[navd.idx];
  const correct=srcKey(q);
  const others=shuffle(drillAllKeys().filter(k=>k!==correct)).slice(0,3);
  navd.opts=shuffle([correct].concat(others));
  navd.correct=correct;
  if(navd.timerId)clearInterval(navd.timerId);
  navd.timerId=setInterval(()=>{const el=$("navclock");if(el)el.textContent=Math.floor((Date.now()-navd.start)/1000)+"s";},400);
  renderDrill();window.scrollTo(0,0);
}
function drillPick(k){
  if(navd.picked!==null)return;
  clearInterval(navd.timerId);
  const secs=(Date.now()-navd.start)/1000;
  navd.times.push(secs);
  navd.picked=k;
  if(k===navd.correct)navd.score++;
  renderDrill();
}
function drillAdvance(){
  navd.idx++;
  if(navd.idx>=navd.list.length){clearInterval(navd.timerId);renderDrill();window.scrollTo(0,0);return;}
  drillNextQ();
}
function drillExit(){navd.active=false;if(navd.timerId)clearInterval(navd.timerId);renderPractice();}
function renderDrill(){
  if(navd.idx>=navd.list.length){
    const avg=navd.times.length?(navd.times.reduce((a,b)=>a+b,0)/navd.times.length):0;
    const pct=Math.round(navd.score/navd.list.length*100);
    app().innerHTML=`
    <div class="card" style="text-align:center">
      <span class="eyebrow">🧭 ${t("drillDone")}</span>
      <div class="result-big ${pct>=75?'pass':'fail'}">${navd.score}/${navd.list.length}</div>
      <p class="lead">${t("drillAcc")}: <b>${pct}%</b> · ${t("drillAvg")}: <b>${avg.toFixed(1)}s</b></p>
      <p class="note">${t("drillMsg")}</p>
      <div class="rowbtns" style="justify-content:center">
        <button class="primary" onclick="startDrill()">${t("drillAgain")}</button>
        <button class="ghost" onclick="drillExit()">${t("back")}</button>
      </div>
    </div>`;
    return;
  }
  const q=navd.list[navd.idx];
  const done=navd.picked!==null;
  app().innerHTML=`
  <div class="topbar">
    <button class="ghost" onclick="drillExit()">${t("back")}</button>
    <span class="progress">🧭 ${t("qWord")} ${navd.idx+1} ${t("ofWord")} ${navd.list.length}</span>
    <span class="timer" id="navclock">0s</span>
  </div>
  <div class="card">
    <span class="badge">${examLabel(q.exam)} · Q${q.n} · ${catName(q.cat)}</span>
    <div class="qtext">${esc(q.q)}</div>
    <div class="civanslabel" style="margin-top:12px">🧭 ${t("drillWhere")}</div>
    <div class="opts">
      ${navd.opts.map(k=>{
        let cls="opt";
        if(done){
          if(k===navd.correct)cls+=" correct";
          else if(k===navd.picked)cls+=" wrong";
          else cls+=" dim";
        }
        return `<button class="${cls}" ${done?"disabled":""} onclick="drillPick('${k}')"><span>${esc(srcLabel(k))}</span></button>`;
      }).join("")}
    </div>
    ${done?`
      <span class="stamp ${navd.picked===navd.correct?'ok':'no'}">${navd.picked===navd.correct?t("drillRight"):t("drillWrong")} · ${navd.times[navd.times.length-1].toFixed(1)}s</span>
      <div class="hintbox">${hintFor(q)}</div>
      <div class="ansreveal">✅ <b>${t("drillAnswer")}:</b><br>${q.ans.map(L=>`<b>${L})</b> ${esc(q.opts[L])}`).join("<br>")}</div>
      <div><span class="cite">${t("source")}: ${esc(q.cite)}</span></div>
      <div class="rowbtns"><button class="primary" onclick="drillAdvance()">${t("next")}</button></div>
    `:""}
  </div>`;
}

let gateOk=stGet("gate")===true;

  const v=($("gatein")||{}).value||"";

  app().innerHTML=`
  <div class="card" style="max-width:420px;margin:60px auto;text-align:center">
    <span class="eyebrow">🔒 ${t("gateTitle")}</span>
    <p class="lead" style="margin:12px 0">${t("gateLead")}</p>
    <input id="gatein" type="password" autocomplete="off" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;text-align:center;letter-spacing:2px" onkeydown="if(event.key==='Enter')gateTry()">
    <p id="gateerr" class="note" style="display:none;color:var(--stamp)">${t("gateErr")}</p>

  </div>`;
  const i=$("gatein");if(i)i.focus();
}
// ---------- render principal ----------
function render(){
  if(!gateOk){renderGate();return;}
  renderNav();
  if(area===null){renderHub();return;}
  if(view==="home")renderHome();
  else if(view==="practice")renderPractice();
  else if(view==="exam")renderExam();
  else if(view==="civics")renderCivics();
  else if(view==="reading")renderReading();
  else if(view==="htsus")renderHtsus();
  else if(view==="broker")renderBroker();
  else renderStats();
}
renderLangs();
render();
