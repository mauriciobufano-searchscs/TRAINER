54:{q:["A XYZ Corporation tem um embarque chegando por via marítima ao porto de Los Angeles/Long Beach. O navio deixou o porto de exportação em 17 de janeiro de 2025. Entrou nos limites do porto marítimo com intenção de descarregar em 23 de janeiro de 2025. O conteúdo foi inspecionado por um agente do U.S. Department of Agriculture em 24 de janeiro de 2025. Por fim, a mercadoria foi descarregada em 27 de janeiro de 2025. Em qual desses dias a mercadoria foi importada para os Estados Unidos?", "XYZ Corporation tiene un embarque que llega por vía marítima al puerto de Los Ángeles/Long Beach. El buque salió del puerto de exportación el 17 de enero de 2025. Entró en los límites del puerto marítimo con intención de descargar el 23 de enero de 2025. Su contenido fue inspeccionado por un funcionario del U.S. Department of Agriculture el 24 de enero de 2025. Finalmente, la mercancía fue descargada el 27 de enero de 2025. ¿En cuál de esos días fue importada la mercancía a los Estados Unidos?"],
A:["17 de janeiro de 2025", "17 de enero de 2025"],
B:["23 de janeiro de 2025", "23 de enero de 2025"],
C:["24 de janeiro de 2025", "24 de enero de 2025"],
D:["27 de janeiro de 2025", "27 de enero de 2025"]},
55:{q:["Qual dos documentos a seguir NÃO é prova do right to make entry (direito de fazer a entry) de mercadoria importada por transportador comum (common carrier) que não seja liberada diretamente ao transportador?", "¿Cuál de los siguientes documentos NO es prueba del right to make entry (derecho de hacer la entry) de mercancía importada por transportista común (common carrier) que no se libera directamente al transportista?"],
A:["Uma fatura comercial ou pro forma.", "Una factura comercial o pro forma."],
B:["Um recibo de embarque ou outro documento apresentado no lugar do bill of lading ou air waybill, contendo o carrier's certificate.", "Un recibo de embarque u otro documento presentado en lugar del bill of lading o air waybill, que contenga el carrier's certificate."],
C:["Um bill of lading ou air waybill, apresentado por seu portador, devidamente endossado quando o endosso for exigido por lei.", "Un bill of lading o air waybill, presentado por su tenedor, debidamente endosado cuando la ley exija el endoso."],
D:["Um extrato do bill of lading ou air waybill, certificado como autêntico pelo transportador que traz a mercadoria ao porto de entrada.", "Un extracto del bill of lading o air waybill, certificado como auténtico por el transportista que trae la mercancía al puerto de entrada."]},
56:{q:["Jane Doe quer importar produtos químicos líquidos em tanques de aço inoxidável que podem ser usados repetidamente. Os tanques são esvaziados na importação e exportados vazios para serem reabastecidos. A Sra. Doe não quer fazer entry nem pagar duty por esses tanques, que serão exportados e reimportados continuamente. Ela cogita designá-los como Instruments of International Traffic (IITs). Qual das afirmações a seguir sobre IITs é VERDADEIRA?", "Jane Doe quiere importar productos químicos líquidos en tanques de acero inoxidable que pueden usarse repetidamente. Los tanques se vacían al importarse y se exportan vacíos para volver a llenarse. La Sra. Doe no quiere hacer entry ni pagar duty por esos tanques, que se exportarán y reimportarán continuamente. Está considerando designarlos como Instruments of International Traffic (IITs). ¿Cuál de las siguientes afirmaciones sobre los IITs es VERDADERA?"],
A:["Um tanque de aço pode ser designado IIT isento de duties ordinários, mas continua sujeito a antidumping e countervailing duties.", "Un tanque de acero puede designarse IIT exento de duties ordinarios, pero sigue sujeto a antidumping y countervailing duties."],
B:["Um tanque de aço designado como IIT deve ser exportado dos Estados Unidos em até 365 dias da admissão.", "Un tanque de acero designado como IIT debe exportarse de los Estados Unidos dentro de los 365 días de su admisión."],
C:["Um tanque de aço só pode ser designado IIT se a Sra. Doe obtiver um basic custodial bond.", "Un tanque de acero solo puede designarse IIT si la Sra. Doe obtiene un basic custodial bond."],
D:["Um tanque de aço pode ser designado IIT isento de entry, mas continua sujeito aos requisitos de reporte de embarcação (vessel reporting).", "Un tanque de acero puede designarse IIT exento de entry, pero sigue sujeto a los requisitos de reporte de embarcación (vessel reporting)."]},
57:{q:["Izzie Stein é a importer of record (IOR) de um embarque de mercadorias que comprou diretamente de um fabricante estrangeiro. O embarque tem duties, taxes e fees estimados de $5,800.00. A Sra. Stein vendeu a mercadoria a um consignee. Ela paga ao seu customs broker os $5,800.00 devidos ao CBP, mas depois recebe aviso de que os duties nunca foram pagos. A quem o CBP vai cobrar os duties não pagos, e por quê?", "Izzie Stein es la importer of record (IOR) de un embarque de mercancías que compró directamente a un fabricante extranjero. El embarque tiene duties, taxes y fees estimados de $5,800.00. La Sra. Stein vendió la mercancía a un consignee. Le paga a su customs broker los $5,800.00 adeudados al CBP, pero después recibe aviso de que los duties nunca se pagaron. ¿A quién le cobrará el CBP los duties impagos y por qué?"],
A:["Ao customs broker, porque recebeu o pagamento do duty da Sra. Stein.", "Al customs broker, porque recibió el pago del duty de la Sra. Stein."],
B:["Ao fabricante estrangeiro, porque é a parte a quem se paga (pay-to party) na fatura comercial.", "Al fabricante extranjero, porque es la parte a quien se paga (pay-to party) en la factura comercial."],
C:["Ao consignee, porque recebeu o embarque das mercadorias.", "Al consignee, porque recibió el embarque de las mercancías."],
D:["À Sra. Stein, porque ela é a importer of record.", "A la Sra. Stein, porque ella es la importer of record."]},
58:{q:["A High End Store (High End), varejista dos EUA, apresentou pedido de ruling administrativo para a classificação de uma blusa feminina com capuz antes da importação. Foi emitida a New York Ruling Letter (NY) N123456 para a High End, classificando a blusa com capuz na subheading 6106.20.2010 do HTSUS. A decisão trazia a seguinte instrução: \"[u]ma cópia do ruling ou o número de controle indicado acima deve ser fornecido com os documentos da entry no momento da importação desta mercadoria.\" O fabricante que produz as blusas com capuz para a High End também produz blusas idênticas para a Discount Retailer, outra varejista dos EUA. Ambas importaram as blusas após a emissão da NY N123456. Qual das afirmações a seguir é VERDADEIRA?", "High End Store (High End), minorista de EE. UU., presentó una solicitud de ruling administrativo para la clasificación de una blusa femenina con capucha antes de la importación. Se emitió la New York Ruling Letter (NY) N123456 a High End, clasificando la blusa con capucha en la subheading 6106.20.2010 del HTSUS. La decisión incluía la siguiente instrucción: \"[u]na copia del ruling o el número de control indicado arriba debe entregarse con los documentos de la entry al momento de importar esta mercancía.\" El fabricante que produce las blusas con capucha para High End también produce blusas idénticas para Discount Retailer, otro minorista de EE. UU. Ambas importaron las blusas tras la emisión de la NY N123456. ¿Cuál de las siguientes afirmaciones es VERDADERA?"],
A:["A Discount Retailer pode classificar suas blusas com capuz idênticas na subheading 6106.20.2010 do HTSUS, apoiando-se na NY N123456.", "Discount Retailer puede clasificar sus blusas con capucha idénticas en la subheading 6106.20.2010 del HTSUS, apoyándose en la NY N123456."],
B:["Ao revisar a documentação da entry apresentada pela Discount Retailer, o Center Director pode solicitar informações adicionais sobre as blusas importadas. Se concluir que a Discount Retailer não obteve ruling confirmando que suas blusas também são classificáveis na 6106.20.2010, o Center Director é obrigado a suspender a liquidação da entry até que a Discount Retailer obtenha um ruling.", "Al revisar la documentación de la entry presentada por Discount Retailer, el Center Director puede solicitar información adicional sobre las blusas importadas. Si concluye que Discount Retailer no obtuvo un ruling que confirme que sus blusas también se clasifican en la 6106.20.2010, el Center Director está obligado a suspender la liquidación de la entry hasta que Discount Retailer obtenga un ruling."],
C:["Antes de se apoiar na NY N123456, emitida para a High End, a Discount Retailer deve escrever ao Port Director do porto de entrada e pedir esclarecimento sobre se a NY N123456 foi modificada ou revogada.", "Antes de apoyarse en la NY N123456, emitida para High End, Discount Retailer debe escribir al Port Director del puerto de entrada y pedir aclaración sobre si la NY N123456 fue modificada o revocada."],
D:["Uma vez publicada, a NY N123456 não está sujeita a modificação ou revogação, diferentemente de outras ruling letters administrativas que não classificam mercadoria.", "Una vez publicada, la NY N123456 no está sujeta a modificación o revocación, a diferencia de otras ruling letters administrativas que no clasifican mercancía."]},
59:{q:["Na primeira violação, o CBP pode impor multa civil a quem dirigir, auxiliar financeiramente ou de outro modo, ou concorrer para a importação de mercadoria apreendida por ostentar marca contrafeita (counterfeit), no valor de:", "En la primera violación, el CBP puede imponer una multa civil a quien dirija, ayude financieramente o de otro modo, o colabore en la importación de mercancía incautada por llevar una marca falsificada (counterfeit), por un monto de:"],
A:["Não mais que o valor doméstico da mercadoria importada no momento da apreensão.", "No más del valor doméstico de la mercancía importada al momento de la incautación."],
B:["Não mais que o valor que a mercadoria teria se fosse genuína, segundo o preço sugerido de varejo (MSRP) nos Estados Unidos no momento da apreensão.", "No más del valor que la mercancía habría tenido si fuera genuina, según el precio sugerido de venta (MSRP) en los Estados Unidos al momento de la incautación."],
C:["Não mais que o dobro do valor doméstico da mercadoria importada no momento da apreensão.", "No más del doble del valor doméstico de la mercancía importada al momento de la incautación."],
D:["Não mais que o dobro do valor que a mercadoria teria se fosse genuína, segundo o preço sugerido de varejo (MSRP) nos Estados Unidos no momento da apreensão.", "No más del doble del valor que la mercancía habría tenido si fuera genuina, según el precio sugerido de venta (MSRP) en los Estados Unidos al momento de la incautación."]},
60:{q:["O Petty Officer John Doe, da Marinha dos EUA, está voltando para Washington, D.C. após um período prolongado de serviço em Hokkaido, Japão. Ele quer importar, sem pagamento de duty, a motocicleta café racer vintage que adquiriu no Japão para uso pessoal nos Estados Unidos. Ao procurar um customs broker licenciado para providenciar a importação e a entry da moto, qual das perguntas a seguir é RELEVANTE para apurar se a motocicleta pode receber tratamento livre de duty sob o 19 CFR Part 148, Subpart H?", "El Petty Officer John Doe, de la Marina de EE. UU., regresa a Washington, D.C. tras un período prolongado de servicio en Hokkaido, Japón. Quiere importar, sin pago de duty, la motocicleta café racer vintage que adquirió en Japón para su uso personal en los Estados Unidos. Al contactar a un customs broker licenciado para gestionar la importación y la entry de la moto, ¿cuál de las siguientes preguntas es RELEVANTE para determinar si la motocicleta puede recibir trato libre de duty bajo el 19 CFR Part 148, Subpart H?"],
A:["A motocicleta teve seu valor aumentado ou sua condição melhorada por algum processo de manufatura ou outro meio depois da compra no exterior?", "¿La motocicleta ha sido aumentada en valor o mejorada en condición por algún proceso de manufactura u otro medio después de su compra en el extranjero?"],
B:["Desde que o Sr. Doe comprou a motocicleta, ela serviu como efeito pessoal ou foi usada para fins comerciais após ter sido ofertada à venda?", "Desde que el Sr. Doe compró la motocicleta, ¿ha servido como efecto personal o se ha usado con fines comerciales tras ser ofrecida en venta?"],
C:["A motocicleta é um produto do Japão?", "¿La motocicleta es un producto de Japón?"],
D:["O Sr. Doe apresentou o CBP Form 6059-B para a motocicleta, que chegará a D.C. um mês depois do voo de volta dele?", "¿El Sr. Doe presentó el CBP Form 6059-B para la motocicleta, que llegará a D.C. un mes después de su vuelo de regreso?"]},
61:{q:["Um A.T.A. carnet (Admission Temporaire – Temporary Admission) é o documento reproduzido como Anexo à Customs Convention on the A.T.A. Carnet for the Temporary Admission of Goods. O A.T.A. carnet emitido conforme essa Convenção e os regulamentos aplicáveis do CBP deve indicar o período de validade. Qual é o prazo máximo dessa validade, contado da data de emissão?", "Un A.T.A. carnet (Admission Temporaire – Temporary Admission) es el documento reproducido como Anexo de la Customs Convention on the A.T.A. Carnet for the Temporary Admission of Goods. El A.T.A. carnet emitido conforme a esa Convención y a los reglamentos aplicables del CBP debe indicar su período de validez. ¿Cuál es el plazo máximo de esa validez, contado desde la fecha de emisión?"],
A:["1 ano", "1 año"],
B:["2 anos", "2 años"],
C:["3 anos", "3 años"],
D:["4 anos", "4 años"]},
62:{q:["Quando o país de origem é determinado com base em um método de gestão de estoque (inventory management method)?", "¿Cuándo se determina el país de origen con base en un método de gestión de inventario (inventory management method)?"],
A:["Quando as mercadorias são não fungíveis, consistem em materiais indiretos e foram desmontadas.", "Cuando las mercancías son no fungibles, consisten en materiales indirectos y han sido desarmadas."],
B:["Quando as mercadorias são não fungíveis, foram misturadas (commingled) e a identificação física direta da origem não é praticável.", "Cuando las mercancías son no fungibles, han sido mezcladas (commingled) y la identificación física directa del origen no es practicable."],
C:["Quando as mercadorias são fungíveis, foram misturadas (commingled) e a identificação física direta da origem não é praticável.", "Cuando las mercancías son fungibles, han sido mezcladas (commingled) y la identificación física directa del origen no es practicable."],
D:["Sempre que as mercadorias forem fungíveis, independentemente de outros atributos.", "Siempre que las mercancías sean fungibles, sin importar otros atributos."]},
63:{q:["Qual dos exemplos de mercadoria substituída a seguir é elegível a unused merchandise drawback nos termos do 19 USC 1313(j)(2)?", "¿Cuál de los siguientes ejemplos de mercancía sustituida es elegible para unused merchandise drawback conforme al 19 USC 1313(j)(2)?"],
A:["Chá preto Amaretto, não fermentado, classificado na subheading 0902.10.9015 do HTSUS; substituindo chá Earl Grey importado, não fermentado, classificado na subheading 0902.10.9015 do HTSUS.", "Té negro Amaretto, no fermentado, clasificado en la subheading 0902.10.9015 del HTSUS; en sustitución de té Earl Grey importado, no fermentado, clasificado en la subheading 0902.10.9015 del HTSUS."],
B:["Amendoim cru, sem casca, classificado na subheading 1202.41.8040 do HTSUS; substituindo amendoim cru, sem casca, importado, classificado na subheading 1202.41.8040 do HTSUS.", "Maní crudo, sin cáscara, clasificado en la subheading 1202.41.8040 del HTSUS; en sustitución de maní crudo, sin cáscara, importado, clasificado en la subheading 1202.41.8040 del HTSUS."],
C:["Chocolate e outras preparações alimentícias contendo cacau, classificados na subheading 1806.20.2028 do HTSUS; substituindo chocolate e outras preparações alimentícias contendo cacau importados, classificados na subheading 1806.20.2038 do HTSUS.", "Chocolate y otras preparaciones alimenticias que contienen cacao, clasificados en la subheading 1806.20.2028 del HTSUS; en sustitución de chocolate y otras preparaciones alimenticias con cacao importados, clasificados en la subheading 1806.20.2038 del HTSUS."],
D:["Vinho de uvas frescas, incluindo vinho fortificado, classificado na subheading 2204.21.8030 do HTSUS; substituindo vinho de uvas frescas importado, incluindo vinho fortificado, classificado na 2204.21.8060 do HTSUS.", "Vino de uvas frescas, incluido vino fortificado, clasificado en la subheading 2204.21.8030 del HTSUS; en sustitución de vino de uvas frescas importado, incluido vino fortificado, clasificado en la 2204.21.8060 del HTSUS."]},
64:{q:["A mercadoria chega de Ontário, Canadá, e sabe-se que o país de origem é Ontário, Canadá. Em 15 de maio de 1997, o código ISO de país para mercadorias de origem canadense foi substituído pelo Canadian Province Code. Contudo, sob seis condições, \"CA\" continua sendo código ISO aceitável. Com base nas informações dos entry summaries apresentados, qual deles NÃO exibe corretamente \"CA\" como país de origem no lugar de \"XO\", o código da província de Ontário?", "La mercancía llega de Ontario, Canadá, y se sabe que el país de origen es Ontario, Canadá. El 15 de mayo de 1997, el código ISO de país para mercancías de origen canadiense fue reemplazado por el Canadian Province Code. Sin embargo, bajo seis condiciones, \"CA\" sigue siendo un código ISO aceptable. Con base en la información de los entry summaries presentados, ¿cuál de ellos NO muestra correctamente \"CA\" como país de origen en lugar de \"XO\", el código de la provincia de Ontario?"],
A:["O entry summary com Entry Type 06 (consumo de FTZ)", "El entry summary con Entry Type 06 (consumo de FTZ)"],
B:["O entry summary com Entry Type 07 (consumo com quota/AD-CVD)", "El entry summary con Entry Type 07 (consumo con quota/AD-CVD)"],
C:["O entry summary com Entry Type 11 (informal)", "El entry summary con Entry Type 11 (informal)"],
D:["O entry summary com Entry Type 31 (warehouse)", "El entry summary con Entry Type 31 (warehouse)"]},
65:{q:["A Speedy Imports recebeu três embarques de adesivos exportados do México por caminhão. Cada embarque entrou nos Estados Unidos em data diferente: o primeiro em 10 de junho, o segundo em 12 de junho e o terceiro em 14 de junho deste ano. Os adesivos de todos os embarques são classificados na subheading 3506.10.5000 do HTSUS e incluem adesivos de origem norte-americana e mexicana. Todos os embarques são consignados à Sticky Fingers LLC. A Speedy Imports consolidou as três entries em um único entry summary em 15 de junho, identificando cada entry pelo seu número. Depois, foi notificada de que o entry summary havia sido rejeitado. Com base nessas informações, o que melhor explica a rejeição?", "Speedy Imports recibió tres embarques de adhesivos exportados desde México por camión. Cada embarque entró a los Estados Unidos en una fecha distinta: el primero el 10 de junio, el segundo el 12 de junio y el tercero el 14 de junio de este año. Los adhesivos de todos los embarques se clasifican en la subheading 3506.10.5000 del HTSUS e incluyen adhesivos de origen estadounidense y mexicano. Todos los embarques están consignados a Sticky Fingers LLC. Speedy Imports consolidó las tres entries en un solo entry summary el 15 de junio, identificando cada entry por su número. Luego fue notificada de que el entry summary fue rechazado. Con base en esta información, ¿qué explica mejor el rechazo?"],
A:["O tempo entre a data da primeira entry e a da última excedeu o prazo permitido.", "El tiempo entre la fecha de la primera entry y la de la última excedió el plazo permitido."],
B:["O entry summary foi apresentado tarde demais em relação às datas das entries.", "El entry summary se presentó demasiado tarde en relación con las fechas de las entries."],
C:["O país de origem da mercadoria não era o mesmo para toda a mercadoria.", "El país de origen de la mercancía no era el mismo para toda la mercancía."],
D:["A mercadoria não estava consignada a um único consignee.", "La mercancía no estaba consignada a un solo consignee."]},
66:{q:["A USA Corporation importa uma máquina especializada, desmontada e dividida em vários embarques por razões de entrega. Uma ferramenta específica é usada para produzir essa máquina, e o custo dessa ferramenta é somado ao valor da máquina como assist. A USA Corporation decide pagar duties sobre o valor integral da ferramenta já no primeiro embarque, em vez de dividir esse valor entre todas as entries da máquina. Qual é o termo aduaneiro para essa alocação de assists?", "USA Corporation importa una máquina especializada, desarmada y dividida en varios embarques por razones de entrega. Se usa una herramienta específica para producir esa máquina, y el costo de esa herramienta se suma al valor de la máquina como assist. USA Corporation decide pagar duties sobre el valor total de la herramienta en el primer embarque, en lugar de dividir ese valor entre todas las entries de la máquina. ¿Cuál es el término aduanero para esa asignación de assists?"],
A:["Inclusion", "Inclusion"],
B:["Deduction", "Deduction"],
C:["Proration", "Proration"],
D:["Apportionment", "Apportionment"]},
67:{q:["Um fabricante irlandês de acessórios de golfe, atuando como importer of record, importa bolas de golfe para distribuir como brinde promocional em um torneio que patrocina. Como não há venda no momento da importação, que valor deve constar na fatura?", "Un fabricante irlandés de accesorios de golf, actuando como importer of record, importa pelotas de golf para regalar como promoción en un torneo que patrocina. Como no hay venta al momento de la importación, ¿qué valor debe constar en la factura?"],
A:["O valor calculado com base no valor médio de embarque do fabricante nos últimos 12 meses.", "El valor calculado con base en el valor promedio de embarque del fabricante en los últimos 12 meses."],
B:["O maior valor que o fabricante já recebeu pela venda de mercadorias similares.", "El mayor valor que el fabricante haya recibido por la venta de mercancías similares."],
C:["Não há valor, porque não há venda.", "No hay valor, porque no hay venta."],
D:["O valor que teria se o fabricante vendesse as bolas de golfe a um importador no curso normal do comércio.", "El valor que tendría si el fabricante vendiera las pelotas de golf a un importador en el curso ordinario del comercio."]},
68:{q:["Calcule o duty da mercadoria a seguir. Cogumelos shiitake frescos (não secos) foram importados para os Estados Unidos. O valor faturado dos cogumelos é de $7.56 por quilograma. O embarque tem 2.000 quilogramas.", "Calcule el duty de la siguiente mercancía. Se importaron a los Estados Unidos hongos shiitake frescos (no secos). El valor facturado de los hongos es de $7.56 por kilogramo. El embarque tiene 2.000 kilogramos."],
A:["$1,730.56", "$1,730.56"],
B:["$3,024.00", "$3,024.00"],
C:["$3,200.00", "$3,200.00"],
D:["$4,784.00", "$4,784.00"]},
69:{q:["Qual das opções a seguir é uma limitação ao uso do transaction value para mercadoria importada?", "¿Cuál de las siguientes es una limitación al uso del transaction value para mercancía importada?"],
A:["O preço pago pelo comprador pela mercadoria importada está condicionado ao preço pelo qual o comprador vende outra mercadoria ao vendedor da mercadoria.", "El precio que paga el comprador por la mercancía importada está condicionado al precio al que el comprador vende otra mercancía al vendedor de la mercancía."],
B:["A revenda e o uso da mercadoria importada pelo comprador são limitados geograficamente por lei.", "La reventa y el uso de la mercancía importada por el comprador están limitados geográficamente por ley."],
C:["Comprador e vendedor são relacionados; contudo, essa relação não influencia o preço da mercadoria importada.", "El comprador y el vendedor son partes relacionadas; sin embargo, esa relación no influye en el precio de la mercancía importada."],
D:["O comprador está impedido de vender a mercadoria importada antes de uma data determinada.", "El comprador tiene prohibido vender la mercancía importada antes de una fecha determinada."]},
70:{q:["Um embarque de 1.000 garrafas de água fabricadas na Alemanha é registrado a $20.00 por unidade no Porto da Filadélfia. As garrafas foram embarcadas de Hamburgo para a Filadélfia com custo de frete de $300.00. Na fatura, um crédito de $10,000.00 por pagamento anterior a maior feito pelo comprador foi aplicado ao preço de venda. O total devido na fatura é de $10,300.00. Qual é o transaction value da mercadoria com base nessas informações?", "Un embarque de 1.000 botellas de agua fabricadas en Alemania se registra a $20.00 por unidad en el Puerto de Filadelfia. Las botellas se embarcaron de Hamburgo a Filadelfia con un costo de flete de $300.00. En la factura, un crédito de $10,000.00 por un pago anterior en exceso del comprador se aplicó al precio de venta. El total adeudado en la factura es de $10,300.00. ¿Cuál es el transaction value de la mercancía con base en esta información?"],
A:["$10,000.00", "$10,000.00"],
B:["$20,300.00", "$20,300.00"],
C:["$10,300.00", "$10,300.00"],
D:["$20,000.00", "$20,000.00"]},
71:{q:["Se o transaction value of similar merchandise não puder ser determinado, qual das opções a seguir é base aceitável de valoração (appraisement) para mercadoria importada?", "Si no puede determinarse el transaction value of similar merchandise, ¿cuál de las siguientes es una base aceptable de valoración (appraisement) para mercancía importada?"],
A:["O preço da mercadoria para exportação a um país que não os Estados Unidos", "El precio de la mercancía para exportación a un país distinto de los Estados Unidos"],
B:["O preço da mercadoria no mercado interno do país de exportação", "El precio de la mercancía en el mercado interno del país de exportación"],
C:["O valor mínimo (minimum value)", "El valor mínimo (minimum value)"],
D:["O deductive value", "El deductive value"]},
72:{q:["Qual dos custos a seguir NÃO deve ser somado ao price actually paid or payable para determinar o transaction value de uma entry de bolsas de couro feitas à mão?", "¿Cuál de los siguientes costos NO debe sumarse al price actually paid or payable para determinar el transaction value de una entry de bolsos de cuero hechos a mano?"],
A:["O couro fornecido gratuitamente pelo comprador norte-americano aos designers italianos que farão a bolsa", "El cuero provisto gratuitamente por el comprador estadounidense a los diseñadores italianos que harán el bolso"],
B:["As royalties que o comprador norte-americano é obrigado a pagar como condição da venda", "Las regalías que el comprador estadounidense debe pagar como condición de la venta"],
C:["Os custos de frete pagos pelo comprador norte-americano para importar as bolsas", "Los costos de flete pagados por el comprador estadounidense para importar los bolsos"],
D:["O valor da dívida que os compradores norte-americanos perdoam aos designers italianos em troca do embarque das bolsas", "El monto de deuda que los compradores estadounidenses condonan a los diseñadores italianos a cambio del embarque de los bolsos"]},
73:{q:["A ASW Furnishings (ASW), empresa de móveis de Los Angeles, concordou em comprar 5.000 cadeiras da Big House, fabricante de móveis na Polônia. A ASW fornece à Big House os seguintes insumos para a produção das cadeiras, gratuitamente:\n• Especificações de design criadas por um designer de móveis de Chicago, adquiridas por valor fixo de $3,200.00.\n• 2.500 jardas de tecido de algodão para estofamento, que a Big House adquiriu por $2.00 a jarda na Polônia e enviou à empresa de serigrafia da ASW na África do Sul. A ASW pagou $1.00 por jarda à serigrafia sul-africana para aplicar um desenho no tecido, antes de devolvê-lo à fábrica da Big House na Polônia.\nA Big House importa as cadeiras para os Estados Unidos em cinco embarques de 1.000 cadeiras cada. A ASW concorda em pagar à Big House $375,000.00 pelo pedido inteiro de 5.000 cadeiras, sem incluir o valor dos assists. Se a Big House optar por ratear o valor total dos assists por toda a produção prevista de 5.000 cadeiras, qual é o dutiable value de um embarque de 1.000 cadeiras?", "ASW Furnishings (ASW), empresa de muebles de Los Ángeles, acordó comprar 5.000 sillas a Big House, fabricante de muebles en Polonia. ASW suministra a Big House los siguientes insumos para la producción de las sillas, gratuitamente:\n• Especificaciones de diseño creadas por un diseñador de muebles de Chicago, adquiridas por un monto fijo de $3,200.00.\n• 2.500 yardas de tela de algodón para tapicería, que Big House adquirió a $2.00 la yarda en Polonia y envió a la empresa de serigrafía de ASW en Sudáfrica. ASW pagó $1.00 por yarda a la serigrafía sudafricana para aplicar un diseño a la tela, antes de devolverla a la fábrica de Big House en Polonia.\nBig House importa las sillas a los Estados Unidos en cinco embarques de 1.000 sillas cada uno. ASW acuerda pagar a Big House $375,000.00 por el pedido completo de 5.000 sillas, sin incluir el valor de los assists. Si Big House opta por prorratear el valor total de los assists sobre toda la producción prevista de 5.000 sillas, ¿cuál es el dutiable value de un embarque de 1.000 sillas?"],
A:["$75,500.00", "$75,500.00"],

D:["$77,140.00", "$77,140.00"]},
74:{q:["Uma montadora está importando peças de sua subsidiária no exterior para testes em seu novo modelo de veículo elétrico, ainda em pré-produção. As peças são testadas para determinar se são necessárias alterações antes de o veículo ir ao mercado. Em qual dos cenários a seguir essas peças seriam elegíveis a tratamento livre de duty sob a subheading 9817.85.01?", "Una automotriz está importando piezas de su filial en el extranjero para pruebas en su nuevo modelo de vehículo eléctrico, aún en preproducción. Las piezas se prueban para determinar si se requieren cambios antes de que el vehículo salga al mercado. ¿En cuál de los siguientes escenarios serían esas piezas elegibles para trato libre de duty bajo la subheading 9817.85.01?"],
A:["Depois de usadas pela montadora, as peças serão vendidas com desconto a uma escola local, para uso em suas aulas de oficina.", "Después de usarlas la automotriz, las piezas se venderán con descuento a una escuela local para sus clases de taller."],
B:["A empresa está usando as peças em testes de controle de qualidade do veículo.", "La empresa está usando las piezas en pruebas de control de calidad del vehículo."],
C:["A montadora está importando 10 vezes mais peças do que outras montadoras usaram no desenvolvimento de veículos elétricos semelhantes.", "La automotriz está importando 10 veces más piezas de las que otras automotrices usaron en el desarrollo de vehículos eléctricos similares."],
D:["Para evitar desperdício, as peças importadas de melhor funcionamento serão incorporadas a veículos que serão vendidos ao público.", "Para evitar desperdicio, las piezas importadas de mejor funcionamiento se incorporarán a vehículos que se venderán al público."]},
75:{q:["Ao determinar se as mercadorias se qualificam ao Acordo de Livre Comércio Estados Unidos-Colômbia, qual das opções a seguir NÃO é um acréscimo permitido ao valor dos materiais originários?", "Al determinar si las mercancías califican para el Tratado de Libre Comercio Estados Unidos-Colombia, ¿cuál de las siguientes NO es una adición permitida al valor de los materiales originarios?"],

76:{q:["Suco de laranja em recipientes a granel é importado para os Estados Unidos vindo do Marrocos. O suco é produzido assim: laranjas classificadas na heading 0805 são importadas da Espanha para o Marrocos. Água purificada da França é importada para o Marrocos. Citrato de cálcio, um conservante, é fabricado no Marrocos. O suco das laranjas (25% em volume e 70% em valor), a água (74,75% em volume e 29,5% em valor) e o citrato de cálcio (0,25% em volume e 0,5% em valor) são combinados no Marrocos e reembalados em recipientes a granel antes da exportação aos Estados Unidos. Na importação, o suco de laranja será classificado na subheading 2009.12.2500. Qual das opções indica corretamente o país de origem, o special program indicator e a alíquota de duty para esse suco de laranja?", "Se importa a los Estados Unidos jugo de naranja en recipientes a granel desde Marruecos. El jugo se produce así: naranjas clasificadas en la heading 0805 se importan de España a Marruecos. Agua purificada de Francia se importa a Marruecos. El citrato de calcio, un conservante, se fabrica en Marruecos. El jugo de las naranjas (25% en volumen y 70% en valor), el agua (74,75% en volumen y 29,5% en valor) y el citrato de calcio (0,25% en volumen y 0,5% en valor) se combinan en Marruecos y se reenvasan a granel antes de exportarse a los Estados Unidos. Al importarse, el jugo de naranja se clasificará en la subheading 2009.12.2500. ¿Cuál opción indica correctamente el país de origen, el special program indicator y la tasa de duty para ese jugo de naranja?"],
A:["Marrocos; MA; Free", "Marruecos; MA; Free"],
B:["Marrocos; nenhum; 4.5₵ por litro", "Marruecos; ninguno; 4.5₵ por litro"],
C:["Espanha; nenhum; 4.5₵ por litro", "España; ninguno; 4.5₵ por litro"],
D:["França; E; Free", "Francia; E; Free"]},
77:{q:["Considerando que a mercadoria satisfaz todos os demais requisitos aplicáveis do 19 CFR Part 182, qual é o percentual de De minimis permitido para fibras e fios não originários em mercadorias têxteis e de vestuário classificadas nos capítulos 61 a 63, ao pleitear o Acordo de Livre Comércio Estados Unidos-México-Canadá?", "Suponiendo que la mercancía satisface todos los demás requisitos aplicables del 19 CFR Part 182, ¿cuál es el porcentaje de De minimis permitido para fibras e hilados no originarios en mercancías textiles y de vestimenta clasificadas en los capítulos 61 a 63, al reclamar el Tratado de Libre Comercio Estados Unidos-México-Canadá?"],

78:{q:["Um Cylindrical Can Assembly da 8507.90 do HTSUS é produzido no México.\n• O único material não originário usado na produção é aço niquelado da 7212.50 do HTSUS, vindo da Coreia.\n• A produção no México resulta em transformação substancial (substantial transformation).\n• O importador busca tratamento tarifário preferencial sob o USMCA.\nCom base nessas informações, qual afirmação é VERDADEIRA?", "Un Cylindrical Can Assembly de la 8507.90 del HTSUS se produce en México.\n• El único material no originario usado en la producción es acero niquelado de la 7212.50 del HTSUS, procedente de Corea.\n• La producción en México resulta en una transformación sustancial (substantial transformation).\n• El importador busca trato arancelario preferencial bajo el USMCA.\nCon base en esta información, ¿cuál afirmación es VERDADERA?"],
A:["O Cylindrical Can Assembly não pode receber tratamento tarifário preferencial sob o USMCA porque contém material não originário do USMCA.", "El Cylindrical Can Assembly no puede recibir trato arancelario preferencial bajo el USMCA porque contiene un material no originario del USMCA."],
B:["O Cylindrical Can Assembly é elegível ao tratamento preferencial do USMCA porque é substancialmente transformado no México e passa a ser produto do México.", "El Cylindrical Can Assembly es elegible para el trato preferencial del USMCA porque se transforma sustancialmente en México y pasa a ser producto de México."],
C:["O Cylindrical Can Assembly não é elegível ao tratamento preferencial porque não é produzido nos Estados Unidos.", "El Cylindrical Can Assembly no es elegible para el trato preferencial porque no se produce en los Estados Unidos."],
D:["O Cylindrical Can Assembly cumpre a regra de origem aplicável do USMCA.", "El Cylindrical Can Assembly cumple la regla de origen aplicable del USMCA."]},
79:{q:["Uma alegação feita por parte interessada de que um importador de covered merchandise evadiu ordem de antidumping ou countervailing (AD/CVD) sob o Enforce and Protect Act de 2015 (EAPA) deve conter todas as informações a seguir, EXCETO:", "Una alegación de una parte interesada de que un importador de covered merchandise evadió una orden de antidumping o countervailing (AD/CVD) bajo el Enforce and Protect Act de 2015 (EAPA) debe contener toda la siguiente información, EXCEPTO:"],

80:{q:["A Bebe Mattresses (Bebe), importadora e fabricante italiana de colchões de algodão para camas infantis e berços, importou 140 colchões de cama infantil da WeSew, fabricante na China, com valor de $2,000.00 (US). A Bebe reembalou esses colchões em sacos plásticos individuais com o logotipo da Bebe. A Bebe embarcou os 140 colchões de cama infantil e 80 colchões de berço fabricados por ela na Itália para a Upscale Baby Furniture, compradora nos Estados Unidos. A Bebe faturou à Upscale $4,200.00 pelos 140 colchões de cama infantil e $1,700.00 pelos 80 colchões de berço. Qual das fórmulas abaixo resulta no depósito estimado de AD/CVD devido para essa mercadoria? Aplicam-se as alíquotas de \"all other companies\". A alíquota é ad valorem. Os casos, países e alíquotas possíveis são:\n• A-475-845-000; Itália; 257,06%\n• A-570-092-000; China; 1.731,75%\n• C-570-128-000; China; 97,78%\nNas fórmulas abaixo, \"x\" significa \"multiplicado por\".", "Bebe Mattresses (Bebe), importadora y fabricante italiana de colchones de algodón para camas infantiles y cunas, importó 140 colchones de cama infantil de WeSew, fabricante en China, con un valor de $2,000.00 (US). Bebe reempacó esos colchones en bolsas plásticas individuales con el logotipo de Bebe. Bebe embarcó los 140 colchones de cama infantil y 80 colchones de cuna fabricados por ella en Italia a Upscale Baby Furniture, compradora en los Estados Unidos. Bebe facturó a Upscale $4,200.00 por los 140 colchones de cama infantil y $1,700.00 por los 80 colchones de cuna. ¿Cuál de las fórmulas siguientes da como resultado el depósito estimado de AD/CVD adeudado por esta mercancía? Se aplican las tasas de \"all other companies\". La tasa es ad valorem. Los casos, países y tasas posibles son:\n• A-475-845-000; Italia; 257,06%\n• A-570-092-000; China; 1.731,75%\n• C-570-128-000; China; 97,78%\nEn las fórmulas siguientes, \"x\" significa \"multiplicado por\"."],
A:["($1,700.00 x 2.5706) + ($4,200.00 x 2.5706)", "($1,700.00 x 2.5706) + ($4,200.00 x 2.5706)"],
B:["($1,700.00 x 257.06) + ($2,000.00 x 1731.75) + ($2,000.00 x 97.78)", "($1,700.00 x 257.06) + ($2,000.00 x 1731.75) + ($2,000.00 x 97.78)"],
C:["($1,700.00 x 2.5706) + ($4,200.00 x 17.3175) + ($4,200.00 x .9778)", "($1,700.00 x 2.5706) + ($4,200.00 x 17.3175) + ($4,200.00 x .9778)"],
D:["($1,700.00 x 257.06) + ($4,200.00 x 1731.75) + ($4,200.00 x 97.78)", "($1,700.00 x 257.06) + ($4,200.00 x 1731.75) + ($4,200.00 x 97.78)"]}
}

[QUESTIONS,OCT2024,MAY2024,OCT2025,APR2025].forEach(arr=>{

    if(!q.scenario)return;
    if(/^Mesmo cen[aá]rio/i.test(q.scenario)){ if(full)q.scenario=full+"\n\n➕ "+q.scenario; }

  });
});

function toggleExam(id){
  if(sel.has(id)){if(sel.size>1)sel.delete(id);}else sel.add(id);

}
function selAll(){sel=new Set(EXAMS.map(e=>e.id));render();}
function examSelector(){
  return `<div class="card">
    <h3>${t("selTitle")}</h3>
    <div class="rowbtns" style="margin-top:6px">
      ${EXAMS.map(e=>`<button class="${sel.has(e.id)?'primary':'ghost'}" onclick="toggleExam('${e.id}')">${sel.has(e.id)?'✓ ':''}${e.label} (${e.qs.length})</button>`).join("")}
      ${EXAMS.length>1?`<button class="ghost" onclick="selAll()">${t("selAll")}</button>`:""}
    </div>
    <p class="note">${t("selNote").replace("{N}",pool().length)}</p>
  </div>`;
}

guidePractice:{pt:"<b>PRATICAR</b> ensina: uma questão por vez, correção na hora, dica de onde buscar no livro (💡 em 3 níveis) e o 🧭 Treino de Navegação contra o relógio.",en:"<b>PRACTICE</b> teaches: one question at a time, instant grading, where-to-look hints (💡 in 3 levels) and the 🧭 timed Navigation Drill.",es:"<b>PRACTICAR</b> enseña: una pregunta a la vez, corrección al instante, pistas de dónde buscar en el libro (💡 en 3 niveles) y el 🧭 Entrenamiento de Navegación contra el reloj."},
guideExam:{pt:"<b>SIMULADO</b> mede: prova completa com cronômetro no ritmo oficial, sem correção durante — a nota sai no final. Faça 1 por semana.",en:"<b>MOCK EXAM</b> measures: full exam with a timer at the official pace, no grading during — results at the end. Do 1 per week.",es:"<b>SIMULACRO</b> mide: examen completo con cronómetro al ritmo oficial, sin corrección durante — la nota sale al final. Haz 1 por semana."},
guideCivics:{pt:"<b>CIVICS 🇺🇸</b> é a cidadania: as 128 perguntas oficiais em cartas inteligentes que voltam na hora certa de revisar. 15 min por dia bastam.",en:"<b>CIVICS 🇺🇸</b> is citizenship: the 128 official questions as smart flashcards that return right when it's time to review. 15 min a day is enough.",es:"<b>CIVICS 🇺🇸</b> es la ciudadanía: las 128 preguntas oficiales en tarjetas inteligentes que vuelven justo cuando toca repasar. 15 min al día bastan."},
guideReading:{pt:"<b>LEITURA 🔊</b> treina o ouvido: frases faladas em inglês → português → espanhol, com modo lento. Ouça e repita em voz alta.",en:"<b>READING 🔊</b> trains your ear: sentences spoken in English → Portuguese → Spanish, with slow mode. Listen and repeat out loud.",es:"<b>LECTURA 🔊</b> entrena el oído: frases habladas en inglés → portugués → español, con modo lento. Escucha y repite en voz alta."},
guideMotto:{pt:"Resumo: Praticar ensina · Simulado mede · Civics é a cidadania · Leitura treina o ouvido.",en:"In short: Practice teaches · Mock Exam measures · Civics is citizenship · Reading trains your ear.",es:"En resumen: Practicar enseña · Simulacro mide · Civics es la ciudadanía · Lectura entrena el oído."},
tutorOffline:{pt:"📚 Fonte oficial desta questão: {CITE}\n\nA prova é de livro aberto — abra a fonte acima, a resposta mora ali. Treinar esse caminho é exatamente o que a prova cobra.\n\n🤖 O Tutor IA com explicações personalizadas chega em breve, na versão com login.",en:"📚 Official source for this question: {CITE}\n\nThe exam is open book — open the source above, the answer lives there. Training that path is exactly what the exam demands.\n\n🤖 The AI Tutor with personalized explanations is coming soon, in the login version.",es:"📚 Fuente oficial de esta pregunta: {CITE}\n\nEl examen es a libro abierto — abre la fuente de arriba, la respuesta vive ahí. Entrenar ese camino es exactamente lo que exige el examen.\n\n🤖 El Tutor IA con explicaciones personalizadas llega pronto, en la versión con login."},
civTutorOffline:{pt:"📚 As respostas oficiais estão logo acima — memorize uma delas e treine dizê-la em voz alta em inglês (use o 🔊).\n\n🤖 O Tutor IA com dicas de memorização chega em breve, na versão com login.",en:"📚 The official answers are right above — memorize one of them and practice saying it out loud in English (use the 🔊).\n\n🤖 The AI Tutor with memory tips is coming soon, in the login version.",es:"📚 Las respuestas oficiales están justo arriba — memoriza una y practica decirla en voz alta en inglés (usa el 🔊).\n\n🤖 El Tutor IA con consejos de memorización llega pronto, en la versión con login."},
civTest:{pt:"Teste — todas as 128",en:"Test — all 128",es:"Examen — las 128"},
civTestSub:{pt:"O teste percorre as 128 perguntas oficiais com 3 alternativas. Acertou, a pergunta vai para o fim da fila; errou, ela volta logo — e continua voltando até você acertar. Tudo fica salvo: pare e continue quando quiser.",en:"The test goes through all 128 official questions with 3 choices. Get it right and the question goes to the back of the line; miss it and it comes back soon — and keeps coming back until you get it right. Everything is saved: stop and resume anytime.",es:"El examen recorre las 128 preguntas oficiales con 3 opciones. Si aciertas, la pregunta va al final de la fila; si fallas, vuelve pronto — y sigue volviendo hasta que aciertes. Todo queda guardado: para y continúa cuando quieras."},

civTestDoneMsg:{pt:"Na entrevista real são até 20 perguntas e 12 certas aprovam — a sua taxa de acerto acima diz se você está pronto. As erradas já estão na fila do Estudar e voltarão com mais frequência na próxima rodada.",en:"In the real interview you get up to 20 questions and 12 correct pass — your accuracy above tells you if you are ready. The missed ones are queued in Study and will come back more often next round.",es:"En la entrevista real son hasta 20 preguntas y 12 correctas aprueban — tu tasa de acierto de arriba dice si estás listo. Las falladas ya están en la fila de Estudiar y volverán con más frecuencia en la próxima ronda."},

function qKey(q){return q.exam+"#"+q.n;}
function startPractice(cat){
  const p=pool();
  let base = cat==="all" ? p.slice() : p.filter(q=>q.cat===cat);
  base = shuffle(base); // ordem sempre embaralhada
  // histórico: questão com mais erro que acerto ganha uma aparição extra na sessão
  const qs=stGet("cbleqstats")||{};
  const extras=[];
  base.forEach(q=>{const s=qs[qKey(q)];if(s&&s.w>s.r)extras.push(q);});
  extras.forEach(q=>base.splice(Math.floor(Math.random()*(base.length+1)),0,q));
  practice.list=base;
  practice.idx=0; resetQ(); renderPractice();
}
function resetQ(){practice.answered=null;practice.pick=null;practice.chat=[];practice.loading=false;practice.hintLvl=0;practice.trLang=null;}
function cbleTr(q){const e=(typeof CBLE_TR!=="undefined"&&CBLE_TR[q.exam])?CBLE_TR[q.exam][q.n]:null;return e||null;}

function hintFor(q){
  const c=q.cite||"";
  if(/ANULADA/i.test(c))return t("hintAnnulled");
  const out=[];
  const PN=PART_NAMES[lang]||PART_NAMES.pt;
  const HC=HTS_CH[lang]||HTS_CH.pt;
  const parts=[...new Set([...c.matchAll(/19 CFR (?:Part )?(\d{1,3})/g)].map(m=>parseInt(m[1])))].filter(p=>p!==351);
  if(parts.length){
    const vols=p=>p<=140?"volume Parts 1–140":"volume Parts 141–199";
    out.push("📕 <b>19 CFR</b> — "+parts.map(p=>`Part ${p}${PN[p]?" ("+PN[p]+")":""} · ${vols(p)}`).join("; "));
  }
  if(/19 CFR 351/.test(c))out.push("📕 <b>19 CFR</b> — Part 351 ("+(PN[351]||"AD/CVD")+") · "+t("volEnd"));
  const chs=new Set();
  [...c.matchAll(/\b(\d{4})\.\d{2}/g)].forEach(m=>chs.add(parseInt(m[1].slice(0,2))));
  [...c.matchAll(/Chapter (\d{1,2})/g)].forEach(m=>chs.add(parseInt(m[1])));
  [...c.matchAll(/\bCh\. (\d{1,2})/g)].forEach(m=>chs.add(parseInt(m[1])));
  if(chs.size)out.push("📗 <b>HTSUS</b> — "+[...chs].sort((a,b)=>a-b).map(ch=>`${t("chWord")} ${ch}${HC[ch]?" ("+HC[ch]+")":""}`).join("; ")+". "+t("hintNotes"));
  if(/GRI/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGRI"));
  if(/Additional U\.S\. Rules/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintAddl"));
  if(/General Note|GN /.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGN"));
  if(/General Statistical Note/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintGSN"));
  if(/Annex C/.test(c))out.push("📗 <b>HTSUS</b> — "+t("hintAnnex"));
  if(/ACE (Entry Summary Instructions|ES)/i.test(c))out.push("📘 <b>ACE Entry Summary Instructions</b> "+t("hintACEES"));
  if(/BRPD|Business Rules/i.test(c))out.push("📘 <b>ACE BRPD</b> "+t("hintBRPD"));
  if(/RTME|Right to Make Entry/i.test(c))out.push("📘 <b>RTME Directive 3530-002A</b> "+t("hintRTME"));
  return out.length?out.join("<br>"):t("hintFallback");
}
function hintL1(q){
  const c=q.cite||"";
  if(/ANULADA/i.test(c))return t("hintAnnulled");
  const out=[];
  const cfr=[...c.matchAll(/19 CFR (?:Part )?(\d{1,3})/g)].map(m=>+m[1]);
  if(cfr.length){
    const vols=[...new Set(cfr.map(p=>p>=200?t("volEnd"):(p<=140?"volume Parts 1–140":"volume Parts 141–199")))];
    out.push("📕 <b>19 CFR</b> — "+vols.join(" + "));
  }
  if(/HTSUS|GRI|General Note|GN |Chapter|Additional U\.S\. Rules|General Statistical|Annex C/.test(c)||/\b\d{4}\.\d{2}/.test(c))out.push("📗 <b>HTSUS</b>");
  if(/ACE (Entry Summary|ES)/i.test(c))out.push("📘 <b>ACE Entry Summary Instructions</b>");
  if(/BRPD|Business Rules/i.test(c))out.push("📘 <b>ACE BRPD</b>");
  if(/RTME|Right to Make Entry/i.test(c))out.push("📘 <b>RTME Directive 3530-002A</b>");
  return out.join("<br>")||t("hintFallback");
}
function hintLevels(q,lvl){
  if(/ANULADA/i.test(q.cite||""))return t("hintAnnulled");
  const parts=[`<div class="hlvl">${t("hintLvl")} 1/3 — ${t("hintLvlBook")}</div>`+hintL1(q)];
  if(lvl>=2)parts.push(`<div class="hlvl">${t("hintLvl")} 2/3 — ${t("hintLvlPart")}</div>`+hintFor(q));
  if(lvl>=3)parts.push(`<div class="hlvl">${t("hintLvl")} 3/3 — ${t("hintLvlExact")}</div>📌 <b>${esc(q.cite)}</b>`);
  return parts.join('<div class="hsep"></div>');
}

async function askTutor(preset){
  const q=practice.list[practice.idx];

  const sys=`You are an expert tutor for the U.S. Customs Broker License Exam (CBLE). ALWAYS answer in ${tutorLang}, clearly and didactically, in plain text (no markdown). The exam is open book: always point out WHERE to find the answer (19 CFR part/section, HTSUS chapter/note, applicable GRI, or ACE document). Be concise (max ~250 words).`;
  const context=`PROVA: ${examLabel(q.exam)}\nQUESTÃO ${q.n} (Categoria ${q.cat} - ${catName(q.cat)}):\n${q.scenario?("CENÁRIO: "+q.scenario+"\n"):""}${q.q}\nA) ${q.opts.A}\nB) ${q.opts.B}\nC) ${q.opts.C}\nD) ${q.opts.D}\nRESPOSTA(S) CORRETA(S) segundo o gabarito oficial: ${q.ans.join(", ")}\nCITAÇÃO OFICIAL: ${q.cite}\nO aluno respondeu: ${practice.pick} (${practice.answered?"acertou":"errou"}).`;

  for(let i=1;i<practice.chat.length;i++){
    msgs.push({role:practice.chat[i].role==="user"?"user":"assistant",content:practice.chat[i].text});
  }
  try{
    const r=await fetch(TUTOR_URL,{
      method:"POST",headers:{"Content-Type":"application/json","x-access-code":atob(GATE_CODE_B64)},
      body:JSON.stringify({system:sys,messages:msgs})
    });
    if(!r.ok)throw new Error("api "+r.status);
    const data=await r.json();
    const out=(data.text||"").trim();
    if(!out)throw new Error("empty");
    practice.chat.push({role:"ai",text:out});
  }catch(e){
    practice.chat.push({role:"ai",text:t("tutorOffline").replace("{CITE}",q.cite||"—")});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){

  exam={active:true,qs,answers:{},idx:0,end:Date.now()+ms,timerId:setInterval(tickClock,1000),done:false,score:null,hintLvl:0,showTr:false};
  renderExam();
}
function pickExam(k,L){exam.answers[k]=L;renderExam();}
function tickClock(){
  const el=$("clock");if(!el)return;
  const ms=exam.end-Date.now();
  if(ms<=0){finishExam();return;}
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  el.textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if(ms<15*60000)el.classList.add("low");
}
function finishExam(){
  clearInterval(exam.timerId);
  let correct=0;const byCat={};Object.keys(CATS).forEach(c=>byCat[c]={c:0,t:0});
  exam.qs.forEach(q=>{
    byCat[q.cat].t++;
    const a=exam.answers[uid(q)];
    if(a&&q.ans.includes(a)){correct++;byCat[q.cat].c++;}
    if(a){stats[q.cat].total++;if(q.ans.includes(a))stats[q.cat].correct++;}
  });
  exam.done=true;exam.active=false;exam.score={correct,byCat,total:exam.qs.length};
  stSet("stats",stats);
  examHist.unshift({d:Date.now(),c:correct,t:exam.qs.length});
  examHist=examHist.slice(0,20);stSet("examhist",examHist);
  renderExam();window.scrollTo(0,0);
}

const CIV_CATS={
  GA:{pt:"Princípios do Governo",en:"Principles of Government",es:"Principios del Gobierno"},
  GB:{pt:"Sistema de Governo",en:"System of Government",es:"Sistema de Gobierno"},
  GC:{pt:"Direitos e Responsabilidades",en:"Rights and Responsibilities",es:"Derechos y Responsabilidades"},
  HA:{pt:"Período Colonial e Independência",en:"Colonial Period and Independence",es:"Período Colonial e Independencia"},
  HB:{pt:"Século XIX (1800s)",en:"1800s",es:"Siglo XIX (1800s)"},
  HC:{pt:"História Recente",en:"Recent American History",es:"Historia Reciente"},
  SY:{pt:"Símbolos",en:"Symbols",es:"Símbolos"},
  HO:{pt:"Feriados",en:"Holidays",es:"Días Festivos"}
};
const civCatName=k=>CIV_CATS[k][lang]||CIV_CATS[k].pt;
const civTrQ=n=>{const tr=CIVICS_TR[n];if(!tr||lang==="en")return "";return lang==="pt"?tr.q[0]:tr.q[1];};
const civTrA=n=>{const tr=CIVICS_TR[n];if(!tr||!tr.a||lang==="en")return null;return lang==="pt"?tr.a[0]:tr.a[1];};
const DAY=86400000;
let civ={deck:stGet("civdeck")||{},session:[],pos:0,flipped:false,mode:null,browseCat:null,chat:null,loading:false,graded:0,test:null};
function civState(n){if(!civ.deck[n])civ.deck[n]={reps:0,ease:2.5,ivl:0,due:0,seen:false,lapses:0};return civ.deck[n];}
function civDueCards(filter){
  const now=Date.now();
  return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>{const s=civState(c.n);return s.seen&&s.due<=now;});
}
function civNewCards(filter){return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>!civState(c.n).seen);}
function civMasteredCount(filter){return CIVICS.filter(c=>(!filter||filter(c))).filter(c=>civState(c.n).ivl>=4).length;}
function civReadiness(){
  let sum=0;
  CIVICS.forEach(c=>{const s=civState(c.n);sum+=s.ivl>=4?1:(s.reps>=1?0.5:0);});
  return Math.round(sum/CIVICS.length*100);
}
function civStartSession(mode){
  const filter = mode==="star" ? (c=>c.s===1) : null;
  const due=civDueCards(filter), fresh=civNewCards(filter);
  let list=due.slice(0,30);
  const newLimit=mode==="star"?20:12;
  list=list.concat(fresh.slice(0,Math.max(0,newLimit-Math.floor(due.length/3))));
  if(!list.length)list=CIVICS.filter(c=>(!filter||filter(c))).slice().sort((a,b)=>civState(a.n).due-civState(b.n).due).slice(0,15);
  civ.session=shuffle(list.slice());civ.pos=0;civ.flipped=false;civ.mode=mode;civ.chat=null;civ.graded=0;
  renderCivics();
}
function civGrade(g){ // 0=errei 1=difícil 2=bom 3=fácil
  const card=civ.session[civ.pos];const s=civState(card.n);
  s.seen=true;
  if(g===0){s.reps=0;s.ivl=0;s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);s.due=Date.now();
    const re=Math.min(civ.session.length,civ.pos+4);
    civ.session.splice(re,0,card); // reaparece nesta sessão
  }else if(g===1){s.ivl=Math.max(1,Math.round(s.ivl*1.2))||1;s.ease=Math.max(1.3,s.ease-0.15);s.reps++;s.due=Date.now()+s.ivl*DAY;}
  else if(g===2){s.reps++;s.ivl=s.reps===1?1:(s.reps===2?3:Math.round(s.ivl*s.ease));s.due=Date.now()+s.ivl*DAY;}
  else{s.reps++;s.ivl=Math.max(4,Math.round((s.ivl||1)*s.ease*1.3));s.ease=Math.min(3.0,s.ease+0.1);s.due=Date.now()+s.ivl*DAY;}
  civ.graded++;civ.pos++;civ.flipped=false;civ.chat=null;
  stSet("civdeck",civ.deck);
  renderCivics();window.scrollTo(0,0);
}
function civTestOpts(c){ // 1 oficial + 2 distratoras (mesma categoria primeiro), sem repetir
  const correct=c.a[Math.floor(Math.random()*c.a.length)];
  const others=shuffle(CIVICS.filter(x=>x.n!==c.n&&x.c===c.c).flatMap(x=>x.a)
    .concat(shuffle(CIVICS.filter(x=>x.n!==c.n&&x.c!==c.c).flatMap(x=>x.a))));
  const seen=new Set([correct.toLowerCase()]);const dis=[];
  for(const o of others){const k=o.toLowerCase();if(!seen.has(k)){seen.add(k);dis.push(o);if(dis.length===2)break;}}
  const opts=shuffle([correct].concat(dis));
  return {opts,correctIdx:opts.indexOf(correct)};
}
function civTestSetCur(){
  const T=civ.test,n=T.queue[T.pos],c=CIVICS.find(x=>x.n===n);
  const o=civTestOpts(c);T.cur={n,opts:o.opts,correctIdx:o.correctIdx};
}
function civTestSave(){stSet("civtest",civ.test);}
function civStartTest(fresh){
  const saved=fresh?null:stGet("civtest");
  if(saved&&saved.queue&&saved.pos<saved.queue.length&&saved.cur){ // retoma exatamente de onde parou
    civ.test=saved;civ.mode="test";renderCivics();window.scrollTo(0,0);return;
  }
  const stats=stGet("civtstats")||{};
  // fila nova: as 128 embaralhadas; histórico de mais erro que acerto = aparição extra na rodada
  let queue=shuffle(CIVICS.map(c=>c.n));
  CIVICS.forEach(c=>{const s=stats[c.n];if(s&&s.w>s.r)queue.splice(Math.floor(Math.random()*(queue.length+1)),0,c.n);});
  civ.test={queue,pos:0,score:0,picked:null,cur:null};
  civTestSetCur();
  civ.mode="test";civTestSave();renderCivics();window.scrollTo(0,0);
}
function civTestPick(i){
  const T=civ.test;if(T.picked!==null&&T.picked!==undefined)return;
  T.picked=i;
  const n=T.cur.n;const stats=stGet("civtstats")||{};
  if(!stats[n])stats[n]={w:0,r:0};
  if(i===T.cur.correctIdx){T.score++;stats[n].r++;}
  else{
    stats[n].w++;
    const s=civState(n);s.seen=true;s.due=Date.now();stSet("civdeck",civ.deck); // erro entra na fila do Estudar
    // errou: a pergunta volta daqui a 4-8 posições (máx. 2 reaparições futuras)
    const future=T.queue.slice(T.pos+1).filter(x=>x===n).length;
    if(future<2){const at=Math.min(T.queue.length,T.pos+4+Math.floor(Math.random()*5));T.queue.splice(at,0,n);}
  }
  stSet("civtstats",stats);civTestSave();renderCivics();
}
function civTestNext(){
  const T=civ.test;T.pos++;T.picked=null;
  if(T.pos<T.queue.length){civTestSetCur();civTestSave();}
  else{stSet("civtest",null);} // rodada fechada: limpa o salvo, mantém o histórico
  renderCivics();window.scrollTo(0,0);
}

async function civExplain(){

  const tutorLang={pt:"português brasileiro",en:"English",es:"español"}[lang];
  const sys=`You are a friendly tutor helping an immigrant prepare for the U.S. naturalization civics test (oral, in English). ALWAYS answer in ${tutorLang}, in plain text (no markdown), max ~150 words. Explain the MEANING of the question and answer in very simple terms, give one easy memory tip or association, and remind how to say the answer in English.`;
  const user=`Question ${c.n}: ${c.q}\nOfficial answers: ${c.a.join(" | ")}${c.d?"\nNOTE: this answer changes with elections/appointments — remind the student to check uscis.gov/citizenship/testupdates.":""}`;
  try{
    const r=await fetch(TUTOR_URL,{method:"POST",headers:{"Content-Type":"application/json","x-access-code":atob(GATE_CODE_B64)},
      body:JSON.stringify({system:sys,messages:[{role:"user",content:user}]})});
    if(!r.ok)throw new Error("api "+r.status);
    const data=await r.json();
    const out=(data.text||"").trim();
    if(!out)throw new Error("empty");
    civ.chat=out;
  }catch(e){civ.chat=t("civTutorOffline");}
  civ.loading=false;renderCivics();
}

  const cand=[];
  for(const v of tts.voices){
    const L=v.lang.replace("_","-").toLowerCase();
    const i=pref.findIndex(p=>L.startsWith(p.replace("_","-")));
    if(i>=0)cand.push({v,i});
  }
  if(!cand.length)return null;

  const good=/natural|neural|online|premium|enhanced|google|siri|samantha|luciana|felipe|paulina|m[oó]nica|joanna|aria|jenny/i;

id #e3e3e3;vertical-align:top"><b>10 dias corridos, por escrito, ao processing Center</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Firma sem NENHUM licenciado qualificando (substituir o qualifying member/officer)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>120 dias contínuos — depois, licença e permit revogados by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Firma sem um licenciado como NATIONAL PERMIT QUALIFIER</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>180 dias contínuos — o national permit é revogado by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Aviso do CBP antes da revogação by operation of law</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>30 dias corridos ANTES — SE o broker avisou o CBP dos eventos com antecedência</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Não pagar a annual permit user fee</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>permit revogado by operation of law (após aviso)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.45(b) · 111.96(c)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reportar cyberbreach ao CBP</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>72 horas</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.21(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Triennial status report — janela de entrega</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>DURANTE fevereiro do ano de reporte (2027, 2030…); a partir de 1º de MARÇO = suspensão by operation of law</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reativar licença suspensa by operation of law</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>relatório + taxa em 60 dias do aviso</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.30(d)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Educação continuada</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>36 h por triênio</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.103</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Aplicar para a licença após passar no exame</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>3 anos</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.11</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Multa monetária máxima a broker</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>$30.000 por violação</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">111.91</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">🧾 Bonds — Part 113</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Protocolar continuous bond / rider antecipado</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>até 60 dias ANTES da data de vigência pedida</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.26</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Término do bond pelo PRINCIPAL</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>vale na data pedida se ela cair ≥10 dias ÚTEIS após o CBP receber o pedido; senão, no 10º dia útil seguinte</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(a)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Término do bond pela SURETY (com ou sem consentimento do principal)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>aviso razoável = 30 dias (à Revenue Division + ao principal); não desfaz obrigações já incorridas</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(b)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Efeito do término</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>nenhuma transação nova se cobra no bond terminado — exige bond novo (CBP Form 301)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">113.27(c)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Valor do bond de TIB</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>regra geral: o DOBRO dos duties (200%); equipamento profissional 9813.00.50 = 110% dos duties estimados incluindo fees</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.31(f) · Dir. 3510-004</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Cartman/lighterman com bond insuficiente (aviso escrito do CBP)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>remediar em 15 dias da notificação</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">112.25</td></tr><tr><td colspan="3" style="padding:8px 5px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px">📜 Regimes especiais</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — Temporary Importation under Bond</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>1 ano, prorrogável até 3 no total</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">10.37</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Mercadoria em bonded warehouse</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 anos da importação</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">144.5</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Drawback claim</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>5 anos da importação</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">190.51</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Reconciliation (fechar o flag)</td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top"><b>21 meses</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">ACE/159</td></tr></table>
  <p class="note" style="margin-top:10px">Os prazos acima são o esqueleto de memorização do exame. Regras têm exceções e mudam — na prova (livro aberto) e na vida real, a palavra final é sempre o texto vigente do 19 CFR.</p>
</div>
<div class="card">
  <h3>🗂️ Tipos de entry — o código do CBP Form 7501</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Código</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">O que é</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>01</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — o padrão: mercadoria livre ou tributada entrando no comércio</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>02</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — sujeita a quota/visa</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>03</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — sujeita a antidumping/countervailing (AD/CVD)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>06</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Consumo — saída de Foreign Trade Zone (FTZ)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>11</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Informal — remessas de baixo valor (regra geral até $2.500)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>21</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Warehouse — entrada em bonded warehouse (até 5 anos)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>22</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Re-warehouse — transferência para outro bonded warehouse/porto</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>23</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">TIB — importação temporária sob bond (1 ano, até 3)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>31</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Withdrawal — retirada do warehouse para consumo</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>51 / 52</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Governo — Defesa (51) e demais agências federais (52)</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>61 / 62 / 63</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">In-bond: IT / T&amp;E / IE — ver quadro do 7512 abaixo</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>86</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">Section 321 — de minimis até $800 com dados de PGA (via ACE)</td></tr></table>
</div>
<div class="card">
  <h3>🚛 In-bond — os três movimentos do CBP Form 7512</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Tipo</th><th style="text-align:left;padding:7px 5px;border-bottom:2px solid var(--navy)">Movimento</th></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IT — Immediate Transportation (61)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">A carga chega num porto e viaja sob bond até OUTRO porto americano, onde o entry será feito. Sem duty no trajeto.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>T&amp;E — Transportation &amp; Exportation (62)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">A carga atravessa os EUA sob bond só de passagem: entra por um porto e SAI do país por outro. Nunca entra no comércio americano.</td></tr><tr><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top;white-space:nowrap"><b>IE — Immediate Exportation (63)</b></td><td style="padding:7px 5px;border-bottom:1px solid #e3e3e3;vertical-align:top">A carga é exportada pelo MESMO porto onde chegou, sem entry de consumo.</td></tr></table>
  <p class="note" style="margin-top:10px">Memorize pela pergunta "onde a carga termina?": IT termina em outro porto dos EUA (para entry); T&amp;E termina fora do país saindo por outro porto; IE termina fora do país saindo pelo mesmo porto. Retiradas de warehouse para transporte/exportação também usam o 7512. Prazo operacional do in-bond: em regra, 30 dias para chegar ao destino (19 CFR 18).</p>
</div>
<div class="card">
  <h3>📜 Part 113 — bonds</h3>
  <p class="guideline"><b>Estrutura:</b> contrato tripartite — principal (importador/transportador) + surety (aprovada pelo Treasury, Circular 570) + CBP. Formulário: <b>CBP Form 301</b>.</p>
  <p class="guideline"><b>Tipos:</b> single transaction bond (STB) para uma operação; continuous bond cobre 12 meses com renovação automática.</p>
  <p class="guideline"><b>Valores:</b> continuous de importação (Activity 1) = <b>10% dos duties/taxes/fees dos últimos 12 meses, mínimo $50.000</b>. STB em geral = valor da mercadoria + duties (mercadoria de outras agências: valor ×3).</p>
  <p class="guideline"><b>Condições do 113.62 (Basic Importation Bond):</b> pagar duties no prazo, entregar entry summary em 10 dias úteis, apresentar documentos, <b>redelivery</b> quando exigido, manter registros, submeter a exame.</p>
  <p class="guideline"><b>Quebrou condição → liquidated damages:</b> cobrança pré-fixada contra principal E surety — padrão: valor da mercadoria; TIB não reexportada: <b>dobro dos duties</b>. Alívio via petition (Part 172).</p>
</div>
<div class="card" style="border-left:4px solid var(--stamp)">
  <h3>⚠️ Pares que a prova adora confundir</h3>
  <p class="guideline">• <b>Liquidation ≠ liquidated damages</b>: liquidation é o fechamento da conta do entry; liquidated damages é a multa contratual do bond.</p>
  <p class="guideline">• <b>Suspensão by operation of law ≠ disciplinar</b>: a primeira é automática (triennial não entregue) e reversível com relatório + taxa; a segunda exige processo.</p>
  <p class="guideline">• <b>Licença ≠ permit</b>: a licença habilita a pessoa/firma; o national permit habilita o exercício.</p>
  <p class="guideline">• <b>Surety responde solidariamente</b> — mas só até o limite do bond.</p>
  <p class="note" style="margin-top:10px">Valores e prazos mudam com o tempo — este guia é o esqueleto de memorização; na prova, a palavra final é o texto vigente do 19 CFR.</p>
</div>`,

<div class="card">
  <span class="eyebrow">The most tested parts of the exam · open book</span>
  <h2>⚖️ Broker & Bonds Guide — 19 CFR 111 and 113</h2>
  <p class="lead">Part 111 is the customs broker's statute; Part 113 is the guarantee contract holding the system together. Together they dominate the exam. Memorize the skeleton — and in the exam, confirm in the CFR.</p>
</div>
<div class="card" style="border-left:4px solid var(--gold)">
  <h3>🧾 "Customs business" — the definition that opens the exam (111.1)</h3>
  <p class="guideline"><b>It IS customs business</b> (done for others → requires a license): <b>entry and admissibility</b> of merchandise (including TIB entries); <b>classification and valuation</b>; <b>payment of duties/taxes/fees</b>; <b>refunds and drawback</b>; and preparing/signing documents for those activities intended for CBP.</p>
  <p class="guideline"><b>It is NOT customs business</b> (no license required): mere <b>electronic transmission of data</b> with no judgment over content; an importer acting <b>on its own behalf</b>; <b>corporate compliance activity</b> — guiding affiliates of the same group; marketing, freight and pure logistics.</p>
  <p class="guideline"><b>Customs territory (101.1):</b> the 50 states + District of Columbia + <b>Puerto Rico</b>. OUTSIDE: U.S. Virgin Islands, Guam and other territories — a recurring trap.</p>
  <p class="guideline"><b>National permit — point of contact:</b> the firm must designate a knowledgeable point of contact available to CBP <b>during AND outside normal operating hours</b>.</p>
  <p class="guideline"><b>Without a license (111.4):</b> penalty of <b>$10,000 per transaction/violation</b>, capped at <b>$30,000 total</b> for all violations.</p>
  <p class="note">The exam loves the negative side of the definition: wrong choices often dress up as "customs business" something that isn't — or vice versa.</p>
</div>
<div class="card">
  <h3>👤 Part 111 — the license and the profession</h3>
  <p class="guideline"><b>Individual license (111.11):</b> U.S. citizen, <b>21 years of age before applying</b>, not a federal employee, good moral character and <b>75% on the exam</b>. The application (CBP <b>Form 3124</b> + fee) must be filed within <b>3 years</b> of passing.</p>
  <p class="guideline"><b>Firms:</b> a partnership/corporation is licensed by having at least <b>one licensed qualifying member/officer</b>, who must exercise responsible supervision and control (111.28).</p>
  <p class="guideline"><b>National permit:</b> single and nationwide — it enables customs business throughout the customs territory.</p>
  <p class="guideline"><b>Duties of conduct:</b> promptly transmit funds (CBP checks to the client; duties to CBP), separate accounts, do not withhold client documents, give written notice of debts owed to CBP, integrity — if a client refuses to correct a known error, the broker withdraws; no fee-sharing with anyone whose license was suspended/revoked.</p>
  <p class="guideline"><b>Discipline:</b> denial, suspension and revocation with notice and hearing; monetary penalty up to <b>$30,000</b> per violation.</p>
</div>

  <h3>⏱️ Master deadlines table — 19 CFR</h3>
