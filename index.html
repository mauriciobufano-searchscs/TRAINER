7:{q:["Um candidato teve sua licença de customs broker negada. Qual das opções melhor descreve a próxima providência que o candidato deve tomar para iniciar um recurso?", "A un solicitante se le negó la licencia de customs broker. ¿Cuál de las siguientes opciones describe mejor la próxima acción que debe tomar para iniciar una apelación?"],
A:["Apresentar ao Executive Assistant Commissioner, Office of Trade, por escrito, pedido de revisão adicional que o Executive Assistant Commissioner julgue apropriada, em até noventa (90) dias da negativa.", "Presentar al Executive Assistant Commissioner, Office of Trade, por escrito, una solicitud de revisión adicional que este considere apropiada, dentro de los noventa (90) días de la negativa."],
B:["Apresentar ao Executive Director competente, Office of Trade, por escrito, informações ou argumentos adicionais em apoio à aplicação. Tais informações e argumentos devem ser recebidos pelo Executive Director em até sessenta (60) dias corridos da negativa.", "Presentar al Executive Director competente, Office of Trade, por escrito, información o argumentos adicionales en apoyo de la solicitud. Esa información y argumentos deben ser recibidos por el Executive Director dentro de sesenta (60) días calendario de la negativa."],
C:["Recorrer da decisão à Court of International Trade em até trinta (30) dias da negativa.", "Apelar la decisión ante la Court of International Trade dentro de treinta (30) días de la negativa."],
D:["Recorrer apresentando recurso escrito ou eletrônico ao Office of Trade, CBP Headquarters, em até trinta (30) dias da negativa.", "Apelar presentando un recurso escrito o electrónico ante el Office of Trade, CBP Headquarters, dentro de treinta (30) días de la negativa."]},
8:{q:["Qual dos cenários a seguir demonstra que um customs broker pode ter deixado de manter responsible supervision and control sobre seu customs business?", "¿Cuál de los siguientes escenarios demuestra que un customs broker pudo haber dejado de mantener responsible supervision and control sobre su customs business?"],
A:["A John Smith Customs Brokerage (Smith) demitiu Sally Johnson (Johnson). Johnson estava listada na conta do portal ACE da Smith como ponto de contato qualificado, disponível ao CBP dentro e fora do horário normal de funcionamento. A Smith atualizou o registro da funcionária, mas não designou novo ponto de contato qualificado no ACE. O CBP não consegue contatar a Smith há mais de seis meses.", "John Smith Customs Brokerage (Smith) despidió a Sally Johnson (Johnson). Johnson figuraba en la cuenta del portal ACE de Smith como punto de contacto calificado, disponible para el CBP dentro y fuera del horario normal. Smith actualizó el registro de la empleada, pero no designó un nuevo punto de contacto calificado en ACE. El CBP no ha podido contactar a Smith por más de seis meses."],
B:["A Countrywide Customs Brokerage (Countrywide) tem dez escritórios nos Estados Unidos sob National Permit com plano de supervisão aprovado. Dois desses escritórios não têm broker licenciado no local e não têm há seis meses. Embora não tenha pedido waiver, a Countrywide mantém um broker licenciado fazendo visita de supervisão duas vezes por semana a esses escritórios.", "Countrywide Customs Brokerage (Countrywide) tiene diez oficinas en los Estados Unidos bajo un National Permit con plan de supervisión aprobado. Dos de esas oficinas no tienen broker licenciado en el sitio y no lo tienen desde hace seis meses. Aunque no solicitó un waiver, Countrywide mantiene a un broker licenciado haciendo visitas de supervisión dos veces por semana a esas oficinas."],
C:["A National Customs Brokerage (National) contratou, sem saber, James Jones, Sr., condenado por peculato há dez (10) anos. Na ficha de emprego, Jones declarou não ter condenações por crime grave e usou o número de seguridade social de outra pessoa. A National não pediu waiver para empregar um condenado.", "National Customs Brokerage (National) contrató, sin saberlo, a James Jones, Sr., condenado por malversación hace diez (10) años. En su solicitud de empleo, Jones declaró no tener condenas por delito grave y usó el número de seguro social de otra persona. National no solicitó un waiver para emplear a un condenado."],
D:["A Trustworthy Customs Broker Co. (Trustworthy) recebeu $10,000.00 de Sally Doe, importadora de estatuetas de vidro soprado. Sally designou a Trustworthy para fazer o pagamento de todas as importações ao longo de um ano e receber quaisquer reembolsos do CBP. Sally deve $4,000.00 de duties estimados por sua aquisição mais recente. A Trustworthy repassou o pagamento ao CBP em até 12 dias da chegada das estatuetas ao Porto de Long Beach.", "Trustworthy Customs Broker Co. (Trustworthy) recibió $10,000.00 de Sally Doe, importadora de figuras de vidrio soplado. Sally designó a Trustworthy para pagar todas las importaciones durante un año y cobrar cualquier reembolso del CBP. Sally adeuda $4,000.00 de duties estimados por su adquisición más reciente. Trustworthy remitió el pago al CBP dentro de los 12 días de la llegada de las figuras al Puerto de Long Beach."]},
9:{q:["Um broker deixou de apresentar seu triennial status report no prazo exigido e recebeu do CBP notificação escrita de suspensão da licença. Que providência o broker deve tomar para reativar a licença?", "Un broker no presentó su triennial status report en el plazo exigido y recibió del CBP notificación escrita de suspensión de su licencia. ¿Qué acción debe tomar el broker para reactivar la licencia?"],
A:["Pagar a taxa mais penalidade monetária designada pelo Executive Assistant Commissioner em até seis (6) meses da data da notificação de suspensão.", "Pagar la tarifa más una penalidad monetaria designada por el Executive Assistant Commissioner dentro de seis (6) meses de la fecha de la notificación de suspensión."],
B:["Apresentar o relatório eletronicamente por um sistema EDI autorizado pelo CBP em até dez (10) dias corridos da data da notificação de suspensão.", "Presentar el informe electrónicamente por un sistema EDI autorizado por el CBP dentro de diez (10) días calendario de la fecha de la notificación de suspensión."],
C:["Transmitir aviso escrito de recurso ao CBP por correio registrado, com aviso de recebimento, em até noventa (90) dias corridos da data da notificação de suspensão.", "Transmitir aviso escrito de apelación al CBP por correo certificado, con acuse de recibo, dentro de noventa (90) días calendario de la fecha de la notificación de suspensión."],
D:["Apresentar o relatório exigido e pagar a taxa em até sessenta (60) dias corridos da data da notificação de suspensão.", "Presentar el informe exigido y pagar la tarifa dentro de sesenta (60) días calendario de la fecha de la notificación de suspensión."]},
10:{q:["Qual das afirmações a seguir é VERDADEIRA? Para os fins desta questão, organização significa partnership, association ou corporation.", "¿Cuál de las siguientes afirmaciones es VERDADERA? Para los fines de esta pregunta, organización significa partnership, association o corporation."],
A:["O candidato a national permit que aplica em nome de uma organização deve ser customs broker individualmente licenciado e empregado da organização, e essa pessoa também será responsável por exercer responsible supervision and control sobre as atividades conduzidas sob aquele national permit.", "El solicitante de national permit que aplica en nombre de una organización debe ser customs broker licenciado individualmente y empleado de la organización, y esa persona también será responsable de ejercer responsible supervision and control sobre las actividades realizadas bajo ese national permit."],
B:["O candidato aprovado no exame para licença individual de broker pode requerer national permit, e o permit será emitido mesmo se a licença de broker for negada, desde que atendidos os requisitos do 19 CFR 111.19(b)(2)-(11), (c) e (d).", "El solicitante que aprueba el examen para licencia individual de broker puede pedir national permit, y el permit se emitirá aunque la licencia de broker sea negada, siempre que se cumplan los requisitos del 19 CFR 111.19(b)(2)-(11), (c) y (d)."],
C:["O broker organizacional deve receber district permit do processing Center antes de a organização poder requerer national permit para realizar customs business conforme os requisitos do 19 CFR Part 111.", "El broker organizacional debe recibir un district permit del processing Center antes de que la organización pueda solicitar un national permit para realizar customs business conforme a los requisitos del 19 CFR Part 111."],
D:["Um funcionário de broker pode, por conta própria e sem licença individual, estando nas instalações do empregador, celebrar powers of attorney entre ele e clientes seus e usar as instalações do empregador para realizar customs business em nome desses clientes.", "Un empleado de un broker puede, por cuenta propia y sin licencia individual, estando en las instalaciones del empleador, celebrar powers of attorney entre él y sus propios clientes y usar las instalaciones del empleador para realizar customs business en nombre de esos clientes."]},
11:{q:["Conforme os regulamentos do CBP relativos ao CBP's Office of Information Technology Security (CBP SOC), o que o broker deve fazer quando ocorre violação (breach) de registros físicos relacionados ao seu customs business?", "Conforme a los reglamentos del CBP relativos al CBP's Office of Information Technology Security (CBP SOC), ¿qué debe hacer el broker cuando ocurre una violación (breach) de registros físicos relacionados con su customs business?"],
A:["Notificar eletronicamente o CBP Office of Information Technology Security Operations Center (CBP SOC) em até 72 horas da descoberta e fornecer ao CBP SOC os números de identificação de importadores sabidamente comprometidos.", "Notificar electrónicamente al CBP Office of Information Technology Security Operations Center (CBP SOC) dentro de 72 horas del descubrimiento y proporcionarle los números de identificación de importadores comprometidos conocidos."],
B:["Notificar eletronicamente e por correio o CBP SOC em até 72 horas da descoberta e fornecer os números de identificação de importadores sabidamente comprometidos.", "Notificar electrónicamente y por correo al CBP SOC dentro de 72 horas del descubrimiento y proporcionar los números de identificación de importadores comprometidos conocidos."],
C:["Notificar o processing Center do broker em até 72 horas da descoberta e avisar aos clientes que suas operações estão temporariamente suspensas.", "Notificar al processing Center del broker dentro de 72 horas del descubrimiento y avisar a los clientes que sus operaciones están temporalmente suspendidas."],
D:["Notificar o CBP Executive Assistant Commissioner em até dez (10) dias da descoberta e fornecer os números de identificação de importadores sabidamente comprometidos.", "Notificar al CBP Executive Assistant Commissioner dentro de diez (10) días del descubrimiento y proporcionar los números de identificación de importadores comprometidos conocidos."]},
12:{q:["Qual das afirmações a seguir é FALSA?", "¿Cuál de las siguientes afirmaciones es FALSA?"],
A:["O broker deve repassar o pagamento ao Governo em até cinco (5) dias úteis do recebimento do cliente, se a data de vencimento já tiver passado.", "El broker debe remitir el pago al Gobierno dentro de cinco (5) días hábiles de recibirlo del cliente, si la fecha de vencimiento ya pasó."],
B:["Registros relativos aos negócios dos clientes atendidos por customs brokers devem ser considerados confidenciais.", "Los registros relativos a los negocios de los clientes atendidos por customs brokers deben considerarse confidenciales."],
C:["Sem exceção, o broker que importa mercadoria não pode atuar como broker de importador que importe mercadoria do mesmo caráter geral da importada pelo broker.", "Sin excepción, el broker que importa mercancía no puede actuar como broker de un importador que importe mercancía del mismo carácter general que la importada por el broker."],
D:["Cada broker deve exercer responsible supervision and control sobre a realização do customs business.", "Cada broker debe ejercer responsible supervision and control sobre la realización del customs business."]},
13:{q:["Qual das opções a seguir NÃO é exigida para que uma corporation registre entry / entry summary de mercadoria comercial em nome de terceiros?", "¿Cuál de las siguientes opciones NO se exige para que una corporation registre entry / entry summary de mercancía comercial en nombre de terceros?"],
A:["Um officer da corporation que seja customs broker licenciado.", "Un officer de la corporation que sea customs broker licenciado."],
B:["Licença de broker e national permit.", "Licencia de broker y national permit."],
C:["Uma power of attorney válida obtida do outorgante.", "Una power of attorney válida obtenida del otorgante."],
D:["Funcionalidade de Automated Broker Interface (ABI).", "Funcionalidad de Automated Broker Interface (ABI)."]},
14:{q:["Em qual das circunstâncias a seguir é exigida power of attorney na apresentação de um protest?", "¿En cuál de las siguientes circunstancias se exige una power of attorney al presentar un protest?"],
A:["Quando o protest é apresentado diretamente pelo importador.", "Cuando el protest lo presenta directamente el importador."],
B:["Quando o protest é apresentado pelo advogado do importador.", "Cuando el protest lo presenta el abogado del importador."],
C:["Quando o protest é apresentado por agente do importador, e esse agente não é advogado, customs broker licenciado nem funcionário autorizado de customs broker licenciado.", "Cuando el protest lo presenta un agente del importador, y ese agente no es abogado, customs broker licenciado ni empleado autorizado de un customs broker licenciado."],
D:["Não é exigida power of attorney para apresentar protest.", "No se exige power of attorney para presentar un protest."]},
15:{q:["John Rose tem licença individual de customs broker e um National Permit. Shady está importando dezoito (18) diamantes soltos de 1 quilate, no valor de $2,500.00 cada, totalizando $45,000.00, em sua bagagem. Shady chega de Londres, Inglaterra, em avião particular. Ele pretende montar os diamantes em anéis para vender em sua joalheria nos EUA. Rose obtém procuração de Shady para ser seu broker e avisa que os diamantes não precisam ser declarados porque são absolutamente livres de duty. Qual afirmação abaixo é VERDADEIRA quanto à penalidade que pode ser imposta nessas circunstâncias?", "John Rose tiene licencia individual de customs broker y un National Permit. Shady está importando dieciocho (18) diamantes sueltos de 1 quilate, valorados en $2,500.00 cada uno, con un total de $45,000.00, en su equipaje. Shady llega de Londres, Inglaterra, en avión privado. Pretende montar los diamantes en anillos para vender en su joyería en EE. UU. Rose obtiene un poder de Shady para ser su broker y le informa que los diamantes no necesitan declararse porque están absolutamente libres de duty. ¿Cuál afirmación es VERDADERA respecto de la penalidad que puede imponerse en estas circunstancias?"],
A:["Pode ser aplicada penalidade de $45,000.00 contra o cliente sob o 19 USC 1497, mas nenhuma penalidade será aplicada ao broker, pois só se pode aplicar uma penalidade.", "Puede aplicarse una penalidad de $45,000.00 contra el cliente bajo el 19 USC 1497, pero no se aplicará penalidad al broker, pues solo puede aplicarse una."],
B:["Pode ser aplicada penalidade de $45,000.00 contra o broker sob o 19 USC 1641(d)(1)(D), e penalidade de $45,000.00 contra o cliente sob o 19 USC 1497.", "Puede aplicarse una penalidad de $45,000.00 contra el broker bajo el 19 USC 1641(d)(1)(D), y una de $45,000.00 contra el cliente bajo el 19 USC 1497."],
C:["Pode ser aplicada penalidade de $30,000.00 contra o broker sob o 19 USC 1641(d)(1)(D), e penalidade de $45,000.00 contra o cliente sob o 19 USC 1497.", "Puede aplicarse una penalidad de $30,000.00 contra el broker bajo el 19 USC 1641(d)(1)(D), y una de $45,000.00 contra el cliente bajo el 19 USC 1497."],
D:["Pode ser aplicada penalidade de $30,000.00 sob o 19 USC 1641 contra o broker e o cliente conjuntamente, porque penalidades contra broker não podem exceder $30,000.00.", "Puede aplicarse una penalidad de $30,000.00 bajo el 19 USC 1641 contra el broker y el cliente conjuntamente, porque las penalidades contra un broker no pueden exceder $30,000.00."]},

18:{q:["A Baltimore Quick Printers é cliente ativa da Fast Broker LLC, com power of attorney celebrada em 1º de maio de 2020. Consulte na fatura do broker o texto do \"NOTICE TO CLIENT OF METHOD OF PAYMENT\" (o Aviso). Se a fatura não contivesse esse Aviso, qual(is) afirmação(ões) está(ão) correta(s) quanto à obrigação do broker de fornecer esse texto aos clientes ativos?\nI. O aviso não é exigido pelos regulamentos do Customs.\nII. O aviso é exigido em toda fatura do broker a clientes ativos, conforme os regulamentos do Customs.\nIII. O aviso é exigido na power of attorney entre broker e cliente, ou anexado a ela, conforme os regulamentos do Customs.\nIV. O aviso é exigido por escrito ao menos uma vez a cada período de 12 meses, conforme os regulamentos do Customs.", "Baltimore Quick Printers es cliente activa de Fast Broker LLC, con power of attorney celebrada el 1º de mayo de 2020. Consulte en la factura del broker el texto del \"NOTICE TO CLIENT OF METHOD OF PAYMENT\" (el Aviso). Si la factura no contuviera ese Aviso, ¿cuál(es) afirmación(es) es(son) correcta(s) respecto de la obligación del broker de entregar ese texto a los clientes activos?\nI. El aviso no es exigido por los reglamentos del Customs.\nII. El aviso es exigido en toda factura del broker a clientes activos, conforme a los reglamentos del Customs.\nIII. El aviso es exigido en la power of attorney entre broker y cliente, o adjunto a ella, conforme a los reglamentos del Customs.\nIV. El aviso es exigido por escrito al menos una vez cada período de 12 meses, conforme a los reglamentos del Customs."],
A:["I.", "I."],
B:["II.", "II."],
C:["II. e IV.", "II. y IV."],
D:["III. e IV.", "III. y IV."]},
19:{q:["Consulte a Commercial Invoice. Como o rebate oferecido pela Stampa Fabbrica, vendedora, à Baltimore Quick Printers, compradora, afeta o transaction value?", "Consulte la Commercial Invoice. ¿Cómo afecta al transaction value el rebate ofrecido por Stampa Fabbrica, la vendedora, a Baltimore Quick Printers, la compradora?"],

38:{q:["Em que momento se determina a classificação tarifária controlada pelo principal use (uso principal) nos Estados Unidos?", "¿En qué momento se determina la clasificación arancelaria controlada por el principal use (uso principal) en los Estados Unidos?"],
A:["Na data da exportação, ou imediatamente antes dela.", "En la fecha de exportación, o inmediatamente antes de ella."],
B:["Na data da importação, ou imediatamente antes dela.", "En la fecha de importación, o inmediatamente antes de ella."],
C:["Na data em que as mercadorias são entered, ou imediatamente depois.", "En la fecha en que las mercancías son entered, o inmediatamente después."],
D:["Em até três (3) anos após a data em que as mercadorias são entered.", "Dentro de tres (3) años después de la fecha en que las mercancías son entered."]},
39:{q:["Está sendo importado um embarque de batatas amarelas frescas. A fatura indica que as batatas são \"certified organic\" segundo __________, e o importador declarou que a mercadoria é classificável na 0701.90.1010. Qual das entidades a seguir NÃO preencheria corretamente a lacuna?", "Se importa un embarque de papas amarillas frescas. La factura indica que las papas son \"certified organic\" según __________, y el importador declaró que la mercancía se clasifica en la 0701.90.1010. ¿Cuál de las siguientes entidades NO completaría correctamente el espacio?"],
A:["O United States Department of Agriculture National Organic Program Regulation (7 CFR 205)", "El United States Department of Agriculture National Organic Program Regulation (7 CFR 205)"],
B:["As regulamentações Ley de Productos Orgánicos (RLPO) do Serviço Nacional mexicano de Sanidade Animal e Vegetal, Inocuidade e Qualidade Agroalimentar", "Las regulaciones Ley de Productos Orgánicos (RLPO) del Servicio Nacional mexicano de Sanidad, Inocuidad y Calidad Agroalimentaria"],
C:["As Canadian Organic Products Regulations (SOR/2006-338 COPR)", "Las Canadian Organic Products Regulations (SOR/2006-338 COPR)"],
D:["O Regulamento (CE) nº 834/2007 do Conselho da União Europeia (UE)", "El Reglamento (CE) nº 834/2007 del Consejo de la Unión Europea (UE)"]},
40:{q:["Consulte a tabela abaixo. Dentre as quatro alternativas, qual lista de pares associa corretamente as partes de uma classificação de 10 dígitos ao nível da hierarquia do Harmonized Tariff Schedule representado por esses dígitos?\nA) 01xx.xx.xxx — 1) Heading (posição)\nB) 0106.xx.xxxx — 2) Subheading (subposição)\nC) 0106.00.50xx — 3) Sufixo estatístico\nD) xxxx.xx.xx10 — 4) Chapter (capítulo)", "Consulte la tabla siguiente. De las cuatro alternativas, ¿cuál lista de pares asocia correctamente las partes de una clasificación de 10 dígitos con el nivel de la jerarquía del Harmonized Tariff Schedule representado por esos dígitos?\nA) 01xx.xx.xxx — 1) Heading (partida)\nB) 0106.xx.xxxx — 2) Subheading (subpartida)\nC) 0106.00.50xx — 3) Sufijo estadístico\nD) xxxx.xx.xx10 — 4) Chapter (capítulo)"],
A:["A1, B2, C3, D4", "A1, B2, C3, D4"],
B:["A3, B1, C2, D4", "A3, B1, C2, D4"],
C:["A4, B2, C1, D3", "A4, B2, C1, D3"],
D:["A4, B1, C2, D3", "A4, B1, C2, D3"]}
},
out2024:{
1:{q:["Qual ÚNICO dos permits a seguir constitui autoridade suficiente para um customs broker realizar customs business dentro do território aduaneiro dos Estados Unidos?", "¿Cuál ÚNICO de los siguientes permits constituye autoridad suficiente para que un customs broker realice customs business dentro del territorio aduanero de los Estados Unidos?"],
A:["National permit", "National permit"],
B:["Permit de association ou corporation", "Permit de association o corporation"],
C:["Permit de partnership", "Permit de partnership"],
D:["Nenhum permit", "Ningún permit"]},
2:{q:["Quem deve exercer responsible supervision and control (supervisão e controle responsáveis) sobre a realização de customs business de uma association ou corporation que seja broker?", "¿Quién debe ejercer responsible supervision and control (supervisión y control responsables) sobre la realización de customs business de una association o corporation que sea broker?"],
A:["Todos os funcionários da association ou corporation licenciada que também tenham licença de customs broker.", "Todos los empleados de la association o corporation licenciada que también tengan licencia de customs broker."],
B:["Apenas os funcionários licenciados que também sejam o license qualifier e/ou o permit qualifier da association ou corporation.", "Solo los empleados licenciados que además sean el license qualifier y/o el permit qualifier de la association o corporation."],
C:["Todo officer da association ou corporation licenciada, ainda que o officer não seja broker licenciado.", "Todo officer de la association o corporation licenciada, aunque el officer no sea broker licenciado."],
D:["Todo officer licenciado da association ou corporation licenciada.", "Todo officer licenciado de la association o corporation licenciada."]},
3:{q:["Ao preparar os documentos de entry para sua cliente Angel Industries, a Shady CHB percebe que o valor do seguro é bem menor que o valor da fatura comercial. A Angel explica que há duas faturas comerciais: a real (mais baixa), emitida pelo embarcador e usada para o seguro, e uma segunda fatura criada pela Angel com valor maior, usada para calcular o valor aduaneiro, sobre a qual paga duties, taxes e fees — um esquema para reduzir o lucro declarado no imposto de renda. O advogado da Shady recomenda encerrar a relação, porque o \"esquema da fatura dupla\" é fraudulento. Dentre as opções abaixo, qual é o melhor próximo passo da Shady?", "Al preparar los documentos de entry para su cliente Angel Industries, Shady CHB advierte que el valor del seguro es mucho menor que el valor de la factura comercial. Angel explica que hay dos facturas comerciales: la real (más baja), emitida por el embarcador y usada para el seguro, y una segunda factura creada por Angel con un valor mayor, usada para calcular el valor aduanero, sobre la cual paga duties, taxes y fees — un esquema para reducir la utilidad declarada en el impuesto a la renta. El abogado de Shady recomienda terminar la relación, porque el \"esquema de la doble factura\" es fraudulento. De las opciones siguientes, ¿cuál es el mejor próximo paso de Shady?"],
A:["A Shady documenta o esquema da fatura dupla, encerra imediatamente a relação com a Angel e informa ao CBP o nome do cliente, a data do encerramento e o motivo.", "Shady documenta el esquema de la doble factura, termina de inmediato la relación con Angel e informa al CBP el nombre del cliente, la fecha de terminación y el motivo."],
B:["A Shady vai registrar a entry usando o valor menor e correto e avisará a Angel de que, no futuro, só registrará entries com a fatura real do embarcador.", "Shady registrará la entry usando el valor menor y correcto y avisará a Angel que en el futuro solo registrará entries con la factura real del embarcador."],
C:["A Shady vai registrar a entry pelo valor pedido pela Angel e manterá a Angel como cliente, porque a possível fraude não envolve o CBP.", "Shady registrará la entry por el valor solicitado por Angel y mantendrá a Angel como cliente, porque el posible fraude no involucra al CBP."],
D:["A Shady vai registrar a entry como a Angel pediu, porque não é fraude pagar mais duties, taxes e fees do que o efetivamente devido.", "Shady registrará la entry como pidió Angel, porque no es fraude pagar más duties, taxes y fees de lo realmente adeudado."]},
4:{q:["A licença de customs broker de uma pessoa física é suspensa by operation of law (por força de lei) por falta de apresentação do triennial status report e do pagamento da taxa, e a pessoa recebeu a notificação de suspensão na forma prevista no regulamento. Quando a licença será revogada by operation of law se a pessoa não apresentar o relatório nem pagar a taxa?", "La licencia de customs broker de una persona física se suspende by operation of law (por ministerio de la ley) por no presentar el triennial status report ni pagar la tarifa, y la persona recibió la notificación de suspensión según lo previsto en el reglamento. ¿Cuándo se revocará la licencia by operation of law si la persona no presenta el informe ni paga la tarifa?"],
A:["No 30º dia útil após a data da notificação de suspensão", "En el 30º día hábil tras la fecha de la notificación de suspensión"],
B:["Em 31 de março do ano de reporte.", "El 31 de marzo del año de reporte."],
C:["No 61º dia corrido após a data da notificação de suspensão.", "En el 61º día calendario tras la fecha de la notificación de suspensión."],
D:["Na data em que for publicado no Federal Register o aviso de revogação.", "En la fecha en que se publique en el Federal Register el aviso de revocación."]},
5:{q:["____ deve constar de, ou estar anexado a, uma aplicação de novo national permit, para descrever como será exercida a responsible supervision and control sobre o customs business conduzido sob o national permit.", "____ debe constar en, o estar adjunto a, una solicitud de nuevo national permit, para describir cómo se ejercerá la responsible supervision and control sobre el customs business realizado bajo el national permit."],
A:["Um supervision plan (plano de supervisão)", "Un supervision plan (plan de supervisión)"],
B:["Uma proposta de regulamento", "Una propuesta de reglamento"],
C:["Um status report", "Un status report"],
D:["Uma estratégia de controle", "Una estrategia de control"]},
6:{q:["Qual é o número máximo de dias corridos que o contato designado para recordkeeping tem para disponibilizar os registros ao CBP, quando a solicitação NÃO especifica prazo adicional para a resposta?", "¿Cuál es el número máximo de días calendario que el contacto designado para recordkeeping tiene para poner los registros a disposición del CBP, cuando la solicitud NO especifica un plazo adicional para responder?"],
A:["10", "10"],
B:["15", "15"],
C:["30", "30"],
D:["60", "60"]},
7:{q:["Um customs broker devidamente licenciado foi nomeado em, e regularmente intimado por, um summons do CBP assinado por um Center Director. O summons exige que o broker forneça ao CBP a documentação de 10 entries que registrou em nome da Company Z nos últimos três anos. O broker encerrou a relação com a Company Z 10 meses antes da emissão do summons, e a POA foi revogada. A Company Z não deu ao broker instruções escritas específicas sobre como responder a um summons. Como o broker deve responder ao summons do CBP?", "Un customs broker debidamente licenciado fue nombrado en, y debidamente notificado de, un summons del CBP firmado por un Center Director. El summons exige que el broker entregue al CBP la documentación de 10 entries que registró en nombre de Company Z en los últimos tres años. El broker terminó la relación con Company Z 10 meses antes de la emisión del summons, y la POA fue revocada. Company Z no dio al broker instrucciones escritas específicas sobre cómo responder a un summons. ¿Cómo debe responder el broker al summons del CBP?"],
A:["Fornecer ao CBP os arquivos de entry solicitados, porque o broker é legalmente obrigado a disponibilizar tais registros ao CBP.", "Entregar al CBP los archivos de entry solicitados, porque el broker está legalmente obligado a poner esos registros a disposición del CBP."],
B:["Devolver o summons ao CBP, porque ele precisa ser assinado por um auditor ou special agent para ter eficácia legal.", "Devolver el summons al CBP, porque debe estar firmado por un auditor o special agent para tener eficacia legal."],
C:["Encaminhar o summons à Company Z e comunicar ao Center Director que ele foi encaminhado à parte obrigada a respondê-lo.", "Reenviar el summons a Company Z y comunicar al Center Director que fue enviado a la parte obligada a responderlo."],
D:["Nenhuma resposta ao summons é exigida, porque o período de retenção dos registros das entries da Company Z expirou com o encerramento da relação broker-cliente.", "No se exige respuesta al summons, porque el período de retención de los registros de las entries de Company Z expiró al terminar la relación broker-cliente."]},
8:{q:["A Sra. Crimson e o Sr. Blue são customs brokers individualmente licenciados. Eles constituem uma LLC e obtêm licença organizacional de customs broker como association. A LLC contrata a Sra. Yellow, também customs broker licenciada. Crimson é a sócia majoritária. Blue é o license qualifier. Yellow é a permit qualifier. Os três são officers da LLC. A LLC devolve sua licença organizacional e seu permit ao processing Center e encerra a atividade de corretagem. No encerramento, quem é responsável por notificar o CBP por escrito sobre o nome, endereço, e-mail e telefone da parte que tem a custódia legal dos registros de corretagem da LLC?", "La Sra. Crimson y el Sr. Blue son customs brokers licenciados individualmente. Constituyen una LLC y obtienen una licencia organizacional de customs broker como association. La LLC contrata a la Sra. Yellow, también customs broker licenciada. Crimson es la socia mayoritaria. Blue es el license qualifier. Yellow es la permit qualifier. Los tres son officers de la LLC. La LLC devuelve su licencia organizacional y su permit al processing Center y termina la actividad de corretaje. Al terminar, ¿quién es responsable de notificar al CBP por escrito el nombre, dirección, correo electrónico y teléfono de la parte que tiene la custodia legal de los registros de corretaje de la LLC?"],
A:["Apenas Blue, como license qualifier, é obrigado a notificar o CBP.", "Solo Blue, como license qualifier, está obligado a notificar al CBP."],
B:["Apenas Crimson, como sócia majoritária, é obrigada a notificar o CBP.", "Solo Crimson, como socia mayoritaria, está obligada a notificar al CBP."],
C:["Apenas Yellow, como permit qualifier, é obrigada a notificar o CBP.", "Solo Yellow, como permit qualifier, está obligada a notificar al CBP."],
D:["Crimson, Blue e Yellow, como brokers individualmente licenciados e officers da LLC, são todos obrigados a notificar o CBP.", "Crimson, Blue y Yellow, como brokers licenciados individualmente y officers de la LLC, están todos obligados a notificar al CBP."]},
9:{q:["Além do owner ou purchaser, dentre os seguintes, quem tem autoridade para assinar ou certificar transmissões eletrônicas da entry ou do entry summary?", "Además del owner o purchaser, de los siguientes, ¿quién tiene autoridad para firmar o certificar transmisiones electrónicas de la entry o del entry summary?"],
A:["Qualquer funcionário do customs broker devidamente designado.", "Cualquier empleado del customs broker debidamente designado."],
B:["Qualquer funcionário do customs broker devidamente designado que também tenha login no software de envio eletrônico do broker para transmitir dados ao CBP.", "Cualquier empleado del customs broker debidamente designado que además tenga acceso (login) al software de envío electrónico del broker para transmitir datos al CBP."],
C:["Todos os funcionários do customs broker devidamente designado que também tenham recebido power of attorney (POA) do customs broker.", "Todos los empleados del customs broker debidamente designado que además hayan recibido power of attorney (POA) del customs broker."],
D:["Um nominal consignee, em seu próprio nome, sem os serviços de um customs broker devidamente designado.", "Un nominal consignee, en su propio nombre, sin los servicios de un customs broker debidamente designado."]},
10:{q:["O outorgante de uma customs power of attorney (POA) a uma corretora aduaneira licenciada é uma limited partnership (sociedade em comandita) e importa produtos têxteis. O outorgante também tem POA com um freight forwarder, com outorga especial permitindo que o forwarder nomeie subagentes, inclusive customs brokers. Qual das afirmações a seguir é juridicamente FALSA?", "El otorgante de una customs power of attorney (POA) a una agencia aduanal licenciada es una limited partnership (sociedad en comandita) e importa productos textiles. El otorgante también tiene una POA con un freight forwarder, con una concesión especial que permite al forwarder designar subagentes, incluidos customs brokers. ¿Cuál de las siguientes afirmaciones es jurídicamente FALSA?"],
A:["Os nomes de todos os sócios gerais e comanditários da limited partnership devem constar no acordo de POA entre o customs broker e a limited partnership.", "Los nombres de todos los socios generales y comanditarios de la limited partnership deben constar en el acuerdo de POA entre el customs broker y la limited partnership."],
B:["A POA entre a limited partnership e o customs broker deve ter anexado o contrato social (partnership agreement) da limited partnership.", "La POA entre la limited partnership y el customs broker debe tener adjunto el contrato social (partnership agreement) de la limited partnership."],
C:["Se a POA entre a limited partnership e o customs broker foi firmada em 1º de março de 2024, uma nova power of attorney deve ser firmada até 1º de março de 2026.", "Si la POA entre la limited partnership y el customs broker se firmó el 1º de marzo de 2024, debe firmarse una nueva power of attorney a más tardar el 1º de marzo de 2026."],
D:["Ainda que o outorgante tenha dado ao freight forwarder o poder de nomear subagente, o outorgante continua obrigado a ter POA diretamente com o customs broker.", "Aunque el otorgante haya dado al freight forwarder el poder de designar un subagente, el otorgante sigue obligado a tener una POA directamente con el customs broker."]},
11:{q:["Qual das limitações a seguir, em uma limited power of attorney entre broker e importador, NÃO seria permitida pelos regulamentos do CBP?", "¿Cuál de las siguientes limitaciones, en una limited power of attorney entre broker e importador, NO estaría permitida por los reglamentos del CBP?"],
A:["Importador e broker são ambos corporations e o acordo de POA, firmado em 27 de outubro de 2024, estabelece validade até 27 de outubro de 2026.", "El importador y el broker son ambos corporations y el acuerdo de POA, firmado el 27 de octubre de 2024, establece validez hasta el 27 de octubre de 2026."],
B:["Importador e broker são ambos corporations e a POA estabelece que o broker só pode registrar entries dos embarques do importador que cheguem ao porto de entrada de Newark/Nova York.", "El importador y el broker son ambos corporations y la POA establece que el broker solo puede registrar entries de los embarques del importador que lleguen al puerto de entrada de Newark/Nueva York."],
C:["Importador e broker são ambos partnerships e o acordo de POA, firmado em 27 de outubro de 2024, estabelece validade até 31 de outubro de 2026.", "El importador y el broker son ambos partnerships y el acuerdo de POA, firmado el 27 de octubre de 2024, establece validez hasta el 31 de octubre de 2026."],
D:["Importador e broker são ambos pessoas físicas e a POA estabelece que o único customs business que o broker pode realizar em nome do importador é elaborar, assinar e apresentar protests.", "El importador y el broker son ambos personas físicas y la POA establece que el único customs business que el broker puede realizar en nombre del importador es elaborar, firmar y presentar protests."]},
12:{q:["A licença de customs broker de Sam Sly foi revogada by operation of law por falta de apresentação do triennial status report e do pagamento da taxa. Sam ignorou a carta de advertência do CBP achando que seu empregador havia apresentado por ele. Além do emprego, Sam faz trabalhos autônomos classificando mercadorias e preenchendo (sem registrar) documentos de entry para clientes captados em um site de freelancer. O CBP descobre que Sam se anuncia publicamente como customs broker licenciado e realizou customs business para cinco importadores de mercadorias comerciais depois de revogada a licença. O CBP envia notificação de penalidade de $10,000.00 por realizar customs business sem licença. É a primeira penalidade de Sam, ele pode pagar, mas pede mitigação alegando que não sabia da revogação. Com base nas diretrizes do Appendix C ao 19 CFR Part 171, o CBP vai mitigar e, em caso positivo, para qual valor?", "La licencia de customs broker de Sam Sly fue revocada by operation of law por no presentar el triennial status report ni pagar la tarifa. Sam ignoró la carta de advertencia del CBP creyendo que su empleador la había presentado por él. Además de su empleo, Sam hace trabajos independientes clasificando mercancías y llenando (sin registrarlos) documentos de entry para clientes captados en un sitio de freelance. El CBP descubre que Sam se anuncia públicamente como customs broker licenciado y realizó customs business para cinco importadores de mercancías comerciales después de revocada su licencia. El CBP envía una notificación de penalidad de $10,000.00 por realizar customs business sin licencia. Es la primera penalidad de Sam, puede pagar, pero pide mitigación alegando que no sabía de la revocación. Con base en las directrices del Appendix C al 19 CFR Part 171, ¿mitigará el CBP y, de ser así, a qué monto?"],
A:["Sim, o CBP vai mitigar para $250.00.", "Sí, el CBP mitigará a $250.00."],
B:["Sim, o CBP vai mitigar para $1,000.00.", "Sí, el CBP mitigará a $1,000.00."],
C:["Não, o CBP não vai mitigar a penalidade.", "No, el CBP no mitigará la penalidad."],
D:["Não, o CBP não vai mitigar e elevará a penalidade a $30,000.00 porque houve cinco violações.", "No, el CBP no mitigará y elevará la penalidad a $30,000.00 porque hubo cinco violaciones."]},
13:{q:["Se uma penalidade é aplicada ou uma apreensão é feita e restam menos de 180 dias para que a prescrição (statute of limitations) possa ser alegada como defesa, o Fines, Penalties, and Forfeitures Officer pode fixar, na notificação de apreensão ou penalidade, prazo razoável, não inferior a __________, para a apresentação da petition for relief.", "Si se aplica una penalidad o se hace una incautación y quedan menos de 180 días para que la prescripción (statute of limitations) pueda alegarse como defensa, el Fines, Penalties, and Forfeitures Officer puede fijar, en la notificación de incautación o penalidad, un plazo razonable, no menor a __________, para presentar la petition for relief."],
A:["7 dias úteis (working days)", "7 días hábiles (working days)"],
B:["7 dias, incluindo fins de semana", "7 días, incluyendo fines de semana"],
C:["10 dias úteis (business days)", "10 días hábiles (business days)"],
D:["30 dias úteis (working days)", "30 días hábiles (working days)"]},
14:{q:["Qual ÚNICA das opções a seguir está sujeita a apreensão obrigatória (mandatory seizure) sob o 19 USC 1595a(c)?", "¿Cuál ÚNICA de las siguientes está sujeta a incautación obligatoria (mandatory seizure) bajo el 19 USC 1595a(c)?"],
A:["Mercadoria furtada, contrabandeada ou importada/introduzida clandestinamente.", "Mercancía robada, de contrabando o importada/introducida clandestinamente."],
B:["Mercadoria que envolva violação de proteção de copyright, marca (trademark) ou nome comercial.", "Mercancía que involucre violación de protección de copyright, marca (trademark) o nombre comercial."],
C:["Mercadoria marcada intencionalmente em violação ao 19 USC 1304.", "Mercancía marcada intencionalmente en violación del 19 USC 1304."],
D:["Mercadoria que exige licença para ser importada e não vem acompanhada dessa licença.", "Mercancía que requiere licencia para su importación y no viene acompañada de dicha licencia."]},
15:{q:["Qual é o valor máximo pelo qual um broker pode ser penalizado por uma violação ou violações do 19 USC 1641 em uma única notificação de penalidade?", "¿Cuál es el monto máximo por el que puede penalizarse a un broker por una violación o violaciones del 19 USC 1641 en una sola notificación de penalidad?"],
A:["$25,000.00", "$25,000.00"],
B:["$30,000.00", "$30,000.00"],
C:["$50,000.00", "$50,000.00"],
D:["$100,000.00", "$100,000.00"]},
16:{q:["Qual das afirmações a seguir é FALSA quanto à Power of Attorney (POA)?", "¿Cuál de las siguientes afirmaciones es FALSA respecto de la Power of Attorney (POA)?"],
A:["A linguagem da POA confirmando que o agente da Echo é: 1) residente; e 2) autorizado a receber citação (service of process) contra a Echo significa que a POA pode ser aceita pelo CBP nos termos do 19 CFR 141.36.", "El texto de la POA que confirma que el agente de Echo es: 1) residente; y 2) está autorizado a recibir notificaciones judiciales (service of process) contra Echo significa que la POA puede ser aceptada por el CBP conforme al 19 CFR 141.36."],
B:["A POA também deve ter anexada documentação que comprove a autoridade de Joan McKay para firmá-la em nome da Echo, nos termos do 19 CFR 141.37.", "La POA también debe tener adjunta la documentación que acredite la autoridad de Joan McKay para firmarla en nombre de Echo, conforme al 19 CFR 141.37."],
C:["A notificação escrita prevista no 19 CFR 111.29(b)(1) deve constar na POA, ou estar a ela anexada, nos termos do 111.29(b)(2)(i).", "La notificación escrita prevista en el 19 CFR 111.29(b)(1) debe constar en la POA, o estar adjunta a ella, conforme al 111.29(b)(2)(i)."],
D:["A POA deve conter o selo corporativo (corporate seal) do outorgante, conforme especificado no 19 CFR 113.37(g)(1)(v).", "La POA debe contener el sello corporativo (corporate seal) del otorgante, según lo especificado en el 19 CFR 113.37(g)(1)(v)."]},
17:{q:["Qual das afirmações abaixo é VERDADEIRA?", "¿Cuál de las siguientes afirmaciones es VERDADERA?"],
A:["A Echo não precisa se registrar como IOR e não precisará de Importer Number no Box 23 do 7501.", "Echo no necesita registrarse como IOR y no necesitará un Importer Number en el Box 23 del 7501."],
B:["O CBP atribuirá à Echo um Employer Identification Number para a NBB usar em nome da Echo como Importer Number no Box 23 do 7501.", "El CBP asignará a Echo un Employer Identification Number para que NBB lo use en nombre de Echo como Importer Number en el Box 23 del 7501."],
C:["A NBB pode apresentar o Form 5106 para informar ao CBP o número da corporação canadense da Echo, a ser usado como Importer Number no Box 23 do 7501.", "NBB puede presentar el Form 5106 para informar al CBP el número de la corporación canadiense de Echo, para usarlo como Importer Number en el Box 23 del 7501."],
D:["A NBB pode apresentar o Form 5106 e o CBP atribuirá um número (Customs Assigned Number) para uso como Importer Number da Echo no Box 23 do 7501.", "NBB puede presentar el Form 5106 y el CBP asignará un número (Customs Assigned Number) para usarlo como Importer Number de Echo en el Box 23 del 7501."]},
18:{q:["A NBB conclui que precisa fazer um post-summary claim de USMCA em uma entry de consumo tipo 01 registrada em nome da Echo. Dentre os métodos a seguir de post-summary claim, qual ÚNICO NÃO pode ser usado para fazer um post-summary claim sob o USMCA?", "NBB concluye que necesita hacer un post-summary claim de USMCA en una entry de consumo tipo 01 registrada en nombre de Echo. De los siguientes métodos de post-summary claim, ¿cuál ÚNICO NO puede usarse para hacer un post-summary claim bajo el USMCA?"],

19:{q:["Como e quando a NBB pode responder da melhor forma em nome da Echo?", "¿Cómo y cuándo puede NBB responder de la mejor manera en nombre de Echo?"],
A:["Em até dois dias da rejeição do entry summary, a NBB responderá ao CBP que a rejeição é intempestiva porque o entry summary estava em paid status, e pedirá que a entry retorne ao ciclo de liquidação.", "Dentro de dos días del rechazo del entry summary, NBB responderá al CBP que el rechazo es extemporáneo porque el entry summary estaba en paid status, y pedirá que la entry vuelva al ciclo de liquidación."],
B:["Em até dois dias da rejeição do entry summary, a NBB reapresentará a entry como entry tipo 03 (antidumping), especificando o número correto do caso AD, corrigindo o país de origem para Austrália e recolhendo pagamento suplementar dos AD duties adicionais.", "Dentro de dos días del rechazo del entry summary, NBB volverá a presentar la entry como entry tipo 03 (antidumping), especificando el número correcto del caso AD, corrigiendo el país de origen a Australia y haciendo un pago suplementario de los AD duties adicionales."],
C:["Em até 10 dias da rejeição do entry summary, a NBB pedirá ao CBP que emita um CBP Form 29 Rate Advance e conceda 20 dias adicionais para recolher os AD duties.", "Dentro de 10 días del rechazo del entry summary, NBB pedirá al CBP que emita un CBP Form 29 Rate Advance y conceda 20 días adicionales para pagar los AD duties."],
D:["Trezentos dias da data da entry, a NBB apresentará uma post-summary correction (PSC) para mudar o entry type de 01 para 03, atualizar o país de origem, incluir o número correto do caso AD e pedir liquidação acelerada com cobrança dos AD duties adicionais devidos.", "Trescientos días desde la fecha de la entry, NBB presentará una post-summary correction (PSC) para cambiar el entry type de 01 a 03, actualizar el país de origen, incluir el número correcto del caso AD y solicitar liquidación acelerada con el cobro de los AD duties adicionales adeudados."]},

A:["Um cubo plástico de 2\" com um único tubo de crimpagem atravessando o cubo. Um cabo de fibra óptica multifilamentar é empurrado através do tubo, estabilizando o cabo para que possa ser dividido em filamentos menores e conectado a vários dispositivos.", "Un cubo plástico de 2\" con un único tubo de crimpado que lo atraviesa. Un cable de fibra óptica multifilamento se empuja a través del tubo, estabilizando el cable para que pueda dividirse en filamentos menores y conectarse a varios dispositivos."],

D:["Uma caixa metálica de 8\"x8\"x2\" com quatro bancos de portas de fibra óptica, contendo múltiplos circuitos integrados repetidores de sinal usados para reforçar a qualidade do sinal antes de ele sair.", "Una caja metálica de 8\"x8\"x2\" con cuatro bancos de puertos de fibra óptica, que contiene múltiples circuitos integrados repetidores de señal usados para reforzar la calidad de la señal antes de que salga."]},

D:["O TSCA rege a importação, para o território aduaneiro dos EUA, de pesticidas, fungicidas, raticidas e dispositivos relacionados a tais substâncias.", "El TSCA rige la importación, al territorio aduanero de EE. UU., de pesticidas, fungicidas, raticidas y dispositivos relacionados con tales sustancias."]},
66:{q:["Mercadoria importada do Canadá ou do México sob a subheading 9811.00.60 do HTSUS é \"commercial sample of negligible value\" (amostra comercial de valor desprezível) se a amostra comercial _____.", "La mercancía importada de Canadá o México bajo la subheading 9811.00.60 del HTSUS es \"commercial sample of negligible value\" (muestra comercial de valor insignificante) si la muestra comercial _____."],

67:{q:["Segundo o Acordo de Livre Comércio Estados Unidos-Singapura (SFTA), quais são as regras de origem de produtos agrícolas exportados de Singapura para os Estados Unidos, cultivados em Singapura ou nos Estados Unidos (país do SFTA), a partir de sementes importadas de país não signatário do SFTA? Os produtos agrícolas não estão sujeitos à exclusão especificada.", "Según el Tratado de Libre Comercio Estados Unidos-Singapur (SFTA), ¿cuáles son las reglas de origen de productos agrícolas exportados de Singapur a los Estados Unidos, cultivados en Singapur o en los Estados Unidos (país del SFTA), a partir de semillas importadas de un país no signatario del SFTA? Los productos agrícolas no están sujetos a la exclusión especificada."],
A:["Os produtos agrícolas são tratados como manufaturados de país não signatário do SFTA.", "Los productos agrícolas se tratan como manufacturados de un país no signatario del SFTA."],
B:["Os produtos agrícolas são tratados como originários do país não signatário do SFTA.", "Los productos agrícolas se tratan como originarios del país no signatario del SFTA."],
C:["Os produtos agrícolas são tratados como originários do território do SFTA.", "Los productos agrícolas se tratan como originarios del territorio del SFTA."],

68:{q:["Quando começa um procedimento de antidumping ou countervailing duty (AD/CVD), supondo que não tenha sido iniciado de ofício pelos Estados Unidos?", "¿Cuándo comienza un procedimiento de antidumping o countervailing duty (AD/CVD), suponiendo que no fue iniciado de oficio por los Estados Unidos?"],

69:{q:["Ao concluir uma investigação sob o 19 CFR 165.15, o CBP fará determinação com base em _____ sobre se a covered merchandise foi introduzida no território aduaneiro dos Estados Unidos por meio de evasão.", "Al concluir una investigación bajo el 19 CFR 165.15, el CBP hará una determinación con base en _____ sobre si la covered merchandise fue introducida al territorio aduanero de los Estados Unidos mediante evasión."],

70:{q:["Três importadores de covered merchandise têm múltiplas alegações de evasão de ordens de antidumping/countervailing (AD/CVD). Qual das afirmações a seguir é VERDADEIRA sobre a consolidação dessas alegações?", "Tres importadores de covered merchandise tienen múltiples alegaciones de evasión de órdenes de antidumping/countervailing (AD/CVD). ¿Cuál de las siguientes afirmaciones es VERDADERA sobre la consolidación de esas alegaciones?"],
A:["A consolidação em uma única investigação pode ser feita a qualquer momento, inclusive após a emissão de determinação de evasão para ao menos um dos importadores.", "La consolidación en una sola investigación puede hacerse en cualquier momento, incluso tras la emisión de una determinación de evasión para al menos uno de los importadores."],
B:["A consolidação em uma única investigação não é permitida quando há múltiplos importadores envolvidos.", "La consolidación en una sola investigación no se permite cuando hay múltiples importadores involucrados."],
C:["A consolidação em uma única investigação só é permitida quando outra agência federal a solicita.", "La consolidación en una sola investigación solo se permite cuando otra agencia federal lo solicita."],
D:["A consolidação em uma única investigação pode ser feita a critério do CBP.", "La consolidación en una sola investigación puede hacerse a discreción del CBP."]},
71:{q:["Escolha a alternativa correta para completar a lacuna. Alíquotas reduzidas ou modificadas sob tariff-rate quotas estabelecidas nos termos da section 350 do Tariff Act de 1930, conforme emendado e prorrogado (19 U.S.C. 1351), não se aplicam a produtos importados direta ou indiretamente de _____.", "Elija la opción correcta para completar el espacio. Las tasas reducidas o modificadas bajo tariff-rate quotas establecidas conforme a la section 350 del Tariff Act de 1930, según enmendado y prorrogado (19 U.S.C. 1351), no se aplican a productos importados directa o indirectamente de _____."],

73:{q:["Para a quantidade agregada de chocolate contendo mais de 5,5% de gordura de manteiga em peso (excluindo artigos para consumo no varejo como bala ou confeito), qual dos países a seguir terá acesso a \"não menos de 3.379.279 kg\"?", "Para la cantidad agregada de chocolate con más del 5,5% de grasa de mantequilla en peso (excluyendo artículos para consumo al por menor como caramelo o confite), ¿cuál de los siguientes países tendrá acceso a \"no menos de 3.379.279 kg\"?"],

74:{q:["A Acme Company, nos Estados Unidos, pagou $7,000 a uma fábrica brasileira por um embarque de bambolês, na condição CIF. Os $7,000 correspondem a $6,500 pelos brinquedos e $500 de frete marítimo e seguro. A fábrica brasileira cobrou da Acme $8,250 pelos brinquedos; contudo, como devia $1,750 à Acme, cobrou apenas $6,500 pelos bambolês. Qual é o transaction value?", "Acme Company, en los Estados Unidos, pagó $7,000 a una fábrica brasileña por un embarque de hula hoops, en condición CIF. Los $7,000 corresponden a $6,500 por los juguetes y $500 de flete marítimo y seguro. La fábrica brasileña cobró a Acme $8,250 por los juguetes; sin embargo, como le debía $1,750 a Acme, cobró solo $6,500 por los hula hoops. ¿Cuál es el transaction value?"],
A:["$6,500.00", "$6,500.00"],
B:["$7,000.00", "$7,000.00"],
C:["$8,250.00", "$8,250.00"],
D:["$8,750.00", "$8,750.00"]},

76:{q:["Ao determinar a valoração de mercadoria, qual das opções a seguir melhor descreve \"similar merchandise\" (mercadoria similar)?", "Al determinar la valoración de mercancía, ¿cuál de las siguientes opciones describe mejor \"similar merchandise\" (mercancía similar)?"],
A:["Mercadoria que incorpora ou reflete engenharia, desenvolvimento, arte, trabalho de design, plano ou esboço fornecido a custo reduzido pelo comprador da mercadoria que está sendo valorada.", "Mercancía que incorpora o refleja ingeniería, desarrollo, arte, trabajo de diseño, plano o boceto suministrado a costo reducido por el comprador de la mercancía que se está valorando."],
B:["Mercadoria produzida pela mesma indústria ou setor industrial da mercadoria que está sendo valorada.", "Mercancía producida por la misma industria o sector industrial de la mercancía que se está valorando."],
C:["Mercadoria produzida no mesmo país e pela mesma pessoa que a mercadoria que está sendo valorada.", "Mercancía producida en el mismo país y por la misma persona que la mercancía que se está valorando."],
D:["Mercadoria idêntica em todos os aspectos à mercadoria que está sendo valorada.", "Mercancía idéntica en todos los aspectos a la mercancía que se está valorando."]},
77:{q:["Qual dos custos a seguir NÃO deve ser somado ao price actually paid or payable para determinar o transaction value de uma entry de relógios de luxo?", "¿Cuál de los siguientes costos NO debe sumarse al price actually paid or payable para determinar el transaction value de una entry de relojes de lujo?"],
A:["O desenho do mostrador e do padrão da pulseira, criado na Suíça, fornecido gratuitamente pelo comprador norte-americano ao fabricante estrangeiro.", "El diseño de la esfera y del patrón de la correa, creado en Suiza, provisto gratuitamente por el comprador estadounidense al fabricante extranjero."],
B:["As royalties relativas aos relógios de luxo que o comprador norte-americano é obrigado a pagar como condição da venda.", "Las regalías relativas a los relojes de lujo que el comprador estadounidense debe pagar como condición de la venta."],
C:["O custo de várias fresadoras fornecidas gratuitamente pelo comprador/importador norte-americano ao fabricante/exportador estrangeiro para cortar e moldar peças como engrenagens.", "El costo de varias fresadoras provistas gratuitamente por el comprador/importador estadounidense al fabricante/exportador extranjero para cortar y moldear piezas como engranajes."],
D:["Os custos de frete pagos pelo comprador norte-americano para importar os relógios de luxo.", "Los costos de flete pagados por el comprador estadounidense para importar los relojes de lujo."]},
78:{q:["Qual das relações a seguir NÃO se qualifica como \"related persons\" (pessoas relacionadas) para fins de determinação de valor?", "¿Cuál de las siguientes relaciones NO califica como \"related persons\" (personas relacionadas) a efectos de determinar el valor?"],
A:["Um empregado e o empregador", "Un empleado y el empleador"],

C:["Um avô e a neta", "Un abuelo y la nieta"],

79:{q:["Qual program indicator, para produtos elegíveis a tratamento tarifário especial, é usado para pleitear a preferência de duty da Column 1 sob o Agreement on Trade in Pharmaceutical Products?", "¿Qué program indicator, para productos elegibles a trato arancelario especial, se usa para reclamar la preferencia de duty de la Column 1 bajo el Agreement on Trade in Pharmaceutical Products?"],

80:{q:["Um molde para brinquedos foi fornecido gratuitamente a um fabricante francês pelo importador norte-americano. O custo original do molde era de $180,000, mas 2/3 da vida útil do molde já haviam sido consumidos pelo importador norte-americano antes de enviá-lo à França. O importador pagou $1,600 de frete. No cálculo do transaction value, qual é o valor total do assist relativo ao molde?", "Un molde para juguetes fue provisto gratuitamente a un fabricante francés por el importador estadounidense. El costo original del molde era de $180,000, pero 2/3 de la vida útil del molde ya habían sido consumidos por el importador estadounidense antes de enviarlo a Francia. El importador pagó $1,600 de flete. Al calcular el transaction value, ¿cuál es el valor total del assist relativo al molde?"],
A:["$0.00", "$0.00"],

D:["$181,600.00", "$181,600.00"]}

abr2026:{
1:{q:["Um broker deixa de apresentar o triennial status report até 1º de março do ano de reporte, o que resulta na suspensão de sua licença by operation of law (automaticamente, por força de lei). Além de apresentar o triennial status report, o que o broker deve fazer para reativar a licença?","Un broker no presenta el triennial status report antes del 1º de marzo del año de reporte, lo que resulta en la suspensión de su licencia by operation of law (automáticamente, por ley). Además de presentar el triennial status report, ¿qué debe hacer el broker para reactivar su licencia?"],
A:["Pagar multa de $500 em até 90 dias corridos a partir da data em que o relatório original era devido.","Pagar una multa de $500 dentro de 90 días calendario desde la fecha en que debía presentarse el informe original."],
B:["Apresentar um protest ao CBP em até 180 dias demonstrando justa causa para a reativação da licença.","Presentar un protest ante el CBP dentro de 180 días demostrando justa causa para la reactivación de su licencia."],
C:["Apresentar um appeal ao CBP em até três meses da data da notificação de suspensão.","Presentar un appeal ante el CBP dentro de tres meses desde la fecha de la notificación de suspensión."],
D:["Pagar a taxa exigida em até 60 dias corridos da data da notificação de suspensão.","Pagar la tarifa exigida dentro de 60 días calendario desde la fecha de la notificación de suspensión."]},
2:{q:["Qual ÚNICA das atividades a seguir pode valer um crédito de continuing broker education (educação continuada)?","¿Cuál ÚNICA de las siguientes actividades puede valer un crédito de continuing broker education (educación continua)?"],
A:["Assistir à gravação de uma hora de um webinar do CBP oferecido para preparar candidatos inscritos no CBLE para os procedimentos do dia da prova.","Ver la grabación de una hora de un webinar del CBP ofrecido para preparar a los candidatos inscritos en el CBLE para los procedimientos del día del examen."],
B:["Participar de uma sessão de discussão de uma hora sobre o uso potencial de inteligência artificial na classificação tarifária, oferecida durante um workshop presencial de comércio perto do Porto de Baltimore, com a presença de vários funcionários do CBP. Os organizadores pretendem buscar a aprovação para crédito de educação continuada somente após o fim da sessão.","Asistir a una sesión de discusión de una hora sobre el uso potencial de la inteligencia artificial en la clasificación arancelaria, ofrecida durante un taller presencial de comercio cerca del Puerto de Baltimore, con la presencia de varios funcionarios del CBP. Los organizadores pretenden buscar la aprobación para crédito de educación continua solo después de que termine la sesión."],
C:["Ministrar uma palestra de uma hora sobre oportunidades de reembolso de duty para instituições de ensino, em uma convenção para educadores e compradores universitários. A palestra e a convenção foram aprovadas para crédito de educação continuada por um credenciador selecionado pelo CBP, antes de sua realização.","Dar una conferencia de una hora sobre oportunidades de reembolso de duty para instituciones educativas, en una convención para educadores y compradores universitarios. La conferencia y la convención fueron aprobadas para crédito de educación continua por un acreditador seleccionado por el CBP, antes de su realización."],
D:["Uma hora gasta preparando material para um curso online autoguiado de cinco meses sobre valoração, iniciado no começo do ano. O curso termina com um teste de retenção e foi aprovado para crédito de educação continuada por um credenciador selecionado pelo CBP.","Una hora dedicada a preparar material para un curso en línea autoguiado de cinco meses sobre valoración, iniciado a comienzos del año. El curso culmina con una prueba de retención y fue aprobado para crédito de educación continua por un acreditador seleccionado por el CBP."]},
3:{q:["A Smith Logistics LLC (\"Smith Logistics\") é freight forwarder e customs broker licenciado. A Smith Logistics outorgou uma power of attorney (procuração) válida autorizando sua funcionária sem licença, Erin Johnson, a assinar documentos relativos a customs business em seu nome. Qual ÚNICA das afirmações a seguir é VERDADEIRA neste cenário?","Smith Logistics LLC (\"Smith Logistics\") es freight forwarder y customs broker licenciado. Smith Logistics otorgó una power of attorney (poder) válida autorizando a su empleada sin licencia, Erin Johnson, a firmar documentos relativos a customs business en su nombre. ¿Cuál ÚNICA de las siguientes afirmaciones es VERDADERA en este escenario?"],
A:["A Smith Logistics deve fornecer prova da existência da power of attorney ao CBP mediante solicitação do CBP.","Smith Logistics debe proporcionar prueba de la existencia de la power of attorney al CBP a solicitud del CBP."],
B:["A Smith Logistics deve apresentar ao processing Center uma declaração identificando Erin Johnson como pessoa autorizada a assinar documentos relativos a customs business em seu nome.","Smith Logistics debe presentar al processing Center una declaración identificando a Erin Johnson como persona autorizada a firmar documentos relativos a customs business en su nombre."],
C:["A Smith Logistics deve apresentar cópia da power of attorney ao CBP antes que Erin Johnson possa começar a assinar documentos relativos a customs business em seu nome.","Smith Logistics debe presentar copia de la power of attorney al CBP antes de que Erin Johnson pueda comenzar a firmar documentos relativos a customs business en su nombre."],
D:["A Smith Logistics deve fornecer ao CBP prova de que Erin Johnson tem pelo menos 21 anos e é cidadã dos Estados Unidos antes que ela possa começar a assinar documentos relativos a customs business em seu nome.","Smith Logistics debe proporcionar al CBP prueba de que Erin Johnson tiene al menos 21 años y es ciudadana de los Estados Unidos antes de que pueda comenzar a firmar documentos relativos a customs business en su nombre."]},
4:{q:["A Torres & Sons, uma partnership (sociedade), outorgou uma power of attorney (POA) à Kent Customs Brokers (KCB) em 1º de maio de 2024. A Torres & Sons encerrou a relação comercial com a KCB em 20 de abril de 2026 e deseja também encerrar a POA da KCB. Qualquer das medidas a seguir encerraria a POA entre a Torres & Sons e a KCB, EXCETO:","Torres & Sons, una partnership (sociedad), otorgó una power of attorney (POA) a Kent Customs Brokers (KCB) el 1º de mayo de 2024. Torres & Sons terminó su relación comercial con KCB el 20 de abril de 2026 y desea también terminar la POA de KCB. Cualquiera de las siguientes medidas terminaría la POA entre Torres & Sons y KCB, EXCEPTO:"],
A:["Enviar ao CBP, eletronicamente, aviso escrito da revogação da POA e receber confirmação do recebimento do aviso.","Enviar al CBP, electrónicamente, un aviso escrito de la revocación de la POA y recibir confirmación de su recepción."],
B:["Aguardar a POA expirar em 1º de maio de 2026.","Esperar a que la POA expire el 1º de mayo de 2026."],
C:["Outorgar uma nova POA a um customs broker diferente.","Otorgar una nueva POA a un customs broker diferente."],
D:["Formar uma nova firma pela adição de um novo sócio à partnership.","Formar una nueva firma mediante la adición de un nuevo socio a la partnership."]},
5:{q:["Qual ÚNICA das quatro opções abaixo identifica corretamente por quanto tempo um customs broker deve reter o tipo de registro especificado?","¿Cuál ÚNICA de las cuatro opciones siguientes identifica correctamente por cuánto tiempo un customs broker debe retener el tipo de registro especificado?"],
A:["Um entry summary (CBP Form 7501) deve ser retido por três anos após a data de entry.","Un entry summary (CBP Form 7501) debe retenerse por tres años después de la fecha de entry."],
B:["Registros relativos à apresentação de um drawback claim devem ser retidos por três anos após a liquidation do claim, ou por período maior se exigido por lei.","Los registros relativos a la presentación de un drawback claim deben retenerse por tres años después de la liquidation del claim, o por un período mayor si la ley lo exige."],
C:["Registros relativos à retirada de mercadoria de um bonded warehouse devem ser retidos por cinco anos após a data de entrada no bonded warehouse.","Los registros relativos al retiro de mercancía de un bonded warehouse deben retenerse por cinco años después de la fecha de entrada al bonded warehouse."],
D:["Documento ou carta pelo qual um importador revoga uma power of attorney anteriormente concedida a um customs broker deve ser retido por cinco anos após a data de outorga da referida power of attorney.","Un documento o carta por el cual un importador revoca una power of attorney previamente otorgada a un customs broker debe retenerse por cinco años después de la fecha de otorgamiento de dicha power of attorney."]},
6:{q:["Qual ÚNICO dos quatro cenários a seguir demonstra melhor o cumprimento adequado de uma solicitação de exame de registros? Considere que cada solicitação abaixo foi feita por representantes devidamente credenciados do U.S. Department of Homeland Security (DHS).","¿Cuál ÚNICO de los cuatro escenarios siguientes demuestra mejor el cumplimiento adecuado de una solicitud de examen de registros? Suponga que cada solicitud fue hecha por representantes debidamente acreditados del U.S. Department of Homeland Security (DHS)."],
A:["Um customs broker recebe solicitação para inspecionar registros de um cliente com quem parou de trabalhar há mais de cinco anos. O broker manteve os registros solicitados, mas informa ao DHS que não os disponibilizará para inspeção porque o período de retenção terminou.","Un customs broker recibe una solicitud para inspeccionar registros de un cliente con quien dejó de trabajar hace más de cinco años. El broker mantuvo los registros solicitados, pero informa al DHS que no los pondrá a disposición porque el período de retención terminó."],
B:["Um customs broker recebe solicitação para inspecionar registros de uma entry de mercadoria feita há dois anos. O broker envia pelo correio a versão original em papel dos registros, postada 60 dias corridos após a solicitação.","Un customs broker recibe una solicitud para inspeccionar registros de una entry de mercancía hecha hace dos años. El broker envía por correo la versión original en papel de los registros, con matasellos de 60 días calendario después de la solicitud."],
C:["Um customs broker recebe aviso razoável de uma visita ao local, incluindo solicitação para inspecionar registros de um cliente. Durante a visita, o broker informa ao DHS que os registros ficam fora do local e não estarão disponíveis durante a visita, dizendo que os enviará eletronicamente em até 30 dias corridos após a visita.","Un customs broker recibe aviso razonable de una visita al sitio, incluida una solicitud para inspeccionar registros de un cliente. Durante la visita, el broker informa al DHS que los registros están fuera del sitio y no estarán disponibles durante la visita, diciendo que los enviará electrónicamente dentro de 30 días calendario después de la visita."],
D:["Um customs broker recebe solicitação para inspecionar registros relativos a um unused merchandise drawback claim. A solicitação especifica que o broker tem até 120 dias corridos para fornecer os registros. No 45º dia corrido a partir da solicitação, o broker envia ao DHS a versão eletrônica original dos registros solicitados.","Un customs broker recibe una solicitud para inspeccionar registros relativos a un unused merchandise drawback claim. La solicitud especifica que el broker tiene hasta 120 días calendario para proporcionarlos. En el día 45 desde la solicitud, el broker envía al DHS la versión electrónica original de los registros solicitados."]},

10:{q:["Um customs broker descobre que um cliente omitiu informação de um affidavit (declaração juramentada). O broker acredita que a omissão foi um engano e avisa prontamente o cliente sobre a omissão e as ações corretivas adequadas. O que mais o broker deve fazer?","Un customs broker descubre que un cliente omitió información de un affidavit (declaración jurada). El broker cree que la omisión fue un error y avisa prontamente al cliente sobre la omisión y las acciones correctivas adecuadas. ¿Qué más debe hacer el broker?"],

11:{q:["Das quatro opções abaixo, qual relação comercial Tracy, customs broker licenciada e sole proprietor (empresária individual) de sua corretora, pode manter sem violar os regulamentos do CBP?","De las cuatro opciones siguientes, ¿qué relación comercial puede mantener Tracy, customs broker licenciada y sole proprietor (propietaria única) de su agencia, sin violar los reglamentos del CBP?"],
A:["Tracy realiza customs business em nome de sua cliente, X-Logistics, uma importadora legítima (bona fide). Quando iniciou a relação broker-cliente, Tracy sabia que a X-Logistics era uma importadora notoriamente mal-afamada.","Tracy realiza customs business en nombre de su cliente, X-Logistics, una importadora legítima (bona fide). Al iniciar la relación broker-cliente, Tracy sabía que X-Logistics era una importadora notoriamente de mala reputación."],
B:["Tracy tem um acordo com Faith, outra sole proprietor que teve a licença de customs broker suspensa with prejudice. Durante a suspensão de Faith, Faith indica seus clientes a Tracy, e Tracy repassa a Faith uma pequena porcentagem dos honorários cobrados dos clientes indicados.","Tracy tiene un acuerdo con Faith, otra sole proprietor cuya licencia de customs broker fue suspendida with prejudice. Durante la suspensión de Faith, Faith refiere sus clientes a Tracy, y Tracy le da a Faith un pequeño porcentaje de los honorarios cobrados a los clientes referidos."],
C:["Tracy fica amiga de uma advogada, Margaret, que trabalha no Office of Regulations and Rulings do DHS e redige classification rulings para o tipo de produto que os clientes de Tracy importam. Tracy oferece um belo jantar a Margaret em troca da oportunidade de conversar sobre os rulings de classificação pendentes de revisão por Margaret.","Tracy se hace amiga de una abogada, Margaret, que trabaja en la Office of Regulations and Rulings del DHS y redacta classification rulings para el tipo de producto que importan los clientes de Tracy. Tracy invita a Margaret a una buena cena a cambio de la oportunidad de hablar sobre los rulings de clasificación pendientes de la revisión de Margaret."],
D:["Tracy contrata Paul para ajudar com o recordkeeping da corretora. Seis meses após o início, Tracy descobre que Paul foi condenado por crime grave (felony). Tracy não toma nenhuma providência e continua empregando Paul.","Tracy contrata a Paul para ayudar con el recordkeeping de su agencia. Seis meses después, Tracy descubre que Paul fue condenado por un delito grave (felony). Tracy no toma ninguna medida y continúa empleándolo."]},
12:{q:["Qual das afirmações a seguir sobre national permits é FALSA?","¿Cuál de las siguientes afirmaciones sobre los national permits es FALSA?"],

14:{q:["Como customs broker licenciada e sole proprietor, Janet Martin deve enviar ao processing Center a lista de nomes de seus funcionários atuais. Ela tem dois funcionários: Spencer McGill (reportado em até 30 dias da contratação em 2021; nada mudou desde então) e Logan Sharpe (funcionário novo, ainda não reportado). Qual ÚNICA das listas a seguir a Sra. Martin deve enviar tempestivamente ao processing Center para melhor cumprir os regulamentos do CBP?","Como customs broker licenciada y sole proprietor, Janet Martin debe enviar al processing Center la lista de nombres de sus empleados actuales. Tiene dos empleados: Spencer McGill (reportado dentro de 30 días de su contratación en 2021; nada ha cambiado desde entonces) y Logan Sharpe (empleado nuevo, aún no reportado). ¿Cuál ÚNICA de las siguientes listas debe la Sra. Martin enviar oportunamente al processing Center para cumplir mejor con los reglamentos del CBP?"],

23:{q:["Ao determinar a classificação da colcha, você descobre que há duas subposições possíveis em dois capítulos diferentes do HTSUS. Além das informações da fatura comercial, a resposta a qual ÚNICA das perguntas abaixo é necessário obter do seu cliente para classificar corretamente a colcha?","Al determinar la clasificación de la colcha, descubres que hay dos subpartidas posibles en dos capítulos diferentes del HTSUS. Además de la información de la factura comercial, ¿la respuesta a cuál ÚNICA de las preguntas siguientes es necesario obtener de tu cliente para clasificar correctamente la colcha?"],

27:{q:["A Bake 4U, Inc. (B4U) importa massa de pastelaria a granel sujeita a tariff-rate quota (limite agregado anual de 3.500.000 kg; período de quota 2026: 1º abr 2026 – 30 mar 2027). A B4U compra a massa da Holanda e a admite numa FTZ no Texas em privileged foreign status. Em sua subzone, assa pastéis porcionados embalados para venda a granel, apresentando consumption entries para retirá-los. Hoje uma emergência (falha do refrigerador) força a B4U a assar imediatamente toda a massa afetada; o excedente será vendido no varejo, no local, aos trabalhadores da FTZ. A quota anual ainda não fechou. Qual das opções é uma afirmação VERDADEIRA?","Bake 4U, Inc. (B4U) importa masa de pastelería a granel sujeta a tariff-rate quota (límite agregado anual de 3,500,000 kg; período de quota 2026: 1º abr 2026 – 30 mar 2027). B4U compra la masa de Holanda y la admite en una FTZ en Texas en privileged foreign status. En su subzone hornea pasteles porcionados empacados para venta a granel, presentando consumption entries para retirarlos. Hoy una emergencia (falla del refrigerador) obliga a B4U a hornear de inmediato toda la masa afectada; el excedente se venderá al por menor, en el sitio, a los trabajadores de la FTZ. La quota anual aún no se llenó. ¿Cuál de las opciones es una afirmación VERDADERA?"],
A:["A massa importada pela B4U é elegível a obter quota status mediante apresentação do CBP Form 214 em forma adequada, para lograr a admissão em privileged foreign status.","La masa que B4U importa es elegible para obtener quota status mediante la presentación del CBP Form 214 en forma adecuada, para lograr la admisión en privileged foreign status."],
B:["Devido à emergência, a B4U pode eleger nonprivileged foreign status para a massa afetada, que é assada em pastéis para venda no varejo dentro da FTZ.","Debido a la emergencia, B4U puede elegir nonprivileged foreign status para la masa afectada, que se hornea en pasteles para venta al por menor dentro de la FTZ."],
C:["Os pastéis que a B4U retira da FTZ para venda a granel são elegíveis apenas à alíquota mais alta, fora da quota, vigente na data em que o privileged foreign status foi concedido.","Los pasteles que B4U retira de la FTZ para venta a granel solo son elegibles para la tasa más alta, fuera de la quota, vigente en la fecha en que se otorgó el privileged foreign status."],
D:["Os pastéis que a B4U retira da FTZ para venda a granel são elegíveis à alíquota mais baixa de dentro da quota mediante apresentação de entry summary em forma adequada, e serão tributados conforme sua condição na retirada da FTZ.","Los pasteles que B4U retira de la FTZ para venta a granel son elegibles para la tasa más baja, dentro de la quota, mediante la presentación de un entry summary en forma adecuada, y se gravarán según su condición al retirarse de la FTZ."]},

59:{q:["Em qual circunstância um indivíduo que qualifica como importer of record sob o 19 USC 1484 pode autorizar um agente não remunerado (unpaid agent) a fazer o entry em seu nome?","¿En qué circunstancia un individuo que califica como importer of record bajo el 19 USC 1484 puede autorizar a un agente no remunerado (unpaid agent) a hacer el entry en su nombre?"],

B:["O indivíduo, importador conhecido que não age por corporação, partnership ou associação, faz pedido escrito ao agente alegando ser indigente, com prova de que não pode pagar o agente.","El individuo, importador conocido que no actúa por una corporación, partnership o asociación, hace una solicitud escrita al agente alegando indigencia, con prueba de que no puede pagarle."],

60:{q:["No ACE, qual dos elementos de dados NÃO pode ser alterado por Post Summary Correction (PSC) em nenhum tipo de entry?","En el ACE, ¿cuál de los elementos de datos NO puede cambiarse mediante Post Summary Correction (PSC) en ningún tipo de entry?"],
