{n:17,cat:"II",scenario:"Mesmo cenário Echo/NBB (Q16-20). A Echo registrará CBP Form 7501 com valor acima de $1.000; o Box 23 exige um Importer Number. Registrar-se como IOR é necessário para entries formais/informais; entries de minimis (Section 321, até $800) dispensam registro.",q:"Which below statement is TRUE?",opts:{A:"Echo does not need to register as an IOR and will not need an Importer Number in Box 23 of the 7501.",B:"CBP will assign Echo an Employer Identification Number for NBB to use on behalf of Echo as Echo's Importer Number in Box 23 of the 7501.",C:"NBB can file a Form 5106 to provide Echo's Canadian Corporation Number to CBP to use as Echo's Importer Number in Box 23 of the 7501.",D:"NBB can file a Form 5106 and CBP will assign a number (Customs Assigned Number) to use as Echo's Importer Number in Box 23 of the 7501."},ans:["D"],cite:"ACE BRPD Ch. 23, Sec. 23.2; 19 CFR 24.5"},
{n:18,cat:"II",scenario:"Mesmo cenário Echo/NBB (Q16-20).",q:"NBB determines it needs to make a USMCA post-summary claim on a type 01 consumption entry filed on behalf of Echo. Of the following methods for making post-summary claims, which ONE cannot be used to make a post-summary claim under the USMCA?",opts:{A:"File a post-summary claim under 19 USC 1520(d).",B:"File a post-summary correction (PSC).",C:"File a reconciliation entry as long as the originally filed entry was flagged for FTA reconciliation.",D:"File a protest under 19 USC 1514 after the entry liquidates."},ans:["B"],cite:"ACE BRPD Ch. 6 Sec. 6.5; Ch. 10; 19 CFR 182.31; 174.11"},
{n:19,cat:"II",scenario:"Mesmo cenário Echo/NBB (Q16-20). A Echo importou papel de fabricante AUSTRALIANO para o Canadá, reetiquetou as caixas com seus dados e exportou aos EUA; a NBB registrou como se a Echo tivesse fabricado. Em inspeção 60 dias após a importação, o Import Specialist vê a marcação de origem \"Australia\" e REJEITA a entry type 01 por falta de pagamento de antidumping. A rejeição põe o entry summary em Trade control status.",q:"How and when can NBB best respond on behalf of Echo?",opts:{A:"Within two days of the entry summary rejection, NBB will respond to CBP that the rejection is untimely because the entry summary was in paid status and request that the entry be placed back in the liquidation cycle.",B:"Within two days of the entry summary rejection, NBB will refile the entry as an entry type 03 antidumping entry specifying the correct AD case number, correcting the country of origin to Australia, and submitting a supplemental payment for the additional AD duties.",C:"Within 10 days of the entry summary rejection, NBB will request that CBP issue a CBP Form 29 Rate Advance and provide an additional 20 days to submit the AD duties.",D:"Three hundred days from the date of entry, NBB will file a post-summary correction (PSC) to change the entry type from 01 to 03, update the country of origin, and add the correct AD case number, and request accelerated liquidation with a bill for the additional AD duties due."},ans:["B"],cite:"ACE BRPD, Chapter 1, Section 1.4"},
{n:20,cat:"II",scenario:"Mesmo cenário Echo/NBB (Q16-20).",q:"On August 16, 2024, NBB filed a warehouse entry for Echo's paper instead of a consumption entry. This merchandise was manufactured in Canada. On September 19, 2024, Echo advised NBB that it needed to withdraw one-third of the paper and return it to Canada. At no time would a carnet be involved in this process. What document, from the list below, would be used for the warehouse withdrawal of the merchandise being reexported to Canada?",opts:{A:"Entry Type 22 on CBP Form 7501",B:"Entry Type 31 on CBP Form 7501",C:"Entry Type 34 on CBP Form 7501",D:"Entry for Transportation and Exportation"},ans:["D"],cite:"19 CFR 144.37; ACE BRPD Chapter 12"},
{n:21,cat:"IIIB",q:"Of the parties listed below, which party is entitled to claim manufacturing drawback when the right to claim drawback has not been assigned by certification?",opts:{A:"The producer",B:"The importer",C:"The exporter",D:"The manufacturer"},ans:["C"],cite:"19 CFR 190.28"},
{n:22,cat:"IIIB",q:"How long must records supporting a claim under the modernized drawback regulations be retained?",opts:{A:"Five years from date of importation.",B:"Three years from date of payment of the claim.",C:"Three years after liquidation of the claim.",D:"Five years after date of payment of the claim."},ans:["C"],cite:"19 CFR 190.15"},
{n:23,cat:"IIIB",q:"Which of the answer choices listed below is NOT information required to be maintained by the drawback claimant in the proper documents generally kept in the normal course of business to substantiate a transfer of merchandise?",opts:{A:"Description of Merchandise",B:"Date of Importation",C:"Date of Entry",D:"Import entry and Line Number"},ans:["C"],cite:"ACE BRPD Chapter 13, Section 13.02"},
{n:24,cat:"IIIB",scenario:"Boots-4-U comprou 1.000 pares de botas de couro em 3 estilos: preta/sola preta $100 (500 pares, $50.000); preta com correntes $125 (350 pares, $43.750); marrom/sola preta $150 (150 pares, $22.500). Total $116.250. Em 23/04/2024 registrou entry de consumo com todas as botas em UMA linha (6403.91.6075), isenta de MPF; duty total pago: $9.881,25. Exportou depois 100 pares pretas e 100 pares pretas com correntes e registrou o 1º drawback claim usando per unit averaging (19 CFR 190.14(c)(4)(i)). Em transação doméstica, vendeu os 150 pares marrons à Discount Boot House por $135/par, transferindo os direitos de drawback. A Discount exporta tudo e registra claim como transferee.",q:"Which statement below is accurate regarding the per unit drawback that Discount can claim on the brown upper and black sole boots?",opts:{A:"Discount can claim the per unit drawback amount calculated using the per unit averaging method used by Boots-4-U in its drawback claim.",B:"Discount can claim 99% of the duty apportioned to the per unit cost by Boots-4-U of $150.00.",C:"Discount can claim 99% of the duty apportioned to the per unit cost paid to Boots-4-U of $135.00.",D:"Discount can claim 99% of 15% of the total duty paid by Boots-4-U as Discount is exporting 15% of the total quantity of boots that were imported."},ans:["A"],cite:"19 CFR 190.10(c); 19 CFR 190.2"},
{n:25,cat:"IIIB",q:"Which of the following best describes a drawback claim, as authorized for payment by CBP?",opts:{A:"A drawback claim is the refund, in whole or in part, of the duties, taxes, and/or fees paid on imported merchandise.",B:"A drawback claim is the drawback entry and related documents required by regulation which together constitute the request for drawback payment.",C:"A drawback claim is when CBP transfers work between various drawback offices even though the drawback submission may have been to a particular office.",D:"A drawback claim is the document containing a description of, and other required information concerning, the exported or destroyed article upon which a drawback claim is based."},ans:["B"],cite:"19 CFR 190.2"},
{n:26,cat:"IV",q:"What is the CLASSIFICATION for a plastic tripod designed for use with a digital camera?",opts:{A:"3926.90.5000",B:"8525.89.4000",C:"9006.91.0001",D:"9620.00.5000"},ans:["D"],cite:"HTSUS 9620.00.5000; GRIs 1 and 6"},
{n:27,cat:"IV",q:"The Explanatory Notes (ENs) define \"goods put up in sets for retail sale\" as goods which: (a) consist of at least two different articles which are, prima facie, classifiable in different headings; (b) consist of products or articles put together to meet a particular need or carry out a specific activity; and (c) are put up in a manner suitable for sale directly to users without repacking. Based on this definition, which of the following kits would meet the requirements of a set?",opts:{A:"A nail grooming kit consisting of three colors of nail polish: clear (heading 3304), red (heading 3304) and pink (heading 3304) packaged in a retail cardboard box with specially fitted inserts to hold the contents.",B:"A gift box wrapped in colored cellophane packed with the following items: a natural bath loofah (heading 4602), a lavender-scented bath bomb (heading 3307), and four lavender-scented soaps (heading 3401).",C:"Bulk shipping boxes, each containing 50 wooden bread boards (heading 4419) and 50 bread knives (heading 8211).",D:"A collection of 8 round wooden coasters, each with a painted picture of wildflowers (heading 4419), in a clear plastic tube with lid ready for retail sale."},ans:["B"],cite:"GRI 3(b)"},
{n:28,cat:"IV",q:"What is the CLASSIFICATION of an artificial floral bouquet that consists of purple and pink flowers made from natural ostrich feathers that are bound to wooden stems with floral tape?",opts:{A:"6701.00.3000",B:"6701.00.6000",C:"6702.90.1000",D:"6702.90.6500"},ans:["C"],cite:"HTSUS 6702.90.1000; GRI 1, 3(b), and 6"},
{n:29,cat:"IV",q:"What is the CLASSIFICATION of merchandise invoiced as \"polyester scarf\" which is composed of 100% polyester and measures 59 centimeters (cm) by 60 cm?",opts:{A:"6213.90.0700",B:"6213.90.1000",C:"6214.30.0000",D:"6214.90.0090"},ans:["B"],cite:"HTSUS 6213.90.1000; Ch. 62 Note 8; Ch. 54 Note 1"},
{n:30,cat:"IV",q:"Which of the following statements is accurate with regard to \"cough drops\" of Chapter 17, HTSUS?",opts:{A:"Cough drops must contain a minimum of 5mg per dose of menthol, of eucalyptol, or of a combination of menthol and eucalyptol.",B:"Cough drops must contain a minimum of 10mg per dose of menthol, of eucalyptol, or of a combination of menthol and eucalyptol.",C:"Cough drops must contain a minimum of 5mg per dose of raw sugar.",D:"Cough drops must consist of blended syrups containing sugars derived from sugar cane or sugar beets."},ans:["A"],cite:"HTSUS 1704.90.25; Ch. 17 Additional U.S. Note 11"},
{n:31,cat:"IV",q:"What is the CLASSIFICATION of heat insulating solid building bricks made of ceramic?",opts:{A:"2515.11.0000",B:"6802.29.9000",C:"6904.10.0010",D:"6907.30.1051"},ans:["C"],cite:"HTSUS 6904.10.0010"},
{n:32,cat:"IV",q:"What is the CLASSIFICATION of a women's outdoor long sleeve garment top, which is composed of a rubberized textile fabric meant for recreational water sports? The rubberized textile fabric is a 100% nylon knit fabric that is completely coated on the outer surface with a rubber weighing less than 1,500 g/m2.",opts:{A:"6112.41.0010",B:"6113.00.1012",C:"6114.30.1020",D:"6114.30.2010"},ans:["B"],cite:"HTSUS 6113.00.1012; Ch. 59 Note 5; Ch. 61 Note 8"},
{n:33,cat:"IV",q:"What is the CLASSIFICATION of a motorcycle propelled by an electric motor rated at 80 kilowatts output? (1 megawatt = 1000 kilowatts; 1 kilowatt = 1000 watts; 1 kilowatt = 1.34102 horsepower)",opts:{A:"8711.20.0030",B:"8711.50.0060",C:"8711.60.0050",D:"8711.60.0090"},ans:["D"],cite:"HTSUS 8711.60.0090"},
{n:34,cat:"IV",q:"What is the CLASSIFICATION of a greenhouse cabinet measuring 48\" high by 36\" wide by 20\" deep? Constructed of a wooden frame (the component giving essential character) with unreinforced, translucent plastic sides and roof. It has two cabinet doors revealing three interior wooden shelves that specifically fit the greenhouse, designed for placement on the ground or floor.",opts:{A:"4421.99.9880",B:"9403.60.8081",C:"9406.10.0000",D:"9406.90.0120"},ans:["B"],cite:"HTSUS 9403.60.8081; Ch. 94 Note 2"},
{n:35,cat:"IV",q:"You are filing entry on a shipment consisting of 25 dozen men's woven cotton pajamas weighing 5 kg per dozen. The pajamas are valued at $50.00 per dozen. Which of the following best represents how the HTS units should be reported on CBP Form 7501?",opts:{A:"5 kg",B:"25 doz.",C:"25 doz. and 125 kg",D:"25 doz. and 5 kg"},ans:["C"],cite:"ACE ES Instructions v2.4a; HTSUS 6207.21.0030"},
{n:36,cat:"IV",q:"What is the CLASSIFICATION of a set of four (4) molded, high-grade thermoplastic elastomer (TPE) floor mats, specifically shaped for passenger vehicles, which are packaged for retail sale and imported from India?",opts:{A:"3918.10.2000",B:"4016.91.0000",C:"5704.10.0090",D:"8708.99.8180"},ans:["D"],cite:"HTSUS 8708.99.8180; GRI 1"},
{n:37,cat:"IV",q:"Which merchandise described below is CLASSIFIED under 8536.70.0000?",opts:{A:"A 2\" plastic cube with a single crimping tube through the cube. A multi-strand fibre optic cable is pushed through the crimping tube, stabilizing the cable so it can be split into smaller strands and connected to multiple devices.",B:"A 4\" plastic cube with color-coded input and output ports on opposite ends. Each port contains a clamping tube into which the end of the fibre optic cable is inserted. The purpose of the cube is to align the optical fibres end-to-end in a line. It does not amplify or modify the signal.",C:"A rectangular 4\"x3\"x2\" plastic box with a single port at each end, containing a signal amplifying integrated circuit used to increase the incoming signal from the optical fiber bundle and send the amplified signal onward.",D:"An 8\"x8\"x2\" metal box with four banks of optical fibre ports, containing multiple signal repeating integrated circuits used to boost signal quality before the signal exits."},ans:["B"],cite:"HTSUS 8536.70.0000; Ch. 85 Note 9"},
{n:38,cat:"IV",q:"What is the CLASSIFICATION of merchandise identified as \"Polyhedral Bead Combo Pack\"? The package contains 20 beads in five shapes made of zinc alloy (98% zinc by weight), each ~3/8 inch on the diagonal, with a hole drilled through the center, strung on 8 inches of temporary steel wire. Except for the hole, the beads resemble polyhedral dice. Sold in a plastic bag with a printed cardboard topper for peg display; packaging states the beads are intended for making jewelry. Each package is invoiced at U.S. $1.99.",opts:{A:"7117.19.9000",B:"7901.20.0000",C:"8308.90.3000",D:"9504.90.6000"},ans:["C"],cite:"HTSUS 8308.90.3000; Ch. 71 Note 9(a)"},
{n:39,cat:"IV",q:"What is the CLASSIFICATION of a beverage dispenser machine designed to dispense both soda and non-carbonated soft drinks? Made of stainless steel with solenoid valves that allow beverage components to be mixed and dispensed on demand. It features a \"cold plate\" using ice supplied by a separate apparatus not imported with the machine (i.e., no refrigerating unit). The solenoid valves control liquid flow through water and syrup lines; customer activation directly causes the machine to mix and release beverages. For use in restaurants, supermarkets, and cafeterias.",opts:{A:"8418.69.0130",B:"8481.80.9005",C:"8481.80.9050",D:"8509.40.0030"},ans:["B"],cite:"HTSUS 8481.80.9005; GRI 1 and 6; Section XVI Note 3"},
{n:40,cat:"IV",q:"What is the CLASSIFICATION and duty rate for a button of acrylic resin, not covered with textile material? The finished button is a product of the U.S. Virgin Islands and is manufactured from button blanks produced in France.",opts:{A:"9606.21.2000 / Free",B:"9606.21.4000 / 0.3 cents/line/gross + 4.6%",C:"9606.21.4000 / Free",D:"9606.29.2000 / 0.3 cents/line/gross + 4.5%"},ans:["B"],cite:"GRI 1; General Notes 2 and 3; HTSUS 9606.21.4000; Ch. 96 Add. U.S. Note 2"},
{n:41,cat:"V",q:"When withdrawing merchandise from a bonded warehouse for transportation to another port of entry, which ONE of the following choices is NOT required on the in-bond application?",opts:{A:"The original entry number, date of entry, date of entry summary, and port at which filed.",B:"The quantity remaining in the warehouse after the withdrawal.",C:"Visa, permit, or license information issued by the U.S. Government, foreign government or other issuing authority, relating to the merchandise.",D:"The entered value of the merchandise."},ans:["C"],cite:"19 CFR 144.36; 144.32; 18.1"},
{n:42,cat:"V",q:"Which of the following answer choices meets the minimum quantity requirements for merchandise that may be withdrawn from a bonded warehouse without special authorization from the Commissioner of Customs?",opts:{A:"Bulk merchandise that weighs 3 tons, of a total of 6 tons.",B:"A half of a bale that weighs 500 lbs.",C:"One fourth of a cask out of ten casks that each weigh one-half ton.",D:"One and three-quarters boxes out of twenty boxes that each weigh 1000 lbs."},ans:["A"],cite:"19 CFR 144.33"},
{n:43,cat:"V",q:"If CBP has detained articles for bearing copying or simulating marks, all the following would enable the importer to obtain release of the articles EXCEPT:",opts:{A:"If this detention is the importer's first offense, the importer can pay a fine equal to the value the articles would have had if they were genuine.",B:"The recordant gives written consent to the importation and such consent is furnished to appropriate Customs officials.",C:"The objectionable mark is removed or obliterated as a condition to entry in such a manner as to be illegible and incapable of being reconstituted.",D:"The articles of foreign manufacture bear a recorded trademark and the one-item personal exemption is claimed and allowed."},ans:["A"],cite:"19 CFR 133.22(c)(1),(3),(4); 148.55"},
{n:44,cat:"V",q:"The operator of a foreign trade zone has _____ calendar days to prepare an annual reconciliation report after the end of the zone/subzone year, unless the port director authorizes an extension for reasonable cause.",opts:{A:"30",B:"60",C:"90",D:"120"},ans:["C"],cite:"19 CFR 146.25(a)"},
{n:45,cat:"V",q:"Broker B's client wants to export 3,000 men's shirts upon which it paid duty, taxes, and fees at the time of importation by transferring the merchandise to a Foreign Trade Zone (FTZ). On proper application by Broker B, what zone status must the merchandise transferred to the FTZ have to be considered exported for purposes of drawback?",opts:{A:"Non-privileged Foreign Status",B:"Privileged Foreign Status",C:"Zone restricted Status",D:"Domestic Status"},ans:["C"],cite:"19 CFR 190.181; 190.182; 146.44"},
{n:46,cat:"V",q:"A foreign trade zone operator discovers missing merchandise from a lot within the zone. If a consumption entry was filed, the missing merchandise would have been subject to $500.00 in duties and taxes. What is the minimum amount of shortage in quantity of merchandise in a lot that requires a zone operator to file a written report to the port director immediately upon discovery?",opts:{A:"1%",B:"5%",C:"10%",D:"20%"},ans:["A"],cite:"19 CFR 146.53(a)(3)"},
{n:47,cat:"V",q:"A single entry bond was filed with an entry. What shall the port director do if a broker fails to file the entry summary in a timely manner?",opts:{A:"Issue a penalty for the domestic value of the merchandise.",B:"Make a demand for liquidated damages in the amount of the bond.",C:"Cancel the entry and return it to the broker for refiling.",D:"Liquidate the entry and send a bill for the duty due."},ans:["B"],cite:"19 CFR 142.15"},
{n:48,cat:"V",scenario:"Fatos (com calendário de 2024; feriados federais: 01/01, 15/01, 19/02, etc.):\n• Importação do México.\n• Linha 001: mercadoria SEM direito a preferência; o valor incluía um assist já totalmente rateado em entries de 2023.\n• Linha 002: claim USMCA feito na entry, mas o blanket certificate of origin expirou em 01/01/2024.\n• Date of Import: 08/01/2024 · Date of Entry: 09/01/2024.\n• Entry summary registrado e duties pagos: 19/01/2024.\n• Pending Liquidation Date: 22/11/2024.\n• Import Specialist negou a preferência via CBP Form 29 Notice of Action; importador não contestou.\n• Liquidação real: 15/03/2024 (rate advance com cobrança).\nO importador quer protestar a linha 001 (refund do duty sobre o assist) e fazer post-entry claim do USMCA negado.",q:"Using the provided calendar and facts, calculate 1) the date duties, taxes, and fees were DUE after customs release; 2) the last day to file a USMCA trade preference claim under 19 U.S.C. 1520(d) for a refund of excess duties paid; and 3) the last day to file a protest under 19 U.S.C. 1514 for a claim unrelated to a USMCA trade preference claim.",opts:{A:"January 19, 2024; September 11, 2024; September 11, 2024",B:"January 24, 2024; January 8, 2025; September 11, 2024",C:"January 22, 2024; January 9, 2025; May 21, 2025",D:"January 23, 2024; January 19, 2025; June 13, 2024"},ans:["B"],cite:"19 CFR 142.12(b); 182.31; 171.12(e)"},
{n:49,cat:"V",q:"Consumption entry ABC-1234567-8 was submitted to CBP after the importer had entered and received the merchandise. Upon receiving the merchandise, the importer realized they erred in reporting the imported quantity and fixed the consumption entry. Once CBP liquidated the entry, the importer asserted that CBP incorrectly assessed antidumping duties. Choose the answer that puts the steps in the correct order of occurrence: I. Liquidation · II. Estimated duty payment · III. Customs release · IV. Post summary correction · V. Protest under 19 USC 1514",opts:{A:"III, II, IV, I, V",B:"III, IV, II, V, I",C:"I, II, III, IV, V",D:"IV, II, III, V, I"},ans:["A"],cite:"19 CFR Parts 141, 142, 159, 175; ACE BRPD Ch. 1 and 6"},
{n:50,cat:"V",q:"An importer is owed a refund of duties, taxes, and fees on an entry, but wants the refund to be mailed in care of its broker. The broker's importer number was reported on the corresponding CBP Form 7501 in the designated section. What form must the importer use to authorize the mailing of the refund check to its broker?",opts:{A:"CBP Form 4811, Special Address Notification",B:"CBP Form 5106, Create/Update Importer Identity Form",C:"CBP Form 3347, Declaration of Owner",D:"CBP Form 6059B, Customs Declaration"},ans:["A"],cite:"19 CFR 24.36; 141.61(d)(3)"},
{n:51,cat:"V",q:"After the merchandise has arrived, merchandise for which entry is required will be entered within ____ calendar days after landing from a vessel, aircraft or vehicle, or after arrival at the port of destination in the case of merchandise transported in bond.",opts:{A:"15",B:"30",C:"60",D:"90"},ans:["A"],cite:"19 CFR 142.2(a)"},
{n:52,cat:"V",q:"Non-quota merchandise subject to the Section 232 Presidential Proclamation regarding steel and covered by an entry for immediate transportation made at the port of original importation, if entered for consumption at the port designated by the consignee or his agent in such transportation entry without having been taken into custody by the port director for general order under 19 USC 1490, shall be subject to the duty rates in effect when _____.",opts:{A:"The immediate transportation entry was accepted at the port of original importation.",B:"The shipment arrives at the final destination and a consumption entry is filed.",C:"Never. Immediate transportation entries are not subject to duties because they are not actually entered into commerce.",D:"The immediate transportation shipment is destined for the United States (date of export)."},ans:["A"],cite:"19 CFR 141.69(b)"},
{n:53,cat:"V",q:"For a filer to submit a post-summary correction (PSC), the original entry summary or previously filed PSC must meet the following criteria:",opts:{A:"Entry summary must be in accepted status, can be under CBP review, must be in CBP control, must be fully paid, and cannot be liquidated.",B:"Entry summary must be in accepted status, cannot be under CBP review, must be in CBP control, must be fully paid, and must be liquidated.",C:"Entry summary must be in non-accepted status, cannot be under CBP review, must be in CBP control, must be fully paid, and must be liquidated.",D:"Entry summary must be in accepted status, cannot be under a CBP review, must be in CBP control, must be fully paid, and cannot be liquidated."},ans:["D"],cite:"ACE BRPD Chapter 6, Section 6.2"},
{n:54,cat:"V",q:"A broker's client calls and informs the broker that the client has a vase from Egypt that they want to import. The vase was purchased from a bazaar vendor. The picture from the client raises concerns that the vase may be very old and, perhaps, archaeological material. What regulatory provision addresses whether such a shipment might be subject to import restrictions?",opts:{A:"19 CFR 12.41",B:"19 CFR 12.42",C:"19 CFR 12.45",D:"19 CFR 12.104g"},ans:["D"],cite:"19 CFR 12.104g"},
{n:55,cat:"V",q:"An importer with merchandise currently in CBP custody at the Port of Laredo is substantially delinquent in the payment of several bills for additional duties owed. The Port Director has provided written notice specifying that if all delinquent bills are not paid within _______ working days, importations of his merchandise will be denied release until CBP Form _______ or its electronic equivalent is filed with the estimated duties attached.",opts:{A:"5; CBP Form 19",B:"10; CBP Form 78",C:"10; CBP Form 7501",D:"30; CBP Form 3461"},ans:["C"],cite:"19 CFR 142.14(a); 142.11(a)"},
{n:56,cat:"V",q:"What is the maximum value for a shipment of merchandise not qualifying for an exemption or exception, that may be entered as an informal entry (Type 11)?",opts:{A:"$250.00",B:"$800.00",C:"$1,500.00",D:"$2,500.00"},ans:["D"],cite:"19 CFR 143.21(a)"},
{n:57,cat:"V",q:"Which of the below is a matter that could be subject to protest?",opts:{A:"Because of a broker clerical error, non-dutiable charges were not deducted when reporting the entered value on the entry summary. The entered value needs to be adjusted and a duty refund requested on the unliquidated entry summary.",B:"CBP refused to allow amendment of a protest involving one entry 200 days after the underlying entry was liquidated.",C:"CBP liquidated a drawback claim with a refund on a drawback claim where the accelerated payment was completed.",D:"CBP denied a post-summary 19 USC 1520(d) claim under the United States-Peru Trade Promotion Agreement filed in the ACE Protest Module."},ans:["D"],cite:"19 CFR 174.11; 174.11(b)(8)"},
{n:58,cat:"V",q:"Which publication contains a list of corporations authorized to act as sureties on bonds, with the amount in which each may be accepted?",opts:{A:"Customs Bulletin",B:"Treasury Department Circular 570",C:"ACE Entry Summary Business Rules and Process Document",D:"19 CFR Part 113, Appendix A"},ans:["B"],cite:"19 CFR 113.37(a)"},
{n:59,cat:"V",q:"When an individual or organization files a bond with CBP the activity in which they plan on engaging will be identified on the bond. The bond conditions correspond to the activity and will be incorporated by reference into the bond. For example, when a person files a(n) _____ bond it can only be a continuous bond.",opts:{A:"basic importation and entry",B:"international carriers",C:"basic custodial",D:"repayment of erroneous drawback"},ans:["C"],cite:"19 CFR 113.62-113.65"},
{n:60,cat:"V",q:"When is the earliest date a continuous bond application may be filed if the requested effective date is March 1, 2025?",opts:{A:"60 days prior to the effective date",B:"45 days prior to the effective date",C:"30 days prior to the effective date",D:"15 days prior to the effective date"},ans:["A"],cite:"19 CFR 113.26(a)"},
{n:61,cat:"V",q:"Die-cut steel scissors were bolted together and manufactured as completely finished scissors in China, fitted with rubberized non-slip grips handles in Germany, and ultimately imported into the United States. What is the correct country of origin and marking method?",opts:{A:"\"Made in Beijing\" printed on a hangtag.",B:"\"Made in China\" printed on a sticker attached to the scissors.",C:"\"Made in China\" die stamped into the scissors.",D:"\"Made in Germany\" printed on a hangtag"},ans:["C"],cite:"19 CFR 134.43(a); 134.11; 134.1(b)"},
{n:62,cat:"V",q:"Cotton seeds from the species Gossypium barbadense (Egyptian Cotton) are imported into the U.S. from Egypt. The seeds are planted in Mississippi and the cotton is harvested. The harvested cotton is turned into 100% cotton thread in the Dominican Republic. The thread is woven into fabric and cut into pieces in Vietnam. The cut pieces are sewn into shirts in Israel using 100% cotton thread and exported to the United States. What is the country of origin of the shirts?",opts:{A:"Egypt",B:"United States",C:"Vietnam",D:"Israel"},ans:["D"],cite:"19 CFR 102.21(a); 102.22(a),(b)(1)(i),(c)(1)(v),(d)"},
{n:63,cat:"V",q:"Which of the following is NOT an example of a good \"wholly obtained or produced\" in the United States?",opts:{A:"Coal mined in West Virginia.",B:"A vegetable harvested in Iowa for export to Mexico.",C:"A moon rock retrieved by a U.S. astronaut.",D:"A car assembled in Ohio using imported parts."},ans:["D"],cite:"19 CFR 102.1(g)"},
{n:64,cat:"V",q:"Every year more than one billion cut flowers are imported into the United States for Valentines Day and Mother's Day. Which regulatory provision in Title 19 of the Code of Federal Regulations describes the entry and release process of the cut flowers?",opts:{A:"19 CFR 4.3",B:"19 CFR 12.11",C:"19 CFR 12.91(b)",D:"19 CFR 141.113"},ans:["B"],cite:"19 CFR 12.11; 4.3; 12.91(b); 141.113"},
{n:65,cat:"V",q:"Which of the following statements best describes the Toxic Substances Control Act (TSCA)?",opts:{A:"The TSCA governs the importation into the customs territory of the U.S. of food, drugs, devices, cosmetics, and tobacco products.",B:"The TSCA governs the manufacturing, production, and distribution of controlled dangerous substances (CDS) in the U.S. and articles containing controlled dangerous substances.",C:"The TSCA governs the importation into the customs territory of the U.S. of a chemical substance in bulk form or as part of a mixture, and articles containing a chemical substance or mixture.",D:"The TSCA governs the importation into the customs territory of the U.S. of pesticides, fungicides, rodenticides, and devices related to such substances."},ans:["C"],cite:"19 CFR 12.118"},
{n:66,cat:"VI",q:"Merchandise imported from either Canada or Mexico under HTSUS subheading 9811.00.60 is a \"commercial sample of negligible value\" if the commercial sample is _____.",opts:{A:"Worth less than $5.00 individually",B:"Worth less than $1,000.00 in aggregate",C:"Worth less than $1.00 individually",D:"Physically marked but still suitable for sale or use"},ans:["C"],cite:"19 CFR 182.111(a)"},
{n:67,cat:"VI",q:"According to the United States-Singapore Free Trade Agreement (SFTA), what are the rules of origin for agricultural goods exported from Singapore to the United States, which are grown in Singapore or the United States (an SFTA country), started from seeds imported from a non-SFTA country? The agricultural goods are not subject to the specified exclusion.",opts:{A:"The agricultural goods are treated as manufactured goods from a non-SFTA country.",B:"The agricultural goods are treated as originating in the non-SFTA country.",C:"The agricultural goods are treated as originating in the SFTA territory.",D:"The rules of origin for these agricultural goods depend on how they are harvested."},ans:["C"],cite:"HTSUS GN 25(n)(iii)(A)"},
{n:68,cat:"VI",q:"When does an antidumping or countervailing duty (AD/CVD) proceeding begin, assuming the proceeding was not self-initiated by the United States?",opts:{A:"On the date of the rescission of initiation",B:"On the date of the filing of the petition",C:"On the date of the publication of notice of initiation of investigation",D:"When the sunset review begins"},ans:["B"],cite:"19 CFR 351.102(b)(40)"},
{n:69,cat:"VI",q:"Upon conclusion of an investigation under 19 CFR 165.15, CBP will make a determination based on _____ as to whether covered merchandise was entered into the customs territory of the United States through evasion.",opts:{A:"probable cause",B:"clear and convincing evidence",C:"preponderance of evidence",D:"substantial evidence"},ans:["D"],cite:"19 CFR 165.27(a)"},
{n:70,cat:"VI",q:"Three importers of covered merchandise have multiple allegations of evading antidumping/countervailing (AD/CVD) orders. Which of the following is TRUE about the consolidation of these allegations?",opts:{A:"Consolidation into a single investigation may be made at any point, including after the issuance of a determination of evasion to at least one of the importers.",B:"Consolidation into a single investigation is not permissible when multiple importers are involved.",C:"Consolidation into a single investigation is permissible only when another Federal agency requests it.",D:"Consolidation into a single investigation may be made at CBP's discretion."},ans:["D"],cite:"19 CFR 165.13(a)"},
{n:71,cat:"VI",q:"Choose the correct answer to fill in the blank. Reduced or modified duty rates under tariff-rate quotas established pursuant to section 350 of the Tariff Act of 1930, as amended and extended (19 U.S.C. 1351), are not applicable to products imported directly or indirectly from _____.",opts:{A:"Mongolia",B:"South Africa",C:"Republic of Belarus",D:"Syria"},ans:["C"],cite:"19 CFR 132.6; HTSUS GN 3(b)"},
{n:72,cat:"VI",q:"Which QUOTA is the one which permits a limited number of specified merchandise to be entered or withdrawn for consumption during specified periods?",opts:{A:"Absolute (or quantitative) quota",B:"Qualitative quota",C:"Tariff-rate quota",D:"Priority quota"},ans:["A"],cite:"19 CFR 132.1(a)"},
{n:73,cat:"VI",q:"For the aggregate quantity of chocolate containing over 5.5 percent by weight of butterfat (excluding articles for consumption at retail as candy or confection), which one of the following countries shall have access to \"not less than 3,379,279 kg\"?",opts:{A:"Australia",B:"Ireland",C:"Netherlands",D:"United Kingdom"},ans:["D"],cite:"HTSUS Chapter 18 Additional U.S. Note 2"},
{n:74,cat:"VI",q:"Acme Company in the United States paid $7,000 to a Brazilian factory for a shipment of hula hoops, CIF terms of sale. The $7,000 consists of $6,500 for the toys and $500 for ocean freight and insurance. The Brazilian factory charged Acme $8,250 for the toys; however, because the factory owed Acme $1,750, it charged only $6,500 for the hula hoops. What is the transaction value?",opts:{A:"$6,500.00",B:"$7,000.00",C:"$8,250.00",D:"$8,750.00"},ans:["C"],cite:"19 CFR 152.103(a)(2); 152.102(f)"},
{n:75,cat:"VI",q:"Disregarding antidumping and/or countervailing duties, if any, what is the duty rate of an imported aluminum product valued at $39,999.00 with a country of origin of the Russian Federation classified under subheading 7606.12.3035?",opts:{A:"3%",B:"13.5%",C:"70%",D:"83.5%"},ans:["C"],cite:"HTSUS GN 3(b); 7606.12.3035; 9903.90.09; Ch. 99 Subch. III U.S. Note 30"},
{n:76,cat:"VI",q:"When determining the valuation of merchandise, which of the following best describes \"similar merchandise\"?",opts:{A:"Merchandise that incorporates or reflects any engineering, development, artwork, design work, or plan or sketch supplied at reduced cost by the buyer of the merchandise being appraised.",B:"Merchandise produced by the same industry or industry sector as the merchandise being appraised.",C:"Merchandise produced in the same country and by the same person as the merchandise being appraised.",D:"Merchandise identical in all respects to the merchandise being appraised."},ans:["C"],cite:"19 CFR 152.102(i),(h),(d)"},
{n:77,cat:"VI",q:"Which of the following costs should not be added to the price actually paid or payable to determine the transaction value for an entry of luxury watches?",opts:{A:"The watch face and band pattern designed in Switzerland, provided free of charge by the U.S. buyer to the foreign manufacturer.",B:"The royalty fees related to the luxury watches which the U.S. buyer is required to pay as a condition of the sale.",C:"The cost of several milling machines provided free of charge by the U.S. buyer/importer to the foreign manufacturer/exporter to cut and shape parts such as gears.",D:"The shipping costs paid by the U.S. buyer to import the luxury watches."},ans:["D"],cite:"19 CFR 152.103(b)(1); 152.102(a); 152.103(d)"},
{n:78,cat:"VI",q:"Which of the following relationships does not qualify as \"related persons\" for the purpose of determining value?",opts:{A:"An employee and employer",B:"An importer of record and a bond surety company",C:"A grandfather and granddaughter",D:"A corporation and a 5% shareholder"},ans:["B"],cite:"19 CFR 152.102(g)"},
{n:79,cat:"VI",q:"Which program indicator for products eligible for special tariff treatment is used to claim the Column 1 duty preference under the Agreement on Trade in Pharmaceutical Products?",opts:{A:"A+",B:"B",C:"C",D:"K"},ans:["D"],cite:"HTSUS GN 3(c)(i)"},
{n:80,cat:"VI",q:"A mold for toys was provided free of charge to a French manufacturer by the U.S. importer. The original cost of the mold was $180,000 but 2/3 of the useful life of the mold had been used by the U.S. importer prior to sending it to France. The U.S. importer paid the freight cost of $1,600. When calculating transaction value, what is the total value of the assist for the mold?",opts:{A:"$0.00",B:"$61,600.00",C:"$180,000.00",D:"$181,600.00"},ans:["B"],cite:"19 CFR 152.103(d)(2)"}
];
const MAY2024=[
{n:1,cat:"I",q:"Which of the following statements is FALSE?",opts:{A:"Only customs brokers who have been approved for a National Permit are required to pay the annual user fee every year.",B:"All customs brokers are required to file the triennial status report and pay the associated fee every three years after 1985.",C:"Every applicant for a customs broker's license must pay an application fee, the amount of which is based upon whether the applicant is an individual, a partnership, an association, or a corporation.",D:"All customs brokers are required to file an annual status report and pay the annual user fee every year after 1985."},ans:["D"],cite:"19 CFR 111.96"},
{n:2,cat:"I",q:"Number One Car Company (NOC Co.) is an existing importer whose account is not in frozen or void status with the CBP Office of Finance Revenue Division and whose account is assigned to the Automotive and Aerospace Center of Excellence and Expertise (A&A Center). NOC Co.'s broker is Jack Frost Customhouse Broker (Jack Frost). Jack Frost is licensed and has his National Permit through Los Angeles/Long Beach and his processing Center is the Electronics Center of Excellence and Expertise (Electronics Center). NOC Co. has advised Jack Frost that it is adopting an alternate name of NOC Co. as it has permission from its State of incorporation. Which of the following correctly states a method Jack Frost can use to notify CBP of NOC Co.'s adoption of an alternate name?",opts:{A:"Jack Frost will email a completed and signed Customs Form 5291 showing the NOC Co.'s alternate name to the A&A Center.",B:"Jack Frost will use NOC Co.'s ACE Portal account to create an Importer Certifying Statement showing the adoption of the alternate name.",C:"Jack Frost will email a completed and signed Customs Form 5106 showing NOC Co.'s alternate name to the A&A Center.",D:"Jack Frost will follow the change of name instructions found in 19 CFR 111.30(c) and email the Electronics Center with NOC Co.'s alternate name."},ans:["C"],cite:"ACE BRPD Chapter 23, Section 23.6 and 23.10"},
{n:3,cat:"I",q:"ZXY Importer (ZXY) is switching customs brokerages. ZXY is terminating its relationship with Slick Customs Brokerage Co. (Slick). The power of attorney contract between ZXY and Slick was granted for an unlimited time period. Which of the following parings correctly indicates who may revoke the power of attorney between ZXY as the principal and Slick as the agent?",opts:{A:"Principal Yes, Agent No",B:"Principal No, Agent Yes",C:"Principal No, Agent No",D:"Principal Yes, Agent Yes"},ans:["D"],cite:"19 CFR 141.35"},
{n:4,cat:"I",q:"Which statement accurately reflects the duration limitations for powers of attorney?",opts:{A:"Powers of attorney issued by a partnership can be granted for an unlimited period and all other powers of attorney are limited to a period not to exceed two (2) years from the date signed.",B:"Powers of attorney issued by a partnership and all other powers of attorney have the same duration limitation of two (2) years from the date signed.",C:"Powers of attorney issued by a partnership shall be limited to a period not to exceed two (2) years from the date of execution, while all other powers of attorney may be granted for an unlimited period.",D:"Powers of attorney issued by a partnership are valid for five (5) years from the date of execution, while all other powers of attorney may be granted for an unlimited period."},ans:["C"],cite:"19 CFR 141.34"},
{n:5,cat:"I",q:"A duly licensed customs broker plans to switch from keeping paper records of documents created in the course of conducting customs business to keeping digital records electronically. These documents are not required to be maintained as original paper records under laws and regulations administered by other Federal Government agencies. From whom must the broker receive permission to switch the method of storage and within what time frame?",opts:{A:"Regulatory Audit, Charlotte, North Carolina; at least 30 calendar days before implementing the alternative storage method",B:"The Executive Director, Office of Trade, CBP Headquarters; no more than 30 calendar days after implementation of the alternative storage method",C:"Broker Management Branch, CBP Headquarters; at least 60 calendar days before implementation of the alternative storage method",D:"The Executive Director, Trade Regulatory Audit, CBP Headquarters; no more than 15 calendar days after implementation of the alternative storage method"},ans:["A"],cite:"19 CFR 163.5(b)"},
{n:6,cat:"I",q:"Which of the following is TRUE regarding the record retention period?",opts:{A:"Records pertaining to articles that are admitted free of duty and tax pursuant to 19 USC 1321(a)(2) shall be kept for five (5) years from the date of the entry.",B:"Packing lists shall be retained for a period of ninety (90) calendar days from the end of release or conditional period, whichever is later.",C:"Any record relating to a drawback claim shall be kept until the fifth (5th) anniversary of the date of the payment of the claim.",D:"A consignee who is not the owner and appoints a customs broker shall keep a record of merchandise covered by informal entry for two (2) years from the date of the informal entry."},ans:["D"],cite:"19 CFR 163.4(b)(3)"},
{n:7,cat:"I",q:"A customs broker license applicant has been denied a customs broker license. Which of the following best describes the next action the applicant must take to initiate an appeal?",opts:{A:"File with the Executive Assistant Commissioner, Office of Trade, in writing, a request for additional review that the Executive Assistant Commissioner deems appropriate not later than ninety (90) days of the denial.",B:"File with the appropriate Executive Director, Office of Trade, in writing, additional information or arguments in support of the application. Such information and arguments must be received by the Executive Director within sixty (60) calendar days of the denial.",C:"Appeal the decision to the Court of International Trade within thirty (30) days of the denial.",D:"Appeal the decision by filing a written or electronic appeal with the Office of Trade, CBP Headquarters within thirty (30) days of the denial."},ans:["B"],cite:"19 CFR 111.17(a)"},
{n:8,cat:"I",q:"Which of the following scenarios demonstrates that a customs broker may have failed to maintain responsible supervision and control over their customs business?",opts:{A:"John Smith Customs Brokerage (Smith) terminated Sally Johnson's (Johnson) employment. Johnson was listed in Smith's Automated Commercial Environment (ACE) portal account as the knowledgeable point of contact to be available to CBP during and outside of normal operating hours. Smith updated Johnson's employee record but did not designate a new knowledgeable point of contact in ACE. CBP has been unable to contact Smith for over six months.",B:"Countrywide Customs Brokerage (Countrywide) has ten offices across the United States under a National Permit with an approved supervision plan. Two of these offices do not have a licensed broker on site and have not had one for six months. Although Countrywide has not requested a waiver, Countrywide has a licensed broker conduct a supervisory visit twice a week to those offices.",C:"National Customs Brokerage (National) unwittingly hired James Jones, Sr., a convicted felon who committed embezzlement ten (10) years ago. On his employment application, Jones stated that he did not have any felony convictions and used another person's social security number. National did not seek a waiver to employ a convicted felon.",D:"Trustworthy Customs Broker Co. (Trustworthy) received $10,000.00 from Sally Doe, an importer of handblown glass figurines. Sally has designated Trustworthy to make payment for all imports over the course of a year, and to collect any refunds issued by CBP. Sally owes $4,000.00 in estimated duties for her most recent acquisition of figurines. Trustworthy remitted payment to CBP within 12 days of the figurines' arrival at the Port of Long Beach."},ans:["A"],cite:"19 CFR 111.3(b); 19 CFR 111.28(a)"},
{n:9,cat:"I",q:"A broker has failed to file their triennial status report within the required timeframe. They have received written notice of their license being suspended from CBP. What action must the broker take to get their license reinstated?",opts:{A:"Pay the fee plus a monetary penalty designated by the Executive Assistant Commissioner within six (6) months of the date of notice of suspension.",B:"Submit the report electronically through a CBP-authorized electronic data interchange (EDI) system within ten (10) calendar days of the date of notice of suspension.",C:"Transmit written notice of appeal to CBP by certified mail, return receipt requested within ninety (90) calendar days of the date of notice of suspension.",D:"File the required report and pay the fee within sixty (60) calendar days of the date of the notice of suspension."},ans:["D"],cite:"19 CFR 111.30(d)(4)"},
{n:10,cat:"I",q:"Which of the following statements is TRUE? For the purposes of this question, an organization means a partnership, association, or corporation.",opts:{A:"An applicant for a national permit applying on behalf of an organization must be an individually licensed customs broker employed by the organization and such individual will also be responsible for exercising responsible supervision and control over the activities conducted under that national permit.",B:"An applicant who obtains a passing grade on the examination for an individual broker license may apply for a national permit and the permit will be issued if the broker license is denied as long as the requirements of 19 CFR 111.19(b)(2) - (11), (c) and (d) are met.",C:"An organizational broker must be issued a district permit by the processing Center before the organization may apply for a national permit for the purpose of transacting customs business in accordance with the requirements in 19 CFR Part 111.",D:"An employee of a broker may, acting on his or her own behalf and without an individual license, while on the employer's premises, execute powers of attorney between the employee and clients of the employee and use the employer's facilities to conduct customs business on behalf of those clients."},ans:["A"],cite:"19 CFR 111.19"},
{n:11,cat:"I",q:"Pursuant to CBP regulations regarding CBP's Office of Information Technology Security (CBP SOC), what must a broker do when there is a breach of physical records related to the broker's customs business?",opts:{A:"Notify electronically the CBP Office of Information Technology Security Operations Center (CBP SOC) within 72 hours of the discovery and provide CBP SOC with any known compromised importer identification numbers.",B:"Notify electronically and by mail CBP SOC within 72 hours of the discovery and provide CBP SOC any known compromised importer identification numbers.",C:"Notify the broker's assigned processing Center within 72 hours of the discovery and let their clients know their operations are temporarily suspended.",D:"Notify the CBP Executive Assistant Commissioner within ten (10) days of the discovery and provide any known compromised importer identification numbers."},ans:["A"],cite:"19 CFR 111.21(b)"},
{n:12,cat:"I",q:"Which of the following statements is FALSE?",opts:{A:"A broker must transmit payment to the Government within five (5) working days after receipt from a client if the due date has passed.",B:"Records pertaining to the business of the clients serviced by customs brokers are to be considered confidential.",C:"Without exception, a broker who imports merchandise must not act as a broker for an importer who imports merchandise of the same general character as that imported by the broker.",D:"Each broker must exercise responsible supervision and control over the transaction of customs business."},ans:["C"],cite:"19 CFR 111.31(c)"},
{n:13,cat:"I",q:"Which of the following is NOT required for a corporation to file entry / entry summary for commercial merchandise on behalf of others?",opts:{A:"A corporate officer who is a licensed customs broker.",B:"A broker license and a national permit.",C:"A valid power of attorney obtained from the principal.",D:"Automated Broker Interface (ABI) functionality."},ans:["D"],cite:"19 CFR 111.2; 19 CFR 111.11; 19 CFR 141.46; 19 CFR 143.1"},
{n:14,cat:"I",q:"In which of the following circumstances is a power of attorney required when filing a protest?",opts:{A:"When the protest is filed directly by the importer.",B:"When the protest is filed by the importer's attorney-at-law.",C:"When a protest is filed by the importer's agent, and that agent is not an attorney at law, a licensed customs broker, or an authorized employee of a licensed customs broker.",D:"A power of attorney is not required to file a protest."},ans:["C"],cite:"19 CFR 174.3(a)"},
{n:15,cat:"I",q:"John Rose has an individual customs broker license and a National Permit. Shady is importing eighteen (18) unmounted 1-carat diamonds worth $2,500.00 each for a total of $45,000.00 in his luggage. Shady is arriving from London, England, via private airplane. Shady intends to put the diamonds in rings to sell from his U.S.-based jewelry store. Rose obtains a power of attorney from Shady to be Shady's broker, and Rose advises Shady that the diamonds do not need to be declared because the diamonds are absolutely duty free. Which statement below is TRUE with respect to any penalty that may be imposed under these circumstances?",opts:{A:"A $45,000.00 penalty may be assessed against the client under 19 USC 1497, but no penalty will be assessed against the broker as only one penalty may be assessed.",B:"A $45,000.00 penalty may be assessed against the broker under 19 USC 1641(d)(1)(D), and a $45,000.00 penalty may be assessed against the client under 19 USC 1497.",C:"A $30,000.00 penalty may be assessed against the broker under 19 USC 1641(d)(1)(D), and a $45,000.00 penalty may be assessed against the client under 19 USC 1497.",D:"A $30,000.00 penalty under 19 USC 1641 may be assessed against the broker and the client jointly, because penalties against a broker may not exceed $30,000.00."},ans:["C"],cite:"19 CFR 171, Apx C Section VI(D)(1)"},
{n:16,cat:"II",scenario:"EXERCÍCIO PRÁTICO (Q16-20) — Baltimore Quick Printers (BQ Printers, Baltimore/MD) comprou uma Luxemburg Digital Press da fabricante Stampa Fabbrica (Gênova, Itália), parte não relacionada, por US$ 60.000,00. A Stampa prepaga frete e seguro internacionais e fatura em base C.I.F. A prensa estava em backorder; a Stampa prometeu a próxima disponível. Uma prensa enviada a um comprador em Pequim (China) foi recusada por atraso; a Stampa ofereceu um rebate à BQ Printers para induzir a aceitação da prensa recusada, e embarcou por via aérea da China para Baltimore. Em rota, o voo foi desviado de Baltimore para Boston por mau tempo. O broker Fast Broker, LLC (Fast) foi notificado; um funcionário alterou a documentação de entry/entry summary ainda não submetida no ABI para refletir o desembarque em Boston, e arranjou transporte terrestre Boston→Baltimore pela Exact Trucking (transportadora bonded sob 19 CFR 113.63), criando o CF 7512 nomeando a Exact Trucking como bonded carrier.\n\nDOCUMENTOS:\n• Air Cargo Manifest (Shark Airlines, voo 1650, 16/01/2024): PEK Beijing → BWI Baltimore (1303); AWB tipo M nº 98923499976; 6 volumes; 11.500 kg; Shipper: Stampa Fabbrica, Chaoyang District, Beijing China; Consignee: Baltimore Quick Printers; Nature of Goods: Digital Press 8443.32.\n• Air Waybill 989-2349 9976 (Shark Airlines): PEK → BWI; Declared Value for Carriage US$ 94.200,00; Declared Value for Customs US$ 60.000,00; Amount of Insurance US$ 60.000,00 (Insurance @ $2,00/$100); frete 11.000 lb × $3,00 = US$ 33.000,00; Prepaid US$ 34.200,00; 6 volumes, 11.500 kg; \"One Digital Press Machine (Disassembled and in six (6) boxes)\"; MARKS & NOS: SF1201202 riscado → SF05012023S; \"Origin IT\" riscado → Origin CN.\n• Commercial Invoice SF05012023S (05/01/2024, US dollars): Exporter/Shipper Stampa Fabbrica (IR# 012345-54321); Importer/Ultimate Consignee BQ Printers (IR# 84-155999901); broker Fast Brokers, LLC (Jacksonville, FL); Terms of Sale C.I.F., due 10 days after importation; Linha 001 C/O \"IT\" — Luxemburg Digital Press, HTS 8443.32, 1 EA — US$ 60.000,00; Linha 002 — Freight & Insurance — US$ 34.200,00; Grand Total US$ 94.200,00; Notes: \"Rebate of $15,000.00 will be wire transferred 10 days after invoice payment.\"\n• Broker Invoice 20165823478 (08/01/2024, Fast Brokers): 400 broker fee $390,00; 405 additional document $30,00; 205 document fees Shark Airlines $35,00; 299 Customs duties, taxes, fees $4.782,84 (Duty $0,00; Add'l duty Sec. 301 $4.500,00; MPF $207,84; HMF $75,00); Grand Total $5.237,84; Notes: \"C/O China HTS: 9903.88.15/7.5% + 8443.32.5000/Free\". A fatura inclui o \"NOTICE TO CLIENT OF METHOD OF PAYMENT\".\n\nData de importação: 17/01/2024. BQ Printers pagou a fatura da Stampa em 19/01/2024. A Stampa emitiu o rebate em 29/01/2024.",q:"Which of the following statements is TRUE regarding country of origin?",opts:{A:"The country of origin of cargo is required data on the air cargo manifest under 19 CFR 122.48.",B:"The country of origin of cargo is required data on the commercial invoice under 19 CFR 141.86.",C:"The country of origin of cargo is required data on the air waybill under 19 CFR 141.11.",D:"The country of origin of the Luxemburg Digital Press is China because Beijing was the port of departure."},ans:["B"],cite:"19 CFR 141.86(a)(10)"},
{n:17,cat:"II",scenario:"Mesmo cenário das Q16-20 (prensa digital BQ Printers / Stampa Fabbrica; in-bond Boston→Baltimore pela Exact Trucking).",q:"During the in-bond movement, Exact Trucking's driver delivered the press directly to the importer's address instead of to the port of entry. Using this additional fact, which party will be liable for the breach resulting from mis-delivery of the press?",opts:{A:"Shark Airlines",B:"Exact Trucking",C:"Fast Brokers LLC",D:"Baltimore Quick Printers"},ans:["B"],cite:"19 CFR 18.8(a)"},
{n:18,cat:"II",scenario:"Mesmo cenário das Q16-20. Consulte o \"NOTICE TO CLIENT OF METHOD OF PAYMENT\" na Broker Invoice. BQ Printers é cliente ativo da Fast Broker LLC com POA executada em 01/05/2020.",q:"Baltimore Quick Printers is an active client of Fast Broker LLC with a power of attorney executed on May 1, 2020. Please refer to the provided broker's invoice for the \"NOTICE TO CLIENT OF METHOD OF PAYMENT\" (Notice) language. If the invoice did not contain this Notice, which of the statement(s) is/are correct regarding the broker's obligation to provide active clients this language?\nI. The notice is not required by Customs regulations.\nII. The notice is required on every broker invoice to active clients under the Customs regulations.\nIII. The notice is required on or attached to the power of attorney between the broker and the client under the Customs regulations.\nIV. The notice is required in writing at least once per 12-month period under the Customs regulations.",opts:{A:"I.",B:"II.",C:"II. And IV.",D:"III. And IV"},ans:["D"],cite:"19 CFR 111.29(b)(2)"},
{n:19,cat:"II",scenario:"Mesmo cenário das Q16-20 (Commercial Invoice com nota de rebate de US$ 15.000,00 pago após o pagamento da fatura; importação em 17/01/2024; rebate emitido em 29/01/2024).",q:"Refer to the Commercial Invoice. How will the rebate offered by Stampa Fabbrica, the seller, to Baltimore Quick Printers, the buyer, affect transaction value?",opts:{A:"The rebate will not be added to or subtracted from the price paid or payable as it will be paid to the buyer after the buyer pays the seller's invoice.",B:"The rebate will be added to the price paid or payable as it is paid to the buyer by the seller after the buyer pays the seller's invoice.",C:"The rebate will be deducted from the price paid or payable because the receipt by the buyer of the rebate after importation of the press is disregarded.",D:"The rebate will be deducted from the price paid or payable because the rebate was negotiated before the date of importation."},ans:["A"],cite:"19 CFR 152.103(a)(4)"},
{n:20,cat:"II",scenario:"Mesmo cenário das Q16-20 (Broker Invoice: Duty $0,00; Add'l duty Sec. 301 $4.500,00; MPF $207,84; HMF $75,00; total CBP charges $4.782,84).",q:"Use these additional facts to answer this question. Fast Broker, LLC (Fast) obtained additional documentation from the client stating that the country of origin of the Luxemburg Digital Press is Italy. Baltimore Quick Printers (BQ Printers) has already paid the broker's invoice. How much did Fast overcharge BQ Printers on the Broker Invoice?",opts:{A:"$75.00",B:"$207.84",C:"$4,575.00",D:"$4,782.84"},ans:["C"],cite:"HTS 9903.88.15; 19 CFR 24.23; 19 CFR 24.24"},
{n:21,cat:"IIIB",q:"Factory imports pistons from Italy. Factory subjects the pistons to heat treatment and coats them with a specialized alloy, in order to render them fit for use in motorcycle engines. Any pistons Factory does not sell to domestic engine manufacturers are exported for sale abroad. May Factory claim unused merchandise drawback on the exported pistons?",opts:{A:"Yes, because the pistons were reworked but not manufactured.",B:"No, because the pistons were manufactured when made fit for a particular use.",C:"Yes, because the pistons were adjusted but not manufactured.",D:"Yes, because the pistons were manufactured into an engine, which is a new and different article with a distinctive name."},ans:["B"],cite:"19 C.F.R. § 190.2, 190.31(c), 190.32(e)"},
{n:22,cat:"IIIB",q:"Which of the following is considered foreign territory for drawback purposes?",opts:{A:"American Samoa",B:"Guantanamo Bay Naval Station",C:"Puerto Rico",D:"U.S. Virgin Islands"},ans:["B"],cite:"19 CFR 190.5"},
{n:23,cat:"IIIB",q:"What is the maximum civil administrative penalty for any person who seeks, induces, or affects, or attempts to seek, induce, or affect, the payment of drawback by fraud?",opts:{A:"One (1) times the total actual or potential loss of revenue.",B:"Three (3) times the total actual or potential loss of revenue.",C:"Five (5) times the total actual or potential loss of revenue.",D:"Twenty (20) percent of actual or potential loss of revenue."},ans:["B"],cite:"19 CFR 190.62"},
{n:24,cat:"IIIB",q:"CBP has determined that a drawback claim is complete, but additional information is still required and has notified the drawback claimant (\"claimant\"). Five days after the notification date, the claimant filed, in writing, an extension for time to respond. Therefore, within how many days of the original date of notification from CBP to the claimant must the claimant furnish the CBP-requested information?",opts:{A:"Five (5)",B:"Twenty-five (25)",C:"Thirty (30)",D:"Sixty (60)"},ans:["C"],cite:"19 CFR 190.52(b)"},
{n:25,cat:"IIIB",q:"Drawback is allowable pursuant to 19 USC 1313 on duties, taxes, and fees paid on imported merchandise which were imposed under Federal law upon entry or importation. Duties include \"ordinary customs duties.\" In the modernized drawback regulations, which ONE of the following is NOT included in ordinary customs duties?",opts:{A:"Marking duties assessed under section 304(c), Tariff Act of 1930, as amended.",B:"A tender of duties in connection with notices of prior disclosure under 19 USC 1592(c)(4).",C:"Duties paid on an entry, or withdrawal from warehouse, for consumption, for which liquidation has become final.",D:"Duties restored under 19 USC 1592(d)."},ans:["A"],cite:"19 CFR 190.3(a)(1), 19 CFR 190.3(a)(2)"},
{n:26,cat:"IV",q:"What is the CLASSIFICATION of the following plywood panel? The plywood panel measures 4' (1.22m) wide x 8' (2.44m) long x 18mm in thickness, and has 13 wood plies (sheets of wood), each measuring approximately 1.38mm in thickness. The panel has a face ply and back ply (collectively, the \"outer plies\") of birch wood (Betula spp., a non-tropical, nonconiferous wood) and the remaining plies are poplar wood (Populus spp., a non-tropical, nonconiferous wood). Both the face and back plies are surface-covered with opaque phenolic resin - a wood sealer - which fully obscures the grain of the wood it covers.",opts:{A:"4412.31.0620",B:"4412.31.9200",C:"4412.33.0670",D:"4412.33.5700"},ans:["D"],cite:"HTSUS 4412.33.5700; GRI 1; Additional US Note 1(c) to Chapter 44"},
{n:27,cat:"IV",q:"What is the CLASSIFICATION for boys' football shoes that have the provision for the attachment of cleats that cover the ankle with outer soles of plastic and uppers of leather valued at $12.50 per pair?",opts:{A:"6403.19.4090",B:"6403.91.6040",C:"6403.99.6060",D:"6404.11.8590"},ans:["A"],cite:"HTS Subheading Note 1(a) to Chapter 64"},
{n:28,cat:"IV",q:"What is the CLASSIFICATION of a 100% knit cotton infant bootie where the outer sole is not sewn to the upper?",opts:{A:"6111.20.6050",B:"6111.30.5050",C:"6405.20.3070",D:"6405.20.9070"},ans:["A"],cite:"2023 HTSUS Basic Edition Chapter 64 Note 1(b)"},
{n:29,cat:"IV",q:"What is the CLASSIFICATION of a four-piece U-shaped modular sofa sectional unit from Brazil? The sofa sectional is constructed of plywood and upholstered in polyester, rayon, and nylon textile fabrics. The sofa sectional is comprised of (1) left arm facing (LAF) component, (1) right arm facing (RAF) chaise component, (1) double seat component with no armrests, and (1) ottoman component. Each seat component contains a connector plate and an interlocking bolt that links one piece to the next. Once assembled, a unified sectional sofa is presented.",opts:{A:"9401.71.0031",B:"9401.31.0000",C:"9401.79.0003",D:"9401.61.6011"},ans:["D"],cite:"HTS Chapter 94, Note 2 and 2(a), Heading 9401"},
{n:30,cat:"IV",q:"What is the CLASSIFICATION of floor tiles, which measure approximately fifteen (15) centimeters long by fifteen (15) centimeters wide by one (1) centimeter thick, made of cellulose fiber-cement board which does not contain asbestos?",opts:{A:"6808.00.0000",B:"6810.19.1400",C:"6811.82.0000",D:"6811.89.9000"},ans:["C"],cite:"6811.82.0000 and GRI 1"},
{n:31,cat:"IV",q:"What is the CLASSIFICATION of a sound signaling apparatus imported with two components, Part A and Part B, that is battery operated, wireless, and has the following additional characteristics? Part A is a chime unit that is placed inside a home no more than 150 feet from an exterior door. It has a radio frequency (RF) receiver. Part B is a backlit button that, when pressed, sends an RF signal to the receiver in Part A, resulting in a chime sound. Part B is placed outside the home near the exterior door.",opts:{A:"8512.30.0040",B:"8531.80.1500",C:"8531.80.9041",D:"8538.80.0000"},ans:["B"],cite:"8531.80.1500 and GRI 1"},
{n:32,cat:"IV",q:"What is the CLASSIFICATION of an electronic food processing machine designed to emulsify foods (e.g., fruits, vegetables) into frozen textures such as ice cream, sorbet and mousse. The machine includes two stainless steel jars and a specially designed shaving blade. The shaving blade, along with an air-injection system, mixes the food into a frozen texture. The machine is designed and marketed for use in restaurants and other commercial establishments.",opts:{A:"8208.30.0060",B:"8418.69.0180",C:"8438.80.0000",D:"8509.40.0025"},ans:["C"],cite:"GRIs 1 and 6, Chapter 85, Note 4"},
{n:33,cat:"IV",q:"What is the CLASSIFICATION of nonalloy (carbon) steel doors to be used in offshore windmill turbines? The doors will be used to access the monopile's foundation and wind turbine.",opts:{A:"7308.30.1000",B:"8412.90.9081",C:"7308.30.5050",D:"7325.10.0080"},ans:["C"],cite:"GRI 1; HTSUS 7308.30.5050"},
{n:34,cat:"IV",q:"What is the CLASSIFICATION of a cat harness, developed by the Princess Paws Pet Company. The harnesses are designed for cats and are available in size small, medium, and large. They are constructed of genuine leather and are partially covered with a plastic reflective material for safety.",opts:{A:"4112.00.3060",B:"4201.00.3000",C:"4201.00.6000",D:"4205.00.8000"},ans:["C"],cite:"GRI 3(a); Heading 4201"},
{n:35,cat:"IV",q:"What is the CLASSIFICATION of an injectable liquid derived from a combination of Botulinum toxin (99.9%), Albumin Human (0.025%), and sodium chloride (0.075%) imported in measured doses and prescribed by a doctor to treat humans suffering from chronic migraine headaches?",opts:{A:"3002.90.5250",B:"3304.99.5000",C:"3502.90.0000",D:"3924.90.5650"},ans:["A"],cite:"HTS Chapter 30, Heading 3304, Chapter 35 Note 1"},
{n:36,cat:"IV",q:"What is the CLASSIFICATION of iodized sea salt used as a food seasoning?",opts:{A:"2103.90.7400",B:"2501.00.0000",C:"2801.20.0000",D:"2829.11.0000"},ans:["B"],cite:"2501.00.0000"},
{n:37,cat:"IV",q:"Number One Car Company (NOCC), an electric vehicle manufacturer, has asked Jack Frost Customshouse Broker (Jack Frost) to classify imported battery assemblies intended for use in electric vehicles in the Harmonized Tariff Schedule (HTS) in advance of the next shipment. NOCC tells Jack Frost that it typically classifies the battery assemblies under 8507.60.0010 / 3.4%. Jack Frost has the following information.\n• the nominal voltage is 696.96 V\n• the nominal energy is 77.4 kWh\n• the weight is 480 kg.\nWhat additional information does Jack Frost need to confirm that 8507.60.0010 is the correct classification?",opts:{A:"The battery chemistry.",B:"The HTS subheading of the vehicle into which the battery assembly will be installed.",C:"The shape of the battery.",D:"Both A and B"},ans:["D"],cite:"8507.60.0010, GRI 1 and GRI 6"},
{n:38,cat:"IV",q:"At what point in time is the tariff classification, which is controlled by principal use in the United States, determined?",opts:{A:"At, or immediately prior to, the date of exportation.",B:"At, or immediately prior to, the date of importation.",C:"At, or immediately after, the date the goods are entered.",D:"Within three (3) years after the date the goods are entered."},ans:["B"],cite:"Additional U.S. Rules of Interpretation 1(a)"},
{n:39,cat:"IV",q:"A shipment of fresh yellow potatoes is being imported. The invoice indicates that the potatoes are \"certified organic\" to __________ and the importer has stated that the merchandise is classifiable under 0701.90.1010. Which of the following entities would NOT correctly fill in the blank?",opts:{A:"The United States Department of Agriculture National Organic Program Regulation (7 CFR 205)",B:"The Mexican National Service or Animal and Plant Health, Food Safety and Quality Ley de Productos Organicos regulations (RLPO)",C:"The Canadian Organic Products Regulations (SOR/2006-338 COPR)",D:"The European Union (EU) Council Regulation (EC) No. 834/2007"},ans:["B"],cite:"General Statistical Notes, Note 6"},
{n:40,cat:"IV",q:"Refer to the table below. Of the four multiple choice answers, which list of pairings correctly matches the parts of a 10-digit classification with the portion of the Harmonized Tariff Schedule hierarchy represented by the numerical digits?\nA) 01xx.xx.xxx — 1) Heading\nB) 0106.xx.xxxx — 2) Subheading\nC) 0106.00.50xx — 3) Statistical suffix\nD) xxxx.xx.xx10 — 4) Chapter",opts:{A:"A1, B2, C3, D4",B:"A3, B1, C2, D4",C:"A4, B2, C1, D3",D:"A4, B1, C2, D3"},ans:["D"],cite:"General Statistical Note 3(a)"},
{n:41,cat:"V",q:"Sean Reno Fashion (Sean Reno) is a clothing manufacturer in Chicago that imports textiles and apparel products. As part of a planned expansion of its sportwear line, Sean Reno applies to CBP for a continuous bond to secure multiple entries of merchandise over the coming year. In the calendar year prior to filing its application, Sean Reno imported merchandise under single transaction bonds at several different ports of entry. Which of the following is information that Sean Reno must include in its continuous bond application?",opts:{A:"Copies of the single transaction bonds that Sean Reno used in the previous calendar year.",B:"A specific description of the merchandise to be entered under the continuous bond, including estimated value and anticipated classification.",C:"The total amount of ordinary customs duties (including any taxes required by law to be treated as duties), plus the estimated amount of any other tax or taxes on the merchandise to be collected by CBP, accruing on all merchandise Sean Reno has imported during the calendar year preceding the date of the application.",D:"A statement of the duties and taxes Sean Reno estimates will accrue on all importations during the current year."},ans:["C"],cite:"19 C.F.R. § 113.11(b)(1)(ii)"},
{n:42,cat:"V",q:"Importer has a contract with Kitchen Sink Surety Co. (Kitchen Sink) for a continuous bond. Importer is terminating its relationship with its current broker and is hiring a new broker effective April 15, 2024, and before its next shipment due June 1, 2024. The new broker does not have an existing relationship with Kitchen Sink but has its bond with Best Surety Co. (Best). What changes will need to be made to Importer's continuous bond contract with Kitchen Sink when Importer terminates its relationship with its current broker and hires the new broker?",opts:{A:"The existing bond contract between Importer and Kitchen Sink must be terminated and a new continuous bond contract created between Importer and Best.",B:"The existing bond contract will need to be converted from a continuous bond to a single transaction bond contract to cover the June 1, 2024 shipment.",C:"The new broker will notify CBP to substitute Best for Kitchen Sink. on Importer's continuous bond contract.",D:"No changes to the existing bond contract are required and Importer as the principal, Kitchen Sink as the surety, and CBP as the beneficiary will remain intact."},ans:["D"],cite:"ACE BRPD Chapter 3"},
{n:43,cat:"V",scenario:"CUSTOMS BOND (19 CFR Part 113) — trecho do formulário:\nBroker Filer Code: YS1 | Surety Reference Number: 123456 | Bond Number (Assigned by CBP): 24C001ZZZ | Execution Date: 12/27/2023.\nSECTION I: [ ] SINGLE TRANSACTION BOND — [X] CONTINUOUS BOND, Effective Date: 02/01/2024. \"This bond remains in force for one year beginning with the effective date and for each succeeding annual period, or until terminated.\"\nSECTION II: Activity Code [X] 1 — Importer or broker (§113.62) — Limit of Liability: $50,000.00.",q:"Yellow Submarine Brokerage (YSB), a Customs broker with filer code YS1 assisted its importer client, Classy Duds, in obtaining bond No. 24C001ZZZ (bond), pictured above. For which ONE of the following entries will Bond No. 24C001ZZZ be effective?",opts:{A:"Yellow Submarine Brokerage (YSB) files entry type 01 for Classy Duds on an air shipment of commercial goods valued at $25,000.00 that arrived on December 29, 2023, and cleared the next day.",B:"YSB receives documents for Classy Duds regarding an ocean shipment of commercial goods valued at $500,000.00 on January 31, 2024. The ocean shipment is due to arrive in ten (10) days. It arrives as scheduled and clears.",C:"YSB filed entry / entry summary information along with the payment of duties, taxes, and fees on a Classy Duds shipment valued at $245.00 on January 31, 2024 and the shipment liquidated on February 9, 2024.",D:"YSB pre-filed entry / entry summary information for Classy Duds on an ocean shipment valued at $300,000.00 on December 27, 2023. The ocean shipment is scheduled to arrive on January 20, 2024. The shipment arrives as scheduled and clears immediately."},ans:["B"],cite:"19 CFR 113.26(c)"},
{n:44,cat:"V",q:"A filer submits an in-bond application of an Immediate Transportation (IT) entry for a warehouse withdrawal. If the shipment takes longer than 30-days transit time to be transported, to whom would the filer submit a written extension request?",opts:{A:"Port Director of the origin port",B:"Bonded Carrier",C:"Port Director of the destination or port of exportation",D:"Importer of Record"},ans:["C"],cite:"19 CFR 18.1(i)(2)"},
{n:45,cat:"V",q:"A port director serves a written notice to show cause upon a foreign trade zone operator advising of the port director's intention to suspend an individual user from the foreign trade zone for cause. The operator timely requests a hearing to respond to the proposed suspension. When must the hearing take place?",opts:{A:"Within seven (7) days of the operator's request",B:"Within thirty (30) days of the operator's request",C:"Within sixty (60) days of the operator's request",D:"Within ninety (90) days of the operator's request"},ans:["B"],cite:"19 CFR 146.82(b)(2)"},
{n:46,cat:"V",q:"How long does an importer have to file an application with the Port Director for abatement or refund of duties resulting from the destruction of merchandise in an accidental fire while located in a Customs Bonded Warehouse?",opts:{A:"Within thirty (30) days of the importer's discovery of the destruction",B:"Within thirty (30) days of date of entry into the warehouse",C:"Within ninety (90) days of the date of the warehouse proprietor's discovery",D:"Within ninety (90) days of the date of the notification by the warehouse proprietor to the importer."},ans:["A"],cite:"19 CFR 158.23"},
{n:47,cat:"V",q:"Unless an extension is granted, generally the total period of time that merchandise subject to duty may remain in a bonded warehouse is:",opts:{A:"One (1) year from the date of importation",B:"Three (3) years from the date of entry",C:"Five (5) years from the date of entry",D:"Five (5) years from the date of importation"},ans:["D"],cite:"19 U.S.C. § 1557; 19 C.F.R. § 144.5"},
{n:48,cat:"V",q:"Relief from detention of articles bearing copying or simulating trademarks can be accomplished by all of the following, EXCEPT:",opts:{A:"Removing or obliterating the objectionable mark as a condition to entry in such a manner as to be illegible and incapable of being reconstituted.",B:"Claiming, and CBP allowing, the one-time personal use exemption under 19 CFR § 148.55 for importing articles of foreign manufacture bearing a recorded trademark.",C:"Proving to CBP's satisfaction that the merchandise was imported by the recordant of the trademark or trade name or his designate.",D:"Affixing a conspicuous and legible label in close proximity to the trademark stating that: \"This product is not a product authorized by the United States trademark owner for importation and is physically and materially different from the authorized product.\""},ans:["D"],cite:"19 CFR 133.23"},
{n:49,cat:"V",q:"A liquid sauce is prepared in Japan by mixing raw materials from Japan, China, Thailand, and the United States. The raw materials from Japan are water, liquid sugar, salt, apple pulp, orange pulp, bonito extract, squid extract, citric acid, konbu, and paprika. The raw materials from China are garlic, fermented vegetables, chili pepper and ginger. The raw materials from the United States are soy protein hydrolysate and xanthum gum. The raw material from Thailand is s-inosinate. What is the country of origin marking on the bottles of sauce, all of which are to be shipped to the United States and sold in United States grocery stores?",opts:{A:"Product of China",B:"Product of Thailand",C:"Product of Japan",D:"Product of the USA"},ans:["C"],cite:"19 CFR 134.1(b)"},
{n:50,cat:"V",q:"What is the appropriate country of origin marking for an unsealed, disposable, cardboard shoe box manufactured in Japan that reads \"Kickers! America's Favorite Shoes\" on the top panel of the box when it is imported with a pair of shoes manufactured in India that are properly marked as \"Made in India\" on the inside tongue of each shoe?",opts:{A:"The unsealed, disposable, cardboard shoe box is exempt from marking with the country of origin of the shoes because the shoes are already properly marked with the country of origin of the shoes.",B:"The unsealed, disposable, cardboard shoe box must be marked as \"Made in\" or \"Product of\" Japan or words of similar meaning.",C:"The unsealed, disposable, cardboard shoe box must be marked with the country of origin of the shoes on the top panel of the box.",D:"The unsealed, disposable, cardboard shoe box must be marked with the country of origin of the box and the shoe."},ans:["C"],cite:"19 CFR 134.11; 19 CFR 134.46"},
{n:51,cat:"V",q:"What is the earliest possible time that duties and the liability for their payment accrue on imported commercial goods arriving by vessel?",opts:{A:"Upon arrival of the importing vessel within a Customs port of entry with the intent then and there to unlade.",B:"Upon the departure of the importing vessel from a foreign port of lading with the intent to unlade at a U.S. Customs port of entry.",C:"Upon the filing of the entry information on Form 3461 or its electronic equivalent and obtaining a clearance from CBP.",D:"Upon filing an entry summary on CBP Form 7501 or its electronic equivalent and scheduling the duty payment on a statement."},ans:["A"],cite:"19 CFR 141.1"},
{n:52,cat:"V",q:"Of the forms listed below exclusive of other documents which may be required, which Customs Form will Wilson Customs Broker and Freight Forwarder complete to facilitate the in-bond movement of cargo from Argentina arriving by aircraft at Milwaukee's Mitchell International Airport to Chicago's O'Hare International Airport, where it will be exported to Saudi Arabia via aircraft?",opts:{A:"Customs Form 7509",B:"Customs Form 214",C:"Customs Form 7512",D:"Customs Form 214B"},ans:["C"],cite:"19 CFR 122.91; 19 CFR 122.92"},
{n:53,cat:"V",q:"Which of the following data elements of an entry summary (CBP Form 7501) may not be changed through the submission of a Post-Summary Correction (PSC)?",opts:{A:"Country of origin",B:"Description of the merchandise",C:"Port of entry",D:"Tariff number under the Harmonized Tariff Schedule of the United States (HTSUS)"},ans:["C"],cite:"ACE Business Rule 6.4; ACE Business Rule 6.5"},
{n:54,cat:"V",q:"What is the current rate of the Harbor Maintenance Fee (HMF)?",opts:{A:"0.125 percent",B:"0.3464 percent",C:"0.215 percent",D:"1.25 percent"},ans:["A"],cite:"19 CFR 24.24(a)"},
{n:55,cat:"V",q:"Which of the following statements about the reconciliation program is TRUE?",opts:{A:"An eligible importer must have a valid single transaction bond for each flagged entry and a valid reconciliation bond rider on file for each importer of record number at the time the entry summaries are flagged for reconciliation.",B:"An eligible importer must have a valid continuous bond for each flagged entry and a valid reconciliation bond rider on file for each importer of record number at the time the entry summaries are flagged for reconciliation.",C:"The same surety and the same single transaction bond must cover all flagged entry summaries on one reconciliation entry.",D:"The same surety and any continuous bond must cover all flagged entry summaries on one reconciliation entry."},ans:["B"],cite:"ACE BRPD Chapter 10"},
